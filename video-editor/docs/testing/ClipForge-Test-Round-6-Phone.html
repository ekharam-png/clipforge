<style>
:root{--bg:#f5f6fa;--card:#fff;--fg:#161a26;--muted:#5b6274;--line:#dfe2ec;--accent:#4257d6;--ok:#1f7a4d;--bad:#a8322b;--part:#9a5b00;--human:#6a3fb0}
@media (prefers-color-scheme:dark){:root{--bg:#0f1118;--card:#181b25;--fg:#eceef5;--muted:#9aa1b5;--line:#2a2f3f;--accent:#8c9bff;--ok:#6fd3a0;--bad:#ff9c94;--part:#f0b95a;--human:#c3a6ff;color-scheme:dark}}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}
.wrap{max-width:900px;margin:0 auto;padding:28px 16px 64px;display:flex;flex-direction:column;gap:20px}
h1{margin:0;font-size:1.8rem}h2{margin:8px 0 0;font-size:1.2rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:8px}
.instr{white-space:pre-wrap;font-size:.95rem}
.step{border-left:6px solid var(--line)}
.step[data-s="Works"]{border-left-color:var(--ok)}.step[data-s="Problem"]{border-left-color:var(--bad)}.step[data-s="Partial"]{border-left-color:var(--part)}.step[data-s="Needs a person"]{border-left-color:var(--human)}
.step[data-s="PASS"]{border-left-color:var(--ok)}.step[data-s="FAIL"]{border-left-color:var(--bad)}.step[data-s="Needs the owner"]{border-left-color:var(--human)}
.do{margin:0;font-size:.95rem}
.step h3{margin:0;font-size:1.02rem}.exp{color:var(--muted);font-size:.93rem;margin:0}
.tag{font-size:.75rem;font-weight:600;border:1px solid var(--line);border-radius:999px;padding:1px 8px;margin-left:6px;color:var(--muted)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
select,input,textarea,button{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px}
textarea{width:100%;box-sizing:border-box;min-height:64px}
button{cursor:pointer;background:var(--accent);color:#fff;border:0;font-weight:600;padding:10px 16px}
.counts{display:flex;gap:16px;flex-wrap:wrap;font-weight:600}
label{display:flex;flex-direction:column;gap:4px;font-size:.9rem;color:var(--muted)}
</style></head><body><div class="wrap">
<header class="card"><h1>ClipForge test round 6: Android phone</h1>
<p class="exp">Build: <b id="build"></b>. Fill in each step, then click <b>Download filled checklist</b> at the bottom and send the file back to Claude.</p>
<div class="row"><label>Device<input id="device" placeholder="e.g. Samsung Galaxy S23, Android 15, via Link to Windows"></label><label>Tester<input id="tester" placeholder="e.g. ChatGPT agent, or your name"></label></div>
<label>Version shown in the app (required: About ClipForge &gt; Copy version info, then paste here)<textarea id="version" placeholder="ClipForge X.Y.Z (build N) · date, time UTC · commit" style="min-height:56px"></textarea></label>
<p class="exp" id="vwarn" style="color:var(--bad);margin:0"></p>
<div class="counts" id="counts"></div></header>
<section class="card"><h2>Instructions for the tester (person or AI agent)</h2><div class="instr" id="instr"></div></section>
<div id="steps" style="display:flex;flex-direction:column;gap:20px"></div>
<section class="card"><h2>Crash or freeze</h2><label>If the app closed by itself or froze: what were you doing? (include any message Android showed)<textarea id="crash"></textarea></label></section>
<section class="card"><h2>Summary</h2><label>Most important problems first, plus anything confusing, slow or hard to find<textarea id="summary" style="min-height:120px"></textarea></label>
<div class="row"><button id="dl" type="button">Download filled checklist</button><span class="exp" id="saved"></span></div></section>
</div>
<script id="data" type="application/json">{"device": "", "tester": "", "build": "ClipForge 1.15.0 (build 130) \u00b7 20 Nov 2026, 04:21 UTC \u00b7 a977f31", "version": "", "summary": "", "crash": "", "items": {}}</script>
<script>
const STEPS=[["After the update", [["p-version", "The app shows 1.15.0, build 130", "Open ClipForge on the phone. Read the small grey line at the bottom of the project list. Tap the three dots (More) at the top right, tap About ClipForge, then Copy version info. Type or paste the version line into \"Version shown in the app\" at the top of this page. Close About.", "Both show version 1.15.0 and build 130, the same as named at the top of this page. No red warning appears under the version box. The three dots list: Settings, What's new, Check for updates, About ClipForge, Copy version info.", ""], ["p-updated", "The result of the in-app update", "Look at the top of the project list. If a line \"Updated to 1.15.0\" is there, tap What's new, go back, then tap the cross of the line. (It appears once. If the owner already closed it, ask the owner what it said and set Not tested with the answer.)", "One quiet line \"Updated to 1.15.0\" with What's new and a cross. What's new opens Help on the page that starts with 1.15.0. No message says that an update did not work.", ""], ["p-moved", "The \"What moved\" note", "If a window \"Things are easier to find now\" opened at the first start, read it and tap OK. (It appears once. If the owner already closed it, set Not tested and write \"owner saw it: yes / no\".)", "It says nothing was removed, and lists the phone's new places: Add (one button at the bottom lists everything you can add), Text (its own button at the bottom), Shape, fades, notes, History (the three dots at the top of a project), Settings (one page), Sound waves and smooth preview (Settings > Editing), More (now grouped: Clip, Sound, Text), Hold a clip, sound or title (a list of what you can do with it), Trim start / end to here (More, under Clip). Buttons: What's new, Show me Settings, OK. The text fits the screen.", ""], ["p-keeps", "The update kept the projects", "Read the project list. Open the newest project from before the update, tap Play for 5 seconds, tap the back arrow.", "The projects from before the update are listed; the one you opened shows its clips with pictures and plays. No clip says Missing.", ""]]], ["The bottom bar and Add", [["p-new", "New project", "Tap New project. In the phone's picker choose video A (a talking video filmed wide) and confirm. When the editor opens, tap the name at the top and rename the project to Round 6 phone.", "The editor opens with A on the timeline with clip pictures. The top shows the back arrow, the name, the save sign, Undo, Redo, Export and three dots.", ""], ["p-bar", "The bottom bar: Add, Text, Split, More", "Tap an empty place on the timeline so nothing is selected. Read the bar at the bottom. Do NOT tap Text yet (a suggestion depends on it). Move the playhead to the middle of A and tap Split, then tap the Undo arrow.", "With nothing selected the bar has exactly four buttons: Add, Text, Split, More. Split cuts A into two pieces at the playhead; Undo makes it one again.", ""], ["p-add", "The Add sheet: every entry", "Tap Add. Read the list. Tap Videos or photos and add video B. Tap Add > Title, type Round 6 and close the sheet. Move the playhead to 0:02, tap Add > Caption, type: Sam Taylor: Hello from the phone. and tap Add. Add two more captions the same way at 0:06 (\"Alex K: Hello back.\") and at 0:10 (\"Alex K: Let us test the search.\"). Tap Add > Voice recording and cancel the picker. Tap Add > Overlay (picture-in-picture) and cancel the picker.", "A sheet \"Add\" lists, each with an icon and one line of explanation: Videos or photos, Music or sound, Voice recording, Title, Caption, Overlay (picture-in-picture), Good moment marker; at the bottom one sentence says where videos and photos go in. B lands after A. The title and the three captions appear on the timeline and in the preview. Voice recording and Overlay open the phone's picker; cancelling adds nothing.", ""], ["p-more", "More with nothing selected", "Tap an empty place, then tap More. Read the sheet from top to bottom (scroll it) and close it by swiping it down.", "A sheet \"More\" with small headings. CLIP: Trim start to here, Trim end to here, Freeze frame, Remove silences, Good moment marker, Make a short from here, Shorts and good moments. SOUND: Add sound track, Lower music under speech, Copy music credits. TEXT: Text, Find in the text, Subtitle file (.srt), Export subtitles (.srt). EDIT: History. A line that cannot be used now is grey and says why underneath, starting with \"Not now:\" (for example \"Not now: add music first\"). Nothing about Transcribe speech or Captions from speech is listed.", ""], ["p-plus", "The + next to Play when something is selected", "Tap clip A. Tap the + next to the Play button. Read the sheet and close it. Tap Done in the bottom bar.", "With a clip selected the bottom bar shows that clip's tools (no Add button), and the + next to Play opens the same Add sheet. Its last line now says that videos and photos go in after the selected clip. Done clears the selection and the bar shows Add, Text, Split, More again.", ""]]], ["Something selected", [["p-clip", "A clip: its tools, and More grouped by Clip / Edit / Sound / Text", "Tap clip A. Read the bottom bar. Tap More and read the sheet. Tap Duplicate in it, then Undo.", "Bar: Done, Split, Speed, Look, Sound, More, Delete. More: CLIP: Crop and position, Trim start to here, Trim end to here, Freeze frame, Remove silences, Move earlier, Move later, Make a short from here, Transition and fades. EDIT: Duplicate, Copy settings, Paste settings, History. SOUND: Separate sound, Put sound back, Lower music under speech. TEXT: Text. Grey lines say \"Not now: \u2026\" (Paste settings: \"Not now: copy settings first\"; Move earlier on the first clip: \"Not now: it is already the first clip\"). Duplicate adds a copy after A; Undo removes it.", ""], ["p-trim", "Trim start to here, Trim end to here", "Tap clip A, move the playhead about 3 seconds into it, tap More > Trim start to here. Move the playhead to about 3 seconds before the end of A, tap More > Trim end to here. Tap Undo twice.", "Trim start to here makes A start at the playhead (the part before it is gone); Trim end to here makes it end at the playhead. The clips after it move up. Each Undo restores one.", ""], ["p-hold", "Hold: the action list; hold and drag: move", "Long-press clip B without moving (hold about a second, then let go). Read the list and close it. Long-press the title on the timeline, read, close. Long-press an empty part of the timeline, read, close. Then long-press clip B and, still holding, drag it in front of A; let go. Tap Undo. (Through mirroring a long-press or drag may fail: try twice. If the list never opens or the clip never moves, set Needs the owner and ask the owner to try with a finger.)", "Holding without moving opens a sheet titled Video clip with: Split, Trim start to here, Trim end to here, Duplicate, Copy settings, Paste settings, Freeze frame, Remove silences, Crop and position, Rotate right, Separate sound, Put sound back, Move earlier, Move later, Make a short from here, Delete. The title's sheet (\"Title\") has Edit, Duplicate, Text, Delete. An empty place (\"At 0:\u2026\") has Videos or photos, Music or sound, Voice recording, Title, Caption, Overlay (picture-in-picture), Good moment marker, Split, Make a short from here. Holding and dragging still moves the clip to a new place.", ""], ["p-title", "A title or caption selected", "Tap the title on the timeline. Read the bar. Tap More, read, close. Tap Edit, change the text to Round 6 phone, close the sheet. Tap Done.", "Bar: Done, Edit, Duplicate, More, Delete. More: TEXT: Text, Find in the text, Export subtitles (.srt). EDIT: Duplicate, History. Edit opens the title's settings as a sheet; the new text shows in the preview.", ""]]], ["The menu at the top", [["p-top", "The three dots at the top of a project", "Tap the three dots at the top right of the editor. Read the list. Tap History, read, close it.", "The list has: Shape and size, Fade in and out, Publishing notes, Text, History, Markers, Settings, and Help, each with an icon. History opens a sheet with your changes by name, newest first.", ""], ["p-shape", "Shape and size", "Tap the three dots > Shape and size. Read the sheet. Tap 1080p (Full HD). Tap \"Which shape should I use?\" and go back from Help. Do not change the shape yet.", "A sheet \"Shape and size\" with SHAPE: Original (as the first clip), 9:16 upright, 16:9 wide, 1:1 square, 4:5 upright; VIDEO SIZE: Same as the first clip, 720p, 1080p (Full HD), 4K; a tick marks the current ones and moves to 1080p (Full HD). The question opens the help article about shapes.", ""], ["p-fades", "Fade in and out", "Tap the three dots > Fade in and out. Set Fade in from black and Fade out to black to about 2 s each. Close the sheet. Play the first 3 seconds.", "A sheet \"Fade in and out\" with the two settings. The video comes up from black at the start. Ask the owner to watch the phone.", "watch"]]], ["Settings on the phone", [["p-settings", "The Settings page", "Tap the three dots > Settings. Read the page from top to bottom. Go back. Then go to the project list, tap its three dots > Settings, and go back.", "A page \"Settings\" with: Editing (Snap to playhead and edges, Show sound waves, Smooth preview), Export (Use graphics card (faster)), Suggestions (Show suggestions; the button \"Show hidden suggestions again (none hidden)\"), Updates (Check for updates automatically, Check now, the version line), About (About ClipForge, Copy version info, What's new, Licences). There is NO part \"Text window\" and NO part \"Claude\" on the phone. Both ways open the same page.", ""], ["p-set-switches", "Sound waves, snapping and smooth preview change the app and are remembered", "Open the project. Look at clip A's bottom edge (a slim sound wave). Open Settings, switch Show sound waves OFF, Snap to playhead and edges OFF and Smooth preview OFF. Go back and look at the timeline. Close ClipForge completely (recent apps, swipe it away), open it again, open the project and Settings. Then switch all three ON again.", "With Show sound waves off the wave on the clip is gone at once. After closing and reopening the app all three switches are still off. After switching them on the wave returns (\"Drawing sound\u2026\" may show briefly). Ask the owner, with a finger on the phone, whether dragging the end of the title jumps onto the playhead with snapping on and not with it off (otherwise set Partial for snapping).", ""], ["p-set-updates", "Check now", "In Settings tap Check now. Switch Check for updates automatically off and on again. Do NOT tap Update if a newer version is offered: tell the owner.", "A message at the bottom: \"You have the newest version (1.15.0 (build 130)).\" (If a newer version is offered, write the version down and set Partial.) The switch moves and stays as set.", ""]]], ["Suggestions (the line above the bottom bar)", [["p-sg-shape", "Another shape: the line, \"Don't show again\", Settings brings it back, Fill", "Tap the three dots > Shape and size > 9:16 upright and close the sheet. Wait a second without playing. Read the thin line just above the bottom bar. Tap the three dots ON THAT LINE and tap Don't show again. Open Settings (three dots at the top), read the button under Show suggestions, tap it, go back and wait a second. When the line is back, tap Fill.", "The line says \"A clip has another shape than the video, so it gets bars.\" with the buttons Fill, Blur and Crop\u2026 on a second row, three dots and a cross. Don't show again makes it go. In Settings the button reads \"Show hidden suggestions again (1)\"; tapping it says \"One suggestion can show again.\" and the line returns in the project. Fill makes that clip fill the upright frame (no bars), and the line goes.", ""], ["p-sg-music", "Music longer than the video: Fit to video; hidden while playing", "Move the playhead to 0:00. Tap Add > Music or sound. Use My files > Choose a music file\u2026 if the phone has a music file longer than the video; otherwise Find free music, search piano and tap Use on a track that is longer than the video. If it asks \"What is this sound?\", choose Music and tap Add. Wait a second and read the line. Tap Play, look where the line was, tap Pause. Then tap Fit to video.", "The line says \"The music is longer than the video.\" with Fit to video. While the video plays the line is not shown; it is back after Pause. Fit to video makes the music end with the video and says \"The music now ends with the video, with a 2-second fade-out.\"", ""], ["p-sg-swipe", "Swipe a suggestion away", "Wait a few seconds (until \"Drawing sound\u2026\" is gone). Another line should appear, for example \"Music plays while someone is talking.\", \"A long clip has pauses in the talking.\" or \"Text shows every caption in one place, to read, search and fix.\" Write its text down. Swipe the line sideways off the screen (if the swipe fails twice through mirroring, tap its cross instead and say so). Go back to the project list and open the project again.", "The line slides away and does not come back in this project after reopening (a different one may appear; write that down too). Only one line is ever shown at a time.", ""]]], ["The Text page", [["p-text-open", "Text: read, search, tap to jump", "Tap an empty place, then tap Text in the bottom bar. Read the page. Tap the sentence \"Hello back.\" and look at the playhead when you return (close the page with its cross if it does not close by itself). Open Text again, tap into \"Find in the text\u2026\" and type: hello. Then type: xyzzy.", "A full-screen page \"Text\" shows the captions as a readable page: \"Sam Taylor\" once above his line and \"Alex K\" once above the two lines that follow, each with a coloured bar and the time at the side. Tapping a sentence moves the playhead to it (0:06). The search marks and counts the places (\"1 of 2\"); xyzzy gives \"Not found\". Nothing on the page offers to transcribe speech.", ""], ["p-text-edit", "Edit a caption", "In Text tap the sentence \"Let us test the search.\" and tap Edit. Change it to \"Let us test the phone.\" and tap Save. Close Text and look at the preview at 0:10. Tap Undo, then Redo.", "Tapping a sentence shows a bar with Edit, Delete caption and Make a short from this\u2026. Edit opens the caption's text (with the name \"Alex K:\" in front) in a box with Cancel and Save. After Save the page and the preview show the new words. Undo and Redo switch between the old and the new text.", ""], ["p-text-short", "A short from this line: 30, 45, 60 s", "Open Text, tap the first sentence and tap Make a short from this\u2026. Read the window. Tap 30 s, 45 s and 60 s in turn, then 30 s. Leave the tick boxes as they are, name it Round 6 phone short and tap Make the short. Tap Stay here.", "A window \"Make a short\" with the choices The selection, 30 s, 45 s and 60 s; the line with the times changes with each choice. It says a new upright (9:16) project is made and this video is not changed, and has Start and end at a pause, Short caption look, Title at the top and \"Name of the new project\". Afterwards \"The short is ready\" with Stay here and Open it. (If the video is shorter than the chosen length, write down what it says.)", ""]]], ["Markers and shorts", [["p-marker", "Good moment markers", "Move the playhead to about one third of the video and tap Add > Good moment marker. Move it to about two thirds and tap More > Good moment marker. Then tap the three dots at the top > Markers.", "Each one puts a small flag on the time ruler and says \"Marked a good moment at \u2026\" with Undo. Markers opens the list \"Good moments\" with both markers, each with \"Make a short around it\" and \"Remove the marker\", and the buttons Make shorts from markers\u2026 and Close.", ""], ["p-moments", "Shorts and good moments under More", "Close the list. Tap More > Shorts and good moments. Read the sheet.", "The line under More reads \"Shorts and good moments\" with \"2 markers\" under it. It opens a sheet \"Shorts\" with Good moment marker (M), Good moments (2)\u2026, Make a short from here\u2026 and Make shorts from markers\u2026.", ""], ["p-shorts-markers", "Make shorts from markers", "Tap Make shorts from markers\u2026. Read the question and tap Make them. When it is done tap OK. Go to the project list, read the names, open one of the new shorts, play 5 seconds and go back.", "The question \"Make 2 shorts from the markers?\" lists the two parts with times and lengths and has Short caption look, Cancel and Make them. Afterwards \"2 shorts are ready\" lists them, with OK. The project list has the new projects; a short is upright and plays; \"Round 6 phone\" is unchanged. Ask the owner to look at one short on the phone: captions bigger, in the lower middle, outlined.", "watch"]]], ["Export, share, publishing notes", [["p-notes", "Publishing notes", "Open \"Round 6 phone\". Tap the three dots > Publishing notes. Type a Title (Round 6 phone video) and a Description (one sentence). Tap the copy button next to Title. Tap Done.", "A full-screen page \"Publishing notes\" with Title, Description, Hashtags and Chapters, each with a copy button, Chapters from titles / captions\u2026, \"A different title for Shorts, Reels and TikTok\", Copy title and description and Done. The keyboard does not hide the field being typed in.", ""], ["p-exp-dest", "Export for a destination", "Tap Export at the top. Read \"Where is it going?\" and tap each choice once. Then choose WhatsApp / Telegram and tap Export. Wait until it is done and read the finished screen (stay on it for the next step).", "Choices: YouTube, Shorts / Reels / TikTok, Instagram post, WhatsApp / Telegram, Podcast audio, Custom, each with one line of explanation. Because the project is upright now, YouTube asks \"Your video is 9:16; this needs 16:9.\" with Make a copy in this shape and Export as it is. WhatsApp / Telegram says \"A small file (720p) that is quick to send.\" The export runs to 100 %, then \"Video saved\" and \"Saved to \u2026\" (the gallery). \"Keep ClipForge open while it exports.\" is shown while it runs.", ""], ["p-share", "Share, and Copy title and description", "On the finished screen tap Share. When Android's share sheet opens, look at it and close it WITHOUT choosing an app (back button). Then tap Copy title and description. Tap Done.", "Share opens Android's own share sheet with the video (choose nothing: nothing is sent). Back in ClipForge no error is shown. A note says that many apps ignore text shared with a video, which is why Copy title and description stays on screen; it copies the title and description from the notes (paste them into the note here if copying between phone and PC works, otherwise ask the owner to paste them into a notes app and read them).", ""], ["p-exp-several", "Export several into a gallery album", "Tap Export, then Export several\u2026. Tick WhatsApp / Telegram and Podcast audio only. Read the line under the list. Tap Export 2 files and wait. If Android asks whether ClipForge may add to the gallery, allow it and write that down.", "Each tick shows its file name (\"Round 6 phone - WhatsApp.mp4\", \"Round 6 phone - audio.mp3\"). The line says \"2 files, about \u2026 together. The videos go to your gallery, in an album called \"Round 6 phone\".\" One progress bar (\"1 of 2: \u2026\"), then \"Files saved\". The finished screen offers Share and Copy title and description.", ""], ["p-gallery", "The album in the gallery", "Open the phone's Gallery app and look for an album called Round 6 phone. Play the video in it for 10 seconds. Go back to ClipForge.", "The album exists and holds the WhatsApp video (the sound file and the text file stay in the app and go out through Share). Ask the owner to watch and listen on the phone: upright, the clip fills the frame, fade from black, captions readable, music heard, voice in sync.", "watch,listen"]]], ["Files, rotation, what is not on a phone", [["p-reopen", "Close and reopen: the media is still there", "Go to the project list. Close ClipForge completely (recent apps, swipe it away). Open the Gallery app, look at two photos, close it. Open ClipForge again and open \"Round 6 phone\". Play 5 seconds.", "Both clips are there with their pictures, the music is there, and everything plays. No clip is red or says Missing, and no \"File not found\" message appears.", ""], ["p-rotate", "The phone on its side", "Ask the owner to switch auto-rotate on and turn the phone on its side with the project open, then back upright. Look at the screen in both positions.", "Write down what happens. On a wide enough screen (a tablet, or a large phone on its side) the editor changes to the computer's layout: the settings panel at the side, a Shape button and \"?\" in the top bar, and no More sheet; otherwise it keeps the phone layout. In both cases nothing is lost: the project, the playhead and the selection are still there, and the app does not close.", ""], ["p-none", "Nothing about speech-to-text or Claude on the phone", "Look for the words Transcribe, Captions from speech, Remove filler words, Automatic cuts and Claude in: the three dots on the project list, the three dots in a project, Settings, the Add sheet, More (nothing selected and a clip selected) and the Text page.", "None of these places has an item about speech to text or about Claude. (Help may have articles marked \"computer only\": that is correct.) Write down any place where such an item shows up.", ""], ["p-final", "Everything was saved", "Open \"Round 6 phone\" once more and look through it: shape, fill, title, captions, fades, music, markers, publishing notes.", "Everything is as you left it: 9:16 upright, clip A filling the frame, the title \"Round 6 phone\", three captions (the last one edited), the fades, the music ending with the video, two flags on the ruler, and the title and description in Publishing notes.", ""]]]];const INSTR="You are testing ClipForge 1.15.0 (build 130), a video editor, on the owner's Android phone. The phone was updated from inside the app. You work on the owner's Windows PC and see and touch the phone through \"Link to Windows\" (the PC app is called Phone Link): the phone's screen is shown in a window on the PC. This checklist page is open in a browser on the PC. Problems are expected; your job is to find them and write them down precisely. \"Send feedback\" is not part of this round.\n\nHOW TO DRIVE THE PHONE\n- In the phone window a mouse click is a tap, holding the mouse button down for a second is a long-press, and click-and-drag is a drag or a swipe. There are no keyboard shortcuts and no menu bar on the phone: use only what is on the phone's screen. This round is written for taps; the few drags are marked.\n- If the phone screen is not shown, ask the owner to open Phone Link on the PC and choose the phone's screen, and to unlock the phone. If the mirrored screen goes black or locks, ask the owner to unlock it.\n- Drags, swipes and long-presses often fail through mirroring. Try twice. If it still fails, use the button the step offers instead; otherwise set \"Needs the owner\", write that it could not be performed through mirroring (it may work fine with a finger), and ask the owner to try it with a finger if they are there.\n- Typing: tap into the text box on the phone and type on the PC keyboard.\n- SOUND: the phone's sound may not reach you through mirroring. Never judge sound yourself. For every step tagged \"ask the owner to listen\", do the actions, then ask the owner in the chat. The same goes for smoothness: mirroring stutters by itself, so for steps tagged \"ask the owner to watch\" ask the owner to look at the phone itself. Write the answer in the note starting with \"Owner:\" and set PASS or FAIL from it. If the owner is not available, set \"Needs the owner\".\n\nHOW THE PHONE APP IS LAID OUT IN 1.15 (names as on the screen)\n- Project list: New project and Open project file; ? (Help) and three dots (Settings, What's new, Check for updates, About ClipForge, Copy version info) at the top; each project card has three dots: Rename, Duplicate, Share project file, Delete.\n- Editor, top: back arrow, the project's name, the save sign, Undo, Redo, Export and three dots (Shape and size, Fade in and out, Publishing notes, Text, History, Markers, Settings, Help).\n- Bottom bar with nothing selected: Add, Text, Split, More. Add opens one list of everything that can be added. More lists the rest under the headings Clip, Sound, Text, Edit.\n- With something selected the bar shows that item's tools and More; Done clears the selection. A + next to Play opens the Add list while something is selected.\n- A thin line with a tip and a button may appear just above the bottom bar: a suggestion. Outside the group \"Suggestions\" leave it alone.\n- Sheets open from the bottom; swipe them down or tap outside to close them.\n\nBEFORE YOU START\n- Fill in \"Device\" (for example \"Samsung Galaxy S23, Android 15, via Link to Windows\") and \"Tester\".\n- Fill in \"Version shown in the app\": project list > three dots > About ClipForge > Copy version info, then type or paste the line. If it does not match the build named at the top of this page (a red warning appears), tell the owner and say so in the Summary.\n- Test files on the phone (ask the owner which ones to use): A. a talking video filmed wide (landscape), 1-3 minutes; B. a second short video; optional: a music file longer than video A (otherwise the app's own Find free music is used, which needs internet). Do not download files in any other way.\n- Do the steps in order: later steps build on the project \"Round 6 phone\". Do NOT tap Text before the group \"Suggestions\" is finished.\n\nRULES\n- Each step has \"Do\" (exact actions) and \"Expected\" (what should happen). Do the actions exactly, then compare with Expected.\n- For each step choose a Result and write a Note. Result meanings: PASS = you saw exactly the expected result (or the owner confirmed it). FAIL = something was wrong (write what you did, what happened, and what you expected). Partial = part of it worked (say which part). Not tested = you could not do it (say why). Needs the owner = only a person can judge or perform it and the owner was not available.\n- NEVER delete, move or rename the owner's photos, videos or music, in ClipForge's pickers, in the Gallery or in any other app. Do not uninstall ClipForge (that deletes the projects). Inside ClipForge only delete things this test made. Do not send or share anything to other people or apps: when a share sheet opens, choose nothing and go back.\n- Do not tap Update if a newer version is offered: tell the owner.\n- Exported videos go to the phone's gallery; leave them there for the owner.\n- If an Android permission dialog appears (photos and videos, music, notifications), allow it and write down that it appeared.\n- If the app closes by itself or freezes, write down exactly what you were doing, fill in the Crash box, reopen it and continue.\n- Do not guess. Only mark PASS for what you actually saw, or for what the owner told you they heard or saw.\n- This page keeps your answers in this browser as you go. When finished, fill in the Summary box (most important problems first; also what was hard to do through mirroring), then click \"Download filled checklist\" and give the downloaded file to the owner.";
const OPTS=["", "PASS", "FAIL", "Partial", "Not tested", "Needs the owner"];const TAGS={"listen": "ask the owner to listen", "watch": "ask the owner to watch"};const RESULT="Result";const NOTE="What happened? Start with Owner: for what the owner saw or heard";
let data=JSON.parse(document.getElementById('data').textContent);
try{const s=localStorage.getItem('clipforge-round6-phone');if(s){const l=JSON.parse(s);if(l&&l.items)data=Object.assign(data,l);}}catch(e){}
document.getElementById('instr').textContent=INSTR;document.getElementById('build').textContent=data.build;
const root=document.getElementById('steps');
for(const [group,items] of STEPS){const h=document.createElement('h2');h.textContent=group;root.appendChild(h);
 for(const st of items){const five=st.length>4,id=st[0],title=st[1],act=five?st[2]:'',exp=five?st[3]:st[2],tag=st[st.length-1];const it=data.items[id]||(data.items[id]={status:"",note:""});
  const c=document.createElement('article');c.className='card step';c.dataset.s=it.status;
  const t=document.createElement('h3');t.textContent=title;for(const k of (tag?tag.split(','):[])){const g=document.createElement('span');g.className='tag';g.textContent=TAGS[k]||k+' only';t.appendChild(g);}
  const d=document.createElement('p');d.className='do';d.textContent='Do: '+act;
  const p=document.createElement('p');p.className='exp';p.textContent='Expected: '+exp;
  const row=document.createElement('div');row.className='row';const sel=document.createElement('select');sel.setAttribute('aria-label',RESULT+': '+title);
  for(const o of OPTS){const op=document.createElement('option');op.value=o;op.textContent=o||RESULT+'...';if(o===it.status)op.selected=true;sel.appendChild(op);}
  row.appendChild(sel);const ta=document.createElement('textarea');ta.setAttribute('aria-label','Note: '+title);ta.placeholder=NOTE;ta.value=it.note;
  sel.addEventListener('change',()=>{it.status=sel.value;c.dataset.s=sel.value;save();});ta.addEventListener('input',()=>{it.note=ta.value;save();});
  if(act)c.append(t,d,p,row,ta);else c.append(t,p,row,ta);root.appendChild(c);}}
for(const k of ['device','tester','version','summary','crash']){const e=document.getElementById(k);e.value=data[k]||'';e.addEventListener('input',()=>{data[k]=e.value;save();});}
function counts(){const n={};let total=0;for(const [,items] of STEPS)for(const [id] of items){total++;const s=data.items[id].status||'Not done yet';n[s]=(n[s]||0)+1;}
 const el=document.getElementById('counts');el.textContent='';for(const [k,v] of Object.entries(n)){const s=document.createElement('span');s.textContent=k+': '+v;el.appendChild(s);}const s=document.createElement('span');s.textContent='Total: '+total;el.appendChild(s);}
function vcheck(){const v=(data.version||'').trim();const w=document.getElementById('vwarn');
 const b=data.build||'';const m=b.match(/\d+\.\d+\.\d+ \(build \d+\)/)||b.match(/\d+\.\d+\.\d+/);const h=b.match(/\b([0-9a-f]{7,40})\s*$/);
 const bad=m&&!v.includes(m[0])?m[0]:(h&&!v.includes(h[1].slice(0,7))?h[1].slice(0,7):'');
 w.textContent=!v?'Please paste the version shown in the app (required).':(bad?'This is not the build named above ('+bad+'). Say so in the Summary.':'');}
function save(){counts();vcheck();try{localStorage.setItem('clipforge-round6-phone',JSON.stringify(data));document.getElementById('saved').textContent='Saved in this browser.';}catch(e){}}
counts();vcheck();
document.getElementById('dl').addEventListener('click',()=>{
 if(!(data.version||'').trim()&&!confirm('"Version shown in the app" is empty. Download anyway?'))return;
 const clone=document.documentElement.cloneNode(true);clone.querySelector('#data').textContent=JSON.stringify(data).replace(/</g,'\\u003c');
 clone.querySelector('#steps').innerHTML='';
 const blob=new Blob(['<!doctype html>\n'+clone.outerHTML],{type:'text/html'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);
 const d=(data.device||'device').replace(/[^A-Za-z0-9]+/g,'-').slice(0,30);a.download='ClipForge-Test-Round-6-phone-results-'+d+'.html';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1000);});
</script></body></html>
