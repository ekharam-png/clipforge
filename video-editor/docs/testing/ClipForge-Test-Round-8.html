Click the first piece of A, open Look, choose the filter Vintage and Fill. Press Ctrl+Shift+C. Click the photo P and press Ctrl+Shift+V. Press Ctrl+Z. Then, with the first piece of A selected, find Apply to all clips in the side panel and use it for the look; read what it asks; press Ctrl+Z.", "Ctrl+D adds one copy right after B with the same settings. Paste settings gives P the same look and fit as A but keeps its own length; one undo takes it back. Apply to all clips gives every clip the same setting in one step, and one undo takes it back.", ""], ["tl-snap", "Snapping, and Alt to place freely", "Put the playhead at 0:08. Add a title at 0:03 (Add > Title, type: Basics). Slowly drag the right end of the title towards the playhead. Then hold Alt and drag it slowly past the playhead. Open View and read Snap to playhead and edges.", "Near the playhead the edge jumps onto it and a yellow line shows. With Alt held there is no jump and no yellow line. View > Snap to playhead and edges is ticked. (If you cannot hold a key while dragging, set Needs the owner for that part.)", ""], ["tl-keys", "J K L, frame steps, second steps, zoom", "Click an empty place on the timeline. Press L, wait 2 seconds, press K; press J, wait 2 seconds, press K. Pause on clip A and note the time. Press Right 30 times and note the time; Left 30 times. Press Shift+Right once. Press + three times and - three times.", "L plays, K pauses, J goes backwards in small steps. Each Right / Left moves one frame; 30 presses move about 1.0 s on a 30 fps clip (1.2 s at 25 fps, 0.5 s at 60 fps) and Left 30 times returns to the same time. Shift+Right moves 1 second. + zooms the timeline in, - out. Write down the times you saw.", ""], ["tl-long-note", "A long project stays usable", "Open \"Round 8 long\". Read any note it shows about long projects. Zoom fully out and fully in, scroll from the start to the end, and click five places on the ruler quickly one after the other.", "The timeline scrolls and zooms without waiting, clip pictures fill in as they come into view, and the preview follows the playhead. A note for very long projects may be shown once: write its text down.", ""]]], ["O. Picture", [["pic-shape", "Shape, Fit, Fill, Blur", "In \"Round 8 basics\" choose View > Shape > 9:16 upright. Click the first piece of A and in Look choose Fit, then Blur, then Fill. Then try View > Shape > 1:1 square and 4:5 upright, and go back to 9:16 upright.", "The preview takes each shape. Fit shows the whole wide picture with bars, Blur fills the bars with a blurred copy of the picture, Fill makes the picture fill the frame (its sides are cut off).", ""], ["pic-position", "Position: keep the person in shot", "With Fill on the first piece of A, choose Clip > Crop and position\u2026. Move Left \u2013 right fully to one end, then the other, then put the person in the middle.", "With Fill, Left \u2013 right changes which part of the wide picture fills the tall frame. With Fit the position has no effect and the panel says so.", ""], ["pic-crop", "Crop with handles and shapes, rotate and flip", "Choose View > Shape > Original (as the first clip). Click B and choose Clip > Crop and position\u2026. On the preview drag the bottom-right corner of the frame inwards, then drag inside the frame. Click 1:1, 9:16, Free and Original. Click Rotate right twice, Rotate left, Flip sideways, Flip upside down, then Reset crop and position. Then choose Clip > Rotate right and press Ctrl+Z.", "The preview shows the whole picture with a frame, grips and the outside dimmed. A corner drag makes the frame smaller, a drag inside moves it; 1:1 and 9:16 keep their shape while you drag. Each rotate turns the picture a quarter turn, each flip mirrors it, Reset puts it back. The menu item turns it like the button and undo turns it back.", ""], ["pic-look", "Brightness, contrast, saturation, zoom; filters and warmth", "Click the first piece of A and open Look. Move Brightness, Contrast, Saturation and Zoom each a little and back. Under Filter click Warm, Cool, Black & white, Vintage, Vivid, None in turn. Choose Vintage and move Warmth left and right. Click Reset look, then Ctrl+Z.", "Each slider changes the preview at once. Each filter changes the colours at once (Black & white has no colour; None removes it). Warmth makes it more orange or more blue. Reset look removes filter and warmth; one undo brings them back.", ""], ["pic-size", "Video size", "Choose View > Video size > 720p. Press Ctrl+E, choose Custom, read the size shown, cancel. Choose View > Video size > Same as the first clip.", "The tick moves to 720p and the Export window shows that size (1280 \u00d7 720 for a wide video). 1080p (Full HD) and 4K are offered too.", ""], ["pic-overlay", "Overlay: add, corner, size, frame, drag", "Put the playhead at 0:05. Choose Add > Overlay video or photo\u2026 and pick file B. Click the overlay on its row. Under Layout keep Picture-in-picture, set Corner to the top left, Size to about 50 %, switch White frame on. On the preview drag the overlay to the middle and drag its corner grip outwards.", "B appears as a small picture in a corner of the preview from 0:05, on a new Overlay row above the main clips. Corner, Size and White frame change it at once. Dragging it on the preview moves it anywhere (Layout changes to Free position); the corner grip resizes it.", ""], ["pic-overlay-2", "Overlay layouts, trim, mute", "Choose Layout Side by side, then Top and bottom, then Full screen, and play across the overlay each time. Set it back to Picture-in-picture. On the Overlay row drag the overlay 3 seconds to the right and drag its right end shorter. Switch Mute overlay sound on and off while it plays. Right-click the overlay and read its menu.", "Side by side: your video on one half, B on the other. Top and bottom: one above the other. Full screen: B covers the picture while it plays. It moves and trims on its row; Mute overlay sound silences B only. The right-click menu has what can be done with an overlay (crop, rotate, selecting its time, delete). Ask the owner to watch and listen: B plays smoothly and starts and stops at the right moment.", "watch,listen"], ["pic-fades", "Fade the whole video, and one clip", "Click an empty place so nothing is selected. In the side panel set Fade in from black and Fade out to black to about 2 s each. Play from 0:00 and play the last 4 seconds. Then click B, open Transition and fades and set its Fade out to black to about 1 s; play across the end of B.", "The video comes up from black at the start; at the end picture, titles, overlay and all sound go down together. B's picture and own sound fade over its last second and the next item starts normally. Ask the owner to watch and listen.", "watch,listen"]]], ["P. Titles and captions", [["ti-fonts", "Fonts, styles, outline, shadow, position, alignment", "In \"Round 8 basics\" click the title \"Basics\". In the side panel click Font Classic, Modern, Elegant, Handwritten in turn, then two different Styles. Switch Outline on; Shadow off and on; Dark box behind text on and off. Under Position click Top, Middle, Lower third, Bottom; then Left, Centre, Right. (In 1.18 a title's settings are in groups: Size and style, Font and colour, Position, Appear and disappear, When it shows. Click a heading to open its group; Font and colour is closed at first.)", "Each font visibly changes the letters; a Style changes several settings at once. Outline draws a line around the letters, Shadow adds or removes a soft shadow, the box appears and goes. Each Position moves the text to that height; Left / Right line it up at that side.", ""], ["ti-lang", "Hebrew and Russian letters", "Put the playhead at 0:10 and choose Add > Title. Copy this text from this page and paste it into Text: \u05e9\u05dc\u05d5\u05dd \u05e2\u05d5\u05dc\u05dd / \u041f\u0440\u0438\u0432\u0435\u0442, \u043c\u0438\u0440 . Click each of the four fonts.", "In every font the Hebrew and Russian letters show properly (no empty boxes, no question marks). The Hebrew words keep their order: read right to left, \u05e9\u05dc\u05d5\u05dd comes before \u05e2\u05d5\u05dc\u05dd.", ""], ["ti-anim", "Appear and Disappear", "Click the title \"Basics\". Set Appear to Slide up and Disappear to Pop. Play from 1 second before the title to 1 second after it. Then set Appear to Fade and play again. (Appear and Disappear are in the group \"Appear and disappear\", which is closed at first.)", "The title slides up into place at its start and pops away at its end, each in less than half a second; with Fade it fades in. Ask the owner to watch.", "watch"], ["ti-follow", "A title follows its clip", "Note the time of the title \"Basics\" and which clip is under it. Click the clip BEFORE that one and press Delete. Look at the title. Press Ctrl+Z.", "The title moved earlier together with the clip it lies on (it still shows over the same picture). Undo puts both back.", ""], ["ti-srt", "Subtitle file: export and import", "Open \"Round 8 test\". Choose File > Export subtitles (.srt)\u2026 and save as r8-captions.srt in clipforge-test-output. Make a new project \"Round 8 srt\" with file A. Choose Add > Subtitle file (.srt)\u2026 and pick r8-captions.srt.", "A .srt file is saved with the four captions. After the import the new project has the same captions at the same times with the same text (open the Text window to read them); a message says how many were added.", ""], ["ti-vertical", "Text fits an upright video", "In \"Round 8 srt\" choose View > Shape > 9:16 upright and play the first 15 seconds. Then choose Original (as the first clip) again.", "The captions and titles stay inside the upright frame, wrapped onto more lines if needed, and are readable; nothing is cut off at the sides.", ""]]], ["Q. Sound", [["so-music", "Music: volume, fades; a clip's volume and mute", "In \"Round 8 basics\" put the playhead at 0:00 and add music M (Add > Music or sound\u2026, My files; Music). Click the music: set Volume to about half and Fade in and Fade out to about 2 s. Click clip A: move its Volume, switch Mute on and off. Play the start.", "The music starts at 0:00 on a Music track, fades in, and is quieter at half volume; at the video's end it fades out by itself instead of stopping dead. The clip's own sound gets louder, quieter or silent. Ask the owner to listen.", "listen"], ["so-clean", "Clean up sound, Hear original, Voice focus", "Click the first piece of A, open Sound and switch on Clean up sound. Wait until \"Preparing sound\u2026\" is finished. Play it and switch Hear original on and off while it plays. Then switch on Voice focus, wait and play again.", "The clip shows \"Sound \u2026%\" and then finishes; meanwhile the preview plays a light version. Ask the owner to listen: hiss or rumble is lower with Hear original off; with Voice focus the speech is clearer and the background quieter; the voice stays in sync with the lips.", "listen"], ["so-sample", "Sound from, and Hear a sample", "With the same clip selected, read \"Sound from\" in its Sound settings (the choices depend on the file) and click Hear a sample.", "Sound from lets you choose which sound of the file is used (a track, or left / right only) when the file has more than one. Hear a sample plays about 15 seconds with and without your sound settings. Ask the owner to listen.", "listen"], ["so-tracks", "Sound tracks: add, menu, mute, solo, move, delete", "Choose Sound > Add sound track until it is refused. Click the name of the last track on the left and read its menu. While the video plays click M and S on the Music track, each on and off. In a track's menu click Move up and Move down. Delete the empty tracks (Delete track). Click Video (the first name on the left) and switch Mute on and off.", "No more than three sound tracks: then the item reads \"Add sound track (there are already 3 tracks)\". The track menu has Name, Volume, Mute, Solo, Lower this track under speech, This track is speech, Only when speaking, Move up, Move down and Delete track. M silences that track, S plays only that track, Video > Mute silences the clips' own sound while music plays on. Ask the owner to listen while you click.", "listen"], ["so-separate", "Separate sound, an L-cut, Put sound back", "Click the first piece of A and choose Sound > Separate sound\u2026; leave \"Also the other clips with sound\" off and confirm. Drag the left edge of that clip about 2 seconds to the right. Drag the sound piece under it about 1 second to the right. Play across the start of the clip. Then click the clip and choose Sound > Put sound back; Ctrl+Z; Ctrl+Y.", "The clip's sound appears as a piece on a Voice track under the clip and the clip shows as muted; the voice is heard once. After the trim the sound piece is trimmed the same way; after dragging it, the voice starts about 1 second after the picture (an L-cut). Put sound back removes the piece and unmutes the clip; undo and redo work. Ask the owner to listen.", "listen"], ["so-roles", "\"What is this sound?\": Music and Sound effect", "Put the playhead at 0:10 and add music M once more, but answer \"What is this sound?\" with Sound effect. Look where it lands. Delete it.", "The window offers Voice for the video, Music and Sound effect (guessed from the file's name and length), with Cancel and Add. A Sound effect goes to an Effects track, Music to a Music track; two sounds never overlap on one track.", ""], ["so-voice", "A voice recorded separately: nudge, Line up again, Unlink", "Open \"Round 8 two voices\" (or set Not tested without voice files). Click one voice on its track. In its settings click the nudge buttons (1 frame, 10 ms, 100 ms) once each way, then Line up again. Then click Unlink, read what it says, and press Ctrl+Z.", "The voice's settings show that it is lined up with its clip, with buttons to move it by 1 frame, 10 ms or 100 ms, Line up again (compares the sound again and puts it back in sync) and Unlink (the voice stays where it is and no longer follows the clip). Ask the owner to listen after Line up again: lips and voice match.", "listen"], ["so-voice-cuts", "Cuts keep the voice in sync", "In \"Round 8 two voices\" click the video clip, put the playhead at 0:20 and press S; click the second piece, put the playhead 3 seconds into it and press Q; set the speed of the last piece to 1.5\u00d7. Play across each change. Press Ctrl+Z three times.", "Every voice is cut, trimmed and sped up together with its clip, in the same undo step, and stays in sync. Ask the owner to watch and listen at each change.", "watch,listen"], ["so-silences", "Remove silences: Sensitivity, apply, undo", "Open \"Round 8 basics\", click a talking clip and choose Clip > Remove silences\u2026. When the result shows, click Fewer cuts, Automatic and More cuts under Sensitivity and write down the gap count of each. With Automatic click the Remove \u2026 gaps button. Play across two cuts. Press Ctrl+Z, then Ctrl+Y.", "A progress bar with Cancel, then the background-noise line and a button like \"Remove 5 gaps\". Sensitivity changes the count at once without scanning again (Fewer cuts gives no more gaps than Automatic, More cuts no fewer). After removing, the clip is in pieces; one undo brings back the single clip. The cuts are listed under Text and speech > Automatic cuts\u2026. Ask the owner to listen: no chopped words.", "listen"], ["so-fit", "Fit music to video, and loop short music", "In \"Round 8 basics\" click the music (longer than the video) and choose Sound > Fit music to video. Press Ctrl+Z. Then make the video longer than the music if you can (add file A two more times) and choose Fit music to video again, choosing to loop it. (If the music is still longer, set Partial.)", "Fit: the music ends exactly with the video, with the message \"The music now ends with the video, with a 2-second fade-out.\" Loop: the music piece shows that it repeats, with marks where, and reaches the end of the video. Ask the owner to listen at a repeat: no gap or click.", "listen"], ["so-free", "Find free music and credits", "Choose Add > Music or sound\u2026 and open Find free music. Search for: piano. Play the preview of one result and click Use. Click the downloaded music, click Copy credits and paste into the note; click Add credits at the end. Choose Sound > Copy music credits and paste.", "Results show title, artist, length and licence (CC0, Public domain, CC BY or CC BY-SA). The preview plays. After Use the music is downloaded and added. The pasted credits name the track, the artist, the licence and a link; a caption with the credits appears over the last 4 seconds. Without internet it says so in plain words: copy the text.", ""], ["so-lower", "Lower music under speech: three places agree", "Click an empty place. Look at (1) the side panel, \"All music in this project\" > Lower music under speech, (2) Sound > Lower music under speech, (3) the menu of each music track, Lower this track under speech. Switch the side-panel switch ON and look at all three. Switch it OFF in ONE track's menu and look again. Click the Sound menu item once and look again.", "None: all off, no tick. All: the switch on, a tick, the track switches on. Some: the side panel says \"On for some tracks only (set in each track's menu). Turn this on to lower every music track.\" and the menu item shows a dash and reads \"Lower music under speech \u2014 on for some tracks\". Clicking the menu item from \"some\" turns every music track on. The three places never disagree.", ""], ["so-waves", "Sound waves, slim marks, speech starts", "Look at the music and at the bottom edge of the clips: sound waves. Zoom far out and look at the captions of \"Round 8 test\" (open it): narrow captions become slim marks with the caption under the playhead shown on a line above. Go to the start, click the double arrow to the right of Play three times and the one to the left once; press Ctrl+Right twice and Ctrl+Left once.", "The music shows its waves (tall where it is loud) and each clip with sound a slim wave along its bottom. Zoomed out, narrow caption blocks are slim marks, the caption under the playhead is shown above them, and a block's tooltip shows its text. The double arrows (\"Previous speech start (Ctrl+Left)\", \"Next speech start (Ctrl+Right)\") and the keys move the playhead to where talking starts after a pause. Ask the owner to press Play at two of the stops: someone starts talking right there.", "listen"]]], ["R. Settings and suggestions", [["set-open", "The Settings page", "Choose File > Settings\u2026. Read the page from top to bottom and close it.", "A window \"Settings\" with the parts: Editing (Snap to playhead and edges, Show sound waves, Show the side panel), Text window (Where it opens: At the right / Below), Export (Use graphics card (faster)), Suggestions (Show suggestions, Show a tip on the project list, and the button \"Show hidden suggestions again (\u2026)\"), Updates (Check for updates automatically, Check now, and the version line), Claude (a line about the helper for Claude, and Connect\u2026), About (About ClipForge, Copy version info, What's new, Licences, and Send feedback). Every switch has one line of explanation. Show the side panel and Show a tip on the project list are new in 1.18.", ""], ["set-switches", "Every switch changes the app and survives a restart", "In Settings switch OFF: Snap to playhead and edges, Show sound waves, Use graphics card (faster), Show suggestions, Check for updates automatically; set the Text window to Below. Close Settings. Look at the timeline, the View menu and (Ctrl+E > Custom) the line \"Will use: \u2026\"; cancel. Choose File > Exit, start again, open a project and Settings. Then put everything back ON and the Text window to At the right.", "With the switches off: no waves on the timeline, no ticks on the two View items, the Export window's graphics-card switch is off and reads \"Will use: Processor (graphics card turned off)\", no suggestion line anywhere. After the restart every switch is as you left it. After switching them back on, the waves and suggestions return and the View menu shows both ticks.", ""], ["sg-small", "Suggestion: a small first clip (Use 1080p)", "Make a new project (New video) with only file S (the small clip), rename it \"Round 8 tips\". Wait a second without playing and read the line under the top bar. Click Use 1080p and open View > Video size. (If S is 720p or bigger, set Not tested and write its size.)", "A thin line says \"The first clip is small (width\u00d7height), and the video takes its size from it.\" with Use 1080p, Don't show again and a cross. After the click the line goes and Video size has its tick on 1080p (Full HD).", ""], ["sg-shape", "Suggestion: another shape (Fill, Blur, Crop\u2026); it comes back for the next clip", "In \"Round 8 tips\" add file A after S and choose View > Shape > 9:16 upright. Read the line and click Blur. Then add file B (also wide) and wait a second.", "The line says \"A clip has another shape than the video, so it gets bars.\" with Fill, Blur and Crop\u2026. Blur selects that clip and fills its bars with a blurred copy. For the next clip of another shape the suggestion comes back (new in 1.17): it is shown again after B was added.", ""], ["sg-music", "Suggestions about music; \"Don't show again\"; Settings brings it back", "Put the playhead at 0:00 and add music M (Music). Read the line. Press Space and look where the line was; press Space. Click Don't show again. Go to the project list and open the project again. Open Settings, read the button under Show suggestions, click it, close Settings. When the line is back click Fit to video. Wait until \"Drawing sound\u2026\" is gone and read the next line; click Lower the music.", "\"The music is longer than the video.\" with Fit to video. While the video plays the line is hidden. Don't show again makes it go and stay away; in Settings the button reads \"Show hidden suggestions again (1)\" and brings it back (\"One suggestion can show again.\"). Fit to video shortens the music. Then \"Music plays while someone is talking.\" with Lower the music; afterwards Sound > Lower music under speech has a tick. Write down any other line that shows (pauses in the talking, captions from speech, the Text window).", ""]]], ["S. Text window", [["tx-open", "Captions as a page, by speaker; follow playback", "Open \"Round 8 test\" and the Text window (Ctrl+Shift+T, or the Text button at the top right). Read it. Go to the start and press Play; watch the Text window until 0:16, then pause. Click the sentence \"Thanks, happy to be here.\"; then click the first caption block on the timeline.", "The window is titled Text and shows the captions as a readable page: the lines of one speaker joined into a paragraph with the time at the side, \"Sam Taylor\" once above his lines (the caption without a name belongs to him), then \"Alex K\", each with a coloured bar. With a transcript or titles a switch chooses Captions / Transcript / Titles. While playing, the line being spoken is marked and kept in view. Clicking a sentence moves the playhead there and selects that caption on the timeline; clicking a caption on the timeline marks it in the window.", ""], ["tx-search", "Search", "Press Ctrl+F. Type: test. Press Enter twice, then Shift+Enter once. Clear the box and type: xyzzy. Clear the box.", "Ctrl+F puts the cursor into \"Find in the text\u2026\". Every place with \"test\" is marked and counted (\"1 of 2\"); Enter goes to the next one, Shift+Enter to the previous one. For xyzzy it says \"Not found\".", ""], ["tx-edit", "Edit a caption, delete captions", "Double-click \"This line has no name.\", change it to \"This line was edited.\" and press Enter. Double-click it again, delete all its text and press Enter; press Esc. Click the caption \"Let us test the search.\" and click Delete caption; Ctrl+Z. Click the first caption, Shift-click the second, click Delete captions; Ctrl+Z.", "Double-click opens the text in a box with the hint \"Enter saves \u00b7 Shift+Enter: new line\"; Enter saves and the preview shows the new text. An empty text is refused (\"A caption cannot be empty. Use \"Delete caption\" to remove it.\"). Delete caption removes one (\"Caption deleted.\"); with two selected the bar says \"2 captions\" and Delete captions removes both. Each Ctrl+Z brings them back in one step.", ""], ["tx-copy-dock", "Copy, save as text, at the right and below", "In the Text window click the three dots. Click Copy all text and paste into the note; then Copy with times and names and paste; then Save as text file\u2026 into clipforge-test-output. Then Show under the preview; then Show at the right and drag the window's left edge a little. Open Settings and read \"Where it opens\".", "The menu has Copy all text, Copy with times and names, Save as text file\u2026, Export subtitles (.srt)\u2026, Show at the right, Show under the preview. The pasted text has every caption; with times and names also the times and the speakers. A file \"Round 8 test.txt\" is saved. The window moves under the preview and back to the right, where its edge can be dragged; Settings shows the same choice.", ""]]], ["T. Speech to text (needs a speech program; otherwise Not tested with the reason)", [["sp-open", "Transcribe speech\u2026: the speech program, or a plain explanation", "In \"Round 8 test\" click clip A and choose Text and speech > Transcribe speech\u2026. Wait until \"Looking at what this computer has\u2026\" is gone. Read the window. Do not click Download.", "A window \"Transcribe speech\" with a Language list. EITHER a line \"Uses: \u2026\" names the speech program found (write it down) and a part \"Language pack\" lists Small, Medium and Large with their sizes and Download or Remove (\"Nothing is downloaded until you press Download.\"), with Use a model file I have\u2026 below, OR a box says in plain words that turning speech into text needs a speech program on this computer and none was found, and what to install. In the second case set this step to PASS if the text is clear, copy it, and set the rest of this group to Not tested with \"no speech engine\".", ""], ["sp-own", "Use a model file I have\u2026 (fixed in 1.17)", "Only if the owner has a speech model file on this PC (a file like ggml-base.en.bin or ggml-small.bin; ask where it is; otherwise set Not tested). In the Transcribe speech window leave Language on Automatic. Click Use a model file I have\u2026 and pick the file. Read the line under its name and look at the Transcribe button. If the file has \".en\" in its name, also choose another language (for example Russian) and read the line; then choose English again.", "The window shows \"Your own file: <name>\". The Transcribe button can be clicked now (in 1.15 it stayed grey). With an English-only file (\".en\" in its name) and Automatic it says \"This file understands English only, so the language was set to English.\"; for another language one line says why it cannot be used and what to choose instead. Your own file is used before the downloaded packs.", ""], ["sp-run", "Transcribe", "Only with a speech program. If neither a pack nor your own file is there, ask the owner which pack to download (suggest Small; NEVER Large) and click Download on that row only after a yes. Choose the language of file A and click Transcribe. Wait until it is finished. Meanwhile move the window and click the timeline.", "A progress bar with a Stop button; the app stays usable. At the end a message says \"Speech transcribed: \u2026 words. Read it in the Text window.\" Write down the number of words and how long it took. The Text window now has a switch with Captions and Transcript; in Transcript the word being spoken is marked while playing. New in 1.18: when the speech program is your own whisper.cpp (whisper-cli), ClipForge reads the sound itself (\"Reading the sound\u2026\"), so FFmpeg does not have to be installed on the computer. If it stops with \"Reading the sound needs FFmpeg, which was not found on this computer.\", copy that, set FAIL and write down which speech program the window named under \"Uses: \u2026\".", ""], ["sp-voices", "Separate voices are transcribed per speaker", "Only with a speech program and \"Round 8 two voices\". Open it, choose Text and speech > Transcribe speech\u2026 and transcribe. Open the Text window on Transcript.", "The voice files are read (not the muted camera sound) and the transcript shows who speaks: each speaker's name once above their paragraphs, in their colour.", ""], ["sp-captions", "Captions from speech\u2026", "Only with a transcript, in \"Round 8 srt\" after transcribing its clip (or in \"Round 8 two voices\"). Choose Text and speech > Captions from speech\u2026. Read the window, tick \"Replace the \u2026 captions that are already there\" if it is offered, and click Add captions. Play the first minute.", "The window \"Captions from speech\" says how many captions it adds, with Lines and \"Longest line: \u2026 letters\". Afterwards \"Added \u2026 captions from the speech. Undo takes them away.\" and the captions are on the timeline and in the Text window. Ask the owner to watch: each caption appears when its words are spoken and fits inside the picture (wrong names or numbers are normal: write down two examples).", "watch,listen"], ["sp-foreign", "A Russian or Hebrew clip", "Only with file R and a speech program. Make a new project (New video), \"Round 8 language\", with R; transcribe it in its language; Captions from speech\u2026; play 30 seconds and open the Text window.", "The letters show properly in the Text window and in the captions on the picture; Hebrew is laid out right to left with punctuation on the correct side. Ask the owner to read two captions.", "watch"], ["sp-fillers", "Remove filler words\u2026: review, remove, check", "Only with a transcript. Choose Text and speech > Remove filler words\u2026. Wait until \"Checking the picture around each cut\u2026\" is gone. Click Light, Normal and Strong and copy the summary line of each. Press the play button of one row. Choose Light and click the button that removes them (if none were found, Cancel and say so). Play across two of the cuts.", "A window \"Remove filler words\" with Fillers of (a language), Select: Light / Normal / Strong, a summary line (\"\u2026 of \u2026 selected \u00b7 saves \u2026\") and a list with a tick box, the time, the filler in quotes and a play button (\"Play it as it would be after the cut\") per row; or \"No filler words were found in the transcript.\" After removing, the video is shorter by what the summary said. Ask the owner to listen at two cuts: the filler is gone and no word is chopped.", "listen"], ["sp-autocuts", "Automatic cuts\u2026: Put back one, Put back all", "Choose Text and speech > Automatic cuts\u2026. Read the window. Click Put back on one row. Then click Put back all. Close the window and press Ctrl+Z once, then Ctrl+Y.", "The window \"Automatic cuts\" has a line with the number of cuts and the time removed and one row per cut (fillers, silences, parts cut out) with Put back, plus Put back all and Close. Put back returns that part; Put back all returns everything and the video has its old length. Undo and redo of Put back all are one step each. With nothing left the menu item reads \"Automatic cuts\u2026 (nothing was cut automatically)\".", ""]]], ["U. Markers and shorts (the rest)", [["sh-marker", "M, the flags, and the Good moments list", "In \"Round 8 test\" play from the start and press M once while it plays. Pause. Click a flag and press M again. Right-click a flag; Esc. Choose Clip > Good moments\u2026 and read the list; close it. Click an empty place and read the bottom of the side panel (\"Shorts and publishing\"). With two flags, put the playhead between them and choose Part > Select between the markers here; Esc.", "M drops a flag on the ruler, also while playing (\"Marked a good moment at \u2026\" with Undo). M on a flag says \"There is already a marker here.\" The flag's menu has Make a short from here\u2026, Make shorts from markers\u2026, Good moments\u2026 and Remove this marker. The window \"Good moments\" lists the markers with their times and what is said there, each with \"Make a short around it\" and \"Remove the marker\". The side panel has Good moment marker (M), Good moments (\u2026)\u2026, Make a short from here\u2026, Make shorts from markers\u2026 and Publishing notes\u2026. Select between the markers here selects the stretch between the two flags around the playhead.", ""], ["sh-here", "Make a short from here\u2026", "Put the playhead at 0:05 and choose Clip > Make a short from here\u2026. Click 30 s, 45 s, 60 s and 30 s again, reading the line with the times. Leave \"Start and end at a pause\" and \"Short caption look\" ticked, tick \"Title at the top\" and type: Watch this. Name it \"Round 8 short\", click Make the short, then Open it. Play it and go back to the project list.", "A window \"Make a short\" with 30 s, 45 s and 60 s, a line \"From \u2026 to \u2026 \u00b7 \u2026\", the note that it is a new upright (9:16) project and this video is not changed, the three tick boxes and \"Name of the new project\". Then \"The short is ready\" with Stay here and Open it. The short is upright, about 30 seconds, has \"Watch this\" at the top for its whole length and captions in the Short caption look. Ask the owner to watch it once.", "watch"], ["sh-text", "A short from selected text", "Open \"Round 8 test\" and the Text window. Click the first caption, Shift-click the last, click Make a short from this\u2026. Read the window, name it \"Round 8 text short\", click Make the short, then Stay here.", "The window \"Make a short\" has \"The selection\" selected (next to 30 s, 45 s, 60 s) and shows the selection's times and length; over 60 seconds it warns that Shorts, Reels and TikTok have their own limits. The new project is in the project list and \"Round 8 test\" is unchanged.", ""]]], ["V. Publishing", [["pb-notes", "Publishing notes with Copy buttons and chapters", "In \"Round 8 test\" choose File > Publishing notes\u2026. Type a Title (Round 8 test video), a Description (two sentences) and Hashtags (clipforge test). Click the copy button next to Title and paste into the note. Click Chapters from titles / captions\u2026 and read what it says. Tick \"A different title for Shorts, Reels and TikTok\" and type a Short title. Click Copy title and description, paste, and click Done. Open History.", "A window \"Publishing notes\" says ClipForge does not post anything itself, with Title, Description, Hashtags and Chapters, each with its own copy button. Chapters from titles / captions\u2026 either fills Chapters with lines like \"0:00 \u2026\" and says where they came from, or says plainly why not (\"This video is too short for chapters (each is at least 10 seconds).\"). Copy title and description copies title, description and hashtags in one go. History shows steps such as \"Publishing title\" and \"Hashtags\".", ""], ["pb-dest", "Where is it going? Destinations and warnings", "Press Ctrl+E. Click each choice in turn and read the line under the choices and any warning: YouTube, Shorts / Reels / TikTok, Instagram post, WhatsApp / Telegram, Podcast audio, Custom.", "YouTube: \"Wide 16:9, 1080p, full quality.\" Shorts / Reels / TikTok: upright 9:16, 1080p; for a video longer than 60 seconds a warning names the length and says 60 seconds is safe, \"Check the site.\" Instagram post: Tall 4:5 / Square 1:1. WhatsApp / Telegram: \"A small file (720p) that is quick to send.\", with a warning about 16 MB when the file would be bigger. Podcast audio: MP3 / M4A, no picture settings. Custom: Make, Video size, Full quality / Small file, Frames per second, Use graphics card. The window also shows the publishing notes' title and a Publishing notes\u2026 button. Warnings never block the export.", ""], ["pb-shape", "\"Make a copy in this shape\" or \"Export as it is\"", "In the Export window choose Shorts / Reels / TikTok (the project is wide). Click Export as it is and read the size; then Make a copy in this shape and read the size. Click Export and save as r8-short.mp4. Read the finished screen. Check the file (right-click > Properties > Details > Frame width / height). Look at the project list for the copy and at the shape of \"Round 8 test\".", "It offers Make a copy in this shape (a new project with a blurred background; this project stays as it is) and Export as it is. With Export as it is the size shown is wide; with the copy it is 1080 \u00d7 1920, and the exported file is 1080 wide and 1920 high. The finished screen says the copy \"Round 8 test - 9x16\" is in your project list; it is there, and \"Round 8 test\" itself is still wide.", ""], ["pb-several", "Export several\u2026 into one folder", "Choose File > Export several\u2026. Tick YouTube, Shorts / Reels / TikTok and Podcast audio; leave \"Keep the shape copies as projects\" unticked. Read the file name under each tick. Click Export 3 files and choose a new folder clipforge-test-output\\kit8. Watch the progress. Then open the folder in Explorer, check the size of each video and open the text file.", "One progress bar with \"1 of 3: \u2026\", \"2 of 3: \u2026\" and one Cancel export; it ends with \"Files saved\". The folder holds \"Round 8 test - YouTube.mp4\" (1920 x 1080), \"Round 8 test - Short 9x16.mp4\" (1080 x 1920), \"Round 8 test - audio.mp3\" and \"Round 8 test - text.txt\". The text file has the title, description, hashtags and chapters from the notes, the music credits and a part for each file saying what to paste there. No shape copy was added to the project list.", ""], ["pb-finish", "The finished screen: Show in folder, Copy, Open upload page", "On the finished screen click Show in folder. Click Copy title and description and paste. Click Open YouTube upload page, look at the browser, and close the tab WITHOUT signing in or uploading. Click Done.", "Show in folder opens Explorer on the folder. The pasted text is the title, description and hashtags. The link line says ClipForge does not sign in or post; the button opens the upload page in the owner's own browser. ClipForge itself uploaded nothing.", ""], ["pb-listen", "The kit files look and sound right", "Play \"Round 8 test - Short 9x16.mp4\" and \"Round 8 test - audio.mp3\" from the kit8 folder for 30 seconds each.", "Ask the owner to watch and listen: the short is upright with the wide picture in the middle and a blurred copy above and below, captions and title readable, voice in sync; the MP3 has the same sound as the video.", "watch,listen"]]], ["W. Export", [["ex-full", "Full quality: what it says before and after", "Open \"Round 8 basics\". Press Ctrl+E, choose Custom; Make: Video, Full quality, Frames per second: Same as the clips. Copy the lines \"File size: about \u2026\" and \"Will use: \u2026\" into the note. Export as r8-full.mp4. Write down what the finished screen says.", "Before: an estimated file size and what will be used (graphics card or processor). It finishes with \"Video saved\", says what was used and \"Took \u2026\". If the disk has too little free space it warns before starting.", ""], ["ex-watch", "The export looks and sounds like the preview", "Play r8-full.mp4 in Media Player from start to end and compare with the preview.", "Ask the owner to watch and listen: cuts, transition, Fill framing, overlay, filter, fades from and to black, fonts, Hebrew / Russian text, title animations all match the preview; voice in sync with the lips, music lower under speech if switched on, no clicks or gaps at the cuts.", "watch,listen"], ["ex-small-fps", "Small file, and frames per second", "Export once with Small file as r8-small.mp4. Then with Full quality and Frames per second 25 as r8-25fps.mp4 (and 60 as r8-60fps.mp4 if the owner films sport). Compare the file sizes; check the frame rate (right-click > Properties > Details > Frame rate).", "The small file is clearly smaller than r8-full.mp4 and has the same length. The 25 file reports 25 frames per second (the 60 file 60) and has the same length.", ""], ["ex-sound", "Sound only: M4A and MP3", "Ctrl+E, Custom, set Make to the sound-only M4A choice and export as r8-sound.m4a; then MP3 as r8-sound.mp3. Play both.", "The picture settings are hidden for sound only. Both files are made with the video's length. Ask the owner to listen: the same mix as the video.", "listen"], ["ex-gpu", "Graphics card on and off", "Ctrl+E, Custom: switch Use graphics card (faster) off, export as r8-cpu.mp4 and note \"Took \u2026\"; switch it on again and compare with r8-full.mp4's time.", "With the switch off it says it used the processor; with it on, the graphics card (or it says that it fell back to the processor and why). Both files play. Write down both times.", ""], ["ex-quit", "Quit during an export", "Start one more Full quality export (r8-quit.mp4) and press Alt+F4 while it runs. Choose to keep working and let it finish.", "Quitting during an export asks whether to cancel the export or keep working; keep working lets the export finish, and the file plays.", ""], ["ex-long", "Export the long project (start it last and let it run)", "Do this as the LAST export of the round. Open \"Round 8 long\". Press Ctrl+E, choose Custom, Small file, and export as r8-long.mp4. Leave the computer alone. Write down the project's length, the time it took and the file size. Afterwards choose Help > Copy version info and paste it into the note.", "The progress moves steadily to 100 % without standing still for minutes, the window can be moved and Cancel export is there, and no sound waves or thumbnails are drawn meanwhile. It finishes saying what was used and how long it took. The file has the project's length and plays to the end. Ask the owner to watch the last minute: picture and sound still in sync, the two voices as in the preview.", "watch,listen"]]], ["X. Updates and Help", [["up-check", "Check now says this is the newest version", "On the project list choose Help > Check for updates\u2026. Then open Settings and click Check now. Do NOT click Update if a newer version is offered: tell the owner.", "Both answer with the same plain message: \"You have the newest version (1.18.0 (build 140)).\" If a newer version is offered, write it down and set Partial.", ""], ["hp-search", "Help search, also with a typo", "Press F1. Search for each of: settings, suggestion, menu, short, chapters, who is speaking, feedback, overlay, snap, fade. Then with a typo: sugestion.", "Each search shows the fitting article first or near the top (\"Settings\", \"Suggestions\", \"Menus: where everything is\", \"Make a short\", \"Publishing notes: title, description, hashtags, chapters\", \"See who is speaking\", \"Send feedback\", \"Overlay: picture-in-picture, side by side, cut-aways\", \"Snapping on the timeline\", \"Fade in from black, fade out to black\"). The typo still finds \"Suggestions\" (or offers \"Did you mean\").", ""], ["hp-pages", "Keyboard shortcuts, What's new, the menus article, Licences", "Choose Help > Keyboard shortcuts and read the list. Choose Help > What's new and read the top. Open the article \"Menus: where everything is\". Open Settings > Licences and close it.", "Keyboard shortcuts lists I / O as the start and the end of a part and Q / W as start / end of the clip at the playhead, with J / K / L, M, Ctrl+D and the rest. What's new starts with 1.18.0. The menus article lists ten menus including Part, with the same items as the app. Licences opens a list. Write down any sentence that does not match the app.", ""], ["hp-tour", "The tour", "Choose Help > Show the tour and go through it to the end.", "The tour runs in steps over the real buttons, each step pointing at the right place, and ends without leaving anything changed in a project. Its step about starting points at New video in the Start row of the project list and says: Tap \"New video\" to start.", ""]]], ["Y. The end", [["end-saved", "Everything was saved", "Choose File > Exit. Start ClipForge. Open \"Round 8 test\", \"Round 8 basics\", \"Round 8 two voices\" and \"Round 8 long\" one after the other and look through each.", "Each opens with everything as you left it: the quiet parts, the slow part, markers, captions, publishing notes; sound tracks, overlay, filters, fades, titles; Only when speaking on; the long clip with both voices. No clip says Missing.", ""], ["end-perf", "The performance log at the end of the round", "Choose Help > Copy version info and paste ALL of it into the note. Then fill in the Summary: first the long file (did it stall: yes / no; the longest gap; with sound waves on and off), then the worst problems. Also write into the Summary, one line each: did \"Adding file\u2026\" end for the long file (and after how many seconds); the three times from the step \"Opening saved projects: no wait, no freeze\"; did the export with Only when speaking on the long recording finish.", "The text has the version line, the folder, the update log's last lines and the performance log with its \"longest gap\". This is what the maker needs if anything was slow.", ""]]]];const INSTR="You are testing ClipForge 1.18.0 (build 140), a video editor, on the owner's Windows PC. Problems are expected; your job is to find them and write them down precisely. Version 1.18 repairs what a real test of 1.17 found (adding a very large video never ended; the app stopped answering for 100 seconds after a saved project opened; an export with Only when speaking was refused) and brings a project list with a Start row, a side panel whose groups fold away, and a note about FFmpeg on the Connect to Claude page. This round has 156 numbered steps in 25 groups (A to Y). Groups A to F are the update and everything 1.18 changed: THEY MATTER MOST. If time runs out, do those, and group B (the long file) before all others. The groups after F are the whole of round 7 again, as a full regression test of every feature. The Android phone has its own page (Round 8 phone) and the Claude tools their own document (Claude control test 6).\n\nMEDIA FOLDER: <owner fills in>\n\nBEFORE YOU START\n- Fill in \"Device\" (for example \"Windows 11 laptop, RTX 4070\") and \"Tester\".\n- Do group A first: it updates the app. Then fill in \"Version shown in the app\" (Help > About ClipForge > Copy version info, paste). If it does not match the build named at the top of this page (a red warning appears), tell the owner and say so in the Summary.\n- Test files are in the MEDIA FOLDER named above. Look into it and decide which file is which; ask the owner if something is missing. Do not download files from the internet. You need:\n  L. the LONG talking video of 20 to 30 minutes (the recording that froze, if the owner has it), and LV1 + LV2: the two voice files recorded for it (one per speaker);\n  A. a talking video, 1-3 minutes, filmed wide (landscape), with some pauses;\n  B. a short video, 10-40 seconds (shorter than 45 seconds);\n  P. a photo;\n  M. a music file (MP3 or M4A) that is LONGER than video A;\n  S. a small clip from a phone or a chat app (smaller than 720p);\n  optional: V + W, a short video with one sound file per speaker; R, a clip in which someone speaks Russian or Hebrew; a speech model file (ggml-\u2026.bin).\n- The easiest way to add files without the Windows file window: Add > Add from a folder path\u2026, paste the path, tick the files.\n- Do the groups in order: later steps build on the projects made earlier (\"Round 8 long\", \"Round 8 start\", \"Round 8 test\", \"Round 8 two voices\", \"Round 8 basics\"). If time runs out: groups A to F matter most (the update and what 1.18 changed), group B first; the groups after them repeat round 7. Say in the Summary where you stopped.\n- A thin line with a tip and a button may appear under the top bar at any time. That is a suggestion. Outside the groups that test them leave it alone unless a step says so.\n- NEW IN 1.18, for every step: the project list has no round New project button any more. \"Make a new project\" means: click New video in the Start row of the project list (or File > New project, Ctrl+N), then name it with File > Rename project\u2026. Under the Start row a line \"Tip: \u2026\" may show: that is the tip of the day, not a fault.\n- NEW IN 1.18, for every step: the settings in the side panel are in groups that open and close with a click on their heading (Speed, Look, Sound, Transition and fades; for a title Size and style, Font and colour, Position, \u2026). If a step names a setting you do not see, open its group. If the whole panel is gone, View > Show the side panel (Ctrl+Shift+P) brings it back.\n\nIF CLIPFORGE STOPS ANSWERING (the most important finding of this round)\n- Write down the time, the step, and what was on screen (\"Saving\u2026\", \"Drawing sound\u2026 1 of 3\", \"Loading the video\u2026\").\n- Wait two minutes. If it comes back, go on. If not, close it (Task Manager if needed) and start it again.\n- In both cases choose Help > Copy version info right away and paste ALL of it into the Crash box: it carries the performance log, also of the run that stopped. Do the same whenever the line \"Background work was paused to keep ClipForge responsive\" (or \"Sound waves were paused to keep ClipForge responsive\") appears.\n- If the window \"Adding file\u2026\" stays: wait and click nothing. After about 6 seconds it says that this is taking longer than usual; after 45 seconds ClipForge stops by itself with a message. Copy that message, then paste Help > Copy version info into the Crash box. Only if nothing has happened after 60 seconds press Cancel (or Esc), and write that down.\n- Then check whether the last thing you did was saved, and go on with the next step.\n\nRULES\n- Each step has \"Do\" (exact actions) and \"Expected\" (what should happen). Do the actions exactly, then compare with Expected.\n- For each step choose a Result and write a Note. Where a step says to copy a text or write down a number, put it in the note.\n- Result meanings: PASS = you saw exactly the expected result. FAIL = something was wrong (write what you did, what happened, and what you expected). Partial = part of it worked (say which part). Not tested = you could not do it (say why, for example \"no speech engine\" or \"no voice files\"). Needs the owner = only a person can judge it and the owner was not available.\n- Steps tagged \"ask the owner to listen\" or \"ask the owner to watch\" depend on hearing, or on lip sync and movement that screenshots cannot show. Do the actions and check everything you can see. Then ask the owner in the chat, for example: \"Please play the preview from 0:05 and tell me whether the voice matches the lips.\" Write the owner's answer in the note starting with \"Owner:\", and set PASS or FAIL from it. If the owner is not available, set Needs the owner. Never judge sound yourself.\n- Buttons and menu items are written here as the app shows them; \" | \" in a list of menu items stands for a dividing line. If a name on the screen is different, or an item is missing or greyed out when the step expects it to work, write down exactly what you see.\n- If a drag does not work for you, try twice. Then use the keys, the menu bar or the panel buttons if the step offers them; otherwise set Needs the owner and write that you could not perform the drag (it may still work for a human).\n- NEVER delete, move or rename the owner's files or the owner's own projects. Inside ClipForge only delete things this test made. Save every export into a folder named clipforge-test-output inside the MEDIA FOLDER, with the file name the step gives (for example r8-full.mp4).\n- Ask the owner before you press Update, Send (feedback), Connect or Replace with this version. Never press Disconnect in this round.\n- Speech to text needs a speech program on the computer and usually a language pack (Small about 140 MB, Medium about 470 MB, Large about 1.6 GB). Do not install programs. Click Download only for the pack the owner agreed to, and NEVER download a Large pack.\n- Do not guess. Only mark PASS for what you actually saw, or for what the owner told you they heard or saw.\n- This page keeps your answers in this browser as you go. When finished, fill in the Summary box (first group B: did adding the long file end, how long did saved projects take to open, did the export with Only when speaking finish; then the most important problems), then click \"Download filled checklist\" and give the downloaded file (ClipForge-Test-Round-8-results-\u2026.html) to the owner, who sends it back.";
const OPTS=["", "PASS", "FAIL", "Partial", "Not tested", "Needs the owner"];const TAGS={"listen": "ask the owner to listen", "watch": "ask the owner to watch"};const NUM=true;const RESULT="Result";const NOTE="What happened? Copy texts and numbers the step asks for; Owner: for what the owner saw or heard";
let data=JSON.parse(document.getElementById('data').textContent);
try{const s=localStorage.getItem('clipforge-round8');if(s){const l=JSON.parse(s);if(l&&l.items)data=Object.assign(data,l);}}catch(e){}
document.getElementById('instr').textContent=INSTR;document.getElementById('build').textContent=data.build;
const root=document.getElementById('steps');
let stepNo=0;
for(const [group,items] of STEPS){const h=document.createElement('h2');h.textContent=NUM?group+' ('+items.length+(items.length===1?' step)':' steps)'):group;root.appendChild(h);
 for(const st of items){const five=st.length>4,id=st[0],title=st[1],act=five?st[2]:'',exp=five?st[3]:st[2],tag=st[st.length-1];const it=data.items[id]||(data.items[id]={status:"",note:""});
  const c=document.createElement('article');c.className='card step';c.dataset.s=it.status;
  stepNo++;const t=document.createElement('h3');t.textContent=NUM?stepNo+'. '+title:title;for(const k of (tag?tag.split(','):[])){const g=document.createElement('span');g.className='tag';g.textContent=TAGS[k]||k+' only';t.appendChild(g);}
  const d=document.createElement('p');d.className='do';d.textContent='Do: '+act;
  const p=document.createElement('p');p.className='exp';p.textContent='Expected: '+exp;
  const row=document.createElement('div');row.className='row';const sel=document.createElement('select');sel.setAttribute('aria-label',RESULT+': '+title);
  for(const o of OPTS){const op=document.createElement('option');op.value=o;op.textContent=o||RESULT+'...';if(o===it.status)op.selected=true;sel.appendChild(op);}
  row.appendChild(sel);const ta=document.createElement('textarea');ta.setAttribute('aria-label','Note: '+title);ta.placeholder=NOTE;ta.value=it.note;
  sel.addEventListener('change',()=>{it.status=sel.value;c.dataset.s=sel.value;save();});ta.addEventListener('input',()=>{it.note=ta.value;save();});
  if(act)c.append(t,d,p,row,ta);else c.append(t,p,row,ta);root.appendChild(c);}}
for(const k of ['device','tester','version','summary','crash']){const e=document.getElementById(k);e.value=data[k]||'';e.addEventListener('input',()=>{data[k]=e.value;save();});}
function counts(){const n={};let total=0;for(const [,items] of STEPS)for(const [id] of items){total++;const s=data.items[id].status||'Not done yet';n[s]=(n[s]||0)+1;}
 const el=document.getElementById('counts');el.textContent='';for(const [k,v] of Object.entries(n)){const s=document.createElement('span');s.textContent=k+': '+v;el.appendChild(s);}const s=document.createElement('span');s.textContent='Total: '+total;el.appendChild(s);}
function vcheck(){const v=(data.version||'').trim();const w=document.getElementById('vwarn');
 const b=data.build||'';const m=b.match(/\d+\.\d+\.\d+ \(build \d+\)/)||b.match(/\d+\.\d+\.\d+/);const h=b.match(/\b([0-9a-f]{7,40})\s*$/);
 const bad=m&&!v.includes(m[0])?m[0]:(h&&!v.includes(h[1].slice(0,7))?h[1].slice(0,7):'');
 w.textContent=!v?'Please paste the version shown in the app (required).':(bad?'This is not the build named above ('+bad+'). Say so in the Summary.':'');}
function save(){counts();vcheck();try{localStorage.setItem('clipforge-round8',JSON.stringify(data));document.getElementById('saved').textContent='Saved in this browser.';}catch(e){}}
counts();vcheck();
document.getElementById('dl').addEventListener('click',()=>{
 if(!(data.version||'').trim()&&!confirm('"Version shown in the app" is empty. Download anyway?'))return;
