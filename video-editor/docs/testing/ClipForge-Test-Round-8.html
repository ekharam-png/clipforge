<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ClipForge Test Round 8</title>
<style>
:root{--bg:#f5f6fa;--card:#fff;--fg:#161a26;--muted:#5b6274;--line:#dfe2ec;--accent:#4257d6;--ok:#1f7a4d;--bad:#a8322b;--part:#9a5b00;--human:#6a3fb0}
@media (prefers-color-scheme:dark){:root{--bg:#0f1118;--card:#181b25;--fg:#eceef5;--muted:#9aa1b5;--line:#2a2f3f;--accent:#8c9bff;--ok:#6fd3a0;--bad:#ff9c94;--part:#f0b95a;--human:#c3a6ff;color-scheme:dark}}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}
.wrap{max-width:900px;margin:0 auto;padding:28px 16px 64px;display:flex;flex-direction:column;gap:20px}
h1{margin:0;font-size:1.8rem}h2{margin:8px 0 0;font-size:1.2rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:8px}
.instr{white-space:pre-wrap;font-size:.95rem}
.step{border-left:6px solid var(--line)}
.step[data-s="Works"]{border-left-color:var(--ok)}.step[data-s="Problem"]{border-left-color:var(--bad)}.step[data-s="Partial"]{border-left-color:var(--part)}.step[data-s="Needs a person"]{border-left-color:var(--human)}
.step[data-s="PASS"]{border-left-color:var(--ok)}.step[data-s="FAIL"]{border-left-color:var(--bad)}.step[data-s="Needs the owner"]{border-left-color:var(--human)}
.do{margin:0;font-size:.95rem}
.step h3{margin:0;font-size:1.02rem}.exp{color:var(--muted);font-size:.93rem;margin:0}
.tag{font-size:.75rem;font-weight:600;border:1px solid var(--line);border-radius:999px;padding:1px 8px;margin-left:6px;color:var(--muted)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
select,input,textarea,button{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px}
textarea{width:100%;box-sizing:border-box;min-height:64px}
button{cursor:pointer;background:var(--accent);color:#fff;border:0;font-weight:600;padding:10px 16px}
.counts{display:flex;gap:16px;flex-wrap:wrap;font-weight:600}
label{display:flex;flex-direction:column;gap:4px;font-size:.9rem;color:var(--muted)}
</style></head><body><div class="wrap">
<header class="card"><h1>ClipForge test round 8</h1>
<p class="exp">Build: <b id="build"></b>. Fill in each step, then click <b>Download filled checklist</b> at the bottom and send the file back to Claude.</p>
<div class="row"><label>Device<input id="device" placeholder="e.g. Windows 11 laptop, RTX 4070"></label><label>Tester<input id="tester" placeholder="e.g. ChatGPT agent, or your name"></label></div>
<label>Version shown in the app (required: About ClipForge &gt; Copy version info, then paste here)<textarea id="version" placeholder="ClipForge X.Y.Z (build N) · date, time UTC · commit" style="min-height:56px"></textarea></label>
<p class="exp" id="vwarn" style="color:var(--bad);margin:0"></p>
<div class="counts" id="counts"></div></header>
<section class="card"><h2>Instructions for the tester (person or AI agent)</h2><div class="instr" id="instr"></div></section>
<div id="steps" style="display:flex;flex-direction:column;gap:20px"></div>
<section class="card"><h2>Crash or freeze</h2><label>If the app closed by itself, froze or stopped answering: the time, the step, what was on screen. Then paste Help &gt; Copy version info here (it carries the performance log).<textarea id="crash"></textarea></label></section>
<section class="card"><h2>Summary</h2><label>Most important problems first, plus anything confusing, slow or hard to find<textarea id="summary" style="min-height:120px"></textarea></label>
<div class="row"><button id="dl" type="button">Download filled checklist</button><span class="exp" id="saved"></span></div></section>
</div>
<script id="data" type="application/json">{"device": "", "tester": "", "build": "ClipForge 1.18.0 (build 140) \u00b7 21 Nov 2026", "version": "", "summary": "", "crash": "", "items": {}}</script>
<script>
const STEPS=[["A. Update and start", [["up-before", "Before the update: which version is on this PC", "Start ClipForge from the Windows Start menu. Read the small grey line at the bottom of the project list and write it down. Look at the top of the project list for a line \"Version 1.18.0 is available\". If no such line is there and the app is older than 1.18.0, choose Help > Check for updates\u2026 once and look again. Do NOT click Update yet.", "On a PC that still has 1.17 (or an older version): a quiet line \"Version 1.18.0 is available\" with What's new, Update, Later and Skip this version. If the app already shows 1.18.0 (build 140), set Not tested for this step and the next one and write how it got there (ask the owner: in-app update or the installer).", ""], ["up-run", "The in-app update to 1.18.0", "Ask the owner: \"May I press Update now?\" After a yes click Update, read the window, and click Download and update. Wait. When the button Restart ClipForge to finish appears, click it. Do nothing while ClipForge closes and opens again (up to a minute). Write down how long each part took.", "A window \"Update to version 1.18.0\" says that ClipForge downloads the new version, checks it, then closes and opens again as the new version, and that the projects stay as they are. It shows \"Downloading\u2026 \u2026%\", then \"Checking the download\u2026\", then that the version is downloaded and checked with the buttons Restart ClipForge to finish and Later. After the restart ClipForge opens by itself as 1.18.0. If instead it says \"The update did not work.\": click Copy details, paste them into the note, set FAIL, and ask the owner to install 1.18.0 with ClipForge-Setup.exe so that the round can go on.", ""], ["st-version", "The app shows 1.18.0, build 140", "Read the grey line at the bottom of the project list. Open Help > About ClipForge, read it, click Copy version info and paste it into \"Version shown in the app\" at the top of this page. Close About.", "The grey line and About both show version 1.18.0 and build 140, the same as named at the top of this page. No red warning appears under the version box. The pasted text has the version line, the system, a line starting with \"Folder:\" (it ends in AppData\\Local\\Programs\\ClipForge, not in a name ending in \".update-new\"), the update log's last lines when an in-app update ran, and a part \"Performance log (longest gap \u2026 ms):\".", ""], ["st-notes", "\"What's new in 1.18.0\" after the update", "Look at the top of the project list right after the first start of 1.18.0. If a card \"What's new in 1.18.0\" is there, read its lines and copy them into the note, click All release notes, close Help and look whether the card is gone (if it is still there, close it with its cross). Then open any project and look whether a window \"Two keys changed\" opens. (The card appears once. If the owner already closed it, set Not tested and write \"owner saw it: yes / no\".)", "A card with the title \"What's new in 1.18.0\", two or three short lines taken from the release notes (adding a file always ends; the side panel folds; the project list has a Start row), a small line \"Updated to 1.18.0\", the link All release notes and a cross. All release notes opens Help on the page that starts with 1.18.0, and the card does not come back at the next start. (Until 1.17 this was one line \"Updated to \u2026\".) The note \"Two keys changed\" was shown once by 1.17 and does not come again; only when the update came straight from 1.15 or 1.16 it shows once now: write down which. No message says that an update did not work.", ""], ["st-projects", "Earlier projects are still there", "Read the project list. Open one project from an earlier round, play 5 seconds, and go back with File > Back to projects.", "Projects from earlier rounds are listed, the one you opened shows its clips with pictures and plays, and no clip says Missing.", ""]]], ["B. The long file: adding it always ends, saved projects open without a freeze, Only when speaking exports (FIRST PRIORITY)", [["lf-import", "Import the long video alone", "On the project list click New video (the first of the three buttons under \"Start\"; the round New project button of 1.17 is gone). Choose Add > Add from a folder path\u2026, paste the full path of file L (the 20-30 minute video; see the instructions), click the button that looks the path up, and add it. (If that does not work, use Add > Videos or photos\u2026 and say so.) Start counting seconds when you confirm. While the small window \"Adding file\u2026\" shows, click nothing: count how long it stays and read what it says. Watch the top bar (Saving\u2026 / Saved), the preview and the top right of the timeline for two minutes. Choose File > Rename project\u2026 and call it \"Round 8 long\".", "The clip is on the timeline within a few seconds with the right length (write the length down). The preview says \"Loading the video\u2026\" until the first picture is there (not plain black without a word). The top bar goes from Saving\u2026 to Saved within about 5 seconds (write down how many). \"Drawing sound\u2026 1 of 1\" (or \"Drawing sound\u2026\") with a small cross shows at the top right of the timeline and goes away when the sound waves are drawn; write down how long that took. FAIL if Saving\u2026 stays for more than 30 seconds, if the window stops answering, or if the line \"Background work was paused to keep ClipForge responsive\" (or \"Sound waves were paused to keep ClipForge responsive\") appears: then do the step \"The performance log\" below at once. FIRST PRIORITY, new in 1.18: \"Adding file\u2026\" always ends (with 1.17 it stayed for good for a video of 8 GB on a Mac, with no way out). The window has a Cancel button. Normally it closes within a second or two and the clip is there. If it stays, after about 6 seconds it also says \"This is taking longer than usual. You can wait, or cancel and try again with the file copied to this computer.\", and after 45 seconds ClipForge gives up by itself with a message that names the file: \"\u2026 could not be read within 45 seconds. If it is on a network drive, an external disk or in a cloud folder (iCloud, OneDrive, Dropbox) that has not finished downloading it, copy it to this computer first and add it again.\" If the file is NOT added: copy the message letter for letter, write down how many seconds it took, how big file L is and where it is kept (this computer's own disk, an external disk, a network or cloud folder), choose Help > Copy version info and paste ALL of it into the Crash box, set FAIL, and ask the owner to copy the file to this computer's own disk for the rest of this group.", ""], ["lf8-cancel", "\"Adding file\u2026\": Cancel, Esc, and \"taking longer than usual\"", "Go to the project list, click New video and rename the project \"Round 8 cancel\". Add file L once more (Add > Add from a folder path\u2026) and watch the small window \"Adding file\u2026\". If it is still there after two seconds, press Esc and look at the timeline. Add L again and, if the window stays, click Cancel. Then add L a third time and let it finish. If the window closes by itself in under two seconds every time, there is nothing to cancel: write down how long it stayed and set PASS with \"too quick to cancel\".", "The window says \"Adding file\u2026\" and has a Cancel button (new in 1.18). Esc and Cancel both close it at once: nothing is added, the timeline is as it was, the app answers, and the same file can be added again right away. When the window stays, after about 6 seconds it also says \"This is taking longer than usual. You can wait, or cancel and try again with the file copied to this computer.\" After 45 seconds it closes by itself with the message of the first step of this group. A file on the computer's own disk is normally read in well under a second, so on most computers only the first sentence can be checked: that is a good result, not a gap in the test.", ""], ["lf-responsive", "The app answers while the sound waves are drawn", "Do this while \"Drawing sound\u2026\" is still shown if you can (otherwise right after). Press + three times and - three times. Scroll the timeline to the end and back. Click the time ruler at about 10:00 and at about 20:00. Press Space, wait 5 seconds, press Space. Press F1 and close Help. Choose File > Back to projects, then open \"Round 8 long\" again.", "Every action answers within about a second: the timeline zooms and scrolls, the playhead jumps and the preview shows the picture of that place, the video plays with sound, Help opens and closes, the project closes and opens. While the video plays no new sound wave is started (the counter does not move). Write down anything that took longer than 2 seconds, with what was on screen.", ""], ["lf-restart", "A restart keeps the import", "Wait until the top bar says Saved. Choose File > Exit. Start ClipForge again and open \"Round 8 long\". Play 10 seconds at the start, in the middle and one minute before the end.", "The project is in the list with the right length and opens with the long clip in it (it was not lost). It plays at all three places. Ask the owner to watch one of them: picture and voice in sync.", "watch,listen"], ["lf8-reopen", "Opening saved projects: no wait, no freeze", "Use saved projects that are 5 minutes long or longer: \"Round 8 long\", and one or two of the owner's earlier projects of that length if there are any (only open and play them; change nothing). Three times in all: go to the project list, click the project, start counting, and press Space as soon as the editor shows; stop counting when the picture moves and the time under the preview runs. Before the third time choose File > Exit and start ClipForge again. Write down the three times and the length of each project. If any wait is longer than 5 seconds, or the window stops answering (it turns pale, or \"Not responding\" shows in its title): wait until it is back, choose Help > Copy version info at once and paste ALL of it into the note.", "Each time the editor shows within a second or two and the video plays within about 5 seconds; the window answers the whole time. (With 1.17 a Mac did not answer for 100 seconds right after a saved project of five minutes had opened: ClipForge asked its preview player a question and waited inside the player for the answer. Such questions now give up after two seconds. The same code runs on Windows.) FAIL for any wait over 5 seconds. A preview that stays black or does not start while the rest of the app answers is a finding too: write down what the preview says (\"Loading the video\u2026\") and for how long. In the pasted text look for lines that end with \"In flight when it stopped: \u2026\" and for a line like: preview player: no answer to \"get time-pos\" within 2000 ms. Copy them into the Summary.", ""], ["lf-voices", "Add the two voice files to the long video", "Needs the two voice files of L (LV1 and LV2; otherwise set Not tested for this step and the next and say so). In \"Round 8 long\" choose Add > Voice recording\u2026 and pick both files together (or use Add > Add from a folder path\u2026 and answer \"What are these sounds?\" with Voice for the video). Type a speaker's name for each (Sam Taylor, Alex K), leave \"Mute the camera's own sound\" on and click Add and line up. Count the seconds until the message. Then watch the top bar and \"Drawing sound\u2026 1 of 3\" for three minutes, and during that time press + and -, scroll, click the ruler at 12:00 and press Space twice.", "\"Lining up the voice with the video\u2026\" and then a message that the voices are lined up with the video, each on its own track, and follow the picture when you cut (copy it). Two voice rows named after the speakers. The top bar reaches Saved within about 5 seconds after the message. \"Drawing sound\u2026 1 of 3\" counts up and goes away; zoom, scroll, the ruler and Space answer within about a second the whole time. FAIL as in the first step of this group if Saving\u2026 stays, the window stops answering, or \"Background work was paused\u2026\" (or \"Sound waves were paused\u2026\") appears (then click nothing else and do the step \"The performance log\" now).", ""], ["lf-voices-restart", "Restart with the voices; who is speaking", "Wait for Saved. Choose File > Exit, start ClipForge again and open \"Round 8 long\". Wait until \"Drawing sound\u2026\" is gone (it should be quick now). Zoom so that about a minute fills the window and look at the two voice rows. Play 15 seconds where the two people take turns.", "Both voices are still there, on their tracks, in sync. Every voice row has sound waves: bright in the speaker's colour where that person talks, dim in the pauses, each speaker in a different colour. Ask the owner to watch and listen: lips match the voice, no second echoing voice, and the bright stretches match who is talking.", "watch,listen"], ["ows8-real", "Export with Only when speaking on a real recording of several minutes (refused in 1.17)", "Needs the long video with its two voice files in \"Round 8 long\" (or another recording of several minutes with one sound file per speaker; otherwise set Not tested and say so). Open \"Round 8 long\". Put the playhead at 2:00 and press I, at 10:00 and press O: a part of about 8 minutes in which both people talk, every row ticked. Choose Part > Make a short from the part\u2026 (a note about 60 seconds is expected), UNTICK Short caption look, name it \"Round 8 speaking\", click Make the short and Open it. Choose Sound > Only when speaking\u2026, switch it on for both voice tracks, leave \"A little room sound (\u221218 dB)\" and close the window. Press Ctrl+E, choose Custom, Small file, and export as r8-speaking-long.mp4 into clipforge-test-output. Write down the length of the project and how long the export took. Play one minute of the file in which the speakers take turns. (If the short cannot be made, switch Only when speaking on in \"Round 8 long\" itself, export that, and switch it off again afterwards.)", "The export starts, runs to 100 % and ends with \"Video saved\". With 1.17 exactly this was refused: a recording of 9 minutes with two voice tracks gave a message that ended with: its FFmpeg has no \"if\" filter. (ClipForge misread its own instructions when a voice had three or more pauses.) If ANY message stops this export, copy it letter for letter, choose Help > Copy version info, paste both into the note and set FAIL. The file has the length of the project. Ask the owner to listen to that minute with headphones: each microphone is turned down while its speaker is silent, no word is cut off at the start of a turn, the voices match the lips.", "listen"], ["lf-stop", "The cross stops the drawing; \"Background work was paused\u2026\"", "Open Settings (Ctrl+comma), switch Show sound waves OFF and ON again, close Settings and look at the top right of the timeline. If \"Drawing sound\u2026\" shows, click the small cross next to it. If at any time in this round the line \"Background work was paused to keep ClipForge responsive\" (or \"Sound waves were paused to keep ClipForge responsive\") is shown, click Turn back on once and write down when it appeared.", "The cross stops the drawing at once: the counter goes away and the rows that were not drawn yet stay plain; nothing else changes. (The pictures of files drawn earlier are kept, so there may be nothing to stop: then set Partial and say so.) \"Background work was paused\u2026\" (or \"Sound waves were paused\u2026\") should NOT appear on its own; if it did, that is a finding (not a crash): Turn back on starts the drawing again, and the setting Show sound waves stayed on. New in 1.18: when ClipForge did not answer for two seconds or more while it was working in the background, it now pauses ALL of that work (sound waves, the strips of clip pictures, prepared sound) and the timeline says \"Background work was paused to keep ClipForge responsive\" with Turn back on; the older line about sound waves shows when only the waves were at work. Either line is a finding: write down the time and what you were doing, and do the step \"The performance log\".", ""], ["lf-waves-off", "The same import with Show sound waves off", "Open Settings and switch Show sound waves OFF. Go to the project list, make a new project \"Round 8 long 2\", add file L as before and, if you have them, the two voice files as before. Watch Saving\u2026 / Saved, zoom, scroll, click the ruler, press Space twice. Exit, start again, open the project. Then switch Show sound waves ON again in Settings.", "With the switch off no \"Drawing sound\u2026\" appears and the rows are plain blocks. The import is saved within about 5 seconds, the app answers within about a second, and after the restart the clip and the voices are there. Write down every difference to the run with sound waves on (faster, the same, slower). If it stalls HERE too, say so clearly in the Summary: then the sound waves are not the cause.", ""], ["lf-silences", "Remove silences on the long clip", "Open \"Round 8 long\". Click the long clip and choose Clip > Remove silences\u2026. Count the seconds of the scan; while it runs move the window and look for a Cancel button. When the result shows, write down the line about the background noise and the number of gaps. Click the button that removes them. Then press Ctrl+Z once.", "A progress bar with Cancel; the window can be moved while it scans and the bar moves (at most about four times a second). Then a line like \"Background noise about -45 dB; quieter than -34 dB counts as silence\" and a button like \"Remove \u2026 gaps\". After removing, the clip is many pieces, the voices are cut with it, and the app still answers; one Ctrl+Z brings back the single clip. Write down the scan time, the number of gaps and how long the cutting and the undo took.", ""], ["lf-perf", "The performance log (do this at every stall too)", "Choose Help > Copy version info and paste ALL of it into the note of this step. If ClipForge stalled or was closed by force earlier in this round, do the same right after the next start and paste that text too, marked \"after the stall at step \u2026\".", "The text ends with a part \"Performance log (longest gap \u2026 ms):\" and lines of the form \"HH:MM:SS.mmm +ms what\" (project opened, probe start / end, save start / end, sound picture \u2026 start / end, gap \u2026 ms). After a run that ended while the app did not answer there is also a part \"Previous run (ended while not responding):\". There are no file names and no project names in it. Write the \"longest gap\" number into the Summary. New in 1.18: a line about a gap of two seconds or more names what was running, for example \"In flight when it stopped: preview player open (video); thumbnail strip (290 s)\", and the log has lines such as \"probe, 8.3 GB start\" (the size of a file, never its name), \"open: read the project\" and \"preview player open (video)\". Copy every line with \"In flight\" or \"no answer\" into the Summary.", ""]]], ["C. The project list (new in 1.18)", [["pl8-start", "The Start row and the bigger cards", "Go to the project list (File > Back to projects). Read it from top to bottom: the heading Start with its three buttons and the line under each name, the tip under them, the heading above the projects, and one project card. Look for the round New project button with a plus that 1.17 had. Open the File menu and read its first item. Make the window narrow (about a third of the screen) and wide again.", "Under \"Start\" three buttons side by side: New video (\"Put videos and photos together\"), Podcast (\"A video and one sound file per speaker\") and Make a short (\"An upright piece of a video you have here\"). Under them one line that starts with \"Tip:\". Then \"Your videos\" and the projects as cards that are bigger than in 1.17: the picture on top with the length on it, the name, \"Edited\" with the date, and the three dots. Open project file is at the top right. There is no round New project button any more; File > New project (Ctrl+N) is still in the menu and does what New video does. In a narrow window the three buttons stay side by side (smaller: an icon and the name) and the projects become one column of rows; nothing is cut off and nothing overlaps. Only if this computer has no project at all, the page says \"Welcome to ClipForge\" and \"Your videos will be listed here. Start with one of the three above, or drop a video file on this window.\" with Open project file: write that down if you see it, and NEVER delete projects to see it.", ""], ["pl8-new", "New video", "Click New video. Read the name at the top of the editor. Add file B (Add > Add from a folder path\u2026). Choose File > Rename project\u2026 and call it \"Round 8 start\". Go back with File > Back to projects and read its card.", "New video opens an empty project at once; its name is \"Video\" with today's date (with a number in brackets if that name is taken). Back on the list, the card \"Round 8 start\" shows a picture from B, the length of B on the picture and \"Edited\" with today's date.", ""], ["pl8-podcast", "Podcast: the video, then one sound file per speaker", "Click Podcast and read the window. Click Choose the video (the Windows file window opens: paste the full path of the file into its File name box and press Enter) and pick video V, or file L when there is no V. When the window \"Now the sound files\" shows, read it. With voice files (W for V, or LV1 and LV2 for L): click Choose the sound files, pick them together, type the speakers' names (Sam Taylor, Alex K) and click Add and line up. Without voice files click Later. Rename the project \"Round 8 podcast\" and go back to the projects.", "A window \"Podcast\" says: \"Two steps: 1. Choose the video of the recording. 2. Choose the sound files, one for each speaker. ClipForge lines them up with the video by their sound. No separate sound files? Then step 1 is all you need.\" with the buttons Not now and Choose the video. After the video is in, a window \"Now the sound files\" (\"Choose the sound files of the speakers, all at once if you like. You can also add them later: Add > Voice recording.\") with Later and Choose the sound files, which leads to the same window as Add > Voice recording\u2026. The new project is named \"Podcast\" with the date. At the end the video is on the timeline and each voice is on its own track, lined up with the picture. Write down any step that needed more than the two windows.", ""], ["pl8-short", "Make a short: choose the video it comes from", "On the project list click Make a short. Read the window and choose \"Round 8 long\". Read the window that opens then, name the short \"Round 8 from the start row\", click Make the short and then Stay here. Go back to the projects.", "A window \"Make a short from which video?\" lists the projects that have a video, each with its name and length (at most twelve; with only one such project it is skipped). The chosen project opens and the window of Clip > Make a short from here\u2026 opens by itself: it says that the short is a new upright (9:16) project and that this video is not changed. Afterwards the short is in the project list and \"Round 8 long\" is as it was. (On a computer where no project has a video yet, a line says instead: A short is made from a video you already have here. Start with \"New video\", then come back to \"Make a short\".)", ""], ["pl8-tip", "The tip of the day, Don't show tips, and the switch in Settings", "On the project list read the line that starts with \"Tip:\" and copy it into the note. Click Don't show tips at its right and read the message. Open Settings (Ctrl+comma), find \"Show a tip on the project list\", read its line, switch it ON and close Settings. Choose File > Exit, start ClipForge again and read the tip.", "One quiet line \"Tip: \u2026\" about something that is easy to miss (for example I and O for a part, Remove silences, voices recorded separately, Q and W, the search box of Help), with Don't show tips. After the click the line is gone and a message says \"Tips are off. You can turn them back on in Settings.\" Settings > Suggestions has the switch \"Show a tip on the project list\" (\"One line about something that is easy to miss, a new one each day.\"), which is off now; switched on, the tip is back at once, and it is the same tip for the whole day (also after the restart). Nothing on the project list comes from the internet. Write down a tip whose words do not fit the app (a wrong menu, a wrong key).", ""]]], ["D. The side panel folds (new in 1.18)", [["sp8-sections", "The groups of a clip open and close by themselves", "Open \"Round 8 start\" and click clip B. Look at the side panel at the right: write down the headings and which groups are open. Click every heading once, and once more. Then open Speed, Look and Sound at the same time. Click the heading Crop, look at the preview, and click the heading Crop again.", "The settings of the clip are in groups under the headings Speed, Look, Crop, Sound and Transition and fades, each with a small arrow at its right. One click on a heading opens its group, the next closes it, and several can be open at once (in 1.17 exactly one was open). The first time, Speed and Sound are open and the others are closed. A closed group shows a few words about its setting at the right of its heading (the speed, \"100%\" or \"Muted\" for the sound, \"None\" for the transition). Crop is the exception: while it is open the preview shows the crop frame, so it is never opened from memory; its heading closes it again.", ""], ["sp8-dot", "A closed group with a changed setting shows a dot", "With clip B selected open Look and move Brightness a little. Close Look and look at its heading; move the pointer onto the small dot. Open Sound, switch Mute on and close Sound. Open Look again and look for the dot. Then press Ctrl+Z twice, close both groups and look at the headings.", "A closed group in which something is not as it started shows a small dot next to its heading, so nothing is hidden without a sign; the pointer on the dot says \"Something here was changed\". Look shows \"Adjusted\" and Sound shows \"Muted\" at the right. An open group shows no dot (the setting itself is in view). After the two undos the dots are gone.", ""], ["sp8-remember", "The groups are remembered; the groups of a title, a sound and the whole video", "For clip B leave Look open and Speed closed. Choose Add > Title, type Round 8, and click the title on the timeline: read its headings and open Font and colour. Put the playhead at 0:00, add music M (Add > Music or sound\u2026, My files; Music), click the music and read its headings. Click an empty place of the timeline and read the headings. Choose File > Exit, start ClipForge, open \"Round 8 start\" and click clip B, then the title. Open one other project and click a clip there.", "A title: the Text box, then Size and style, Font and colour, Position, Appear and disappear, When it shows (Size and style and Position are open at first). Music: Volume and fades; Where it plays, fit, voice; Clean up, voice focus, quiet parts. Nothing selected: Fade in and out, Music under speech, Shorts and publishing. After the restart every group is as you left it: for the clip Look open and Speed closed, for the title Font and colour open. It is remembered for the app, not for one project: the other project shows the same groups open.", ""], ["sp8-hide", "Hide and show the whole side panel: the menu, the key, the button, Settings", "In \"Round 8 start\" choose View > Show the side panel and look at the window; open the View menu and read the item; choose it again. Press Ctrl+Shift+P twice. Move the pointer onto the small arrow at the top of the panel, read its tooltip and click it; do the same with the button that stays at the right edge. Open Settings, switch Show the side panel off, close Settings and look; switch it on again. Hide the panel once more, choose File > Exit, start ClipForge, open the project, and show the panel again. Then press F1, search for: side panel, and open the article.", "Hidden, the whole panel is gone and the picture and the timeline get its width; a narrow strip with one button stays at the right edge. The menu item View > Show the side panel (Ctrl+Shift+P) has its tick only while the panel shows. The tooltips read \"Hide the side panel (Ctrl+Shift+P)\" and \"Show the side panel (Ctrl+Shift+P)\". The menu item, the key, the button and the switch in Settings > Editing (\"The settings at the right of the editor. Hidden, the picture gets the room; View > Show the side panel brings it back.\") do the same thing and always agree. The choice is kept over a restart. Write down what happens when you click a clip while the panel is hidden. The help article \"The side panel and its groups\" is found and fits what you saw (headings, several open at once, remembered, the dot, Crop as the exception, Ctrl+Shift+P).", ""]]], ["E. Connect to Claude page (the FFmpeg card and \"Updating the helper\u2026\" are new in 1.18)", [["cl-page", "Status lights and Details", "Choose Help > Connect to Claude\u2026. Read the page. Open every \"Details\" line. Do NOT click Connect, Disconnect or Replace with this version yet.", "A card \"The Claude helper is installed\" with \"Version 1.18.0 (build 140). ClipForge refreshes it every time the app starts.\", the helper's folder (it ends in ClipForge\\claude, under the user's app data) and \"Not in use right now \u2026\" or \"In use by \u2026 now \u00b7 last action \u2026\". A card for Claude Desktop and one for Claude Code, each with a light and one status line: \"Connected (ClipForge 1.18.0)\" (green), \"Connected to an old copy at \u2026\" (amber), \"Not connected\" or \"\u2026 not found\" (grey). When an old copy is connected, the ONE highlighted button is Replace with this version, with a line that says what it does (and Disconnect instead next to it). Copy both status lines into the note. New in 1.18: ClipForge brings the helper up to date as the first thing after it starts. If you open the page in that moment, the first card is titled \"Updating the helper\u2026\" instead of showing the old version, and then changes by itself; afterwards it reads Version 1.18.0 (build 140). FAIL if it still names an older version or build after a minute (copy the line).", ""], ["cl8-ffmpeg", "The card \"One more thing to install: FFmpeg\"", "On the Connect to Claude page look for a card \"One more thing to install: FFmpeg\". If it is there: read it, click Copy the command, paste the command into the note and read the message. Do NOT run the command and install nothing: tell the owner what the card says. If the card is not there, ask the owner whether FFmpeg is installed on this PC and write the answer down.", "The card shows only when the Claude helper would find no FFmpeg on this computer (ClipForge looks in the same places as the helper), and it shows BEFORE anything fails. It says: \"Claude control needs the free program FFmpeg on this PC: open PowerShell (or Terminal) and run \"winget install ffmpeg\", then quit and reopen Claude. The ClipForge app itself works without it; only Claude needs it, to read, render and export videos.\", shows the command on a line of its own and has the buttons Copy the command (\"The command was copied.\") and \"I installed it: check again\". The pasted text is exactly: winget install ffmpeg. With FFmpeg installed there is no such card. FAIL if the owner says FFmpeg is not installed and the page has no card, or if the Test of the next step fails for want of FFmpeg while the page said nothing.", ""], ["cl-test", "The Test button", "Click Test and wait. Open the Details under the result. Click Check again.", "\"Testing\u2026\" for up to a minute, then a green line \"PASS: the helper works by itself (ClipForge 1.18.0).\" with Details that hold the self-test table. A red line starting with \"FAIL:\" is a FAIL: copy the line and the Details. The Claude helper needs the free program FFmpeg installed on the computer (ClipForge itself does not). Without it the test cannot pass: the line then reads \"FAIL: the helper answered (ClipForge 1.18.0), but a check did not pass. See Details.\" and the Details give the same sentence as the card \"One more thing to install: FFmpeg\" of the step before. In that case set Partial (not FAIL) with \"no FFmpeg on this PC\", and FAIL only if the Details name another reason or the sentence is missing.", ""], ["cl-connect", "Connect or Replace (only if the owner agrees)", "Ask the owner: \"May I press Connect (or Replace with this version) for Claude Desktop and for Claude Code?\" Only for a row the owner says yes to and that does not already say Connected (ClipForge 1.18.0): click that button. Also click Copy under \"Or paste this one line into a terminal yourself:\" and paste the line into the note. NEVER click Disconnect. If the owner says no, or both rows are already connected, set Not tested and say which.", "After the click the row's light is green and says \"Connected (ClipForge 1.18.0)\". The card \"After connecting: close and reopen Claude once\" explains why. The copied line starts with \"claude mcp add\" and ends with the helper's path in the ClipForge\\claude folder. (The Claude tools themselves are tested with the separate document \"Claude control test 6\".)", ""]]], ["F. Smaller things changed in 1.18", [["sm8-whatsapp", "WhatsApp / Telegram and Video size 720p: exactly 1280 \u00d7 720", "Open \"Round 8 start\" (file B, filmed wide). Press Ctrl+E, click WhatsApp / Telegram and copy the size it shows; export as r8-whatsapp.mp4 into clipforge-test-output and check the file (right-click > Properties > Details > Frame width / height). Choose View > Video size > 720p, press Ctrl+E, choose Custom, copy the size and cancel. Put View > Video size back to Same as the first clip. Ask the owner whether one of the test videos is only ALMOST wide (for example 1916 \u00d7 1080, from a screen recording or a phone): if yes, do the same with it in a new project and write down its own size.", "A wide video comes out at exactly 1280 \u00d7 720 for WhatsApp / Telegram and with Video size 720p, in the window and in the file. With 1.17 a video that was almost 16:9 came out at 1278 \u00d7 720. Any width other than 1280 for a wide video is a FAIL: write down the size of the source video too. (An upright video gives 720 \u00d7 1280.)", ""], ["sm8-share", "Share project file: your own file name still ends in .clipforge.zip", "On the project list open the three dots of \"Round 8 start\" and choose Share project file. In the save window go to clipforge-test-output, read the name it offers, REPLACE it by r8-own-name (type no ending) and save. Look into the folder with Explorer. Then choose File > Open project file\u2026 and pick the file.", "The offered name ends in .clipforge.zip. The file that is written is r8-own-name.clipforge.zip although you typed the name without an ending (1.17 could save it without the ending, and such a file was not offered when opening), and no second, empty file named r8-own-name is left next to it. A message says \"Project file saved: \u2026\". Open project file\u2026 takes the file and adds a project with a free name (\"Round 8 start (2)\").", ""], ["win8-delete", "Delete a test project: the exact message if it cannot be deleted", "Use ONLY a project this round made: the copy \"Round 8 start (2)\" that the step before added (if there is none: three dots of \"Round 8 start\" > Duplicate, and use that copy). NEVER one of the owner's projects. Click its three dots > Delete, read the question and click Delete. Wait ten seconds and read the list. If any message appears, copy it letter for letter. Then, in Explorer, open Documents > ClipForge (change nothing there) and copy the path from the address bar into the note.", "The question \"Delete project?\" names the project and says that copies the app made for it are deleted too, and that files in your own folders are not touched. After Delete the card is gone, and it is still gone after ClipForge was closed and started again. If instead a message starts with \"Could not delete the project.\", copy ALL of it (the part in brackets is what the maker needs), write down whether the card is still in the list, and whether the path of the projects folder has \"OneDrive\" in it (Windows may keep Documents inside OneDrive, which can hold on to files). This step is a note for the maker: PASS when the project was deleted, Partial with the copied message when it was not. Do not try other ways to delete it, and delete nothing in Explorer.", ""]]], ["G. Select a part of the timeline (new in 1.17)", [["pt-project", "Make the test project", "On the project list click New video. Choose Add > Add from a folder path\u2026, paste the MEDIA FOLDER path, look it up, tick files A, B and P and add them. Put the playhead at 0:00, choose Add > Music or sound\u2026, My files > Choose a music file\u2026 and pick M; when it asks \"What is this sound?\" leave Music and click Add. Put the playhead at 0:03, choose Add > Title and type: Round 8. Add four captions with Add > Caption\u2026 (move the playhead first): at 0:02 \"Sam Taylor: Welcome to the test.\"; at 0:06 \"This line has no name.\"; at 0:10 \"Alex K: Thanks, happy to be here.\"; at 0:14 \"Alex K: Let us test the search.\" Choose File > Rename project\u2026 and call it \"Round 8 test\".", "The window \"Add from a folder path\" lists the media files of the folder with tick boxes and a button like \"Add 3 files\". The editor shows A, B and the photo P on the main track with clip pictures, the music on a Music track from 0:00, the title and four captions. The top bar shows Saved.", ""], ["pt-strip", "Drag along the strip under the ruler", "Look directly under the time ruler: a thin strip says \"Drag here to select a part\". Drag along it from about 0:05 to about 0:12. Read what appears. Drag the right handle of the part to about 0:15 and the left one to about 0:04, slowly, near the end of a caption or the playhead. Click the time ruler at 0:20. Press Esc. (If the drag fails twice, use the next step's keys and set Partial.)", "A part of the timeline is highlighted across every row with its length, with a handle on each edge. A bar next to the timeline shows the start, the end and the length and the actions (Cut out, Silence, Lower volume\u2026, Speed\u2026 and more), and every row gets a tick box at its name, all ticked. The handles snap to cuts, to where speech starts and stops, to markers and to the playhead. A click on the ruler still only moves the playhead (the part stays). Esc clears the part: band, bar and tick boxes are gone. Nothing of this is a History step.", ""], ["pt-io", "I and O, Shift+click, Shift+drag", "Put the playhead at 0:06 and press I. Put it at 0:12 and press O. Hold Shift and click the ruler at 0:18. Press Esc. Hold Shift and drag on the ruler itself from 0:08 to 0:11. Press Esc. With no part: put the playhead at 0:10 and press I, look, press Esc; press O, look, press Esc. Then press Space, and while it plays press I and two seconds later O; press Space.", "I sets the start of the part at the playhead, O its end (0:06 to 0:12). Shift+click stretches the part to that place. Shift+drag on the ruler selects a part; without Shift the ruler moves the playhead. With no part, I gives \"from the playhead to the end\" and O \"from the start to the playhead\". I and O also work while the video plays. Part > Part starts at playhead (I) and Part ends at playhead (O) do the same.", ""], ["pt-qw", "Q and W trim the clip (what I and O did before)", "Press Esc. Click clip A, put the playhead about 2 seconds into it and press Q; put it 2 seconds before the end of A and press W. Open the Clip menu and read the two items. Press Ctrl+Z twice.", "Q makes A start at the playhead, W makes it end there; each is one History step (\"Start of clip 1 at playhead\", \"End of clip 1 at playhead\") and each undo restores one. The Clip menu shows Start at playhead (Q) and End at playhead (W). I and O did NOT trim the clip.", ""], ["pt-quick", "Quick ways to select", "Double-click clip B. Press Esc. Double-click the music; Esc. Double-click the title; Esc. Put the playhead at 0:08 and choose Part > Select from the start to the playhead; then Part > Select from the playhead to the end; then Part > Clear the selected part. Put the playhead in a pause of the talking in A (wait until \"Drawing sound\u2026\" is gone) and choose Part > Select the pause here; Esc. Read Part > Select between the markers here (no markers yet).", "A double-click selects exactly the time of that clip, sound or title. From the start to the playhead and From the playhead to the end select those stretches; Clear the selected part removes it. Select the pause here selects the pause around the playhead; where someone is talking it says so instead (\"The playhead is not in a pause: someone is talking \u2026\"). Without markers the item is grey with its reason: \"Select between the markers here (no good moment markers yet)\". A single click on a clip still only selects the clip, without delay.", ""], ["pt-menu", "The Part menu and the right-click menu inside a part", "Select a part from 0:05 to 0:12 (I and O). Open the Part menu and compare with Expected. Then right-click INSIDE the highlighted part on the timeline, read the menu and press Esc.", "Part: Select a part, Part starts at playhead (I), Part ends at playhead (O), Select this clip's time, Select this speaker's turn, Select the pause here, Select between the markers here, Select from the start to the playhead, Select from the playhead to the end, Clear the selected part | Cut out, Delete and leave a gap, Silence, Lower volume\u2026, Speed\u2026, Clean up sound here | Make a short from the part\u2026, Duplicate the part, Title over the part, Good moment marker at its start. A right-click inside the part offers the part's actions. Items that cannot be used are grey with the reason in brackets (for example \"\u2026 (no part is selected)\" when there is none). Write down every difference.", ""], ["pt-rows", "Rows: tick boxes, Alt+click, and why Cut out needs every row", "With the part selected, untick the tick box of the Music row. Read the bar (\"Rows: \u2026\"). Move the pointer over Cut out in the bar and read what it says; click it. Then hold Alt and click the tick box of the Video row. Read the bar. Tick every row again (the bar has a way to choose everything).", "Every row has a tick box while a part is selected (the video, each sound track, titles and captions, the overlay row when there is one). The bar says which rows the actions apply to (\"Rows: everything\", \"Rows: 3 of 4\", or \"Only Video\" after Alt+click). With a row unticked, Cut out is refused with one line why (it removes time, so it needs every row: with only some, lips and voice would no longer match) and points to Silence and Delete and leave a gap; nothing is changed. While the pointer is on an action, the row names show which rows it cannot change.", ""], ["pt-cut", "Cut out", "Write down the length of the video. Select a part from 0:20 to 0:24 with every row ticked (a place with NO caption). Click Cut out. Read the message. Play across the place. Open History (Ctrl+Shift+H) and close it. Choose Text and speech > Automatic cuts\u2026 and read it; close it without putting anything back.", "A message like \"Cut 4.0 s out of everything. To put it back later: Automatic cuts, or Undo now.\" The video is 4 seconds shorter, everything after the part moved up on EVERY row (clips, music, title, captions), and the music has no hole. History has one step for it. The window \"Automatic cuts\" lists this cut with Put back. Ask the owner to listen across the cut: no click.", "listen"], ["pt-putback", "Put back brings the captions back (fixed in 1.17)", "Select a part that covers the whole caption \"Thanks, happy to be here.\" (for example 0:09 to 0:14), every row ticked, and click Cut out. Check that the caption is gone from the timeline. Choose Text and speech > Automatic cuts\u2026 and click Put back on the row of THAT cut; close the window. Then open the Text window (Ctrl+Shift+T), click the caption \"Let us test the search.\", click Cut this part out of the video\u2026, click Cut it out, and again use Automatic cuts\u2026 > Put back for it.", "After Cut out the caption on that part is gone and the video is shorter. After Put back the video has its old length, the clip is one piece again there AND the caption \"Thanks, happy to be here.\" is back at its old time with its text. The same for the part cut out in the Text window: Put back returns the picture, the sound and the caption. (In 1.15 the caption stayed gone: that was the Round 6 finding.) A caption that was only shortened by a cut is not made longer again: that is expected.", ""], ["pt-gap", "Delete and leave a gap", "Select a part from 0:05 to 0:08. Hold Alt and click the tick box of the Music row. Click Delete and leave a gap. Look at the music. Press Ctrl+Z. Now Alt+click the tick box of the Video row and click Delete and leave a gap (or read why it is grey).", "On the music row the part is removed and a gap is left: the music before and after it stays exactly where it was, and nothing else moved; a message like \"Deleted that part on Music. Nothing moved.\" Undo brings it back. For the Video row it is refused with the reason (the main track cannot have gaps); it points to Cut out or Silence.", ""], ["pt-silence", "Silence on one row", "Select a part of about 2 seconds in which someone talks in clip A. Alt+click the tick box of the Video row. Click Silence. Read the message. Look at the slim sound wave along the bottom of clip A. Play from 2 seconds before the part to 2 seconds after it. Click clip A and look in the side panel for \"Quiet parts\".", "A message like \"Silenced 2.0 s on Video.\" Nothing moves and the length stays. The sound wave of the clip is flat (with a dark band) on that part. On play the clip's own sound is silent there while the music plays on; the sound goes down and comes back over a blink, without a click. The clip's settings list the part under Quiet parts (from \u2013 to, silent) with Remove. Ask the owner to listen.", "listen"], ["pt-lower", "Lower volume\u2026", "Select another part of about 3 seconds. Alt+click the tick box of the Music row. Click Lower volume\u2026. Read the window, choose 12 dB and confirm. Play across it. Click the music and look at its Quiet parts. Then select the same part again, open Lower volume\u2026 and move the slider instead; cancel.", "A window \"Lower volume\" with 6, 12 and 18 dB and a slider, and a line saying how long a stretch gets quieter on which rows, with short fades so nothing clicks. Afterwards a message like \"Lowered 3.0 s by 12 dB on Music.\" The music's wave is lower on that part; the music is clearly quieter there and the voice is not. The music's settings list it under Quiet parts with its level. Ask the owner to listen.", "listen"], ["pt-follow", "A quiet part stays on the same words; Remove", "Note the words that are silenced in clip A (from the step \"Silence on one row\"). Click clip A, put the playhead 1 second into it and press Q (the clip starts 1 second later). Play across the silenced words. Press Ctrl+Z. Then, in clip A's Quiet parts list, click Remove on that part and play again. Press Ctrl+Z so that the silence is back.", "After the trim the silence is still on the same words (it moved with the picture, 1 second earlier on the timeline). Remove gives the part its sound back; the row leaves the Quiet parts list. Each is one History step and one undo.", "listen"], ["pt-speed", "Speed\u2026 for a part", "Select a part of 4 seconds in clip B (double-click B and pull the handles in if B is longer), every row ticked. Click Speed\u2026. Read the window. Click 0.5\u00d7, 0.25\u00d7, 1.5\u00d7 and 2\u00d7 in turn and read the line and the tick box each time. Choose 0.5\u00d7 and confirm. Play across it. Press Ctrl+Z, then Ctrl+Shift+Z.", "A window \"Speed of this part\" with 0.25\u00d7, 0.5\u00d7, 1.5\u00d7 and 2\u00d7 (or any speed), a line like \"0.5\u00d7: this part will take 8.0 s (now 4.0 s)\", a note that the clip's own sound and voices lined up with it follow while music and other sound keep their speed and their place, and the tick box \"Mute this part's own sound\", which ticks itself below 0.5\u00d7. After confirming, B is cut at both ends of the part, the middle piece plays in slow motion and is twice as long, and the music did not move. Undo and redo are one step each. Ask the owner to watch: smooth slow motion, normal speed before and after.", "watch"], ["pt-clean", "Clean up sound here", "Select a part of about 5 seconds in clip A where there is talking. Alt+click the tick box of the Video row and click Clean up sound here. Read the message. Wait until the sound is prepared, then play across the part.", "A message that Clean up sound is on for this part on Video, and that you hear it once its sound is prepared, and in the export. The clip is cut at both ends of the part and only the middle piece has Clean up sound on (click it and look at its Sound settings). Ask the owner to listen: less hiss or hum on the part, the voice in sync.", "listen"], ["pt-more", "Short, duplicate, title and marker from a part", "Select a part from 0:02 to 0:10. Click Good moment marker at its start (in the bar under \"Make a short, duplicate, title, marker\", or in the Part menu). Then Title over the part. Then Duplicate the part; press Ctrl+Z. Then Make a short from the part\u2026: read the window, name it \"Round 8 part short\", click Make the short and then Stay here.", "Marker: a flag at 0:02 and \"Marked 0:02 as a good moment.\" (a second time: \"There is already a marker there.\"). Title over the part: a new title that starts and ends with the part (History: \"Added a title over a part\"). Duplicate the part: \"A copy of the part is right after it (now selected).\" and the video is longer by the part. Make a short: the window \"Make a short\" shows the part's times and length; a new upright project \"Round 8 part short\" is in the project list and this project is unchanged.", ""], ["pt-text", "From the Text window: Select this part on the timeline", "Open the Text window (Ctrl+Shift+T). Click the first caption, Shift-click the second, and click Select this part on the timeline. Look at the timeline. Press Esc. Close the Text window.", "The bar above the page says how many captions are selected and from when to when. Select this part on the timeline selects exactly that stretch as a part on the timeline, with the bar and the tick boxes. Esc clears it.", ""], ["pt-export", "The export has the silence, the lower music and the slow part", "Press Ctrl+E, choose Custom, Make: Video, Small file, and export as r8-part.mp4 into the clipforge-test-output folder. Play the file in Media Player at the three places: the silenced part, the part with lower music, the slow-motion part.", "It finishes with \"Video saved\". Ask the owner to watch and listen to the file: at the silenced part the voice is gone and the music plays on, without a click at either edge; the music is quieter on its part; clip B is in slow motion on its part; everything else is as in the preview.", "watch,listen"], ["pt-help", "The four new help articles", "Press F1. Search for each of: select a part, silence, slow down, only when speaking. Open each article that comes first and read it once.", "The articles \"Select a part\", \"Silence or lower a part\", \"Slow down a part\" and \"Only when speaking\" are found and open. Their text fits what you just did (the strip, I and O, the rows, the bar). Write down any sentence that does not match the app.", ""]]], ["H. Only when speaking (new in 1.17)", [["ows-none", "Without a voice track it says why", "In \"Round 8 test\" (no voice track) open the Sound menu and read Only when speaking\u2026; click it if it can be clicked.", "The item is grey with its reason, or a line says \"There is no speech track yet. Add a voice \u2026\". Nothing is changed.", ""], ["ows-short", "A short project with the two voices", "Needs a video with one sound file per speaker (otherwise set Not tested for this group). Open \"Round 8 long\", select a part of 60 seconds in which both people talk, and choose Part > Make a short from the part\u2026; UNTICK Short caption look, name it \"Round 8 two voices\", click Make the short and Open it. (With a short recording V and its voice files W, make a new project \"Round 8 two voices\" with them instead: Add > Voice recording\u2026.)", "The new project is about 60 seconds long and has both voice tracks, still lined up with the picture (play 10 seconds: the voices match the lips). If a line with a tip about two microphones appears under the top bar, write its text down and leave it for the next step.", ""], ["ows-suggest", "The suggestion with two voice tracks", "In \"Round 8 two voices\" wait until \"Drawing sound\u2026\" is gone and read the thin line under the top bar. Click its button Only when speaking\u2026.", "A line \"Two microphones: each one also picks up the other speaker and the room.\" with the button Only when speaking\u2026 (another suggestion may show first: write it down, close it with its cross and wait). The button opens the window \"Only when speaking\".", ""], ["ows-on", "Switch it on", "If the window is not open: Sound > Only when speaking\u2026. Read it. Switch it on for both voice tracks. Under \"Between the turns\" read the choices and leave \"A little room sound (\u221218 dB)\". Open \"How it works, and its limits\" and close Help again. Close the window. Click the name of one voice track on the left and read its menu.", "The window \"Only when speaking\" explains that each microphone also hears the other people, breathing and the room, and that switched on, a microphone is turned down while its speaker is not talking, in the preview and the export; it goes by loudness, not by words: listen to a stretch before you export. Each voice track has its switch (\"Turned down while this speaker is silent\"). Between the turns: A little room sound (\u221218 dB), More room sound (\u221212 dB), Hardly any (\u221230 dB) and silence. The track's menu has Only when speaking too, and it shows the same state. It is OFF unless switched on.", ""], ["ows-listen", "Hear and see it", "Look at the two voice rows on the timeline. Play 30 seconds in which the speakers take turns. Then switch Only when speaking OFF for both tracks (Sound > Only when speaking\u2026) and play the same 30 seconds; switch it ON again.", "With it on, each voice's sound wave is small where that speaker is silent. Ask the owner to listen with headphones: with it on, the other person's voice and the room are much quieter under each speaker, no word is cut off at the start of a turn, and the sound between the turns is not dead silent; with it off the echo of the other microphone is back.", "listen"], ["ows-export", "It is in the export too", "With Only when speaking on, press Ctrl+E, choose Custom, Small file, and export as r8-speaking.mp4. Play the file.", "The export finishes. Ask the owner to listen to the same 30 seconds in the file: it sounds like the preview with Only when speaking on (the export's fades are exact; the preview's are a little coarser).", "listen"]]], ["I. Shorts from markers (fixed in 1.17)", [["shm-short", "Two markers in a short video: two different parts", "Make a new project with file B only (a video shorter than 45 seconds), rename it \"Round 8 markers\". Write down its length. Put the playhead at one third of it and press M, and at two thirds and press M. Choose Clip > Make shorts from markers\u2026. Read the title, the text and the two lines with times. Untick Short caption look and click Make them. Read the result and click its button. Go to the project list and count the new projects.", "The window is titled \"Make 2 shorts from the markers?\" and says: one new upright project around each marker, about 20 seconds before it to 25 seconds after (less in a short video), starting and ending at a pause. The two parts listed are DIFFERENT and neither is the whole video: in a video under a minute each is about half the video (at least 8 seconds). Afterwards \"2 shorts are ready\" lists two projects, with Open the first. The project list has exactly two new projects, as many as the window said. (In 1.15 both parts were the whole video and one short was made.) If one could not be made, the message says \"1 of 2 shorts was made\" with \"Not made: \u2026\" and the reason: copy it.", ""], ["shm-close", "Two markers close together: one short, or two", "Open \"Round 8 markers\". Remove both markers (right-click a flag > Remove this marker). Press M at one third of the video and again 2 seconds later. Choose Clip > Make shorts from markers\u2026. Read the note and the choice. Leave \"One short covering both\" and click the button. Count the new projects. Then open the window again, choose Two shorts and make them. Count again.", "The window says \"The two markers are close together: their shorts would show mostly the same part.\" and offers One short covering both (ticked) and Two shorts (a short for every marker). With the first choice the title reads \"Make 1 short from the 2 markers?\", one part is listed, and exactly ONE new project is made (\"The short is ready\"). With Two shorts the title counts 2, two parts are listed and two projects are made. The number made is always the number in the title; a name that exists gets \"(2)\".", ""], ["shm-long", "Markers in a longer video", "Open \"Round 8 test\". Press M at about 0:40 and at about 1:20 (if the video is shorter, at one quarter and three quarters). Choose Clip > Make shorts from markers\u2026, read the two parts, leave Short caption look ticked and click Make them, then Open the first. Play it and go back.", "In a video longer than a minute each part runs from about 20 seconds before its marker to about 25 seconds after it, moved to pauses. Two shorts are made. The first one opens: upright 9:16, the wide picture in the middle; captions that lie in that part are bigger, in the lower middle and outlined. \"Round 8 test\" is unchanged. Ask the owner to watch it once.", "watch"]]], ["J. Keyboard shortcuts wherever you clicked last (fixed in 1.17)", [["key-timeline", "After a click on the timeline", "In \"Round 8 test\" click clip A on the timeline. Then press, one after the other, and look each time: Space (plays), Space (stops), Right, Left, Home, End, Ctrl+Right, Ctrl+Left, S (splits), Ctrl+Z, Ctrl+Y (redo), Ctrl+Z, Ctrl+Shift+H (History opens), Ctrl+Shift+H, Ctrl+Shift+T (Text opens), Ctrl+Shift+T, Ctrl+F (the search box of Text gets the cursor), Esc, Ctrl+E (Export opens), Esc, F1, Esc.", "Every key does its job at the first press. Write down each key that did nothing or did something else.", ""], ["key-text", "After a click in the Text window", "Open the Text window and click a sentence in it. Press the same keys as in the step before, except S. Then click an EMPTY place of the Text page and press Space, Ctrl+Z and Ctrl+Y.", "The same result: Space plays and stops, the arrows move the playhead by a frame, Ctrl+Z / Ctrl+Y undo and redo, Ctrl+Shift+H, Ctrl+E, Ctrl+F and F1 open their windows. (In 1.15 the keys stopped working after a click in the Text window.)", ""], ["key-slider", "After a click on a slider or a switch in the side panel", "Click clip A. In the side panel click on the Volume slider (move it a little), then press Space, Space, Right, Left, Ctrl+Z, Ctrl+Y. Click a switch in the side panel (for example Mute) and press Space once: look whether the video plays or the switch flips. Click a button in the side panel and press Ctrl+Shift+H twice. (The Volume slider and Mute are in the group Sound of the side panel: click the heading Sound if that group is closed.)", "After a click on a slider, Space plays the video (it does not move the slider), and Right / Left step one frame (they do not change the volume). After a click on a switch or a button, Space plays (it does not press the control again). Ctrl shortcuts always work. One exception that is intended: after pressing Tab to walk through the controls, plain keys go to the control until the next mouse click.", ""], ["key-typing", "While typing, the keys stay with the text field", "Click the title on the timeline, click into its Text box in the side panel and type: jkl iq wso m (with the spaces). Press Ctrl+Z once while still in the box. Click an empty place on the timeline and press L, then K.", "The letters only go into the text: nothing plays, splits, trims, marks a part or drops a marker (no flag, no highlighted part). Ctrl+Z in the box takes back typing in the box. After clicking outside, L plays and K pauses.", ""], ["key-comma", "Ctrl+comma opens Settings everywhere", "On the project list, click an empty place and press Ctrl+comma; close Settings. In a project press Ctrl+comma; close. Ask the owner whether a second keyboard layout is installed (for example Russian or Hebrew): if yes, switch to it (Win+Space), press Ctrl and the key that is the comma on the English layout, close Settings and switch back.", "Settings opens each time, also when nothing on the page has the keyboard and with a layout where that key types another letter. (Round 6: it did not open on this PC.) Without a second layout set Partial and say so.", ""]]], ["K. Send feedback (1.16) with \"Include details about how ClipForge ran\" (1.17)", [["fb-page", "The page and the \"What is sent\" box", "Choose Help > Send feedback\u2026. Read the page. Click each of Problem, Idea, Praise, Question. Type into the message: TEST from Round 8, please ignore. Leave the e-mail address empty. Read the box \"What is sent\". Do NOT press Send yet.", "A page with the four kinds, a message box (\"What did you do, what did you expect, and what happened instead?\"), \"Your e-mail address (optional)\" with \"Only used to answer you.\", and a box \"What is sent\" that shows exactly what goes: the kind, your message, the version and build of ClipForge, the name and version of the system, and says that only this is sent, only when you press Send, and that nothing about your projects, file names, videos, photos or music is ever included.", ""], ["fb-details", "The tick box \"Include details about how ClipForge ran\"", "Find the tick box \"Include details about how ClipForge ran\" and read its explanation. Check that it is OFF. Tick it and read the box \"What is sent\" again, to its end. Look in those lines for the names of your test files and projects (for example \"Round 8\", the name of file L). Untick it and look again; tick it again.", "The box is off unless you tick it. Its explanation: the performance log (when ClipForge opened a project, saved, drew sound waves, and when it could not respond), no file names, no project names, nothing you typed; you see the lines before they are sent. Ticked, \"What is sent\" shows the performance-log lines; unticked, they are gone. No file name and no project name is in them. FAIL if a name of yours appears: copy that line.", ""], ["fb-draft", "The draft is kept; the other ways in", "Close the feedback page without sending. Open it again from Help > About ClipForge (its Send feedback button). Close it. Open Settings and find Send feedback there; open F1 and look at the bottom of Help.", "What you wrote is still on the page each time (the message, the kind). About ClipForge, the bottom of Help and Settings each have a way to Send feedback that opens the same page.", ""], ["fb-send", "Send one test message (only if the owner agrees)", "Ask the owner: \"May I send one test message with the performance details ticked? It goes to the ClipForge website.\" Only after a yes: with the message \"TEST from Round 8, please ignore.\", kind Problem, no e-mail address and the box ticked, press Send once. If the owner says no, set Not tested.", "\"Sent. Thank you!\" and the page is empty afterwards (the draft is gone). If it says \"The message could not be sent. Check the internet connection and try again.\", it offers Open the feedback page in the browser and Copy my message, and your text stays: copy what it says and set FAIL only if the internet works. Ask the owner later whether the message arrived with the performance lines.", ""]]], ["L. Smaller things changed in 1.17", [["sm-addpath", "Add from a folder path\u2026, and Ctrl+V with a path", "In \"Round 8 test\" choose Add > Add from a folder path\u2026. Type a path that does not exist (the media folder plus \\nothing-here) and look it up. Then paste the full path of file B alone and add it; press Ctrl+Z. Close the window. In Explorer, hold Shift, right-click file B and choose Copy as path; back in ClipForge click an empty place on the timeline and press Ctrl+V.", "The window explains: type or paste the path of a file, or of a folder to choose from (in Explorer: Shift+right-click > Copy as path). A wrong path says \"There is no file or folder at that path.\" A file path adds that file (a sound file asks \"What is this sound?\"); a path in quotation marks works too. Ctrl+V on the timeline with a copied path opens the same window with the path filled in. A project file is refused with \"That is a project file: open it from the project list.\"", ""], ["sm-menus-1", "File, Edit, Add and Clip menus", "There are ten menus now: File, Edit, Add, Clip, Part, Sound, Text and speech, View, Playback, Help. Open File, Edit, Add and Clip and compare every item and shortcut with Expected.", "File: New project (Ctrl+N), Open project file\u2026 (Ctrl+O) | Rename project\u2026, Publishing notes\u2026, Back to projects | Export\u2026 (Ctrl+E), Export several\u2026, Export subtitles (.srt)\u2026 | Settings\u2026 (Ctrl+,) | Exit (Alt+F4). Edit: Undo (Ctrl+Z), Redo (Ctrl+Shift+Z / Ctrl+Y), History (Ctrl+Shift+H) | Duplicate (Ctrl+D), Copy settings (Ctrl+Shift+C), Paste settings (Ctrl+Shift+V), Delete (Delete / Backspace) | Find in the text\u2026 (Ctrl+F). Add: Videos or photos\u2026, Music or sound\u2026, Voice recording\u2026, Title, Caption\u2026, Subtitle file (.srt)\u2026, Overlay video or photo\u2026, Add from a folder path\u2026, Good moment marker (M). Clip: Split (S), Start at playhead (Q), End at playhead (W), Freeze frame, Remove silences\u2026, Crop and position\u2026, Rotate right, Move earlier, Move later | Make a short from here\u2026, Make shorts from markers\u2026, Good moments\u2026. In an open project New project and Open project file\u2026 are grey with \"(go back to the projects first)\". Write down every difference. (The menu item is still called New project; on the project list the same thing is the button New video.)", ""], ["sm-menus-2", "Sound, Text and speech, View, Playback and Help menus", "Open Sound, Text and speech, View (with Shape and Video size), Playback and Help and compare with Expected. (The Part menu was compared in group C.)", "Sound: Fit music to video, Line up voice with video, Separate sound\u2026, Put sound back, Add sound track, Lower music under speech, Only when speaking\u2026, Copy music credits. Text and speech: Text window (Ctrl+Shift+T), Transcribe speech\u2026, Captions from speech\u2026, Remove filler words\u2026, Automatic cuts\u2026. View: Zoom in (+), Zoom out (-), Snap to playhead and edges, Show sound waves, Show the side panel (Ctrl+Shift+P; new in 1.18) | Shape > Original (as the first clip), 9:16 upright, 16:9 wide, 1:1 square, 4:5 upright | Video size > Same as the first clip, 720p, 1080p (Full HD), 4K. Playback: Play/Pause (Space), Play backwards (J), Pause (K), Play forwards (L) | Go to start (Home), Go to end (End), Previous frame (Left), Next frame (Right) | Previous speech start (Ctrl+Left), Next speech start (Ctrl+Right). Help: ClipForge Help (F1), Keyboard shortcuts, Show the tour, What's new | Connect to Claude\u2026, Check for updates\u2026 | Send feedback\u2026, Copy version info, About ClipForge. Zoom in shows \"+\". Write down every difference.", ""], ["sm-grey", "Greyed items say why, also on the project list", "In \"Round 8 test\" click an empty place so nothing is selected. Read Sound > Fit music to video, Edit > Paste settings, Edit > Delete and Part > Cut out. Then go to the project list (File > Back to projects) and open the Clip, Part and Sound menus there. Open the project again.", "In the project: \"Fit music to video (select a music clip)\", \"Paste settings (copy settings first)\", \"Delete (select something first)\", \"Cut out (no part is selected)\". On the project list every editor item is grey and says \"(open a project first)\" (in 1.15 they were grey without a reason). Write down any greyed item without a reason.", ""], ["sm-context", "Right-click menus stay inside the window", "Make the ClipForge window small (about half the screen height). Right-click clip A near the bottom of the timeline; press Esc. Right-click the music; Esc. Right-click the title; Esc. Right-click a flag on the ruler; Esc. Right-click an empty part of a track; Esc. Make the window large again.", "Each right-click selects that item and opens a small menu at the pointer with what can be done with it (clip: Split, Start at playhead, End at playhead, Duplicate, Copy settings, Paste settings, Freeze frame, Remove silences\u2026, Crop and position\u2026, Rotate right, Separate sound\u2026, Put sound back, Move earlier, Move later, Make a short from here\u2026, Delete, and the selecting of its time). A long menu never runs past the edge of the window: it fits, or it scrolls.", ""], ["sm-export-words", "The Export window's corrected lines", "Press Ctrl+E. Click WhatsApp / Telegram and read the size it shows. Click Shorts / Reels / TikTok and read the question about the shape. Click Instagram post and read its button for the site (it also shows on the finished screen). Click Custom and open Frames per second. Click Cancel.", "WhatsApp / Telegram shows the size that is really written (for a wide video 1280 \u00d7 720), not the project's size next to \"720p\". The shape question names both shapes the same way: \"Your video is 16:9 wide; this needs 9:16 upright\". The Instagram button says \"Open Instagram\". Frames per second offers Same as the clips, 24, 25, 30, 60.", ""]]], ["M. Projects", [["pr-list", "The project list and a project's menu", "Go to the project list. Read one project card (picture, name, length, date). Open the three dots of the card \"Round 8 markers\" and read the list. Click Duplicate twice. Rename one copy to the name of the other.", "Each card shows a picture, the name, the length and the date. The card menu has Rename, Duplicate, Share project file and Delete. The copies get names that are not taken (\"\u2026 (2)\", \"\u2026 (3)\"); renaming to a name that exists also gives a number in brackets, never two projects with the same name. In 1.18 the cards are bigger: the picture on top with the length on it, the name, \"Edited\" with the date, and the three dots.", ""], ["pr-share", "Share project file and Open project file", "On the card of one copy choose Share project file and save the file into clipforge-test-output. Then choose File > Open project file\u2026 (Ctrl+O) and pick that file. Open the project it makes, play 5 seconds, go back. Delete the copies this test made (card menu > Delete), not the owner's projects.", "A file ending in .clipforge.zip is written (\"Packing \u2026\" may show). Opening it adds a project with a free name that has the clips with their pictures and plays, with the markers. Delete asks first and removes only that project.", ""], ["pr-drop", "Drag and drop files onto ClipForge", "From Explorer drag file B onto the project list. Then, in the project that opens, drag file P onto the window. (If dragging between windows fails twice, set Needs the owner.)", "Dropping on the project list makes a new project with that file; dropping on an open project adds the file. A dropped sound file asks \"What is this sound?\".", ""], ["pr-missing", "A missing file and Find file", "In Explorer copy file B into clipforge-test-output as r8-missing.mp4 (a copy this test made). Make a new project \"Round 8 missing\" with that copy. Go to the project list and choose File > Exit. In Explorer rename the copy to r8-found.mp4. Start ClipForge, open the project, read what it shows, press Ctrl+E and read, cancel. Click Find file\u2026 on the clip and pick r8-found.mp4.", "The clip is marked Missing (red) and the app names the file that is gone. Export says that a file is missing before it starts. Find file\u2026 opens a file window; after choosing the file the clip has its picture again and plays. (If ClipForge kept its own copy and nothing is missing, write that down and set Partial.)", ""], ["pr-history", "History, undo and redo", "Open \"Round 8 test\". Press Ctrl+Shift+H. Copy the newest 15 names into the note. Click a step about 10 back, then the newest. Press Ctrl+Z 5 times and Ctrl+Y 5 times. Close History.", "A History column with your changes by name, newest first; the part actions have clear names (cut out, silenced, lowered, speed of a part, title over a part). Clicking an old step puts the project back to that point (later steps look grey); the newest restores everything. Each undo takes back exactly one change and each redo brings it back. No vague names like \"Changed\".", ""], ["pr-quit", "Quit while editing: everything is saved", "With \"Round 8 test\" open and nothing exporting, make one small change (move the title a little) and press Alt+F4 at once. Start ClipForge again and open the project.", "It closes without asking. After reopening, the last change and everything else is there. The top bar shows Saved.", ""]]], ["N. Timeline and cutting", [["tl-split", "Split, delete, undo; trim by dragging; reorder", "Make a new project \"Round 8 basics\" with A, B and P (Add from a folder path). Click clip A, put the playhead in its middle and press S. Click the second piece and press Delete; Ctrl+Z. Drag the right end of B about 2 seconds to the left. Drag the photo P in front of B. Then click P and use Clip > Move later and Clip > Move earlier.", "S cuts A into two pieces; Delete removes the selected piece and the rest moves up; undo brings it back. Dragging an end trims the clip. Dragging a clip moves it to a new place in the order; Move earlier / Move later do the same from the menu. (If a drag fails twice, use the menu and set Partial.)", ""], ["tl-transition", "Transitions", "Click clip B. In the side panel open Transition and fades. Choose each transition in turn (Crossfade, Fade through black, Slide left, Slide up) and play across the start of B each time. Leave Crossfade.", "Each choice changes how the clip before B changes into B: a soft mix, through black, B slides in from the right, B slides up. Ask the owner to watch: smooth, no frozen frame.", "watch"], ["tl-speed", "Speed of a clip", "Click the first piece of A. Open Speed in the side panel. Choose 0.5\u00d7, play 5 seconds; choose 2\u00d7, play; set it back to 1\u00d7.", "The speeds from 0.25\u00d7 to 4\u00d7 are offered. At 0.5\u00d7 the clip is twice as long and slow; at 2\u00d7 half as long and fast. Ask the owner to listen: the voice keeps its pitch (slower or faster, not deeper or higher).", "listen"], ["tl-freeze", "Freeze frame", "Put the playhead in the middle of B and choose Clip > Freeze frame. Play across it. Press Ctrl+Z.", "The picture under the playhead is held still for a moment as a new item between the two halves of B. One undo removes it.", ""], ["tl-dup", "Duplicate, Copy settings, Paste settings, Apply to all", "Click B and press Ctrl+D; delete the copy.
