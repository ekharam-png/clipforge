<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ClipForge Test Round 5</title>
<style>
:root{--bg:#f5f6fa;--card:#fff;--fg:#161a26;--muted:#5b6274;--line:#dfe2ec;--accent:#4257d6;--ok:#1f7a4d;--bad:#a8322b;--part:#9a5b00;--human:#6a3fb0}
@media (prefers-color-scheme:dark){:root{--bg:#0f1118;--card:#181b25;--fg:#eceef5;--muted:#9aa1b5;--line:#2a2f3f;--accent:#8c9bff;--ok:#6fd3a0;--bad:#ff9c94;--part:#f0b95a;--human:#c3a6ff;color-scheme:dark}}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}
.wrap{max-width:900px;margin:0 auto;padding:28px 16px 64px;display:flex;flex-direction:column;gap:20px}
h1{margin:0;font-size:1.8rem}h2{margin:8px 0 0;font-size:1.2rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:8px}
.instr{white-space:pre-wrap;font-size:.95rem}
.step{border-left:6px solid var(--line)}
.step[data-s="Works"]{border-left-color:var(--ok)}.step[data-s="Problem"]{border-left-color:var(--bad)}.step[data-s="Partial"]{border-left-color:var(--part)}.step[data-s="Needs a person"]{border-left-color:var(--human)}
.step[data-s="PASS"]{border-left-color:var(--ok)}.step[data-s="FAIL"]{border-left-color:var(--bad)}.step[data-s="Needs the owner"]{border-left-color:var(--human)}
.do{margin:0;font-size:.95rem}
.step h3{margin:0;font-size:1.02rem}.exp{color:var(--muted);font-size:.93rem;margin:0}
.tag{font-size:.75rem;font-weight:600;border:1px solid var(--line);border-radius:999px;padding:1px 8px;margin-left:6px;color:var(--muted)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
select,input,textarea,button{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px}
textarea{width:100%;box-sizing:border-box;min-height:64px}
button{cursor:pointer;background:var(--accent);color:#fff;border:0;font-weight:600;padding:10px 16px}
.counts{display:flex;gap:16px;flex-wrap:wrap;font-weight:600}
label{display:flex;flex-direction:column;gap:4px;font-size:.9rem;color:var(--muted)}
</style></head><body><div class="wrap">
<header class="card"><h1>ClipForge test round 5</h1>
<p class="exp">Build: <b id="build"></b>. Fill in each step, then click <b>Download filled checklist</b> at the bottom and send the file back to Claude.</p>
<div class="row"><label>Device<input id="device" placeholder="e.g. Windows 11 laptop, RTX 4070"></label><label>Tester<input id="tester" placeholder="e.g. ChatGPT agent, or your name"></label></div>
<label>Version shown in the app (required: About ClipForge &gt; Copy version info, then paste here)<textarea id="version" placeholder="ClipForge X.Y.Z (build N) · date, time UTC · commit" style="min-height:56px"></textarea></label>
<p class="exp" id="vwarn" style="color:var(--bad);margin:0"></p>
<div class="counts" id="counts"></div></header>
<section class="card"><h2>Instructions for the tester (person or AI agent)</h2><div class="instr" id="instr"></div></section>
<div id="steps" style="display:flex;flex-direction:column;gap:20px"></div>
<section class="card"><h2>Crash or freeze</h2><label>If the app closed by itself or froze: what were you doing?<textarea id="crash"></textarea></label></section>
<section class="card"><h2>Summary</h2><label>Most important problems first, plus anything confusing, slow or hard to find<textarea id="summary" style="min-height:120px"></textarea></label>
<div class="row"><button id="dl" type="button">Download filled checklist</button><span class="exp" id="saved"></span></div></section>
</div>
<script id="data" type="application/json">{"device": "", "tester": "", "build": "ClipForge 1.11.0 (build 106) \u00b7 18 Nov 2026, 04:34 UTC \u00b7 46d9324", "version": "", "summary": "", "crash": "", "items": {}}</script>
<script>
const STEPS=[["Start", [["start-open", "Install 1.11.0 and open ClipForge", "Unzip the new download into a new folder and run clipforge.exe.", "The project list opens. Projects from earlier rounds are still listed and one of them opens without an error.", ""], ["start-version", "The app shows the expected version", "Read the small grey line at the bottom of the project list. Open Help > About ClipForge, click Copy version info and paste it into \"Version shown in the app\" at the top of this page.", "Both show version 1.11.0 and build 106, the same as named at the top of this page. No red warning appears under the version box.", ""], ["help-new", "Help finds the new topics", "Open Help (the ? button at the top, or F1). Search for each of: zoom, transcribe, captions from speech, filler, transcript. Then open What's new in Help.", "The searches find \"Voice recorded separately (microphone, Zoom)\", \"Transcribe speech (computer only)\", \"Captions from speech (computer only)\", \"Remove filler words (computer only)\" and \"The transcript (computer only)\". What's new starts with 1.11.0 (18 November 2026) and below it 1.10.0.", ""]]], ["Basics still work (5-step regression)", [["reg-project", "Make the test project", "On the project list click New project. Add files A and E (see the instructions): drag them from Explorer onto the window, or use Add media. Rename the project to \"Round 5 test\" (File > Rename project\u2026).", "The editor shows two clips on the main track in the order A, E, each with clip pictures. The top bar shows Saved (or Saving... briefly).", ""], ["reg-split", "Split, delete, undo", "Click clip E, put the playhead in its middle and press S. Click the second piece and press Delete. Press Ctrl+Z once.", "S cuts E into two pieces. Delete removes the selected piece. One undo brings it back, so E is in two pieces again. Clicking a clip moves the preview to it.", ""], ["reg-clean", "Clean up sound still works", "Select clip A, open Sound and switch on Clean up sound. Wait until it finishes. Play it and switch Hear original on and off while it plays.", "The clip shows Sound xx% and then finishes. Ask the owner to listen: background hiss or rumble is lower with Hear original off, and the voice stays in sync with the lips.", "listen"], ["reg-music", "Music and Lower music under speech", "Put the playhead at 0:00, click Music, choose My files and pick file C. When ClipForge asks what the sound is, choose Music and click Add (the question itself is checked in the next group). Then choose Edit > Sound > Lower music under speech.", "The music starts at 0:00 on the Music track. The menu item shows as switched on. Ask the owner to listen to the first 20 seconds of the preview: voice and music are both heard.", "listen"], ["reg-quit", "Quit while editing: everything is saved", "With the project open and nothing exporting, press Alt+F4. Start ClipForge again and open \"Round 5 test\".", "It closes without asking. After reopening, the two pieces of E, Clean up sound on A and the music are all there.", ""]]], ["Project names", [["name-new", "Two new projects never get the same name", "Go back to the project list. Click New project, go back to the list, and click New project again. Go back to the list and read the names of the two new projects.", "A new project is named \"Video\" plus today's date. The second one made on the same day has the same name with \"(2)\" at the end. No two projects in the list have exactly the same name.", ""], ["name-dup", "Duplicating twice gives \"(2)\"", "On the card of \"Round 5 test\" open Project options (the three dots) and choose Duplicate. Do the same once more on \"Round 5 test\".", "The first copy is called \"Round 5 test copy\", the second \"Round 5 test copy (2)\". Write down the exact names. (Leave the copies; do not delete anything.)", ""]]], ["Voice recorded separately (new in 1.10)", [["v-ask", "\"What is this sound?\" when adding a sound file", "Open \"Round 5 test\". Drag music file C from Explorer onto the ClipForge window. Read the window that opens, then click Cancel. Then click Music > My files, pick C again and read the window again; click Cancel.", "Both times a window asks \"What is this sound?\" and names the file. It offers exactly three choices: Voice for the video, Music, Sound effect, each with one line of explanation, and the buttons Cancel and Add. For a music file, Music is the choice already selected. Cancel adds nothing.", ""], ["v-roles", "Music and Sound effect go to their tracks", "Put the playhead at 0:30. Add file C once more (Music > My files), choose Sound effect and click Add. Look at the names on the left of the timeline. Press Ctrl+Z.", "The sound lands at the playhead on a track called Effects (it is made when there is room; if there is no room a message says the sound is with the music). History shows \"Added sound effect\". One undo removes it.", ""], ["v-nomatch", "A voice that cannot be lined up says so", "Add file C once more, but this time choose Voice for the video, leave the name as it is and click Add and line up.", "With Voice chosen, a field \"Who speaks (name of its track)\" and a switch \"Mute the camera's own sound\" (on) appear, and the button reads Add and line up. It works for a moment (\"Lining up the voice with the video\u2026\") and then says it could not line it up automatically and to nudge it by hand; the voice starts where clip 1 starts and the camera's own sound is still on. Write down the exact message. Then press Ctrl+Z so the music is gone again.", ""], ["v-add", "Add the real voice: lined up, linked, camera muted", "Needs files V and W (a video and the voice recorded separately for it; otherwise set Not tested for this and the next three steps). Make a new project, add V, rename it \"Round 5 voice\". Drag W onto the window (with several speakers: all voice files together). Check what is preselected, the name field(s), then click Add and line up. Play 20 seconds from three places.", "Voice for the video is preselected (the file name or its length tells ClipForge), with one name field per file, filled in from the file name when it names the speaker. After Add and line up a message says \"Lined up with clip 1 (...)\" with a time, that it follows the picture when you cut, and that the camera's own sound is muted (with several files: \"... voices lined up with the video, each on its own track\"). Each voice is on its own track named after the speaker. Write down the message. Ask the owner to watch and listen: lips match the voice in all three places, and no second, echoing voice is heard.", "watch,listen"], ["v-nudge", "Nudge buttons and \"Line up with the video again\"", "Click the voice on its track. Read the panel. Under Nudge the voice click Later > 100 ms three times and play; then Earlier > 100 ms three times and play. Try 10 ms and 1 frame once each way. Then click Later > 100 ms twice and click Line up with the video again. Open History.", "The panel says \"Voice for clip 1, lined up at ...\" and that it follows the clip when you cut. Under Nudge the voice there are two rows, Earlier (100 ms, 10 ms, 1 frame) and Later (1 frame, 10 ms, 100 ms), plus Line up with the video again, Unlink and the switch Mute the camera's own sound. After 300 ms later the voice is clearly behind the lips; after nudging back it fits again (ask the owner). Line up with the video again brings back the same time as in the previous step. History has steps like \"Nudged voice 100 ms later\" and \"Lined up voice with clip 1 (...)\".", "watch,listen"], ["v-cuts", "Cuts keep the voice in sync", "Select the video clip, put the playhead at about one third and press S. Drag the end of the first piece a little shorter. Then select the second piece, open Sound and run Remove silences and apply it. Play across three cuts. Then press Ctrl+Z once.", "Every cut of the picture cuts the voice (all voices) at the same place: the voice track shows one piece under each video piece. The Sound panel of a video piece says \"Voice from a separate recording (...)\" and that the camera's own sound is muted. Ask the owner to watch and listen at three cuts: lips still match the voice, no words chopped. One Ctrl+Z takes back Remove silences for picture and voice together.", "watch,listen"], ["v-unlink", "Unlink, and line up again", "Click a voice piece and click Unlink. Read the question, leave its switch as it is and click Unlink. Read the panel. Drag the end of the video clip above it a little shorter and look at the voice. Press Ctrl+Z. Click the voice again and click Line up with the video.", "The question is \"Unlink the voice from the video?\"; it explains that the voice stays where it is but no longer follows the picture, and offers \"Switch the camera's own sound back on\", Cancel and Unlink. Afterwards the panel says the voice is recorded separately and not linked to the video, and the button reads Line up with the video (without \"again\"). Trimming the clip now leaves the voice as it was. Line up with the video links it again with the same time as before. History shows \"Unlinked voice from clip ...\".", ""]]], ["Transcribe speech (new in 1.11)", [["t-open", "Transcribe speech\u2026: the speech program, or a plain explanation", "Open \"Round 5 test\", select clip A, open Sound and click Transcribe speech\u2026. Wait until \"Looking at what this computer has\u2026\" is gone. Open the Language list. Do not click Download or Transcribe yet.", "A window \"Transcribe speech\" opens. It names the sound it will use, and Language offers Automatic, English, Russian, Hebrew and Other\u2026. Then EITHER a line \"Uses: ...\" names the speech program found on this computer (write it down exactly), OR a box explains in plain words that turning speech into text needs a speech program, that none was found, which ones ClipForge can use and what to install on Windows (winget install ffmpeg). In the second case copy the text into the note, tell the owner, and set the remaining speech steps to Not tested unless the owner installs one and restarts ClipForge.", ""], ["t-packs", "Language packs: sizes shown, nothing downloads by itself", "In the same window read the part \"Language pack\". Change Language between English and Russian and read the rows again. Wait one minute without clicking anything.", "It says nothing is downloaded until you press Download. Three rows: Small, Medium and Large, each with its size (about 140 MB, 470 MB, 1.6 GB) and a note (quick, more mistakes / good / best, large download), and whether it is English only or for all languages, shared. Each row not on the computer has a Download button; one that is has Remove. Below: \"No packs on this computer yet.\" or \"Packs use ... on this computer.\", and Use a model file I have\u2026. With no pack, Transcribe cannot be clicked. After a minute nothing has started downloading. (If instead it says the program uses its own model, write that text down; there are then no rows.)", ""], ["t-download", "Download a pack, stop it, continue", "Ask the owner which pack to download for the language of file A (suggest Small; NEVER click Download on Large without the owner saying so). Click Download on that row. After a few seconds click Stop. Then click Download again and let it finish.", "While downloading, the row shows how much of the size has arrived and a Stop button. Stop ends it within a few seconds. Download again continues and finishes; the row then shows Remove, it can be selected, the line below says how much space the packs use, and Transcribe can be clicked. If a download fails, copy the exact message.", ""], ["t-ownfile", "Use a model file that is already on the computer", "Click Use a model file I have\u2026. If the owner has a whisper model file (a .bin file, for example ggml-base.en.bin), choose it; otherwise close the file chooser with Cancel and set Partial with \"no file\".", "A file chooser opens. After choosing a file the window shows \"Your own file: <name>\" with a Forget it button, and Transcribe can be clicked without any download. Click Forget it afterwards if the owner wants to use the downloaded pack.", ""], ["t-cancel", "Progress and Stop", "Choose the language of file A and click Transcribe. When the progress bar has moved a little, click Stop. Then look at the Sound panel of clip A.", "A progress bar and a line of text appear, with the note that a long recording takes a while and that you can stop at any time. The left button reads Stop while it runs. Stop ends it within a few seconds, the window closes and the app stays usable. The Sound panel still says \"Turns what is said into text, for captions and more.\" (no transcript was made).", ""], ["t-run", "Transcribe to the end", "Click Transcribe speech\u2026 again, choose the language and click Transcribe. Note the clock time at the start and at the end. Leave the computer alone while it runs.", "The progress moves to the end and a message says \"Speech transcribed: ... words. See it under Transcript.\" Write down the number of words, the length of clip A and how long it took. The Sound panel now says \"Transcribed. Use it for captions or to remove filler words.\" and shows Captions from speech\u2026 and Remove filler words\u2026. Opening Transcribe speech\u2026 again shows \"already transcribed\" and the button Transcribe again.", ""], ["t-voices", "Separate voices are transcribed per speaker", "Only if \"Round 5 voice\" was made (otherwise Not tested). Open it, select the video clip, Sound > Transcribe speech\u2026 and click Transcribe. Then click the Transcript button at the top.", "The window says it will use the recordings, one per speaker, with the speakers' names (not the muted camera sound). While running it shows \"Recording 1 of ...\". In the Transcript column each phrase has its speaker's name above it, and the names are those of the voice tracks.", ""]]], ["Captions from speech", [["c-add", "Captions from speech\u2026", "In \"Round 5 test\" select clip A, Sound > Captions from speech\u2026. Read the window, switch Lines between 1 and 2, move the Longest line slider, then set 2 lines and 37 letters and click Add captions. Then press Ctrl+Z, and add them again the same way. Open Captions from speech\u2026 a third time, read it and click Cancel.", "The window \"Captions from speech\" says \"This adds ... captions, in the look your captions have\", shows the first three as a preview, and the count changes with Lines and Longest line (32 to 42 letters). Add captions puts them on the timeline and says \"Added ... captions from the speech. Undo takes them away.\" One Ctrl+Z removes all of them. The third time the window offers \"Replace the ... captions that are already there\". Write down the caption count.", ""], ["c-watch", "The captions fit what is said", "Play the first two minutes of \"Round 5 test\" in the preview.", "Ask the owner to watch and listen: each caption appears when its words are spoken, has one or two lines that fit inside the picture, stays long enough to read, and two captions never show at once. \"Um\" and \"uh\" are not written. Wrong words (names, numbers) are normal: write down two examples, but do not count them as FAIL.", "watch,listen"], ["c-foreign", "A Hebrew or Russian clip", "Only if the owner has file D (otherwise Not tested). Make a project \"Round 5 language\" with D. Sound > Transcribe speech\u2026, choose Hebrew or Russian. If it needs another pack, ask the owner before clicking Download (the Small pack makes many mistakes in Hebrew). Transcribe, then Captions from speech\u2026 > Add captions. Open the Transcript. Export as r5-language.mp4.", "The transcript and the captions are in Hebrew or Russian letters (no question marks or empty boxes). Hebrew reads right to left in the Transcript column, in the preview and in the exported file, with the full stop or question mark at the LEFT end of the line. Ask an owner who reads the language to watch 30 seconds of the export and say whether the text is readable and on time.", "watch"]]], ["Transcript", [["tp-open", "The Transcript column", "In \"Round 5 test\" click the Transcript button in the top bar (or Edit > Speech > Transcript). Click three different phrases. Then split clip A somewhere and delete a piece, look at the column, and press Ctrl+Z twice.", "A column titled Transcript opens with what is said, phrase by phrase, each with its time. Clicking a phrase moves the playhead and the preview to that moment. After deleting a piece its phrases are gone from the column and the later times are earlier; after the undos they are back. The text cannot be edited. The button (and the menu item, which shows a tick) closes the column again.", ""], ["tp-search", "Search the transcript", "Type a word that is said several times into \"Find a word\u2026\". Click one of the results. Clear the box and type: xyzzy.", "The column shows only the phrases with that word and a line \"Said in ... places\". Clicking one jumps there, and the word is heard when you play (ask the owner). For xyzzy it says that this is not said in this video.", "listen"]]], ["Remove filler words", [["f-open", "The review list", "Select clip A, Sound > Remove filler words\u2026 (or Edit > Speech). Wait until \"Checking the picture around each cut\u2026\" is gone. Read the window. Click the play button of two rows. If it says no filler words were found, type a short word that is said often (for example: so) into \"Also look for\" so that rows appear, and say so in the note.", "A window \"Remove filler words\" with: Fillers of (a language list), Select with Light, Normal and Strong (Light is selected), a line that explains the selected strength, a summary line, and a list. Each row has a tick box, the time, the filler in quotes, its length, a rating of the picture across the cut (smooth, slight or jumpy) and a play button that plays that spot for about three seconds. A word that is also a real word says so and is not ticked. Copy the summary line and any note under the list into the note (for example that word times are only estimated and nothing is ticked, or that FFmpeg's speech filter leaves \"um\" out).", ""], ["f-strength", "Light, Normal, Strong", "Click Light, then Normal, then Strong. For each, copy the summary line (\"... of ... selected \u00b7 saves ... \u00b7 ... per minute\") and the line about fillers left in because the picture would jump, if shown. End on Light.", "The number selected is smallest on Light and largest on Strong (or equal when few were found); the number found stays the same. Light shows at most about 4 cuts per minute. On Light and Normal, fillers rated jumpy are not ticked and a line says how many are left in because the picture would jump there; on Strong they are ticked. Changing the strength resets ticks changed by hand.", ""], ["f-apply", "Remove (Light) and check the result", "On Light, untick one row and tick it again, then click Remove. Note the times of three removed fillers first. Play across those three places.", "A message says \"Removed ... filler words. Undo brings them back.\" The timeline has that many more pieces and the video is shorter by the time the summary line gave. Ask the owner to watch and listen at the three places: the \"um\" is gone, the words next to it are whole, and the picture does not jump badly (a short dissolve is fine).", "watch,listen"], ["f-autocuts", "Automatic cuts: Put back one, Put back all, Undo", "Sound > Automatic cuts\u2026 (or Edit > Speech > Automatic cuts\u2026). Copy the summary line. Click Put back on the first row. Then click Put back all and close the window. Press Ctrl+Z once, then once more, and open Automatic cuts\u2026 again.", "The window \"Automatic cuts\" shows a line \"... cuts \u00b7 ... removed \u00b7 ... per minute\" and one row per cut: the word in quotes (or Silence), the file and time, the length, the rating, \"dissolve\" where one was added. Put back makes the row disappear, the count one lower, and that place in the video whole again. Put back all empties the list (\"Nothing was cut automatically in this project (or everything was put back).\"); the Automatic cuts\u2026 button and menu item are then greyed out or gone, which is correct. Each Ctrl+Z takes back one of these steps, so after two the cuts are back as after the first Put back.", ""]]], ["Export", [["exp-estimate", "Export: what it says before and after", "Open Export in \"Round 5 test\": Video, Full quality. Before clicking Export, copy the lines \"File size: about ...\" and \"Will use: ...\" (and an estimated time, if one is shown). Export as r5-full.mp4 and time it with the clock. Afterwards copy the result line and look up the real size of the file in Explorer.", "It finishes and says what was used (graphics card or processor) and \"Took ...\". Write down: estimated size, real size, time on the clock, time the app says, and the length of the video. The real size should be within about a third of the estimate, and the two times should agree.", ""], ["exp-watch", "The export matches the preview", "Play r5-full.mp4 in Media Player from start to end.", "Ask the owner to watch and listen: the captions from speech are there at the right moments, the filler cuts are where they were in the preview, music is lower under the voice, and picture and sound are in sync to the end.", "watch,listen"]]], ["Menus", [["menu-new", "The menus contain the new items", "With \"Round 5 test\" open and clip A selected, open Edit > Speech and Edit > Sound in the bar at the top of the window. Write down the items in order. Click Edit > Speech > Transcribe speech\u2026 and close it; click Edit > Sound > Add voice recording\u2026 and cancel.", "Edit > Speech has: Transcribe speech\u2026, Captions from speech\u2026, Remove filler words\u2026, Transcript, Automatic cuts\u2026. Edit > Sound has, besides the older items, Add voice recording\u2026 and Line up with the video. Transcribe speech\u2026 opens the same window as the button in Sound; Add voice recording\u2026 opens a file chooser and then the \"What is this sound?\" window.", ""], ["menu-grey", "Nothing about speech is greyed out or missing without a reason", "With a talking video in the project, look at: the Sound panel of clip A, the Transcript button in the top bar, and every item of Edit > Speech and the two voice items of Edit > Sound. Then select the music on its track and look at Edit > Sound again.", "Transcribe speech\u2026, Captions from speech\u2026, Remove filler words\u2026 and Transcript can be clicked. The only greyed items are those with a reason: Automatic cuts\u2026 while nothing is cut automatically, and Line up with the video while no sound is selected (it can be clicked once the music is selected; with the music selected the panel also offers \"This is a voice: line up with the video\"). The Sound panel always shows Transcribe speech\u2026 for a video clip with sound. Write down anything else that is greyed out or missing.", ""]]], ["Finish", [["t-remove", "Remove a language pack", "Ask the owner whether the pack downloaded in this round should stay. Only if the owner says remove it: open Transcribe speech\u2026 and click Remove on that row. Otherwise set Not tested with \"owner keeps the pack\".", "The row shows Download again and the line below shows less space used (or \"No packs on this computer yet.\"). The transcripts already made are still there: the Transcript column still shows the text.", ""]]]];const INSTR="You are testing ClipForge 1.11.0 (build 106), a video editor, on the owner's Windows PC. Problems are expected; your job is to find them and write them down precisely. This round checks only what is new in 1.10 and 1.11 on the computer: a voice recorded separately (the \"What is this sound?\" question, lining up, nudging, unlinking), speech to text (Transcribe speech\u2026, language packs), Captions from speech\u2026, the Transcript, Remove filler words\u2026 and Automatic cuts\u2026, project names, the export window and the menus, plus five steps that check the basics still work. Older features were tested in round 4.\n\nBEFORE YOU START\n- Fill in \"Device\" (for example \"Windows 11 laptop, RTX 4070\") and \"Tester\".\n- Fill in \"Version shown in the app\": in ClipForge open Help > About ClipForge, click Copy version info and paste the text. If it does not match the build named at the top of this page (a red warning appears), tell the owner and say so in the Summary.\n- Test files: ask the owner where they are. You need:\n  A. a talking video, 2-5 minutes, one person speaking with pauses and some \"um\" / \"uh\";\n  C. a music file (MP3 or M4A), at least 1 minute;\n  E. a second short video, 10-30 seconds, anything;\n  V + W. optional: a video and the voice recorded separately for it (a separate microphone, or a Zoom recording: one video and one sound file per speaker);\n  D. optional: a clip in which someone speaks Russian or Hebrew.\n  If something is missing, ask the owner. Do not download files from the internet.\n- Speech to text needs a speech program on the computer (FFmpeg 8 with its \"whisper\" filter, whisper.cpp, faster-whisper or OpenAI whisper) and usually a language pack. The step \"Transcribe speech\u2026\" shows what was found. Do not install programs yourself: tell the owner what the window says.\n- Language packs are downloads of about 140 MB (Small), 470 MB (Medium) and 1.6 GB (Large). Click Download only in the step that says so, and only for the pack the owner agreed to. NEVER download a Large pack without asking the owner first.\n- Most steps use the project \"Round 5 test\", made in the step \"Make the test project\". Do the steps in order: later steps build on earlier ones.\n\nRULES\n- Each step has \"Do\" (exact actions) and \"Expected\" (what should happen). Do the actions exactly, then compare with Expected.\n- For each step choose a Result and write a Note. Where a step says to copy a text or write down a number, put it in the note.\n- Result meanings: PASS = you saw exactly the expected result. FAIL = something was wrong (write what you did, what happened, and what you expected). Partial = part of it worked (say which part). Not tested = you could not do it (say why). Needs the owner = only a person can judge it and the owner was not available.\n- Steps tagged \"ask the owner to listen\" or \"ask the owner to watch\" depend on hearing, or on lip sync and movement that screenshots cannot show. Do the actions and check everything you can see. Then ask the owner in the chat, for example: \"Please play the preview from 0:05 and tell me whether the voice matches the lips.\" Write the owner's answer in the note starting with \"Owner:\", and set PASS or FAIL from it. If the owner is not available, set Needs the owner.\n- Buttons and menu items are written here as the app shows them. If a name on the screen is different, or an item is missing or greyed out when the step expects it to work, write down exactly what you see.\n- If a drag does not work for you, try twice. Then use the menu bar or panel buttons if the step offers them; otherwise set Needs the owner and write that you could not perform the drag (it may still work for a human).\n- Never delete, move or rename the owner's files or projects. Save every export into a new folder named clipforge-test-output next to the test videos, with the file name the step gives (for example r5-full.mp4).\n- If the app closes by itself or freezes, write down exactly what you were doing, fill in the Crash box, reopen it and continue.\n- Do not guess. Only mark PASS for what you actually saw, or for what the owner told you they heard or saw.\n- This page keeps your answers in this browser as you go. When finished, fill in the Summary box (most important problems first), then click \"Download filled checklist\" and give the downloaded file to the owner.";
const OPTS=["", "PASS", "FAIL", "Partial", "Not tested", "Needs the owner"];const TAGS={"listen": "ask the owner to listen", "watch": "ask the owner to watch"};const RESULT="Result";const NOTE="What happened? Copy texts and numbers the step asks for; Owner: for what the owner saw or heard";
let data=JSON.parse(document.getElementById('data').textContent);
try{const s=localStorage.getItem('clipforge-round5');if(s){const l=JSON.parse(s);if(l&&l.items)data=Object.assign(data,l);}}catch(e){}
document.getElementById('instr').textContent=INSTR;document.getElementById('build').textContent=data.build;
const root=document.getElementById('steps');
for(const [group,items] of STEPS){const h=document.createElement('h2');h.textContent=group;root.appendChild(h);
 for(const st of items){const five=st.length>4,id=st[0],title=st[1],act=five?st[2]:'',exp=five?st[3]:st[2],tag=st[st.length-1];const it=data.items[id]||(data.items[id]={status:"",note:""});
  const c=document.createElement('article');c.className='card step';c.dataset.s=it.status;
  const t=document.createElement('h3');t.textContent=title;for(const k of (tag?tag.split(','):[])){const g=document.createElement('span');g.className='tag';g.textContent=TAGS[k]||k+' only';t.appendChild(g);}
  const d=document.createElement('p');d.className='do';d.textContent='Do: '+act;
  const p=document.createElement('p');p.className='exp';p.textContent='Expected: '+exp;
  const row=document.createElement('div');row.className='row';const sel=document.createElement('select');sel.setAttribute('aria-label',RESULT+': '+title);
  for(const o of OPTS){const op=document.createElement('option');op.value=o;op.textContent=o||RESULT+'...';if(o===it.status)op.selected=true;sel.appendChild(op);}
  row.appendChild(sel);const ta=document.createElement('textarea');ta.setAttribute('aria-label','Note: '+title);ta.placeholder=NOTE;ta.value=it.note;
  sel.addEventListener('change',()=>{it.status=sel.value;c.dataset.s=sel.value;save();});ta.addEventListener('input',()=>{it.note=ta.value;save();});
  if(act)c.append(t,d,p,row,ta);else c.append(t,p,row,ta);root.appendChild(c);}}
for(const k of ['device','tester','version','summary','crash']){const e=document.getElementById(k);e.value=data[k]||'';e.addEventListener('input',()=>{data[k]=e.value;save();});}
function counts(){const n={};let total=0;for(const [,items] of STEPS)for(const [id] of items){total++;const s=data.items[id].status||'Not done yet';n[s]=(n[s]||0)+1;}
 const el=document.getElementById('counts');el.textContent='';for(const [k,v] of Object.entries(n)){const s=document.createElement('span');s.textContent=k+': '+v;el.appendChild(s);}const s=document.createElement('span');s.textContent='Total: '+total;el.appendChild(s);}
function vcheck(){const v=(data.version||'').trim();const w=document.getElementById('vwarn');
 const b=data.build||'';const m=b.match(/\d+\.\d+\.\d+ \(build \d+\)/)||b.match(/\d+\.\d+\.\d+/);const h=b.match(/\b([0-9a-f]{7,40})\s*$/);
 const bad=m&&!v.includes(m[0])?m[0]:(h&&!v.includes(h[1].slice(0,7))?h[1].slice(0,7):'');
 w.textContent=!v?'Please paste the version shown in the app (required).':(bad?'This is not the build named above ('+bad+'). Say so in the Summary.':'');}
function save(){counts();vcheck();try{localStorage.setItem('clipforge-round5',JSON.stringify(data));document.getElementById('saved').textContent='Saved in this browser.';}catch(e){}}
counts();vcheck();
document.getElementById('dl').addEventListener('click',()=>{
 if(!(data.version||'').trim()&&!confirm('"Version shown in the app" is empty. Download anyway?'))return;
 const clone=document.documentElement.cloneNode(true);clone.querySelector('#data').textContent=JSON.stringify(data).replace(/</g,'\\u003c');
 clone.querySelector('#steps').innerHTML='';
 const blob=new Blob(['<!doctype html>\n'+clone.outerHTML],{type:'text/html'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);
 const d=(data.device||'device').replace(/[^A-Za-z0-9]+/g,'-').slice(0,30);a.download='ClipForge-Test-Round-5-results-'+d+'.html';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1000);});
</script></body></html>
