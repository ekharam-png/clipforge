<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ClipForge Test Round 6</title>
<style>
:root{--bg:#f5f6fa;--card:#fff;--fg:#161a26;--muted:#5b6274;--line:#dfe2ec;--accent:#4257d6;--ok:#1f7a4d;--bad:#a8322b;--part:#9a5b00;--human:#6a3fb0}
@media (prefers-color-scheme:dark){:root{--bg:#0f1118;--card:#181b25;--fg:#eceef5;--muted:#9aa1b5;--line:#2a2f3f;--accent:#8c9bff;--ok:#6fd3a0;--bad:#ff9c94;--part:#f0b95a;--human:#c3a6ff;color-scheme:dark}}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}
.wrap{max-width:900px;margin:0 auto;padding:28px 16px 64px;display:flex;flex-direction:column;gap:20px}
h1{margin:0;font-size:1.8rem}h2{margin:8px 0 0;font-size:1.2rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:8px}
.instr{white-space:pre-wrap;font-size:.95rem}
.step{border-left:6px solid var(--line)}
.step[data-s="Works"]{border-left-color:var(--ok)}.step[data-s="Problem"]{border-left-color:var(--bad)}.step[data-s="Partial"]{border-left-color:var(--part)}.step[data-s="Needs a person"]{border-left-color:var(--human)}
.step[data-s="PASS"]{border-left-color:var(--ok)}.step[data-s="FAIL"]{border-left-color:var(--bad)}.step[data-s="Needs the owner"]{border-left-color:var(--human)}
.do{margin:0;font-size:.95rem}
.step h3{margin:0;font-size:1.02rem}.exp{color:var(--muted);font-size:.93rem;margin:0}
.tag{font-size:.75rem;font-weight:600;border:1px solid var(--line);border-radius:999px;padding:1px 8px;margin-left:6px;color:var(--muted)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
select,input,textarea,button{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px}
textarea{width:100%;box-sizing:border-box;min-height:64px}
button{cursor:pointer;background:var(--accent);color:#fff;border:0;font-weight:600;padding:10px 16px}
.counts{display:flex;gap:16px;flex-wrap:wrap;font-weight:600}
label{display:flex;flex-direction:column;gap:4px;font-size:.9rem;color:var(--muted)}
</style></head><body><div class="wrap">
<header class="card"><h1>ClipForge test round 6</h1>
<p class="exp">Build: <b id="build"></b>. Fill in each step, then click <b>Download filled checklist</b> at the bottom and send the file back to Claude.</p>
<div class="row"><label>Device<input id="device" placeholder="e.g. Windows 11 laptop, RTX 4070"></label><label>Tester<input id="tester" placeholder="e.g. ChatGPT agent, or your name"></label></div>
<label>Version shown in the app (required: About ClipForge &gt; Copy version info, then paste here)<textarea id="version" placeholder="ClipForge X.Y.Z (build N) · date, time UTC · commit" style="min-height:56px"></textarea></label>
<p class="exp" id="vwarn" style="color:var(--bad);margin:0"></p>
<div class="counts" id="counts"></div></header>
<section class="card"><h2>Instructions for the tester (person or AI agent)</h2><div class="instr" id="instr"></div></section>
<div id="steps" style="display:flex;flex-direction:column;gap:20px"></div>
<section class="card"><h2>Crash or freeze</h2><label>If the app closed by itself or froze: what were you doing?<textarea id="crash"></textarea></label></section>
<section class="card"><h2>Summary</h2><label>Most important problems first, plus anything confusing, slow or hard to find<textarea id="summary" style="min-height:120px"></textarea></label>
<div class="row"><button id="dl" type="button">Download filled checklist</button><span class="exp" id="saved"></span></div></section>
</div>
<script id="data" type="application/json">{"device": "", "tester": "", "build": "ClipForge 1.15.0 (build 130) \u00b7 20 Nov 2026, 04:21 UTC \u00b7 a977f31", "version": "", "summary": "", "crash": "", "items": {}}</script>
<script>
const STEPS=[["Start", [["st-version", "The app shows 1.15.0, build 130", "Start ClipForge from the Windows Start menu. Read the small grey line at the bottom of the project list. Open Help > About ClipForge, read it, click Copy version info and paste it into \"Version shown in the app\" at the top of this page. Close About.", "The grey line and About both show version 1.15.0 and build 130, the same as named at the top of this page. No red warning appears under the version box. The pasted text has the version line, the system and a line starting with \"Folder:\".", ""], ["st-updated", "The \"Updated to\" line and the \"What moved\" note", "Look at the top of the project list right after the first start of 1.15.0. If a line \"Updated to 1.15.0\" is there, click What's new, close Help again, then close the line with its cross. If a window \"Things are easier to find now\" opens, read it and click Show me Settings, then close Settings. (Both appear only once. If the owner has already closed them, set Not tested and write \"owner saw it: yes / no\" after asking the owner.)", "One quiet line \"Updated to 1.15.0\" with a What's new button and a cross; What's new opens Help on the page that starts with 1.15.0. The note \"Things are easier to find now\" says nothing was removed and every keyboard shortcut works as before, lists what has a new place (Settings, Adding things, Split / trim / freeze / crop, Everything about sound, Text window and speech, Zoom / snapping / sound waves / shape / video size, Check for updates automatically, Right-click on the timeline) and has the buttons What's new, Show me Settings and OK. After closing, neither comes back at the next start.", ""], ["st-install", "Installed by the installer: Start menu and folder", "Open the Windows Start menu and type ClipForge. Then look at the \"Folder:\" line in the text you pasted in the first step.", "The Start menu has ClipForge and \"ClipForge read me\". The folder ends in AppData\\Local\\Programs\\ClipForge (the installer's place), not in a downloads folder and not in a name ending in \".update-new\". ClipForge did not ask \"ClipForge is running from a download folder. Tidy up?\". If the folder is somewhere else, write the whole line down.", ""], ["st-projects", "Earlier projects are still there", "Read the project list. Open one project from an earlier round, play 5 seconds, and go back with File > Back to projects.", "Projects from earlier rounds are listed, the one you opened shows its clips with pictures and plays, and no clip says Missing.", ""]]], ["Menus by topic", [["mn-project", "Make the test project", "On the project list click New project. Add files A and B (see the instructions): Add > Videos or photos\u2026, or drag them from Explorer onto the window. Put the playhead at 0:00, choose Add > Music or sound\u2026, then My files > Choose a music file\u2026 and pick M; when it asks \"What is this sound?\", leave Music selected and click Add. Put the playhead at 0:03 and choose Add > Title, and type: Round 6. Choose File > Rename project\u2026 and call it \"Round 6 test\". If a thin line with a tip and a button appears under the top bar at any time, leave it alone for now.", "The editor shows A and B on the main track with clip pictures, the music on a Music track from 0:00 and the title on a title row. The window asking \"What is this sound?\" offers Voice for the video, Music and Sound effect, with Cancel and Add. The top bar shows Saved (or Saving\u2026 briefly).", ""], ["mn-file-edit-add", "File, Edit and Add menus", "In the bar at the top of the window there are nine menus: File, Edit, Add, Clip, Sound, Text and speech, View, Playback, Help. Open File, Edit and Add and compare every item and shortcut with Expected. Do not click Find in the text\u2026 yet.", "File: New project (Ctrl+N), Open project file\u2026 (Ctrl+O) | Rename project\u2026, Publishing notes\u2026, Back to projects | Export\u2026 (Ctrl+E), Export several\u2026, Export subtitles (.srt)\u2026 | Settings\u2026 (Ctrl+,) | Exit (Alt+F4). Edit: Undo (Ctrl+Z), Redo (Ctrl+Shift+Z), History (Ctrl+Shift+H) | Duplicate (Ctrl+D), Copy settings (Ctrl+Shift+C), Paste settings (Ctrl+Shift+V), Delete (Delete) | Find in the text\u2026 (Ctrl+F). Add: Videos or photos\u2026, Music or sound\u2026, Voice recording\u2026, Title, Caption\u2026, Subtitle file (.srt)\u2026, Overlay video or photo\u2026, Good moment marker (M). Nothing is missing and nothing extra is there (a greyed item may have a reason in brackets after its name). Write down every difference.", ""], ["mn-clip-sound-text", "Clip, Sound and Text and speech menus", "Open Clip, Sound and Text and speech and compare with Expected. Do not click Text window yet (it is tested later, and a suggestion depends on it not having been opened).", "Clip: Split (S), Start at playhead (I), End at playhead (O), Freeze frame, Remove silences\u2026, Crop and position\u2026, Rotate right, Move earlier, Move later | Make a short from here\u2026, Make shorts from markers\u2026, Good moments\u2026. Sound: Fit music to video, Line up voice with video, Separate sound\u2026, Put sound back, Add sound track, Lower music under speech, Copy music credits. Text and speech: Text window (Ctrl+Shift+T), Transcribe speech\u2026, Captions from speech\u2026, Remove filler words\u2026, Automatic cuts\u2026. Write down every difference.", ""], ["mn-view-playback-help", "View, Playback and Help menus", "Open View (and its Shape and Video size submenus), Playback and Help and compare with Expected. Click View > Zoom in and View > Zoom out once each, and Playback > Next frame once.", "View: Zoom in (+), Zoom out (-), Snap to playhead and edges (ticked), Show sound waves (ticked) | Shape > Original (as the first clip), 9:16 upright, 16:9 wide, 1:1 square, 4:5 upright | Video size > Same as the first clip, 720p, 1080p (Full HD), 4K; the current shape and size have a tick. Playback: Play/Pause (Space), Play backwards (J), Pause (K), Play forwards (L) | Go to start (Home), Go to end (End), Previous frame (Left), Next frame (Right) | Previous speech start (Ctrl+Left), Next speech start (Ctrl+Right). Help: ClipForge Help (F1), Keyboard shortcuts, Show the tour, What's new | Connect to Claude\u2026, Check for updates\u2026 | Copy version info, About ClipForge. The zoom items zoom the timeline; Next frame moves one frame. Write down every difference, also an item that is in the app but not in this list.", ""], ["mn-grey", "A greyed item says why (three spot checks)", "Click an empty place on the timeline so nothing is selected. Open Sound and read Fit music to video. Open Edit and read Paste settings and Delete. Open Clip and read Make shorts from markers\u2026. Then click the music on its track and open Sound again; then press Ctrl+Shift+C with the playhead on clip A and open Edit again. Finally go to the project list (File > Back to projects), open the Clip menu there, and open \"Round 6 test\" again.", "With nothing selected the items are grey, stay in their place and read: \"Fit music to video (select a music clip)\", \"Paste settings (copy settings first)\", \"Delete (select something first)\", \"Make shorts from markers\u2026 (no good moment markers yet)\". With the music selected Fit music to video can be clicked; after copying settings Paste settings can be clicked. On the project list the editor's items are grey without a reason. Write down the exact text of any greyed item that gives no reason while a project is open.", ""], ["mn-context", "Right-click menus on the timeline", "Right-click clip A; press Esc. Right-click the music; Esc. Right-click the title; Esc (do not choose Text window). Right-click an empty part of a track at about 0:10; Esc. Then right-click clip A again and choose Duplicate, and press Ctrl+Z.", "Each right-click selects that item and opens a small menu at the pointer. Clip: Split, Start at playhead, End at playhead | Duplicate, Copy settings, Paste settings | Freeze frame, Remove silences\u2026, Crop and position\u2026, Rotate right, Separate sound\u2026, Put sound back | Move earlier, Move later, Make a short from here\u2026 | Delete. Music: Fit music to video, Line up voice with video, Put sound back, Lower music under speech, Copy music credits | Delete. Title: Duplicate, Text window | Delete. Empty place (the playhead jumps there): Videos or photos\u2026, Music or sound\u2026, Voice recording\u2026, Title, Caption\u2026, Overlay video or photo\u2026, Good moment marker | Split, Make a short from here\u2026. Items that cannot be used are grey with the reason in brackets, for example \"Put sound back (select a separated sound)\". Duplicate from the menu adds one copy; undo removes it.", ""]]], ["Settings page", [["set-open", "Open Settings", "Choose File > Settings\u2026. Read the page from top to bottom and close it with the cross. Then press Ctrl+comma and close it again.", "A window \"Settings\" with the parts: Editing (Snap to playhead and edges, Show sound waves), Text window (Where it opens: At the right / Below), Export (Use graphics card (faster)), Suggestions (Show suggestions, and the button \"Show hidden suggestions again (none hidden)\"), Updates (Check for updates automatically, Check now, and the version line), Claude (a line about the helper for Claude, and Connect\u2026), About (About ClipForge, Copy version info, What's new, Licences). Every switch has one line of explanation. Ctrl+comma opens the same window.", ""], ["set-snap", "Snap to playhead and edges", "Put the playhead at 0:08 and slowly drag the end of the title towards it: note whether it jumps onto the playhead. Open Settings and switch Snap to playhead and edges OFF; close Settings. Open the View menu. Drag the title end past the playhead again. Leave the switch OFF for now.", "With the switch on, the edge jumps onto the playhead and a yellow line shows. With it off there is no jump and no yellow line, and View > Snap to playhead and edges has no tick: the menu and Settings are the same switch. (If you cannot drag, try twice, then check only the tick in the View menu and set Partial.)", ""], ["set-waves", "Show sound waves", "Look at the music on the timeline and at the bottom edge of clip A. Open Settings, switch Show sound waves OFF, close Settings and look again. Open the View menu. Leave it OFF for now.", "With the switch on, the music shows its sound waves (tall where it is loud) and clip A has a slim wave along its bottom; the first time, \"Drawing sound\u2026\" shows at the top right of the timeline for a moment. With it off the waves are gone at once and the blocks are plain, and View > Show sound waves has no tick.", ""], ["set-export-text", "Use graphics card (remembered), and where the Text window opens", "Open Settings. Switch Use graphics card (faster) OFF. Under Text window click Below. Close Settings. Press Ctrl+E, choose Custom under \"Where is it going?\", read the switch Use graphics card (faster) and the line \"Will use: \u2026\", and click Cancel. (Do not open the Text window yet.)", "In the Export window the switch Use graphics card (faster) is off, as set in Settings, and the line reads \"Will use: Processor (graphics card turned off)\". (The Text window position is checked in the group \"Text window\".)", ""], ["set-suggest", "Show suggestions on and off", "Look under the top bar of \"Round 6 test\": a thin line with a tip is probably there (for example about the music). Write its text down. Open Settings, switch Show suggestions OFF and close Settings. Look again. Leave it OFF for now. (If no line was there before, set Partial and say so.)", "With the switch off no suggestion line is shown anywhere, at once. Nothing else changes.", ""], ["set-restart", "Every switch survives a restart", "Open Settings and switch Check for updates automatically OFF. Close Settings and choose File > Exit. Start ClipForge again, open \"Round 6 test\" and open Settings. Read all the switches, and the View menu. Then put everything back: Snap to playhead and edges ON, Show sound waves ON, Use graphics card (faster) ON, Show suggestions ON, Check for updates automatically ON. Leave the Text window on Below.", "After the restart every switch is as you left it: snapping off, sound waves off, Below selected, graphics card off, suggestions off, automatic update check off; the View menu has no ticks on its two switches and the timeline has no waves. After switching them back on, the waves and the suggestion line return and the View menu shows both ticks.", ""]]], ["Suggestions", [["sg-small", "A small first clip: Use 1080p", "Go to the project list and click New project. Add only file S (the small clip). Rename the project \"Round 6 tips\". Wait a second without playing. Read the line under the top bar. Click Use 1080p. Open View > Video size.", "A thin line under the top bar says \"The first clip is small (width\u00d7height), and the video takes its size from it.\" with the button Use 1080p, then Don't show again and a cross. After Use 1080p the line goes away and View > Video size has its tick on 1080p (Full HD). (If S is 720p or bigger on its short side, no line appears: set Not tested and write the size of S.)", ""], ["sg-shape", "A wide clip in a 9:16 video: Fill, Blur, Crop\u2026", "In \"Round 6 tips\" add file A after S. Choose View > Shape > 9:16 upright. Wait a second. Read the line. Click Blur. Press Ctrl+Z, then Ctrl+Shift+Z.", "The line says \"A clip has another shape than the video, so it gets bars.\" with three buttons: Fill, Blur and Crop\u2026. Blur selects that clip (the first one that sits between bars) and its bars become a blurred copy of the picture; the line goes away. Undo and redo take the blur back and bring it again. If another line shows first, write its text down and close it with the cross.", ""], ["sg-music", "Music longer than the video: Fit to video; hidden while playing", "Put the playhead at 0:00 and add music M (Add > Music or sound\u2026, My files; choose Music when asked). Wait a second and read the line. Press Space, look at the place of the line while the video plays, and press Space again. Then click Fit to video.", "The line says \"The music is longer than the video.\" with Fit to video. While the video plays the line is not shown; it is back when playback stops. Fit to video selects the music and shortens it so that it ends with the video, and a message says \"The music now ends with the video, with a 2-second fade-out.\" The line is gone afterwards.", ""], ["sg-lower", "Music while someone talks: Lower the music", "Stay in \"Round 6 tips\" and wait until \"Drawing sound\u2026\" at the top right of the timeline is gone (up to a minute). Read the line. Click Lower the music. Open the Sound menu.", "The line says \"Music plays while someone is talking.\" with Lower the music. After the click the line goes away and Sound > Lower music under speech has a tick. (It needs Show sound waves to be on. If instead a line \"A long clip has pauses in the talking.\" or \"There is talking in this video and no captions yet.\" shows, write it down, close it with the cross and say so.)", ""], ["sg-text", "Captions, and Text never opened: Open Text", "Put the playhead at 0:02, choose Add > Caption\u2026, type: Sam Taylor: This is a test caption. and click Add. Wait a second. If a line about pauses or about captions from speech is shown, write it down and close it with the cross, then wait again. Read the line and click Open Text. Then close the Text window with its cross.", "The line says \"Text shows every caption in one place, to read, search and fix.\" with Open Text. The button opens the Text window with the caption in it. This suggestion is shown once ever: if the Text window was already opened on this computer with 1.15, it does not appear (set Not tested and say so).", ""], ["sg-never", "\"Don't show again\" sticks, and Settings brings it back", "Make a new project with file A only, rename it \"Round 6 tips 2\", and add music M at 0:00 as before. When \"The music is longer than the video.\" shows, click Don't show again. Go back to the project list and open \"Round 6 tips 2\" again. Open Settings and read the button under Show suggestions; click it; close Settings and wait a second.", "After Don't show again the line goes away and does not come back when the project is opened again (another suggestion may take its place). In Settings the button reads \"Show hidden suggestions again (1)\"; clicking it shows \"One suggestion can show again.\" and the button reads \"Show hidden suggestions again (none hidden)\". Back in the project the line about the music is shown again.", ""]]], ["Basics still work (6-step regression)", [["reg-split", "Split, delete, undo, redo", "Open \"Round 6 test\". Click clip B, put the playhead in its middle and press S. Click the second piece and press Delete. Press Ctrl+Z once, then Ctrl+Shift+Z, then Ctrl+Z.", "S cuts B into two pieces. Delete removes the selected piece. Undo brings it back, redo removes it again, the last undo brings it back: B ends in two pieces. Clicking a clip moves the preview to it.", ""], ["reg-history", "History", "Press Ctrl+Shift+H. Read the list. Click the oldest step, then the newest. Press Ctrl+Shift+H again.", "A History column opens with your changes by name, newest first (for example \"Split clip 2\"). Clicking an old step puts the project back to that point (later steps look grey); the newest restores everything. The same keys hide the column.", ""], ["reg-title", "A title: font, style, position, animation", "Click the title \"Round 6\" on the timeline. In the side panel click each Font, two different Styles, switch Outline on, click Position Top and then Lower third, and set Appear to Pop. Play from 0:02.", "Each font and style visibly changes the letters in the preview; Outline draws a line around them; Top and Lower third move the text. On play the title pops in at 0:03. Ask the owner to watch.", "watch"], ["reg-keys", "Keys: J K L, I and O", "Click an empty place on the timeline. Press L, wait 2 seconds, press K; press J, wait 2 seconds, press K. Select clip A, put the playhead about 2 seconds into it and press I; put it 2 seconds before the end of A and press O. Press Ctrl+Z twice.", "L plays, K pauses, J goes backwards in small steps. I makes A start at the playhead, O makes it end there; each is one History step (\"Start of clip 1 at playhead\", \"End of clip 1 at playhead\") and each undo restores one.", ""], ["reg-export", "Export the project", "Press Ctrl+E. Under \"Where is it going?\" choose Custom; Make: Video, Full quality. Copy the lines \"File size: about \u2026\" and \"Will use: \u2026\" into the note. Click Export and save as r6-full.mp4 in the clipforge-test-output folder. When it is done, play the file in Media Player.", "It finishes with \"Video saved\", says what was used (graphics card or processor) and \"Took \u2026\". Ask the owner to watch and listen to the file: cuts, title and music as in the preview, voice in sync. (The first export ever on this computer may also show one line that starts \"Your first export:\".)", "watch,listen"], ["reg-quit", "Quit while editing: everything is saved", "With \"Round 6 test\" open and nothing exporting, press Alt+F4. Start ClipForge again and open the project.", "It closes without asking. After reopening, the two pieces of B, the title with its look and the music are all there.", ""]]], ["Sound", [["snd-tracks", "Sound tracks and a track's menu", "In \"Round 6 test\" choose Sound > Add sound track. Click the new track's name on the left of the timeline and read its menu; change Volume, switch Mute on and off, then click Delete track. Then click the name of the Music track and read the same menu without changing anything.", "A new sound row appears and a message names it. The track menu has Name, Volume, Mute, Solo, Lower this track under speech, This track is speech, Move up, Move down and Delete track. Delete track removes the empty track. No more than three sound tracks can exist (with three, the Sound menu item reads \"Add sound track (there are already 3 tracks)\").", ""], ["snd-lower", "Lower music under speech: all, some, none agree in three places", "Put the playhead at 0:00 and add music M a second time (it lands on another sound track). Click an empty place so nothing is selected. Look at three places: (1) the side panel, \"All music in this project\" > Lower music under speech; (2) the Sound menu; (3) the menu of each of the two music tracks (click its name), Lower this track under speech. Now switch the side-panel switch ON and look at all three. Then switch Lower this track under speech OFF in ONE track's menu and look at all three. Then click Sound > Lower music under speech once and look again. Finally delete the second music.", "None: the side-panel switch is off, the Sound menu item has no tick, both track switches are off. All: the side-panel switch is on, the Sound menu item has a tick, both track switches are on. Some: the side panel says \"On for some tracks only (set in each track's menu). Turn this on to lower every music track.\", and the Sound menu item shows a dash instead of a tick and reads \"Lower music under speech \u2014 on for some tracks\". Clicking the menu item from \"some\" turns every music track on. The three places never disagree.", ""], ["snd-voice", "A voice recorded separately: \"What is this sound?\", lined up", "Needs files V and W (otherwise set Not tested for this and the next step). Make a new project with V, rename it \"Round 6 voice\". Choose Add > Voice recording\u2026 and pick W (with a Zoom recording: all voice files together). In the window, check what is selected, type the speaker's name in \"Who speaks (name of its track)\" (use Sam Taylor, and Alex K for a second file), leave \"Mute the camera's own sound\" on and click Add and line up. Play 15 seconds from two places.", "The window asks \"What is this sound?\" (\"What are these sounds?\" for several files) with Voice for the video selected, a name field per file, the switch Mute the camera's own sound, and the buttons Cancel and Add and line up. It shows \"Lining up the voice with the video\u2026\" and then \"Lined up with clip 1 (\u2026). It follows the picture when you cut. The camera's own sound is muted.\" (several files: \"\u2026 voices lined up with the video, each on its own track. They follow the picture when you cut.\"). Each voice is on its own track named after the speaker. Copy the message. Ask the owner to watch and listen: lips match the voice and no second, echoing voice is heard.", "watch,listen"], ["snd-who", "Who is speaking: colours and waves", "In \"Round 6 voice\" wait until \"Drawing sound\u2026\" is gone. Look at the voice rows, zoomed so that a minute fills the window. Click a video clip and look at its bottom edge. If a line \"With a voice track, the timeline shows who is speaking when.\" appears, click See who is speaking and close Help again.", "Every voice row has sound waves. The stretches where that person talks are bright in the speaker's colour and the pauses are dim; each speaker has a different colour and the microphone at the left of the row has it too. With two voices, a stretch where only one person talks is bright on that row only. A video clip whose own sound is muted has no wave along its bottom. See who is speaking opens the help article \"See who is speaking\". Ask the owner whether the bright stretches match who is talking in two places.", "watch,listen"], ["snd-speech-nav", "Previous and next speech start", "Open \"Round 6 test\" (or stay in \"Round 6 voice\") and wait until \"Drawing sound\u2026\" is gone. Click an empty place. Go to the start (Home). Click the double arrow to the right of Play three times, then the double arrow to the left once. Press Ctrl+Right twice and Ctrl+Left once. Choose Playback > Next speech start once. In \"Round 6 voice\" also click one voice and press Ctrl+Right twice.", "The double arrows have the tooltips \"Previous speech start (Ctrl+Left)\" and \"Next speech start (Ctrl+Right)\". Each press moves the playhead to the next (or previous) place where talking starts after a pause; the buttons, the keys and the menu items do the same. With a voice selected they follow that speaker only. Before the sound is drawn the menu items read \"Next speech start (no speech found yet)\". Ask the owner to press Play at two of the stops: someone starts talking right there.", "listen"]]], ["Text window", [["tx-open", "Captions as a page, by speaker", "In \"Round 6 test\" add four captions with Add > Caption\u2026 (move the playhead first, type the text, click Add): at 0:02 \"Sam Taylor: Welcome to the test.\"; at 0:06 \"This line has no name.\"; at 0:10 \"Alex K: Thanks, happy to be here.\"; at 0:14 \"Alex K: Let us test the search.\" Then press Ctrl+Shift+T (or click the Text button at the top right, or Text and speech > Text window).", "The Add caption window has the field \"What is being said\" and says where the caption appears. The Text window opens UNDER the preview (as set in Settings: Below). It is titled Text and shows the captions as a readable page: the lines of one speaker joined into a paragraph with the time at the side, the name \"Sam Taylor\" shown once above his lines (the caption without a name belongs to him), then \"Alex K\" once, each with a coloured bar. If the project also has a transcript or titles, a switch at the top chooses Captions / Transcript / Titles.", ""], ["tx-follow", "Follow playback, click to jump", "Go to the start and press Play; watch the Text window until 0:16, then pause. Click the sentence \"Thanks, happy to be here.\" in the Text window. Then click the first caption block on the timeline.", "While the video plays, the line being spoken is marked, one after the other, and kept in view (if you scroll the page by hand, following stops and a Now button brings it back; with four captions the page may be too short to scroll). Clicking a sentence moves the playhead to 0:10 and selects that caption on the timeline. Clicking a caption on the timeline marks it in the Text window.", ""], ["tx-search", "Search", "Press Ctrl+F. Type: test. Press Enter twice, then Shift+Enter once. Clear the box and type: xyzzy. Clear the box.", "Ctrl+F puts the cursor into \"Find in the text\u2026\". Every place with \"test\" is marked and counted (\"1 of 2\"); Enter goes to the next one, Shift+Enter to the previous one. For xyzzy it says \"Not found\".", ""], ["tx-edit", "Edit a caption, delete captions", "Double-click \"This line has no name.\" in the Text window, change it to \"This line was edited.\" and press Enter. Double-click it again, delete all its text and press Enter; then press Esc. Click the caption \"Let us test the search.\", then click Delete caption. Press Ctrl+Z. Click the first caption, Shift-click the second and click Delete captions. Press Ctrl+Z. Open History.", "Double-click opens the caption's text in a box with the hint \"Enter saves \u00b7 Shift+Enter: new line\"; Enter saves and the preview shows the new text. An empty text is refused with \"A caption cannot be empty. Use \"Delete caption\" to remove it.\" Delete caption removes one (\"Caption deleted.\"); with two selected the bar says \"2 captions\" and Delete captions removes both (\"2 captions deleted.\"). Each Ctrl+Z brings them back in one step. History shows \"Edited caption '\u2026'\" and \"Deleted 2 captions\".", ""], ["tx-cut", "Cut this part out of the video\u2026", "Note the length of the video. In the Text window click the caption \"Thanks, happy to be here.\" and click Cut this part out of the video\u2026. Read the question and click Cut it out. Note the new length. Do NOT undo (the step \"Automatic cuts\" below puts it back).", "A question \"Cut this part out of the video?\" says from when to when, how much \"of the picture and its sound will be removed\", shows the words, says that captions and titles on this part go with it, and offers Cancel and Cut it out. After Cut it out a message says \"Cut \u2026 out of the video.\" with Undo; the video is shorter by that much, clip A is in two pieces there, and that caption is gone from the page.", ""], ["tx-copy-dock", "Copy, save as text, dock right and below", "In the Text window click the three dots (\"Copy, save, place\"). Click Copy all text and paste it into the note. Open the three dots again: Copy with times and names, paste. Then Save as text file\u2026 and save it into clipforge-test-output. Then Show at the right; drag the left edge of the window a little; open the three dots and click Show under the preview. Open Settings and read \"Where it opens\".", "The menu has Copy all text, Copy with times and names, Save as text file\u2026, Export subtitles (.srt)\u2026, Show at the right, Show under the preview and a help line. The pasted text has every caption; with times and names it also has the times and \"Sam Taylor\" / \"Alex K\". A file \"Round 6 test.txt\" is saved (\"Text saved: \u2026\"). Show at the right makes the window a column at the right whose edge can be dragged; Show under the preview puts it below again. Settings shows the same choice each time (At the right / Below).", ""]]], ["Speech (Not tested: no speech engine is allowed)", [["sp-open", "Transcribe speech\u2026: the speech program, or a plain explanation", "In \"Round 6 test\" select clip A and choose Text and speech > Transcribe speech\u2026. Wait until \"Looking at what this computer has\u2026\" is gone. Read the window. Do not click Download.", "A window \"Transcribe speech\" with a Language list. EITHER a line \"Uses: \u2026\" names the speech program found (write it down) and a part \"Language pack\" lists Small, Medium and Large with their sizes and Download or Remove (\"Nothing is downloaded until you press Download.\"), OR a box says in plain words: \"Turning speech into text needs a speech program on this computer, and none was found.\", which programs ClipForge can use, and what to install on Windows (winget install ffmpeg). In the second case set this step to PASS if the text is clear, copy it into the note, close the window, and set the next three steps to Not tested with \"no speech engine\".", ""], ["sp-run", "Transcribe", "Only with a speech program. If no language pack is on the computer, ask the owner which one to download (suggest Small; NEVER Large) and click Download on that row only after the owner says yes. Choose the language of file A and click Transcribe. Wait until it is finished.", "A progress bar with a Stop button; the app stays usable. At the end a message says \"Speech transcribed: \u2026 words. Read it in the Text window.\" Write down the number of words and how long it took. The Text window now has a switch with Captions and Transcript.", ""], ["sp-captions", "Captions from speech\u2026", "Only with a transcript. Choose Text and speech > Captions from speech\u2026. Read the window, tick \"Replace the \u2026 captions that are already there\" if it is offered, and click Add captions. Play the first minute.", "The window \"Captions from speech\" says how many captions it adds, with Lines and \"Longest line: \u2026 letters\". After Add captions a message says \"Added \u2026 captions from the speech. Undo takes them away.\" and the captions are on the timeline and in the Text window. Ask the owner to watch: each caption appears when its words are spoken and fits inside the picture (wrong names or numbers are normal: write down two examples).", "watch,listen"], ["sp-fillers", "Remove filler words\u2026: the review list", "Only with a transcript. Choose Text and speech > Remove filler words\u2026. Wait until \"Checking the picture around each cut\u2026\" is gone. Click Light, Normal and Strong and copy the summary line of each. Press the play button of one row. Then click Cancel (nothing is removed in this round).", "A window \"Remove filler words\" with Fillers of (a language), Select: Light / Normal / Strong, a line that explains the strength, a summary line (\"\u2026 of \u2026 selected \u00b7 saves \u2026\") and a list with a tick box, the time, the filler in quotes and a play button (\"Play it as it would be after the cut\") per row; or the line \"No filler words were found in the transcript.\" Light selects the fewest, Strong the most. Cancel changes nothing.", ""], ["sp-autocuts", "Automatic cuts\u2026 \u2192 Put back", "Choose Text and speech > Automatic cuts\u2026 (this works without a speech engine too: the part cut out in the Text window is listed). Read the window. Click Put back on the row of that part. Close the window and look at the length of the video and at the Text window.", "The window \"Automatic cuts\" has a line with the number of cuts and the time removed, explains that it lists what Remove filler words, Remove silences and \"Cut this part out\" took out, and has one row per cut with Put back, plus Put back all and Close. After Put back the row is gone, the video has its old length and clip A is one piece again there; the caption that was on that part does NOT come back (only Undo returns captions). With nothing left the menu item reads \"Automatic cuts\u2026 (nothing was cut automatically)\". If the menu has no Automatic cuts\u2026 at all, write that down.", ""]]], ["Shorts and markers", [["sh-marker", "M drops a good-moment marker", "In \"Round 6 test\" play from the start and press M at about 0:25, and again at about 0:50 (if the video is shorter, use one third and two thirds). Pause. Put the playhead exactly on the first flag (click the flag) and press M again. Right-click the second flag and press Esc.", "Each M drops a small flag on the time ruler, also while playing, with the message \"Marked a good moment at \u2026\" and Undo. Clicking a flag moves the playhead there. M on a place that has one says \"There is already a marker here.\" The right-click menu of a flag has Make a short from here\u2026, Make shorts from markers\u2026, Good moments\u2026 and Remove this marker.", ""], ["sh-moments", "Good moments list", "Choose Clip > Good moments\u2026. Read the list. Close it. Click an empty place on the timeline and look at the bottom of the side panel (\"Shorts and publishing\").", "A window \"Good moments\" lists both markers with their times (and what is said there when there are captions), each with \"Make a short around it\" and \"Remove the marker\", and the buttons Make shorts from markers\u2026 and Close. The side panel, with nothing selected, has Good moment marker (M), Good moments (2)\u2026, Make a short from here\u2026, Make shorts from markers\u2026 and Publishing notes\u2026.", ""], ["sh-from-markers", "Make shorts from markers\u2026", "Choose Clip > Make shorts from markers\u2026. Read the question, leave Short caption look ticked and click Make them. When it is done click OK. Go to the project list, read the new names, and open \"Round 6 test\" again.", "The question \"Make 2 shorts from the markers?\" explains: one new upright project around each marker, about 20 seconds before it to 25 seconds after, starting and ending at a pause; it lists the two parts with their times and lengths. Afterwards \"2 shorts are ready\" lists the new projects by name and length, says this video was not changed, and has an OK button. The project list has two new projects; \"Round 6 test\" is unchanged.", ""], ["sh-here", "Make a short from here\u2026", "Put the playhead at 0:05 and choose Clip > Make a short from here\u2026. Click 30 s, 45 s, 60 s and back to 30 s, reading the line with the times each time. Leave \"Start and end at a pause\" and \"Short caption look\" ticked, tick \"Title at the top\" and type: Watch this. Name the project \"Round 6 short\" and click Make the short. Click Open it. Play it. Then go back to the project list.", "A window \"Make a short\" with the chips 30 s, 45 s and 60 s, a line \"From \u2026 to \u2026 \u00b7 \u2026\", the note that it is a new upright (9:16) project and this video is not changed, the three tick boxes and \"Name of the new project\". After Make the short: \"The short is ready\" with Stay here and Open it. The short is upright, about 30 seconds long, starts near 0:05 of the long video, has \"Watch this\" at the top for its whole length, and its captions are in the Short caption look: bigger, in the lower middle, outlined, one or two lines. Ask the owner to watch it once.", "watch"], ["sh-text", "A short from selected text", "Open \"Round 6 test\" and the Text window. Click the first caption, then Shift-click a later one (with only typed captions: the last one). Click Make a short from this\u2026. Read the window, name it \"Round 6 text short\" and click Make the short, then Stay here.", "The bar above the page says how many captions are selected and from when to when. The window \"Make a short\" has the chip \"The selection\" selected (next to 30 s, 45 s, 60 s) and shows the selection's times and length; over 60 seconds it warns that Shorts, Reels and TikTok have their own limits. The new project is in the project list afterwards and \"Round 6 test\" is unchanged.", ""]]], ["Publishing", [["pb-notes", "Publishing notes with Copy buttons and chapters", "In \"Round 6 test\" choose File > Publishing notes\u2026. Type a Title (Round 6 test video), a Description (two sentences) and Hashtags (clipforge test). Click the copy button next to Title and paste into the note. Click Chapters from titles / captions\u2026 and read what it says. Tick \"A different title for Shorts, Reels and TikTok\" and type a Short title. Click Copy title and description, paste into the note, and click Done. Open History.", "A window \"Publishing notes\" says ClipForge does not post anything itself, with the fields Title, Description, Hashtags and Chapters, each with its own copy button (\"Copy title\" \u2026). Chapters from titles / captions\u2026 either fills the Chapters field with lines like \"0:00 \u2026\" and says where they came from (\"\u2026 chapters from the captions, named by the first words said. Give them better names.\"), or says plainly why not (\"This video is too short for chapters (each is at least 10 seconds).\" or \"Nothing to make chapters from yet: \u2026\"). Copy title and description copies title, description and hashtags in one go. History shows steps such as \"Publishing title\" and \"Hashtags\".", ""], ["pb-dest", "Where is it going? Destinations and warnings", "Press Ctrl+E. Under \"Where is it going?\" click each choice in turn and read the line under the choices and any warning: YouTube, Shorts / Reels / TikTok, Instagram post, WhatsApp / Telegram, Podcast audio, Custom. Stay in the window for the next step.", "Six choices. YouTube: \"Wide 16:9, 1080p, full quality.\" Shorts / Reels / TikTok: \"Upright 9:16, 1080p. \u2026\"; because the test video is longer than 60 seconds a warning says how long it is, that the sites have their own longest length, that 60 seconds is safe, and \"Check the site.\" Instagram post: a choice Tall 4:5 / Square 1:1, and the same kind of warning. WhatsApp / Telegram: \"A small file (720p) that is quick to send.\", with a warning about 16 MB when the file would be bigger. Podcast audio: a choice MP3 / M4A and no picture settings. Custom: the controls from before (Make, Video size, Full quality / Small file, Frames per second, Use graphics card). The window also shows the publishing notes' title and a Publishing notes\u2026 button.", ""], ["pb-shape", "\"Make a copy in this shape\" or \"Export as it is\"", "In the Export window choose Shorts / Reels / TikTok (the project is wide). Read the question. Click Export as it is and read the size shown; then click Make a copy in this shape and read the size again. Click Export and save as r6-short.mp4 in clipforge-test-output. Read the finished screen. Afterwards check the file: right-click > Properties > Details > Frame width / Frame height. Go to the project list and look for the copy, then open \"Round 6 test\" again and look at its shape.", "It says \"Your video is 1920 \u00d7 1080; this needs 9:16.\" (the size of your own video; \"16:9\" if the project's shape was set to 16:9 wide) and offers Make a copy in this shape (a new project with a blurred background; this project stays as it is) and Export as it is (\"Keep the shape the video has now.\"). With Export as it is the size shown is wide (1920 \u00d7 1080); with the copy it is 1080 \u00d7 1920. The exported file is 1080 wide and 1920 high. The finished screen says the copy \"Round 6 test - 9x16\" is in your project list; it is there, and \"Round 6 test\" itself is still wide.", ""], ["pb-several", "Export several\u2026 into one folder", "Choose File > Export several\u2026. Tick YouTube, Shorts / Reels / TikTok and Podcast audio; leave the others and \"Keep the shape copies as projects\" unticked. Read the file name under each tick and the lines below. Click Export 3 files and choose a new folder clipforge-test-output\\kit. Watch the progress. When it is done open the folder in Explorer, check the size of each video (Properties > Details) and open the text file.", "Each tick shows its file name. A line explains that for 9:16 a copy of the video in that shape is made for the export, with a blurred background, and that the project stays as it is; another says \"3 files, about \u2026 together. You choose the folder next.\" One progress bar with \"1 of 3: \u2026\", \"2 of 3: \u2026\" and one Cancel export; it ends with \"Files saved\". The folder holds \"Round 6 test - YouTube.mp4\" (1920 x 1080), \"Round 6 test - Short 9x16.mp4\" (1080 x 1920), \"Round 6 test - audio.mp3\" and \"Round 6 test - text.txt\". The text file has the title, description, hashtags and chapters from the notes and a part for each file saying what to paste there. No shape copy was added to the project list this time.", ""], ["pb-finish", "The finished screen: Show in folder, Copy, Open upload page", "On the finished screen of the last export click Show in folder. Click Copy title and description and paste into the note. Click Open YouTube upload page, look at the browser, and close the tab WITHOUT signing in or uploading anything. Then click Done.", "Show in folder opens Explorer on the kit folder (after a single export: with the file selected). The pasted text is the title, description and hashtags from the notes. The link line says ClipForge does not sign in or post; the button opens youtube.com's upload page in the owner's own browser (it may ask to sign in: do not). ClipForge itself uploaded nothing.", ""], ["pb-listen", "The kit files look and sound right", "Play \"Round 6 test - Short 9x16.mp4\" and \"Round 6 test - audio.mp3\" from the kit folder for 30 seconds each.", "Ask the owner to watch and listen: the short is upright with the wide picture in the middle and a blurred copy of it above and below, captions and title readable, voice in sync; the MP3 has the same sound as the video, with the music lower while someone talks if Lower music under speech is on.", "watch,listen"]]], ["Connect to Claude page", [["cl-page", "Status lights and Details", "Choose Help > Connect to Claude\u2026. Read the page from top to bottom. Open every \"Details\" line you see. Do NOT click Connect or Disconnect.", "A page \"Connect to Claude\". First a card \"The Claude helper is installed\" with \"Version 1.15.0 (build 130). ClipForge refreshes it every time the app starts.\", the helper's folder (it ends in ClipForge\\claude, under the user's app data, not next to clipforge.exe) and a line that is either \"Not in use right now (that is normal: Claude starts it when needed).\" or \"In use by \u2026 now \u00b7 last action \u2026\". Then a card \"Claude Desktop (the Claude app)\" and a card \"Claude Code (in a terminal)\", each with a round light and one status line: \"Connected (ClipForge 1.15.0)\" (green), \"Connected to an old copy at \u2026\" (amber), \"Not connected\", \"Claude Desktop not found\" / \"Claude Code not found\" (grey), and one button, Connect or Disconnect. Details shows exactly what was asked and answered. Copy both status lines into the note.", ""], ["cl-test", "The Test button", "On the same page click Test and wait. Open the Details under the result. Click Check again.", "The button reads \"Testing\u2026\" for up to a minute, then a green line \"PASS: the helper works by itself (ClipForge 1.15.0).\" with Details that hold the self-test table. A red line starting with \"FAIL:\" is a FAIL for this step: copy the line and the Details. Check again reads the status lights afresh.", ""], ["cl-connect", "Connect (only if the owner agrees)", "Ask the owner: \"May I press Connect for Claude Desktop and for Claude Code on the Connect to Claude page?\" Only for a row the owner says yes to AND that does not already say Connected: click Connect. If a question \"Replace the old connection?\" appears, read it to the owner and click what the owner says. Also click Copy under \"Or paste this one line into a terminal yourself:\" and paste the line into the note. NEVER click Disconnect. If the owner says no, or both rows are already connected, set Not tested and say which.", "After Connect the row's light is green and it says \"Connected (ClipForge 1.15.0)\"; the button of that row now reads Disconnect. The card \"After connecting: close and reopen Claude once\" explains that Claude reads its list of tools when it starts and that ClipForge does not have to be running. The copied line starts with \"claude mcp add\" and ends with the helper's path in the ClipForge\\claude folder.", ""]]], ["Updates", [["up-check", "Check now says this is the newest version", "Go to the project list. Choose Help > Check for updates\u2026. Then open Settings and click Check now. Do NOT click Update if a newer version is offered: tell the owner instead.", "Both answer with the same plain message at the bottom of the window: \"You have the newest version (1.15.0 (build 130)).\" If instead it says a version is available (\"Version \u2026 is available: see the top of the project list.\"), write the version down and set Partial: the check works, but 1.15.0 is no longer the newest. Without internet it says so in plain words.", ""], ["up-log", "Copy version info: the folder and the update log", "Choose Help > Copy version info and paste the text into the note.", "A message \"Version info copied. Paste it into your message.\" The text has the version line (1.15.0, build 130), the system, the screen, \"Folder: \u2026\" with the install folder, and, when an in-app update was ever tried on this computer, \"Update log: \u2026\" with the full path of update-log.txt (in a folder called update-state) and \"Its last \u2026 lines:\" followed by up to 40 lines of that log. If there is no \"Update log:\" part, write that down (it is correct on a computer where no in-app update ever ran).", ""]]], ["Help", [["hp-search", "Help search", "Press F1. Search for each of: settings, suggestion, menu, short, chapters, who is speaking. Then search with a typo: sugestion.", "Each search shows the fitting article first or near the top: \"Settings\", \"Suggestions\", \"Menus: where everything is\", \"Make a short\", \"Publishing notes: title, description, hashtags, chapters\", \"See who is speaking\". The typo still finds \"Suggestions\".", ""], ["hp-articles", "The Settings, Suggestions and Menus articles", "Open the articles \"Settings\", \"Suggestions\" and \"Menus: where everything is\" and read each once. Compare two facts of each with the app (for example: the parts of the Settings page; what the cross on a suggestion does; the items of the Sound menu).", "Each article opens and its text fits the app you just tested: Settings names the same parts (Editing, Text window, Export, Suggestions, Updates, Claude, About); Suggestions says the cross closes the line for this project, Don't show again turns one off, and lists the same suggestions; Menus lists the same nine menus with the same items and explains \"Greyed-out items say why\" and \"Right-click on the timeline\". Write down any sentence that does not match what you saw (a mention of \"Send feedback\" belongs to the next version and is not a problem of this test).", ""]]]];const INSTR="You are testing ClipForge 1.15.0 (build 130), a video editor, on the owner's Windows PC. It was installed with the Windows installer (ClipForge-Setup.exe). Problems are expected; your job is to find them and write them down precisely. This round goes through all the main features in one sitting: the menus sorted by topic, the Settings page, suggestions, sound tracks and voices, the Text window, speech (only if a speech program is on the computer), shorts and markers, publishing (destinations, Export several, Publishing notes), the Connect to Claude page, updates and Help, plus six steps that check the basics. The Android phone has its own page (Round 6 phone). \"Send feedback\" is not part of this round.\n\nBEFORE YOU START\n- Fill in \"Device\" (for example \"Windows 11 laptop, RTX 4070\") and \"Tester\".\n- Fill in \"Version shown in the app\": in ClipForge open Help > About ClipForge, click Copy version info and paste the text. If it does not match the build named at the top of this page (a red warning appears), tell the owner and say so in the Summary.\n- Test files: ask the owner where they are (for example C:\\Users\\<you>\\Videos\\clipforge-test). You need:\n  A. a talking video, 1-3 minutes, filmed wide (landscape), one or two people speaking with some pauses;\n  B. a second short video, 10-30 seconds, anything;\n  M. a music file (MP3 or M4A) that is LONGER than video A;\n  S. a small clip from a phone or a chat app (smaller than 720p, for example 640 x 360 or 480 x 848);\n  V + W. optional: a video and the voice recorded separately for it (a separate microphone, or a Zoom recording: one video and one sound file per speaker);\n  R. optional: a clip in which someone speaks Russian or Hebrew (only used if you have time left: add it to a new project and check that Text and captions show the letters properly).\n  If something is missing, ask the owner. Do not download files from the internet.\n- Do the groups in order: later steps build on the projects made earlier (\"Round 6 test\", \"Round 6 tips\", \"Round 6 voice\"). Do NOT open the Text window before the group \"Suggestions\" is finished: one suggestion only appears while Text was never opened.\n- A thin line with a tip and a button may appear under the top bar at any time. That is a suggestion. Outside the group \"Suggestions\" leave it alone (do not click its button, its cross or Don't show again) unless a step says so.\n\nRULES\n- Each step has \"Do\" (exact actions) and \"Expected\" (what should happen). Do the actions exactly, then compare with Expected.\n- For each step choose a Result and write a Note. Where a step says to copy a text or write down a number, put it in the note.\n- Result meanings: PASS = you saw exactly the expected result. FAIL = something was wrong (write what you did, what happened, and what you expected). Partial = part of it worked (say which part). Not tested = you could not do it (say why, for example \"no speech engine\" or \"no file V\"). Needs the owner = only a person can judge it and the owner was not available.\n- Steps tagged \"ask the owner to listen\" or \"ask the owner to watch\" depend on hearing, or on lip sync and movement that screenshots cannot show. Do the actions and check everything you can see. Then ask the owner in the chat, for example: \"Please play the preview from 0:05 and tell me whether the voice matches the lips.\" Write the owner's answer in the note starting with \"Owner:\", and set PASS or FAIL from it. If the owner is not available, set Needs the owner.\n- Buttons and menu items are written here as the app shows them; \" | \" in a list of menu items stands for a dividing line. If a name on the screen is different, or an item is missing or greyed out when the step expects it to work, write down exactly what you see.\n- If a drag does not work for you, try twice. Then use the menu bar or panel buttons if the step offers them; otherwise set Needs the owner and write that you could not perform the drag (it may still work for a human).\n- NEVER delete, move or rename the owner's files or the owner's own projects. Inside ClipForge only delete things this test made. Save every export into a folder named clipforge-test-output next to the test videos, with the file name the step gives (for example r6-full.mp4).\n- Do NOT press Connect or Disconnect (Connect to Claude page) or Update (if a newer version is offered) without asking the owner first. Never press Disconnect in this round.\n- Speech to text needs a speech program on the computer and usually a language pack (Small about 140 MB, Medium about 470 MB, Large about 1.6 GB). Do not install programs. Click Download only for the pack the owner agreed to, and NEVER download a Large pack.\n- If the app closes by itself or freezes, write down exactly what you were doing, fill in the Crash box, reopen it and continue.\n- Do not guess. Only mark PASS for what you actually saw, or for what the owner told you they heard or saw.\n- This page keeps your answers in this browser as you go. When finished, fill in the Summary box (most important problems first), then click \"Download filled checklist\" and give the downloaded file to the owner.";
const OPTS=["", "PASS", "FAIL", "Partial", "Not tested", "Needs the owner"];const TAGS={"listen": "ask the owner to listen", "watch": "ask the owner to watch"};const RESULT="Result";const NOTE="What happened? Copy texts and numbers the step asks for; Owner: for what the owner saw or heard";

document.getElementById('instr').textContent=INSTR;document.getElementById('build').textContent=data.build;
const root=document.getElementById('steps');
for(const [group,items] of STEPS){const h=document.createElement('h2');h.textContent=group;root.appendChild(h);
 for(const st of items){const five=st.length>4,id=st[0],title=st[1],act=five?st[2]:'',exp=five?st[3]:st[2],tag=st[st.length-1];const it=data.items[id]||(data.items[id]={status:"",note:""});
  const c=document.createElement('article');c.className='card step';c.dataset.s=it.status;
  const t=document.createElement('h3');t.textContent=title;for(const k of (tag?tag.split(','):[])){const g=document.createElement('span');g.className='tag';g.textContent=TAGS[k]||k+' only';t.appendChild(g);}
  const d=document.createElement('p');d.className='do';d.textContent='Do: '+act;
  const p=document.createElement('p');p.className='exp';p.textContent='Expected: '+exp;
  const row=document.createElement('div');row.className='row';const sel=document.createElement('select');sel.setAttribute('aria-label',RESULT+': '+title);
  for(const o of OPTS){const op=document.createElement('option');op.value=o;op.textContent=o||RESULT+'...';if(o===it.status)op.selected=true;sel.appendChild(op);}
  row.appendChild(sel);const ta=document.createElement('textarea');ta.setAttribute('aria-label','Note: '+title);ta.placeholder=NOTE;ta.value=it.note;
  sel.addEventListener('change',()=>{it.status=sel.value;c.dataset.s=sel.value;save();});ta.addEventListener('input',()=>{it.note=ta.value;save();});
  if(act)c.append(t,d,p,row,ta);else c.append(t,p,row,ta);root.appendChild(c);}}
for(const k of ['device','tester','version','summary','crash']){const e=document.getElementById(k);e.value=data[k]||'';e.addEventListener('input',()=>{data[k]=e.value;save();});}
function counts(){const n={};let total=0;for(const [,items] of STEPS)for(const [id] of items){total++;const s=data.items[id].status||'Not done yet';n[s]=(n[s]||0)+1;}
 const el=document.getElementById('counts');el.textContent='';for(const [k,v] of Object.entries(n)){const s=document.createElement('span');s.textContent=k+': '+v;el.appendChild(s);}const s=document.createElement('span');s.textContent='Total: '+total;el.appendChild(s);}
function vcheck(){const v=(data.version||'').trim();const w=document.getElementById('vwarn');
 const b=data.build||'';const m=b.match(/\d+\.\d+\.\d+ \(build \d+\)/)||b.match(/\d+\.\d+\.\d+/);const h=b.match(/\b([0-9a-f]{7,40})\s*$/);
 const bad=m&&!v.includes(m[0])?m[0]:(h&&!v.includes(h[1].slice(0,7))?h[1].slice(0,7):'');
 w.textContent=!v?'Please paste the version shown in the app (required).':(bad?'This is not the build named above ('+bad+'). Say so in the Summary.':'');}
function save(){counts();vcheck();try{localStorage.setItem('clipforge-round6',JSON.stringify(data));document.getElementById('saved').textContent='Saved in this browser.';}catch(e){}}
counts();vcheck();
document.getElementById('dl').addEventListener('click',()=>{
 if(!(data.version||'').trim()&&!confirm('"Version shown in the app" is empty. Download anyway?'))return;
 const clone=document.documentElement.cloneNode(true);clone.querySelector('#data').textContent=JSON.stringify(data).replace(/</g,'\\u003c');
 clone.querySelector('#steps').innerHTML='';
 const blob=new Blob(['<!doctype html>\n'+clone.outerHTML],{type:'text/html'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);
 const d=(data.device||'device').replace(/[^A-Za-z0-9]+/g,'-').slice(0,30);a.download='ClipForge-Test-Round-6-results-'+d+'.html';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1000);});
</script></body></html>
