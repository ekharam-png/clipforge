<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ClipForge Test Round 4</title>
<style>
:root{--bg:#f5f6fa;--card:#fff;--fg:#161a26;--muted:#5b6274;--line:#dfe2ec;--accent:#4257d6;--ok:#1f7a4d;--bad:#a8322b;--part:#9a5b00;--human:#6a3fb0}
@media (prefers-color-scheme:dark){:root{--bg:#0f1118;--card:#181b25;--fg:#eceef5;--muted:#9aa1b5;--line:#2a2f3f;--accent:#8c9bff;--ok:#6fd3a0;--bad:#ff9c94;--part:#f0b95a;--human:#c3a6ff;color-scheme:dark}}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}
.wrap{max-width:900px;margin:0 auto;padding:28px 16px 64px;display:flex;flex-direction:column;gap:20px}
h1{margin:0;font-size:1.8rem}h2{margin:8px 0 0;font-size:1.2rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:8px}
.instr{white-space:pre-wrap;font-size:.95rem}
.step{border-left:6px solid var(--line)}
.step[data-s="Works"]{border-left-color:var(--ok)}.step[data-s="Problem"]{border-left-color:var(--bad)}.step[data-s="Partial"]{border-left-color:var(--part)}.step[data-s="Needs a person"]{border-left-color:var(--human)}
.step[data-s="PASS"]{border-left-color:var(--ok)}.step[data-s="FAIL"]{border-left-color:var(--bad)}.step[data-s="Needs the owner"]{border-left-color:var(--human)}
.do{margin:0;font-size:.95rem}
.step h3{margin:0;font-size:1.02rem}.exp{color:var(--muted);font-size:.93rem;margin:0}
.tag{font-size:.75rem;font-weight:600;border:1px solid var(--line);border-radius:999px;padding:1px 8px;margin-left:6px;color:var(--muted)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
select,input,textarea,button{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px}
textarea{width:100%;box-sizing:border-box;min-height:64px}
button{cursor:pointer;background:var(--accent);color:#fff;border:0;font-weight:600;padding:10px 16px}
.counts{display:flex;gap:16px;flex-wrap:wrap;font-weight:600}
label{display:flex;flex-direction:column;gap:4px;font-size:.9rem;color:var(--muted)}
</style></head><body><div class="wrap">
<header class="card"><h1>ClipForge test round 4</h1>
<p class="exp">Build: <b id="build"></b>. Fill in each step, then click <b>Download filled checklist</b> at the bottom and send the file back to Claude.</p>
<div class="row"><label>Device<input id="device" placeholder="e.g. MacBook Air M5, macOS 26.6 / Windows 11 laptop"></label><label>Tester<input id="tester" placeholder="e.g. ChatGPT agent, or your name"></label></div>
<label>Version shown in the app (required: About ClipForge &gt; Copy version info, then paste here)<textarea id="version" placeholder="ClipForge X.Y.Z (build N) · date, time UTC · commit" style="min-height:56px"></textarea></label>
<p class="exp" id="vwarn" style="color:var(--bad);margin:0"></p>
<div class="counts" id="counts"></div></header>
<section class="card"><h2>Instructions for the tester (person or AI agent)</h2><div class="instr" id="instr"></div></section>
<div id="steps" style="display:flex;flex-direction:column;gap:20px"></div>
<section class="card"><h2>Crash or freeze</h2><label>If the app closed by itself or froze: what were you doing? (paste a crash report if macOS shows one)<textarea id="crash"></textarea></label></section>
<section class="card"><h2>Summary</h2><label>Most important problems first, plus anything confusing, slow or hard to find<textarea id="summary" style="min-height:120px"></textarea></label>
<div class="row"><button id="dl" type="button">Download filled checklist</button><span class="exp" id="saved"></span></div></section>
</div>
<script id="data" type="application/json">{"device": "", "tester": "", "build": "ClipForge 1.9.0 (build 34) \u00b7 17 Nov 2026, 13:07 UTC \u00b7 1355148", "version": "", "summary": "", "crash": "", "items": {}}</script>
<script>
const STEPS=[["Start and help", [["start-open", "Install 1.9.0 and open ClipForge", "Mac: replace ClipForge in Applications with the new app and open it (if macOS blocks it: System Settings > Privacy & Security > Open Anyway). Windows: unzip the new download into a new folder and run clipforge.exe.", "The project list opens. Projects from earlier rounds are still listed and one of them opens without an error.", ""], ["start-version", "The app shows the expected version", "Read the small grey line at the bottom of the project list. Open About ClipForge (Mac: ClipForge menu; Windows: Help menu), click Copy version info and paste it into \"Version shown in the app\" at the top of this page.", "Both show version 1.9.0 and the same build as named at the top of this page. No red warning appears under the version box.", ""], ["help-new", "Help finds the new topics", "Open Help (the ? button at the top; F1 on Windows; Cmd+? on a Mac). Search for each of: overlay, snap, mp3, hebrew, fade. Close Help, then choose Help > Keyboard shortcuts in the menu bar.", "Each search shows the new article first: \"Overlay: picture-in-picture, side by side, cut-aways\", \"Snapping on the timeline\", \"Sound only and frames per second\", \"Text styles and animations\", \"Fade in from black, fade out to black\". Keyboard shortcuts opens a list that includes J / K / L, I / O and Ctrl+D.", ""]]], ["Basics still work (short regression)", [["reg-project", "Make the test project", "On the project list, drag files A, B and D (see the instructions) from Finder/Explorer onto the list, or make a new project and add them. Rename the project to \"Round 4 test\".", "The editor opens with three items on the main track in the order A, B, D, each with clip pictures. The top bar shows Saved (or Saving... briefly).", ""], ["reg-split", "Split, delete, undo", "Click clip A, put the playhead in its middle and press S. Click the second piece and press Delete. Press Ctrl/Cmd+Z once.", "S cuts A into two pieces. Delete removes the selected piece. One undo brings it back, so A is in two pieces again. Clicking a clip moves the preview to it.", ""], ["reg-clean", "Clean up sound still works", "Select the first piece of A, open Sound and switch on Clean up sound. Wait until it finishes. Play it and switch Hear original on and off while it plays.", "The clip shows Sound xx% and then finishes. Ask the owner to listen: background hiss or rumble is lower with Hear original off, and the voice stays in sync with the lips.", "listen"], ["reg-quit", "Quit while editing, and during an export", "With the project open and nothing exporting, quit (Cmd+Q on a Mac, Alt+F4 on Windows). Reopen ClipForge and the project. Then click Export > Full quality, and while it runs try to quit again; choose to keep working and let the export finish (save it as r4-quick.mp4).", "The first quit closes without asking, and after reopening the split is still there. During the export, quitting asks whether to cancel the export or keep working; keep working lets the export finish.", ""]]], ["Sound tracks", [["tr-add", "Add and delete sound tracks", "Click Sound track (the button above the row names, left of the timeline) four times. Then click the name of the last track on the left and choose Delete track in its menu.", "Each click adds a row of sound under the video with a name on the left. No more than three sound tracks can exist: the fourth click adds nothing (the button is greyed out or a message says so). Delete track removes the empty track. History shows \"Added sound track ...\" and \"Deleted sound track ...\".", ""], ["tr-music", "Music goes to a free track", "Put the playhead at 0:00. Click Music and pick file C. Put the playhead at 0:00 again, click Music and pick C again.", "The first music starts at 0:00 on the Music track. The second cannot overlap it, so it lands on another sound track (one is made if needed), also at 0:00.", ""], ["tr-mute-solo", "Mute and solo a track, mute the video sound", "Play from 0:00 and keep it playing. On the left of the timeline click M (mute) on the Music track, then click it again. Click S (solo) on the Music track, then again. Then click Video (the first name on the left), switch on Mute, then switch it off.", "M: that track's music goes silent while the voice continues. S: only that track is heard (no voice, no other music). Video > Mute: the voice of the clips goes silent while music still plays. Ask the owner to listen while you click. Each change is a step in History.", "listen"], ["tr-move-sound", "Move a sound to another track", "Drag the second music piece up or down onto a track where there is free space, and drop it. Then drag it onto the Music track at 0:00, where the first music already is. (If dragging fails: select it and choose another track under Track in its settings.)", "On free space it moves to that track. On a busy spot it does not overlap: it goes to the nearest free place. History shows \"Moved music to ...\". Undo puts it back.", ""], ["tr-move-track", "Move a whole sound track up and down", "Click the name of the second sound track on the left. In its menu click Move up. Open the menu again and click Move down.", "The whole row moves one place up together with its sounds, then back down. Each move is one History step (\"Moved sound track\") and can be undone.", ""], ["tr-duck", "Lower this track under speech", "Delete the second music piece. Click the Music track's name and switch on Lower this track under speech. Export > Full quality, save as r4-duck.mp4, and play the file in QuickTime (Mac) or Media Player / Movies & TV (Windows).", "In the exported file the music is clearly quieter while the person in A talks and comes back up in the pauses and over the photo. (The preview does not do this; only the export does.) Ask the owner to listen to the exported file.", "listen"]]], ["Separate sound", [["sep-do", "Separate sound to track", "Select the first piece of A, open Sound and click Separate sound to track\u2026. If it offers \"Also the other clips with sound\", leave that off and confirm. Play that piece.", "The clip's sound appears as a piece on the Voice track right under the clip, and the clip shows as muted. Ask the owner to listen: the voice is heard once (not twice, no echo) and matches the lips.", "listen"], ["sep-lcut", "The sound follows its clip, then an L-cut", "Drag the left edge of that clip about 2 seconds to the right (trim). Then drag the Voice piece under it about 1 second to the right and drop it. Play across the start of the clip.", "After the trim the Voice piece is trimmed the same way (it follows its clip). After dragging it, the voice starts about 1 second after the picture and stays where you put it. Ask the owner to listen: the voice now lags the lips by about a second (that is the expected L-cut effect).", "listen"], ["sep-back", "Put the sound back", "Select the same clip, open Sound and click Put it back on the clip. Then press Ctrl/Cmd+Z, then Ctrl/Cmd+Shift+Z.", "Put back: the Voice piece disappears and the clip is no longer muted. Undo separates it again; redo puts it back again. History shows a step such as \"Put back on the clip\".", ""]]], ["Remove silences", [["sil-sensitivity", "Automatic silence level and Sensitivity", "Add file E at the end of the main track (if you have no E, use the second piece of A). Select it, open Sound and click Remove silences. When the result shows, click Fewer cuts, Automatic and More cuts under Sensitivity in turn. Write down the gap count and the \"Background noise about ... dB\" line for each.", "A progress bar with Cancel, then a line like \"Background noise about -45 dB; quieter than -34 dB counts as silence\" and a button like \"Remove 5 gaps\". Changing Sensitivity updates the count at once without scanning again; Fewer cuts gives no more gaps than Automatic, More cuts no fewer. On a noisy phone recording it still finds the pauses.", ""], ["sil-apply", "Apply the cuts", "With Automatic chosen, click the Remove ... gaps button. Play across two of the new cuts. Then press Ctrl/Cmd+Z once, then Ctrl/Cmd+Shift+Z.", "The clip becomes pieces with clip pictures, without a long freeze. Ask the owner to listen: words are not chopped at the cuts. One undo brings back the single clip; redo cuts it again. History has one step for it (for example \"Cut clip 4 into 6 pieces\").", "listen"]]], ["Picture: video size, crop, rotate, position", [["vsize", "Video size", "Open Export. Under Video size you see As first clip, 720p, 1080p, 4K. Choose a size different from file A's own size (if unsure, 720p), keep Full quality, export as r4-size.mp4. Then open the Shape button (next to Export): it also lists Video size. Set Video size back to As first clip there.", "The exported file has the chosen size (720p of a wide video = 1280 x 720). Check it: Mac: Finder > Get Info > More Info > Dimensions; Windows: right-click > Properties > Details > Frame width / Frame height. The Shape menu shows the same choices with a tick on the current one.", ""], ["crop-frame", "Crop with handles and shapes", "Select the first piece of A. In the side panel open Crop. On the preview drag the bottom-right corner of the frame inwards, then drag inside the frame to move it. Click 1:1, then drag a corner. Click 9:16, then Free, then Original.", "The preview shows the whole picture with a frame, 8 grips and the outside dimmed. A corner drag makes the frame smaller; a drag inside moves it. 1:1 / 9:16 make the frame square / tall and keep that shape while you drag; Free allows any shape; Original returns to the picture's own shape. Each drag is one History step (\"Crop on clip 1\" or similar).", ""], ["crop-rotate", "Rotate and flip", "With the same clip selected, in Crop click Rotate right, Rotate right, Rotate left, Flip sideways, Flip upside down. Click Reset crop and position. Then choose Edit > Rotate right in the menu bar, and Ctrl/Cmd+Z.", "Each button turns the picture a quarter turn or mirrors it, at once, in the preview. Reset puts it back to normal. The menu item turns it like the button and undo turns it back. History shows steps like \"Rotated clip 1\" and \"Flipped clip 1\".", ""], ["crop-position", "Position with Fill (keep the person in shot)", "Click Shape and choose 9:16 upright. Select the first piece of A, open Look and choose Fill. In Crop move Left \u2013 right fully to one end, then the other, then put the person in the middle. Then choose Fit in Look and look at Position again. Finally choose Fill again and set Shape back to Original (as the first clip).", "With Fill, Left \u2013 right changes which part of the wide picture fills the tall frame, so the person can be kept in the middle. With Fit (zoom 1) Position has no effect and the panel says so.", ""]]], ["Overlay (picture-in-picture)", [["ov-add", "Add an overlay", "Put the playhead at 0:05. Click Overlay in the side panel's Add area (or Edit > Add overlay video or photo\u2026) and pick file B.", "B appears as a small picture in the bottom-right corner of the preview from 0:05. A new Overlay row appears above the main clips with B on it. History: \"Added overlay\".", ""], ["ov-pip", "Corner, size, frame, drag on the picture", "Select the overlay. Under Layout keep Picture-in-picture, set Corner to the top left, set Size to about 50%, switch on White frame. Then on the preview drag the overlay to the middle, and drag its corner grip outwards.", "Corner moves it to the top left, Size makes it bigger, White frame draws a thin border. Dragging it on the preview moves it anywhere (Layout changes to Free position); dragging the corner grip resizes it.", ""], ["ov-layouts", "Side by side, top and bottom, full screen", "Choose Layout Side by side, then Top and bottom, then Full screen. For each, play from 1 second before the overlay starts to 1 second after it ends.", "Side by side: your video on one half, B on the other. Top and bottom: one above the other. Full screen: B covers the whole picture while it plays, then your video comes back. Ask the owner to watch: B plays smoothly and starts and stops at the right moment (not frozen, not jumping).", "watch"], ["ov-row", "Move, trim and mute the overlay", "On the Overlay row drag the overlay about 3 seconds to the right, then drag its right end to make it shorter. In Sound, speed and fades switch on Mute overlay sound while playing, then off. Set Layout back to Picture-in-picture.", "It moves and trims on its row. Mute overlay sound silences B while your video's sound continues (ask the owner to listen). History: \"Moved overlay\", \"Trimmed overlay\", \"Muted overlay\".", "listen"]]], ["Look and fades", [["look-filter", "Filters and warmth", "Select the first piece of A, open Look. Under Filter click Warm, Cool, Black & white, Vintage, Vivid, None in turn. Choose Vintage. Move Warmth fully left, fully right, then about halfway to warm. Click Reset look, then Ctrl/Cmd+Z.", "Each filter changes the preview at once (Black & white has no colour; None removes it). Warmth makes the picture more orange or more blue on top of the filter. Reset look removes filter and warmth; one undo brings both back (\"Reset look on clip 1\" in History). Leave Vintage + warm on.", ""], ["fade-project", "Fade the whole video in and out", "Click an empty place on the timeline so nothing is selected. In the side panel set Fade in from black to about 2 s and Fade out to black to about 2 s. Play from 0:00, then play the last 4 seconds.", "The video starts from black and comes up; at the end the picture, titles, overlay and all sound go down to black and silence together. Ask the owner to watch and listen.", "watch"], ["fade-clip", "Fade one clip", "Select clip B on the main track, open Transition and fades, set Fade out to black to about 1 s. Play across the end of B.", "B's picture goes to black over its last second and B's own sound fades with it; the next item then starts normally. Ask the owner to watch and listen.", "watch"]]], ["Titles", [["title-font", "Fonts and styles", "Put the playhead at 0:02, click Title and type: Round 4 title. In the title panel click Font Classic, Modern, Elegant, Handwritten in turn. Then try two different Styles.", "Each font visibly changes the letters in the preview. A Style changes several settings at once.", ""], ["title-lang", "Hebrew and Russian letters", "Put the playhead at 0:10, click Title. Copy this text from this page and paste it into Text: \u05e9\u05dc\u05d5\u05dd \u05e2\u05d5\u05dc\u05dd / \u041f\u0440\u0438\u0432\u0435\u0442, \u043c\u0438\u0440 . Click each of the four fonts.", "In every font the Hebrew and Russian letters show properly (no empty boxes, no question marks). The Hebrew words keep their order: read right to left, \u05e9\u05dc\u05d5\u05dd comes before \u05e2\u05d5\u05dc\u05dd.", ""], ["title-outline", "Outline, shadow, position, alignment", "Select the first title. Switch on Outline. Switch Shadow off, then on. Switch Dark box behind text on, then off. Under Position click Top, Middle, Lower third, Bottom. Then click Left, Centre, Right.", "Outline draws a line around the letters; Shadow adds or removes a soft shadow; the box appears and goes. Each Position moves the text to that height; Left / Right line the text up and move it to that side.", ""], ["title-anim", "Appear and Disappear", "Set Appear to Slide up and Disappear to Pop. Play from 1 second before the title to 1 second after it. Then set Appear to Fade and play again.", "The title slides up into place at its start and pops away at its end, each in less than half a second; with Fade it fades in. Ask the owner to watch.", "watch"]]], ["Duplicate, copy settings, snapping", [["dup", "Duplicate a clip and a title", "Select clip B on the main track and press Ctrl/Cmd+D. Then select the first title and click Duplicate in the tool bar. Then delete the copy of the title.", "A copy of B appears right after B with the same settings (its fade out). A copy of the title appears right after it on the timeline. History: \"Duplicated ...\" for each.", ""], ["copy-paste", "Copy settings, Paste settings", "Open the Edit menu: look at Paste settings. Close it. Select the first piece of A (Vintage, warm, Fill) and press Ctrl/Cmd+Shift+C. Select the photo D and press Ctrl/Cmd+Shift+V. Then select the copy of B and choose Edit > Paste settings. Press Ctrl/Cmd+Z once.", "Before copying, Paste settings is greyed out. After pasting, the photo has the same look (Vintage, warmth) and fit as A, but keeps its own length. The copy of B gets the same look, and its fade is not changed. History: \"Pasted settings on ...\". One undo takes back only the last paste.", ""], ["snap", "Snapping", "Put the playhead at 0:08. Slowly drag the right end of the first title (on the timeline) towards the playhead. Then drag the end of the music towards the end of a clip.", "When it comes close, the edge jumps onto the playhead / clip edge and a yellow line shows where it snapped.", ""], ["snap-off", "Placing freely: Alt / Option, and the menu switch", "Hold Alt (Option on a Mac) while dragging the same title end slowly past the playhead. Then untick Playback > Snap to playhead and edges in the menu bar and drag again without Alt. Tick it again afterwards.", "With Alt / Option held there is no jump and no yellow line. With the menu item unticked, no snapping at all. After ticking it again, snapping works. (If you cannot hold a key while dragging, set Needs the owner for that part.)", ""]]], ["Keyboard", [["keys-jkl", "J / K / L", "Click an empty place on the timeline (not a text box). Press L, wait 2 seconds, press K. Press J, wait 2 seconds, press K.", "L plays forwards, K stops, J goes backwards: the playhead jumps back in small steps and the picture changes (not smooth playback; that is expected).", ""], ["keys-io", "I / O: start and end a clip at the playhead", "Select clip B on the main track. Put the playhead about 1 second into it and press I. Put the playhead about 1 second before its end and press O. Then press Ctrl/Cmd+Z twice.", "I: B now starts at the playhead (the part before is trimmed away). O: B ends at the playhead. Each is one History step, and each undo restores one.", ""], ["keys-frame", "Frame step, second step, zoom", "Pause on clip A and note the time shown. Press Right 30 times and note the time; press Left 30 times. Press Shift+Right once. Press + three times, then - three times. If you have file F (25 or 60 fps), add it and repeat Right 30 times on it.", "Each Right / Left moves one frame (the picture changes slightly with each press). 30 presses move about 1.0 s on a 30 fps clip (1.2 s at 25 fps, 0.5 s at 60 fps), and Left 30 times returns to the same time. Shift+Right moves 1 second. + zooms the timeline in, - zooms out. Write down the times you saw.", ""], ["keys-typing", "Shortcuts are off while typing", "Select a title, click into its Text box and type: jkl iso sd (with the spaces). Then click outside the box.", "The letters only go into the text. Nothing plays, splits, trims or duplicates (History gets only the text change).", ""]]], ["Menus", [["menu-mac", "Mac: menu bar contents", "Mac only. Open each menu in the Mac menu bar: ClipForge, File, Edit (and its Sound, Shape and Video size submenus), Playback, Help. Write down anything missing or without a shortcut.", "Edit has Undo, Redo, History, Duplicate (Cmd+D), Copy settings, Paste settings, Delete (\u232b), Split, start / end clip at playhead, Freeze frame, Remove silences, move clip earlier / later, Crop and position\u2026, Rotate right, add title / caption, Add overlay video or photo\u2026, and the Sound (Add sound track, Separate sound, Put sound back, Lower music under speech), Shape and Video size submenus. Playback has Play (Space), Play backwards / Stop / Play forwards (J / K / L), go to start / end, previous / next frame, zoom in / out and Snap to playhead and edges (ticked). Help has Keyboard shortcuts.", "Mac"], ["menu-mac-keys", "Mac: one key press = one action", "Mac only. Select clip B, put the playhead in its middle and press S once. Open History. Press Cmd+D once and look at History again. Press L, then K. Then undo the split and the duplicate.", "Exactly one \"Split ...\" step and one \"Duplicated ...\" step appear (not two each); L and K play and stop normally. (The Mac menu also knows these keys; this checks that they do not fire twice.)", "Mac"], ["menu-win", "Windows: menu bar contents and shortcuts", "Windows only. Open File, Edit (and its Sound, Shape, Video size submenus), Playback and Help in the bar at the top of the window. Use Edit > Duplicate and Playback > Next frame once each. Undo, then press Ctrl+Shift+Z; undo again, then press Ctrl+Y. Press Ctrl+Shift+H twice and F1.", "The same items as in the Mac step, each with its shortcut (Redo shows Ctrl+Shift+Z; Delete shows \"Delete (or Backspace)\"). Duplicate from the menu adds exactly one copy; Next frame moves one frame. Ctrl+Shift+Z and Ctrl+Y both redo. Ctrl+Shift+H shows and hides History; F1 opens Help.", "Windows"]]], ["History and undo", [["hist-names", "History names of the new edits", "Open History (Ctrl/Cmd+Shift+H or Edit > History). Copy the newest 15 names into the note.", "Each step has a clear name, newest first, similar to \"Duplicated clip 3\", \"Pasted settings on clip 5\", \"Filter Vintage ...\", \"Fade in from black\", \"Font Elegant on title ...\", \"Added overlay\", \"Moved sound track\", \"Rotated clip 1\". No vague names like just \"Changed\" or \"Edit\", and adding a file did not create a \"Read sound tracks\" step.", ""], ["hist-undo", "Undo and redo the new edits", "Press Ctrl/Cmd+Z 8 times, watching the preview and the timeline after each, then Ctrl/Cmd+Shift+Z 8 times. Then in History click a step about 10 back, then the newest step.", "Each undo takes back exactly one of the latest changes, and each redo brings it back; the project ends exactly as before. Clicking an older step in History goes back there (later steps look grey); clicking the newest restores everything.", ""], ["hist-reopen", "Everything is saved", "Go back to the project list and open \"Round 4 test\" again.", "Everything is still there: sound tracks with their mute / lower-under-speech settings, Fill and position, overlay and its layout, filters, fades, title fonts, Hebrew / Russian text, outline and animations. History starts empty again (that is expected).", ""]]], ["Export", [["exp-full", "Export the full project", "Open Export. Make: Video, Full quality, Frames per second: As clips, Video size: As first clip. Export as r4-full.mp4.", "It finishes and says what was used (graphics card or processor) and how long it took. Write both down.", ""], ["exp-watch", "The export looks like the preview", "Play r4-full.mp4 in QuickTime (Mac) or Media Player / Movies & TV (Windows) and compare it with the ClipForge preview.", "Ask the owner to watch: cuts, Fill framing, overlay position, layout and timing, filters and warmth, fades from and to black, fonts, Hebrew / Russian text, outline, title positions and animations all match the preview.", "watch"], ["exp-listen", "The export sounds right", "Play r4-full.mp4 with sound from start to end.", "Ask the owner to listen: voice in sync with the lips, the voice of the trimmed clip not doubled, music lower under speech, the clip fade and the end fade, overlay sound present, no clicks or gaps at the cuts.", "listen"], ["exp-fps", "Frames per second", "Open Export, open Frames per second, choose 25 and export as r4-25fps.mp4. Check the frame rate: Mac: open it in QuickTime > Window > Show Movie Inspector; Windows: right-click > Properties > Details > Frame rate.", "The choices are As clips, 24, 25, 30, 60. The file reports 25 frames per second and has the same length as r4-full.mp4.", ""], ["exp-m4a", "Sound only: M4A", "Open Export, set Make to Sound M4A and export as r4-sound.m4a. Play it in QuickTime / Music (Mac) or Media Player (Windows).", "The picture settings (Video size, Frames per second) are hidden. An .m4a file is made with the same length as the video. Ask the owner to listen: it has the same mix as the video.", "listen"], ["exp-mp3", "Sound only: MP3", "Open Export, set Make to Sound MP3 and export as r4-sound.mp3. Play it.", "An .mp3 file is made and plays with the same sound as the M4A. If instead it says \"Export the sound as M4A instead\", write that down exactly. Ask the owner to listen.", "listen"]]], ["New in 1.8.0", [["m18-fit", "Fit music to video", "Make a new project \"Round 4 music\" with file B (the short video). Add music C. Select the music and click Fit music to video.", "The music now ends exactly where the video ends, with a short fade-out. History shows a step like \"Fitted music to the video\". Ctrl/Cmd+Z undoes it in one step.", ""], ["m18-loop", "Loop short music", "In \"Round 4 music\", add file A after file B so the video is longer than the music (if the music is still longer, skip and set Not tested). Select the music and click Fit music to video, and choose to loop it.", "The music piece shows a repeat icon and \"loops\", with marks where it repeats, and reaches the end of the video. Ask the owner to listen to the preview at the repeat points: no gap or click.", "listen"], ["m18-free", "Find free music", "Click Music (Add music). The window opens on Find free music. Search for \"piano\". Play the preview of one result, then click Use.", "Results show title, artist, length and licence (CC0, Public domain, CC BY or CC BY-SA). The preview plays. After Use the music is downloaded and added to the timeline. If it says it is offline or shows an error, write the exact text.", ""], ["m18-credits", "Music credits", "Select the downloaded music. Click Copy credits and paste into the note. Then click Add credits at the end.", "The pasted text names the track, the artist, the licence and a link. A caption with the credits appears over the last 4 seconds of the video.", ""], ["m18-find", "Find a missing file", "Only if a project shows a red \"Missing\" clip (otherwise set Not tested): click Find file....", "On a computer a file chooser opens; choosing the file brings the clip back. (On an Android phone it offers \"Search the gallery\": the owner tests that on the phone.)", ""]]], ["New in 1.9.0", [["m19-lock", "Opening and closing projects looks the same as before", "1.9.0 marks a project as \"open in the app\" so that Claude does not change it at the same time; you should not notice it. Open \"Round 4 test\", make one small change (for example move a title), go back to the project list and open it again. Then, with the project open, quit ClipForge (Cmd+Q on a Mac, Alt+F4 on Windows), start it again and open the project. Finally open \"Round 4 music\" and go back.", "Nothing new is visible: no message about the project being open or locked, no extra waiting, no new button. Every time the project opens normally with the last change in it, also after quitting with the project open. The top bar shows Saved as before.", ""], ["m19-long", "Export a long project (20 minutes or more)", "Only if the owner has a project or a video of 20 minutes or more (ask; otherwise set Not tested). Open it (or make a project \"Round 4 long\" with that video), click Export > Full quality and save it as r4-long.mp4. Leave the computer alone while it runs. Write down the length of the project, the time the export took and the file size.", "The progress moves steadily to 100% without stopping for minutes at one value, the app stays usable (the window can be moved, Cancel export is there), and it finishes with a result that says what was used and how long it took. The file has the project's length and plays to the end. Ask the owner to watch the last minute: picture and sound are still in sync.", "watch"], ["m19-claude", "Claude is connected and names the same version (optional)", "Only if the owner uses Claude with ClipForge (otherwise set Not tested). The owner has installed the ClipForge extension in Claude Desktop, or added it to Claude Code (guide: \"Connect Claude to ClipForge\"). With \"Round 4 test\" OPEN in ClipForge, ask Claude: \"What version of ClipForge are you connected to?\" and then \"Add the caption Hello at 0:03 in my project Round 4 test\". Then go back to the project list in ClipForge and tell Claude to try again. Open the project.", "Claude names the same version and build as About ClipForge. While the project is open in the app, Claude says it cannot change it because it is open in ClipForge and asks to go back to the project list (nothing is changed). After going back, Claude adds the caption, and it is there at 0:03 when the project is opened.", ""]]]];const INSTR="You are testing ClipForge 1.9.0, a video editor, on the owner's computer (a Mac or a Windows PC). Problems are expected; your job is to find them and write them down precisely. This round checks what is new since 1.4.0 (sound tracks, separate sound, Remove silences, video size, crop and position, overlays, fades, filters, text styles, duplicate and copy settings, snapping, sound-only export, frame rate, keyboard and menus, from 1.8.0 fit and loop music and free music search, and from 1.9.0 the invisible \"open in the app\" mark, long exports and the Claude connection) plus a short check that the basics still work. The Android phone has its own page (Round 4 phone).\n\nBEFORE YOU START\n- Fill in \"Device\" (for example \"MacBook Air M5, macOS 26.6\" or \"Windows 11 laptop\") and \"Tester\".\n- Fill in \"Version shown in the app\": in ClipForge open About ClipForge (Mac: the ClipForge menu; Windows: the Help menu), click Copy version info and paste the text. If it does not match the build named at the top of this page (a red warning appears), tell the owner and say so in the Summary.\n- Test files: ask the owner where the test videos are (Round 3 used the same folder). You need:\n  A. a talking video, 1-3 minutes, one person speaking with some pauses, filmed wide (landscape);\n  B. a second short video, 10-30 seconds, anything (used as the overlay);\n  C. a music file (MP3 or M4A), at least 1 minute;\n  D. a photo;\n  E. optional: a phone recording with background noise and pauses (for Remove silences; otherwise use A);\n  F. optional: a video filmed at 25 or 60 frames per second (for frame stepping).\n  If something is missing, ask the owner. Do not download files from the internet.\n- Most steps use one project, \"Round 4 test\", made in the step \"Make the test project\". Do the steps in order: later steps build on earlier ones.\n\nRULES\n- Each step has \"Do\" (exact actions) and \"Expected\" (what should happen). Do the actions exactly, then compare with Expected.\n- For each step choose a Result and write a Note. Start every note with the device (\"Mac:\" or \"Windows:\").\n- Result meanings: PASS = you saw exactly the expected result. FAIL = something was wrong (write what you did, what happened, and what you expected). Partial = part of it worked (say which part). Not tested = you could not do it (say why). Needs the owner = only a person can judge it and the owner was not available.\n- Steps tagged \"Mac only\" or \"Windows only\": do them only on that system. On the other system set Not tested and write \"other system\".\n- Steps tagged \"ask the owner to listen\" or \"ask the owner to watch\" depend on hearing, or on smooth movement and sync that screenshots cannot show. Do the actions and check everything you can see. Then ask the owner in the chat, for example: \"Please play the preview from 0:05 and tell me whether the voice matches the lips.\" Write the owner's answer in the note starting with \"Owner:\", and set PASS or FAIL from it. If the owner is not available, set Needs the owner.\n- On a Mac use Cmd where a step says Ctrl/Cmd, and Option where it says Alt.\n- If a drag does not work for you, try twice. Then use the menu bar or panel buttons if the step offers them; otherwise set Needs the owner and write that you could not perform the drag (it may still work for a human).\n- To type Hebrew or Russian text, copy it from this page and paste it with Ctrl/Cmd+V.\n- Never delete, move or rename the owner's files. Save every export into a new folder named clipforge-test-output next to the test videos, with the file name the step gives (for example r4-full.mp4).\n- If the app closes by itself or freezes, write down exactly what you were doing, fill in the Crash box, reopen it and continue.\n- Do not guess. Only mark PASS for what you actually saw, or for what the owner told you they heard or saw.\n- This page keeps your answers in this browser as you go. When finished, fill in the Summary box (most important problems first), then click \"Download filled checklist\" and give the downloaded file to the owner.";
const OPTS=["", "PASS", "FAIL", "Partial", "Not tested", "Needs the owner"];const TAGS={"listen": "ask the owner to listen", "watch": "ask the owner to watch"};const RESULT="Result";const NOTE="What happened? Start with Mac: or Windows:";
let data=JSON.parse(document.getElementById('data').textContent);
try{const s=localStorage.getItem('clipforge-round4');if(s){const l=JSON.parse(s);if(l&&l.items)data=Object.assign(data,l);}}catch(e){}
document.getElementById('instr').textContent=INSTR;document.getElementById('build').textContent=data.build;
const root=document.getElementById('steps');
for(const [group,items] of STEPS){const h=document.createElement('h2');h.textContent=group;root.appendChild(h);
 for(const st of items){const five=st.length>4,id=st[0],title=st[1],act=five?st[2]:'',exp=five?st[3]:st[2],tag=st[st.length-1];const it=data.items[id]||(data.items[id]={status:"",note:""});
  const c=document.createElement('article');c.className='card step';c.dataset.s=it.status;
  const t=document.createElement('h3');t.textContent=title;for(const k of (tag?tag.split(','):[])){const g=document.createElement('span');g.className='tag';g.textContent=TAGS[k]||k+' only';t.appendChild(g);}
  const d=document.createElement('p');d.className='do';d.textContent='Do: '+act;
  const p=document.createElement('p');p.className='exp';p.textContent='Expected: '+exp;
  const row=document.createElement('div');row.className='row';const sel=document.createElement('select');sel.setAttribute('aria-label',RESULT+': '+title);
  for(const o of OPTS){const op=document.createElement('option');op.value=o;op.textContent=o||RESULT+'...';if(o===it.status)op.selected=true;sel.appendChild(op);}
  row.appendChild(sel);const ta=document.createElement('textarea');ta.setAttribute('aria-label','Note: '+title);ta.placeholder=NOTE;ta.value=it.note;
  sel.addEventListener('change',()=>{it.status=sel.value;c.dataset.s=sel.value;save();});ta.addEventListener('input',()=>{it.note=ta.value;save();});
  if(act)c.append(t,d,p,row,ta);else c.append(t,p,row,ta);root.appendChild(c);}}
for(const k of ['device','tester','version','summary','crash']){const e=document.getElementById(k);e.value=data[k]||'';e.addEventListener('input',()=>{data[k]=e.value;save();});}
function counts(){const n={};let total=0;for(const [,items] of STEPS)for(const [id] of items){total++;const s=data.items[id].status||'Not done yet';n[s]=(n[s]||0)+1;}
 const el=document.getElementById('counts');el.textContent='';for(const [k,v] of Object.entries(n)){const s=document.createElement('span');s.textContent=k+': '+v;el.appendChild(s);}const s=document.createElement('span');s.textContent='Total: '+total;el.appendChild(s);}
function vcheck(){const v=(data.version||'').trim();const w=document.getElementById('vwarn');
 const b=data.build||'';const m=b.match(/\d+\.\d+\.\d+ \(build \d+\)/)||b.match(/\d+\.\d+\.\d+/);const h=b.match(/\b([0-9a-f]{7,40})\s*$/);
 const bad=m&&!v.includes(m[0])?m[0]:(h&&!v.includes(h[1].slice(0,7))?h[1].slice(0,7):'');
 w.textContent=!v?'Please paste the version shown in the app (required).':(bad?'This is not the build named above ('+bad+'). Say so in the Summary.':'');}
function save(){counts();vcheck();try{localStorage.setItem('clipforge-round4',JSON.stringify(data));document.getElementById('saved').textContent='Saved in this browser.';}catch(e){}}
counts();vcheck();
document.getElementById('dl').addEventListener('click',()=>{
 if(!(data.version||'').trim()&&!confirm('"Version shown in the app" is empty. Download anyway?'))return;
 const clone=document.documentElement.cloneNode(true);clone.querySelector('#data').textContent=JSON.stringify(data).replace(/</g,'\\u003c');
 clone.querySelector('#steps').innerHTML='';
 const blob=new Blob(['<!doctype html>\n'+clone.outerHTML],{type:'text/html'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);
 const d=(data.device||'device').replace(/[^A-Za-z0-9]+/g,'-').slice(0,30);a.download='ClipForge-Test-Round-4-results-'+d+'.html';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1000);});
</script></body></html>
