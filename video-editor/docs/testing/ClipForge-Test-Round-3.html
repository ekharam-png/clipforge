<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ClipForge Test Round 3</title>
<style>
:root{--bg:#f5f6fa;--card:#fff;--fg:#161a26;--muted:#5b6274;--line:#dfe2ec;--accent:#4257d6;--ok:#1f7a4d;--bad:#a8322b;--part:#9a5b00;--human:#6a3fb0}
@media (prefers-color-scheme:dark){:root{--bg:#0f1118;--card:#181b25;--fg:#eceef5;--muted:#9aa1b5;--line:#2a2f3f;--accent:#8c9bff;--ok:#6fd3a0;--bad:#ff9c94;--part:#f0b95a;--human:#c3a6ff;color-scheme:dark}}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}
.wrap{max-width:900px;margin:0 auto;padding:28px 16px 64px;display:flex;flex-direction:column;gap:20px}
h1{margin:0;font-size:1.8rem}h2{margin:8px 0 0;font-size:1.2rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:8px}
.instr{white-space:pre-wrap;font-size:.95rem}
.step{border-left:6px solid var(--line)}
.step[data-s="Works"]{border-left-color:var(--ok)}.step[data-s="Problem"]{border-left-color:var(--bad)}.step[data-s="Partial"]{border-left-color:var(--part)}.step[data-s="Needs a person"]{border-left-color:var(--human)}
.step[data-s="PASS"]{border-left-color:var(--ok)}.step[data-s="FAIL"]{border-left-color:var(--bad)}.step[data-s="Needs the owner"]{border-left-color:var(--human)}
.do{margin:0;font-size:.95rem}
.step h3{margin:0;font-size:1.02rem}.exp{color:var(--muted);font-size:.93rem;margin:0}
.tag{font-size:.75rem;font-weight:600;border:1px solid var(--line);border-radius:999px;padding:1px 8px;margin-left:6px;color:var(--muted)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
select,input,textarea,button{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px}
textarea{width:100%;box-sizing:border-box;min-height:64px}
button{cursor:pointer;background:var(--accent);color:#fff;border:0;font-weight:600;padding:10px 16px}
.counts{display:flex;gap:16px;flex-wrap:wrap;font-weight:600}
label{display:flex;flex-direction:column;gap:4px;font-size:.9rem;color:var(--muted)}
</style></head><body><div class="wrap">
<header class="card"><h1>ClipForge test round 3</h1>
<p class="exp">Build: <b id="build"></b>. Fill in each step, then click <b>Download filled checklist</b> at the bottom and send the file back to Claude.</p>
<div class="row"><label>Device<input id="device" placeholder="e.g. MacBook Air M5, macOS 26.6 / Windows 11 laptop"></label><label>Tester<input id="tester" placeholder="e.g. ChatGPT agent, or your name"></label></div>
<label>Version shown in the app (required: About ClipForge &gt; Copy version info, then paste here)<textarea id="version" placeholder="ClipForge X.Y.Z (build N) · date, time UTC · commit" style="min-height:56px"></textarea></label>
<p class="exp" id="vwarn" style="color:var(--bad);margin:0"></p>
<div class="counts" id="counts"></div></header>
<section class="card"><h2>Instructions for the tester (person or AI agent)</h2><div class="instr" id="instr"></div></section>
<div id="steps" style="display:flex;flex-direction:column;gap:20px"></div>
<section class="card"><h2>Crash or freeze</h2><label>If the app closed by itself or froze: what were you doing? (paste a crash report if macOS shows one)<textarea id="crash"></textarea></label></section>
<section class="card"><h2>Summary</h2><label>Most important problems first, plus anything confusing, slow or hard to find<textarea id="summary" style="min-height:120px"></textarea></label>
<div class="row"><button id="dl" type="button">Download filled checklist</button><span class="exp" id="saved"></span></div></section>
</div>
<script id="data" type="application/json">{"device": "", "tester": "", "build": "ClipForge 1.4.0 (build 21) \u00b7 16 Nov 2026, 15:46 UTC \u00b7 5d3a389", "version": "", "summary": "", "crash": "", "items": {}}</script>
<script>
const STEPS=[["Start and help", [["start-open", "Install the new build and open ClipForge", "Mac: replace the app in Applications, then System Settings > Privacy & Security > Open Anyway. Windows: unzip and run clipforge.exe. The project list opens.", ""], ["start-version", "The app shows the expected version", "The small grey line at the bottom of the project list shows the same version and build number as the build named at the top of this page. Open About ClipForge (Mac: ClipForge menu; Windows: Help menu; phone: the three dots), click Copy version info and paste it into \"Version shown in the app\" at the top.", ""], ["tour-offer", "First-launch tour offer", "On the first start after installing, a dialog asks \"Would you like a quick tour?\" with Show me around / Not now. (It only appears once per computer; if it does not appear, note whether this computer ran this build before.)", ""], ["tour-run", "Run the tour to the end", "8 steps, each highlighting a real button, with Back, Next and Skip tour. At the end it asks to keep or delete the sample project.", ""], ["help-open", "Open Help", "The ? button at the top (or F1 on Windows, or Help in the menu bar) opens Help with a search box and a list of topics.", ""], ["help-typos", "Search Help with typos", "Type: musci, vocie, trascirpe. Each finds the right topic (music, Voice focus, automatic subtitles).", ""], ["help-hints", "Small ? next to settings", "In a clip's Sound panel, the ? next to Clean up sound or Voice focus opens the matching help article.", ""]]], ["Menus and saving", [["menu-win", "Windows: menu bar", "Windows only. File, Edit, Playback, Help at the top of the window. Ctrl+N new project, Ctrl+E export, F1 help.", "Windows"], ["menu-mac", "Mac: menu bar", "Mac only. The Mac menu bar has File, Edit (Undo, Redo, Delete, History), Playback and Help, and they work.", "Mac"], ["save-status", "Save status", "While editing, the top bar shows Saved, or Saving... briefly after a change.", ""], ["quit-clean", "Quit while editing, nothing running", "With a project open, quit (Cmd+Q / Alt+F4 / close window). It closes without asking. Reopen: the edits are there.", ""], ["quit-export", "Quit during an export", "Start an export, then try to quit. It asks whether to cancel the export or keep working.", ""], ["crash-loop", "No crash when opening and closing", "Open a project, play it, go back to the list. Repeat 5 times, then quit. The app never closes by itself.", ""]]], ["Bringing files in", [["drop-home", "Drag files onto the project list", "Computer only. Drag two videos from Finder/Explorer onto the project list: a new project opens with both.", ""], ["drop-editor", "Drag a file onto the timeline", "Drag a photo between two clips on the timeline: an insertion line shows and it lands there.", ""], ["drop-bad", "Drag an unsupported file", "Drag a PDF or text file in: a message lists it as not usable; nothing breaks.", ""]]], ["Editing", [["select-seek", "Select a clip", "Click a clip that is not under the playhead: the preview jumps to it.", ""], ["split", "Split", "Put the playhead inside a clip and press Split (or S): it becomes two clips.", ""], ["history-open", "History panel", "Make 3 changes (e.g. speed, split, title). Open History (Edit > History or the top-bar button; phone: More > History). The changes are listed by name, newest first.", ""], ["history-jump", "Jump back in History", "Click the oldest of the 3 steps: the project goes back to that point. Later steps look greyed but can be clicked to go forward again.", ""], ["keys", "Keyboard shortcuts", "Space plays/pauses, Ctrl/Cmd+Z undoes one step, Delete removes the selected clip, Left/Right arrows step a frame, Shift+arrow steps 1 second.", ""], ["title-size", "Title size", "Add a title, change its Size slider: the text gets bigger/smaller in the preview.", ""]]], ["Sound (needs a person with headphones)", [["sound-play", "Video sound plays in sync", "Play a clip with someone talking: sound is heard and lips match.", "listen"], ["clean-processing", "Clean up sound processes", "Turn on Clean up sound for a clip. After about a second the clip shows Sound xx% then finishes; the Sound panel shows progress with Stop.", ""], ["clean-hear", "Clean up sound is heard in the preview", "After processing, play the clip and switch Hear original on and off: background hiss/rumble is lower with it off.", "listen"], ["voice-focus", "Voice focus", "Set Voice focus to about 80%: after processing, speech sounds clearer and background music quieter (not removed).", "listen"], ["hear-sample", "Hear a sample", "Press Hear a sample: a dialog plays 15 seconds; With changes / Original sound different.", "listen"], ["music-fade", "Music fade", "Add a music file with a 2-second fade-out that runs past the end of the video: in the preview and in the export the music fades out at the video's end.", "listen"], ["duck", "Lower music under speech", "Turn it on and export: in the exported file, music drops while someone talks.", "listen"], ["sound-source", "Sound from: Left / Right / Track", "Only appears for some recordings (stereo, or several tracks). If shown, choosing Left only plays only that side. If it never appears, mark Not tested.", ""]]], ["Long video and Remove silences", [["long-load", "Load a long video (10-40 minutes)", "Import a long video. A note says long videos work but some steps take longer (once). Scrolling and zooming the timeline stays smooth.", ""], ["silences-progress", "Remove silences with progress", "On a talking clip, Remove silences shows a progress bar and a Cancel button, then says how many pieces it will cut into before applying.", ""], ["silences-apply", "Apply the cuts", "After applying, clip pictures appear on all pieces quickly and the app does not freeze for long. One Undo restores the clip.", ""]]], ["Export", [["export-gpu-info", "Graphics card info", "Open Export: it says Will use: Graphics card ... (or Processor). Write down exactly what it says.", ""], ["export-size", "Estimated size and space check", "The export window shows an estimated file size.", ""], ["export-run", "Export full quality", "Export finishes. The result says what was used (graphics card or processor) and how long it took. Write both down.", ""], ["export-play", "Exported file plays and matches", "Open the exported file in QuickTime / Movies & TV: picture, cuts, titles and sound match the preview.", ""], ["export-small", "Export small file", "Small export finishes and the file is clearly smaller.", ""]]], ["Claude control (optional)", [["cc-connect", "Connect Claude", "Follow the ClipForge Claude control setup guide. Ask Claude: What is the ClipForge status? It lists the projects folder and whether FFmpeg was found.", ""], ["cc-edit", "Claude edits a closed project", "Close the project in ClipForge, ask Claude to add a caption and export. Reopen the project: the caption is there.", ""]]]];const INSTR="You are testing ClipForge, a video editor, on this computer. Problems are expected; your job is to find them and write them down precisely.\n\nRULES\n- First fill in \"Version shown in the app\": in ClipForge open About ClipForge (Mac: ClipForge menu; Windows: Help menu; phone: the three dots on the project list), click Copy version info and paste the text. If it does not match the build named at the top of this page, say so in the Summary.\n- Work through the steps below in order, in the ClipForge app.\n- For each step choose a Status and write a Note. Start every note with the device (\"Mac:\" or \"Windows:\").\n- Status meanings: Works = you saw exactly the expected result. Problem = something was wrong (say what you did, what happened, what you expected). Partial = part worked. Not tested = you could not do it (say why). Needs a person = you cannot judge it (sound, or drags you could not perform).\n- Steps marked \"needs a person with headphones\" depend on hearing. Do the actions, check everything visible, then set Needs a person.\n- If a drag does not work for you, try twice, then set Needs a person and say the drag could not be performed by you (it may still work for a human).\n- Never delete, move or rename the user's files. Save exports into a new folder named clipforge-test-output next to the test videos.\n- If the app closes by itself, write down exactly what you were doing, reopen it and continue. Fill in the Crash box.\n- Do not guess. Only mark Works for what you actually saw.\n- When finished, fill in the Summary box, then click \"Download filled checklist\" and give the downloaded file to the user.";
const OPTS=["", "Works", "Problem", "Partial", "Not tested", "Needs a person"];const TAGS={"listen": "needs a person with headphones"};const RESULT="Status";
let data=JSON.parse(document.getElementById('data').textContent);
try{const s=localStorage.getItem('clipforge-round3');if(s){const l=JSON.parse(s);if(l&&l.items)data=Object.assign(data,l);}}catch(e){}
document.getElementById('instr').textContent=INSTR;document.getElementById('build').textContent=data.build;
const root=document.getElementById('steps');
for(const [group,items] of STEPS){const h=document.createElement('h2');h.textContent=group;root.appendChild(h);
 for(const st of items){const five=st.length>4,id=st[0],title=st[1],act=five?st[2]:'',exp=five?st[3]:st[2],tag=st[st.length-1];const it=data.items[id]||(data.items[id]={status:"",note:""});
  const c=document.createElement('article');c.className='card step';c.dataset.s=it.status;
  const t=document.createElement('h3');t.textContent=title;for(const k of (tag?tag.split(','):[])){const g=document.createElement('span');g.className='tag';g.textContent=TAGS[k]||k+' only';t.appendChild(g);}
  const d=document.createElement('p');d.className='do';d.textContent='Do: '+act;
  const p=document.createElement('p');p.className='exp';p.textContent='Expected: '+exp;
  const row=document.createElement('div');row.className='row';const sel=document.createElement('select');sel.setAttribute('aria-label',RESULT+': '+title);
  for(const o of OPTS){const op=document.createElement('option');op.value=o;op.textContent=o||RESULT+'...';if(o===it.status)op.selected=true;sel.appendChild(op);}
  row.appendChild(sel);const ta=document.createElement('textarea');ta.setAttribute('aria-label','Note: '+title);ta.placeholder='What happened? Start with Mac: or Windows:';ta.value=it.note;
  sel.addEventListener('change',()=>{it.status=sel.value;c.dataset.s=sel.value;save();});ta.addEventListener('input',()=>{it.note=ta.value;save();});
  if(act)c.append(t,d,p,row,ta);else c.append(t,p,row,ta);root.appendChild(c);}}
for(const k of ['device','tester','version','summary','crash']){const e=document.getElementById(k);e.value=data[k]||'';e.addEventListener('input',()=>{data[k]=e.value;save();});}
function counts(){const n={};let total=0;for(const [,items] of STEPS)for(const [id] of items){total++;const s=data.items[id].status||'Not done yet';n[s]=(n[s]||0)+1;}
 const el=document.getElementById('counts');el.textContent='';for(const [k,v] of Object.entries(n)){const s=document.createElement('span');s.textContent=k+': '+v;el.appendChild(s);}const s=document.createElement('span');s.textContent='Total: '+total;el.appendChild(s);}
function vcheck(){const v=(data.version||'').trim();const w=document.getElementById('vwarn');
 const b=data.build||'';const m=b.match(/\d+\.\d+\.\d+ \(build \d+\)/)||b.match(/\d+\.\d+\.\d+/);const h=b.match(/\b([0-9a-f]{7,40})\s*$/);
 const bad=m&&!v.includes(m[0])?m[0]:(h&&!v.includes(h[1].slice(0,7))?h[1].slice(0,7):'');
 w.textContent=!v?'Please paste the version shown in the app (required).':(bad?'This is not the build named above ('+bad+'). Say so in the Summary.':'');}
function save(){counts();vcheck();try{localStorage.setItem('clipforge-round3',JSON.stringify(data));document.getElementById('saved').textContent='Saved in this browser.';}catch(e){}}
counts();vcheck();
document.getElementById('dl').addEventListener('click',()=>{
 if(!(data.version||'').trim()&&!confirm('"Version shown in the app" is empty. Download anyway?'))return;
 const clone=document.documentElement.cloneNode(true);clone.querySelector('#data').textContent=JSON.stringify(data).replace(/</g,'\\u003c');
 clone.querySelector('#steps').innerHTML='';
 const blob=new Blob(['<!doctype html>\n'+clone.outerHTML],{type:'text/html'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);
 const d=(data.device||'device').replace(/[^A-Za-z0-9]+/g,'-').slice(0,30);a.download='ClipForge-Test-Round-3-results-'+d+'.html';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1000);});
</script></body></html>
