<style>
:root{--bg:#f5f6fa;--card:#fff;--fg:#161a26;--muted:#5b6274;--line:#dfe2ec;--accent:#4257d6;--ok:#1f7a4d;--bad:#a8322b;--part:#9a5b00;--human:#6a3fb0}
@media (prefers-color-scheme:dark){:root{--bg:#0f1118;--card:#181b25;--fg:#eceef5;--muted:#9aa1b5;--line:#2a2f3f;--accent:#8c9bff;--ok:#6fd3a0;--bad:#ff9c94;--part:#f0b95a;--human:#c3a6ff;color-scheme:dark}}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}
.wrap{max-width:900px;margin:0 auto;padding:28px 16px 64px;display:flex;flex-direction:column;gap:20px}
h1{margin:0;font-size:1.8rem}h2{margin:8px 0 0;font-size:1.2rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:8px}
.instr{white-space:pre-wrap;font-size:.95rem}
.step{border-left:6px solid var(--line)}
.step[data-s="Works"]{border-left-color:var(--ok)}.step[data-s="Problem"]{border-left-color:var(--bad)}.step[data-s="Partial"]{border-left-color:var(--part)}.step[data-s="Needs a person"]{border-left-color:var(--human)}
.step[data-s="PASS"]{border-left-color:var(--ok)}.step[data-s="FAIL"]{border-left-color:var(--bad)}.step[data-s="Needs the owner"]{border-left-color:var(--human)}
.do{margin:0;font-size:.95rem}
.step h3{margin:0;font-size:1.02rem}.exp{color:var(--muted);font-size:.93rem;margin:0}
.tag{font-size:.75rem;font-weight:600;border:1px solid var(--line);border-radius:999px;padding:1px 8px;margin-left:6px;color:var(--muted)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
select,input,textarea,button{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px}
textarea{width:100%;box-sizing:border-box;min-height:64px}
button{cursor:pointer;background:var(--accent);color:#fff;border:0;font-weight:600;padding:10px 16px}
.counts{display:flex;gap:16px;flex-wrap:wrap;font-weight:600}
label{display:flex;flex-direction:column;gap:4px;font-size:.9rem;color:var(--muted)}
</style></head><body><div class="wrap">
<header class="card"><h1>ClipForge test round 7: Android phone</h1>
<p class="exp">Build: <b id="build"></b>. Fill in each step, then click <b>Download filled checklist</b> at the bottom and send the file back to Claude.</p>
<div class="row"><label>Device<input id="device" placeholder="e.g. Samsung Galaxy S23, Android 15, via Link to Windows"></label><label>Tester<input id="tester" placeholder="e.g. ChatGPT agent, or your name"></label></div>
<label>Version shown in the app (required: About ClipForge &gt; Copy version info, then paste here)<textarea id="version" placeholder="ClipForge X.Y.Z (build N) · date, time UTC · commit" style="min-height:56px"></textarea></label>
<p class="exp" id="vwarn" style="color:var(--bad);margin:0"></p>
<div class="counts" id="counts"></div></header>
<section class="card"><h2>Instructions for the tester (person or AI agent)</h2><div class="instr" id="instr"></div></section>
<div id="steps" style="display:flex;flex-direction:column;gap:20px"></div>
<section class="card"><h2>Crash or freeze</h2><label>If the app closed by itself, froze or stopped answering: the time, the step, what was on screen (include any message Android showed, and what Copy version info gave).<textarea id="crash"></textarea></label></section>
<section class="card"><h2>Summary</h2><label>Most important problems first, plus anything confusing, slow or hard to find<textarea id="summary" style="min-height:120px"></textarea></label>
<div class="row"><button id="dl" type="button">Download filled checklist</button><span class="exp" id="saved"></span></div></section>

<script id="data" type="application/json">{"device": "", "tester": "", "build": "ClipForge 1.17.0 (build 136) \u00b7 20 Nov 2026", "version": "", "summary": "", "crash": "", "items": {}}</script>
<script>
const STEPS=[["A. Update", [["p-before", "Before the update: which version is on the phone", "Open ClipForge on the phone. Read the small grey line at the bottom of the project list and write it down. Look at the top of the list for a line \"Version 1.17.0 is available\". If it is not there and the app is older than 1.17.0, tap the three dots (More) at the top right > Check for updates and look again. Do NOT tap Update yet.", "On a phone that still has 1.15 or 1.16: a quiet line \"Version 1.17.0 is available\" with What's new, Update, Later and Skip this version. If the app already shows 1.17.0 (build 136), set Not tested for this step and the next and write how it got there (ask the owner).", ""], ["p-update", "The in-app update to 1.17.0", "Ask the owner: \"May I tap Update now?\" After a yes tap Update, read the window and tap Download and update. Wait for the download. When Android asks to confirm the update, tap Update / Install there (the first time Android may say that installing from ClipForge is not allowed: tap Settings, switch on \"Allow from this source\", go back and confirm). Wait until it is installed and open ClipForge again.", "The window explains that ClipForge downloads the new version, checks it and hands it to Android, which asks you to confirm, and that your projects and videos stay as they are. It shows \"Downloading\u2026 \u2026%\" and \"Checking the download\u2026\", then \"Android is now asking you to confirm the update. If nothing appeared, tap Update again.\" After Android's own install the app opens as 1.17.0. If it says \"The update did not work.\", tap Copy details, ask the owner to paste them into the chat, and set FAIL.", ""], ["p-version", "The app shows 1.17.0, build 136", "Read the grey line at the bottom of the project list. Tap the three dots at the top right, read the list, tap About ClipForge, then Copy version info. Type or paste the version line into \"Version shown in the app\" at the top of this page. Close About.", "Both show version 1.17.0 and build 136, the same as named at the top of this page. No red warning appears under the version box. The three dots list: Settings, What's new, Check for updates | Send feedback, About ClipForge, Copy version info.", ""], ["p-updated", "The result of the update", "Look at the top of the project list. If a line \"Updated to 1.17.0\" is there, tap What's new, go back, then tap the cross of the line. (It appears once. If the owner already closed it, ask what it said and set Not tested with the answer.)", "One quiet line \"Updated to 1.17.0\" with What's new and a cross. What's new opens Help on the page that starts with 1.17.0. No message says that an update did not work. (The note \"Two keys changed\" is for computers: it should NOT appear on the phone. Write it down if it does.)", ""], ["p-keeps", "The update kept the projects", "Read the project list. Open the newest project from before the update, tap Play for 5 seconds, tap the back arrow.", "The projects from before the update are listed; the one you opened shows its clips with pictures and plays. No clip says Missing.", ""]]], ["B. A long video on the phone", [["p-long-import", "Import the longest video", "Ask the owner which video on the phone is the longest (20 minutes or more is best; otherwise the longest there is, and write its length down). Tap New project, choose it in the picker and confirm. Count the seconds. Watch the preview, the save sign at the top and the timeline for two minutes. Tap the name at the top and rename the project to Round 7 phone long.", "The clip is on the timeline within a few seconds with the right length. The preview says \"Loading the video\u2026\" until the first picture is there. The save sign shows saved within about 5 seconds. \"Drawing sound\u2026 1 of 1\" (or \"Drawing sound\u2026\") with a small cross shows at the timeline and goes away later: write down how long it took. FAIL if the app stops reacting to taps for more than a few seconds, or if the line \"Sound waves were paused to keep ClipForge responsive\" appears: then do the step \"The performance log\" at once.", ""], ["p-long-use", "The app answers while the sound waves are drawn", "While \"Drawing sound\u2026\" is shown if you can: drag the timeline to the middle and to the end, tap Play, wait 5 seconds, tap Pause, tap Split and Undo, tap the three dots at the top and close the list. If \"Drawing sound\u2026\" is still there, tap the cross next to it.", "Every tap answers within about a second (mirroring adds its own delay: ask the owner how it felt on the phone itself). While the video plays no new sound wave is started. The cross stops the drawing at once and the rows stay plain.", ""], ["p-long-reopen", "Close and reopen keeps the import", "Go to the project list. Close ClipForge completely (recent apps, swipe it away). Open it again and open \"Round 7 phone long\". Play 10 seconds at the start and near the end.", "The project is there with the long clip (it was not lost) and plays at both places. Ask the owner to watch on the phone: picture and voice in sync.", "watch,listen"], ["p-perf", "The performance log (also at every stall)", "On the project list tap the three dots > Copy version info. Paste it into the note if copying between phone and PC works; otherwise ask the owner to paste it into a notes app, read the last 15 lines and the line that starts with \"Performance log\", and type those into the note.", "\"Version info copied.\" The text has the version line and a part \"Performance log (longest gap \u2026 ms):\" with lines like \"project opened\", \"save start\" / \"save end\", \"sound picture \u2026 start\" / \"end\", \"gap \u2026 ms\". No file names and no project names are in it. Write down the \"longest gap\" number.", ""]]], ["C. Select part (new in 1.17)", [["p-new", "Make the test project", "Tap New project. In the phone's picker choose video A (a talking video filmed wide) and confirm. Rename the project to Round 7 phone. Tap Add > Videos or photos and add video B. Tap Add > Title, type Round 7 and close the sheet. Add three captions with Add > Caption (move the playhead first): at 0:02 \"Sam Taylor: Hello from the phone.\", at 0:06 \"Alex K: Hello back.\", at 0:10 \"Alex K: Let us test the search.\" Add music with Add > Music or sound (My files if the phone has a music file longer than the video, otherwise Find free music, search piano, Use; choose Music if it asks \"What is this sound?\").", "The editor shows A and B with clip pictures, the title, three captions and the music on a sound row. The top shows the back arrow, the name, the save sign, Undo, Redo, Export and three dots.", ""], ["p-part-select", "More > Select part: the handles and the bar", "Tap an empty place so nothing is selected. Move the playhead to 0:05. Tap More, read the heading PART and tap Select part. Read what appears between the timeline and the bottom bar.", "A part of 5 seconds starting at the playhead is highlighted across every row, with two handles (tabs) on the time ruler. A bar shows the start, the end and the length, arrows next to the start and the end, a button that reads \"Step 1 frame\" or \"Step 0.1 s\", a button Actions and a cross. Nothing is changed in the video yet and Undo did not get a new step.", ""], ["p-part-nudge", "Move the edges: arrows, the Step button, the handles", "Tap the arrow that moves the END later three times. Tap the Step button (it changes between \"Step 1 frame\" and \"Step 0.1 s\") and tap the same arrow three times again. Tap the arrow that moves the START earlier twice. Then drag the right handle on the ruler about 3 seconds to the right (through mirroring a drag may fail: try twice, then set Needs the owner for the drag only).", "Each tap moves that edge by one frame or by 0.1 s, as the Step button says, and the times and the length in the bar change with it. Dragging a handle moves that edge; it snaps to cuts, to where speech starts and stops, to markers and to the playhead. Dragging the timeline with one finger still scrolls it.", ""], ["p-part-ways", "The other ways to select, and the cross", "Tap the cross of the bar. Tap the three dots at the top > Select part; tap the cross. Long-press an empty part of the timeline, read the list and tap Select part; tap the cross. Tap clip B, tap More and under PART tap the line that selects this clip's time. Tap More again and read PART. Tap the cross.", "The cross clears the part: band, handles and bar are gone. Select part is in More (under PART), in the three dots at the top and in the list of an empty place. With a clip selected PART also has \"Select this clip's time\", which selects exactly clip B. Once the sound was drawn and talking was found, PART also lists Select this speaker's turn and Select the pause here; with markers, Select between the markers here; with a part selected, Clear the part.", ""], ["p-part-actions", "Actions: the rows and what can be done", "Select a part from about 0:04 to 0:08 (Select part, then the arrows). Tap Actions. Read the sheet from top to bottom. Tap \"Only this\" on the row of the music, look at the tick boxes, then tick every row again.", "A sheet with the rows first (the video, each sound row, titles and captions, the overlay row when there is one), each with a tick box, all ticked, and \"Only this\" next to each; then the actions, each with a line saying what it changes: Cut out, Delete and leave a gap, Silence, Lower volume\u2026, Speed\u2026, Clean up sound here, Make a short from the part\u2026, Duplicate the part, Title over the part, Good moment marker at its start. An action that cannot be used with the ticked rows is grey and says why (\"Not now: \u2026\").", ""], ["p-part-silence", "Silence on the video row only", "Select a part of about 2 seconds where someone talks. Tap Actions, tap \"Only this\" on the Video row, tap Silence. Read the message. Close the part with the cross and play across the place.", "A message like \"Silenced 2.0 s on Video.\" Nothing moves. The slim sound wave of the clip is flat there. Ask the owner to listen on the phone: the voice is silent on that part while the music plays on, without a click; before and after it is normal.", "listen"], ["p-part-lower", "Lower volume\u2026 on the music row", "Select another part of about 3 seconds. Tap Actions, \"Only this\" on the music's row, Lower volume\u2026. Read the window, choose 12 dB and confirm. Play across it. Then tap the music, open its settings (Edit) and look for \"Quiet parts\"; tap Remove on the part and tap Undo.", "A window \"Lower volume\" with 6, 12 and 18 dB and a slider. Afterwards a message like \"Lowered 3.0 s by 12 dB on Music.\" The music is quieter on that part only. The music's settings list it under Quiet parts with Remove; Remove gives the sound back and Undo makes it quiet again. Ask the owner to listen.", "listen"], ["p-part-cut", "Cut out, and why it needs every row", "Write down the length of the video. Select a part of 3 seconds with NO caption on it. Tap Actions, untick the music's row and read the line of Cut out. Tick every row again and tap Cut out. Read the message. Tap Undo, then Redo.", "With a row unticked Cut out is grey and says why (it removes time, so it needs every row; otherwise lips and voice would no longer match). With every row it says \"Cut 3.0 s out of everything.\"; the video is 3 seconds shorter and everything after the part moved up on every row. Undo and Redo are one step each.", ""], ["p-part-gap", "Delete and leave a gap", "Select a part of 2 seconds. Tap Actions, \"Only this\" on the music's row, Delete and leave a gap. Look at the music. Tap Undo.", "The part is removed from the music and a gap is left; the music before and after it stays where it was and nothing else moved (\"Deleted that part on \u2026. Nothing moved.\"). Undo brings it back.", ""], ["p-part-speed", "Speed\u2026 for a part", "Tap clip B, More > PART > Select this clip's time, and move the end 2 seconds earlier with the arrows (Step 0.1 s). Tap Actions > Speed\u2026. Read the window, tap 0.5\u00d7, 0.25\u00d7 and 2\u00d7 and read the line and the tick box each time. Choose 0.5\u00d7 and confirm. Play across it.", "A window \"Speed of this part\" with 0.25\u00d7, 0.5\u00d7, 1.5\u00d7, 2\u00d7, a line saying how long the part will take, the note that music and other sound keep their speed and place, and \"Mute this part's own sound\" (ticked by itself below 0.5\u00d7). Afterwards that part of B plays in slow motion and the music did not move. Ask the owner to watch the phone itself (mirroring stutters).", "watch"], ["p-part-more", "Short, duplicate, title and marker from a part", "Select a part from 0:02 to 0:10. Tap Actions > Good moment marker at its start. Select the part again if it is gone, Actions > Title over the part. Again Actions > Duplicate the part; tap Undo. Again Actions > Make a short from the part\u2026, name it Round 7 phone part short, tap Make the short and Stay here.", "A flag at the start of the part (\"Marked \u2026 as a good moment.\"); a new title that starts and ends with the part; \"A copy of the part is right after it (now selected).\" and the video is longer; a new upright project in the project list while this one is unchanged.", ""]]], ["D. Only when speaking (new in 1.17)", [["p-ows-none", "Without a voice track it says why", "In \"Round 7 phone\" tap an empty place, tap More and read under SOUND the line Only when speaking\u2026. Tap it if it can be tapped.", "Without a voice track the line is grey with \"Not now: \u2026\" and its reason, or a window says that there is no speech track yet and to add a voice. Nothing is changed.", ""], ["p-ows-on", "With voice files: switch it on", "Only if the phone has a video with a sound file per speaker (ask the owner; otherwise set Not tested). New project \"Round 7 phone voices\" with the video; Add > Voice recording, pick the voice files, name the speakers Sam Taylor and Alex K, tap Add and line up. Wait until \"Drawing sound\u2026\" is gone. Tap More > Only when speaking\u2026, switch it on for both voices, leave \"A little room sound (\u221218 dB)\", close. Play 30 seconds where the speakers take turns.", "The voices are lined up, each on its own row named after the speaker. The window \"Only when speaking\" has a switch per voice track and, under \"Between the turns\", A little room sound (\u221218 dB), More room sound (\u221212 dB), Hardly any (\u221230 dB) and silence. With it on, each voice's wave is small where that speaker is silent. Ask the owner to listen with headphones on the phone: the other person's voice is much quieter under each speaker and no word is cut off.", "listen"]]], ["E. Shorts from markers (fixed in 1.17)", [["p-shm-short", "Two markers in a short video", "New project with video B only (shorter than 45 seconds), rename it Round 7 phone markers. Move the playhead to one third and tap Add > Good moment marker; to two thirds and tap More > Good moment marker. Tap More > Shorts and good moments > Make shorts from markers\u2026. Read the title and the two lines with times. Tap Make them, then OK (or Open the first and go back). Count the new projects in the project list.", "The window is titled \"Make 2 shorts from the markers?\"; the two parts are DIFFERENT and neither is the whole video (in a video under a minute each is about half of it, at least 8 seconds). Afterwards \"2 shorts are ready\" lists two projects, and the project list has exactly two new ones. If one could not be made it says \"1 of 2 shorts was made\" with \"Not made: \u2026\": copy it.", ""], ["p-shm-close", "Two markers close together", "Open \"Round 7 phone markers\". Tap the three dots > Markers and remove both markers. Add a marker at one third and another 2 seconds later. Open Make shorts from markers\u2026 again. Read the note and the choice; leave \"One short covering both\" and make it. Count the new projects.", "The window says \"The two markers are close together: their shorts would show mostly the same part.\" with One short covering both (ticked) and Two shorts. The title reads \"Make 1 short from the 2 markers?\" and exactly one new project is made (\"The short is ready\").", ""]]], ["F. Send feedback", [["p-fb-page", "The page, \"What is sent\" and the details tick box", "On the project list tap the three dots > Send feedback. Read the page. Tap Problem, Idea, Praise, Question. Type: TEST from Round 7 phone, please ignore. Leave the e-mail address empty. Read the box \"What is sent\". Find \"Include details about how ClipForge ran\": check it is OFF, tick it, read \"What is sent\" again, and look there for the names of your projects or videos. Go back without sending; open a project and tap its three dots > Send feedback.", "A page with the four kinds, the message box, \"Your e-mail address (optional)\" and a box \"What is sent\" with exactly what goes (kind, message, the app's version and build, the system's name and version) and the sentence that nothing about your projects, file names, videos, photos or music is ever included. The tick box is off; ticked, the performance-log lines are shown in \"What is sent\", with no file or project name in them. The keyboard does not hide the box being typed in. Your text is still there when the page is opened again, from either place.", ""], ["p-fb-send", "Send one test message (only if the owner agrees)", "Ask the owner: \"May I send one test message from the phone, with the details ticked?\" Only after a yes tap Send once. Otherwise set Not tested.", "\"Sent. Thank you!\" and the draft is gone. Without a connection it says \"The message could not be sent. Check the internet connection and try again.\" and offers Open the feedback page in the browser and Copy my message; the text stays.", ""]]], ["G. The bottom bar, Add and More", [["p-bar", "The bottom bar: Add, Text, Split, More", "Open \"Round 7 phone\". Tap an empty place so nothing is selected. Read the bar at the bottom. Move the playhead to the middle of A and tap Split, then Undo.", "With nothing selected the bar has exactly four buttons: Add, Text, Split, More. Split cuts A into two pieces at the playhead; Undo makes it one again.", ""], ["p-add", "The Add sheet: every entry", "Tap Add and read the list. Tap Voice recording and cancel the picker. Tap Add > Overlay (picture-in-picture) and cancel. Tap Add > Subtitle file (.srt) and cancel.", "A sheet \"Add\" lists, each with an icon and one line of explanation: Videos or photos, Music or sound, Voice recording, Title, Caption, Subtitle file (.srt) (new in 1.17), Overlay (picture-in-picture), Good moment marker; one sentence at the bottom says where videos and photos go in. Each picker opens; cancelling adds nothing.", ""], ["p-more", "More with nothing selected", "Tap an empty place, then More. Read the sheet from top to bottom (scroll it) and swipe it down.", "A sheet \"More\" with small headings. CLIP: Trim start to here, Trim end to here, Freeze frame, Remove silences, Good moment marker, Make a short from here, Shorts and good moments. PART: Select part (and the quick selections that are possible). SOUND: Add sound track, Lower music under speech, Only when speaking\u2026, Copy music credits. TEXT: Text, Find in the text, Subtitle file (.srt), Export subtitles (.srt). EDIT: History. A line that cannot be used now is grey and says why underneath (\"Not now: \u2026\"). Nothing about Transcribe speech or Captions from speech is listed.", ""], ["p-clip", "A clip selected: its tools, More, and the + next to Play", "Tap clip A. Read the bottom bar. Tap More and read the sheet. Tap Duplicate in it, then Undo. Tap the + next to the Play button, read, close. Tap Done.", "Bar: Done, Split, Speed, Look, Sound, More, Delete. More: CLIP: Crop and position, Trim start to here, Trim end to here, Freeze frame, Remove silences, Move earlier, Move later, Make a short from here. PART: Select part, Select this clip's time. EDIT: Duplicate, Copy settings, Paste settings, History. SOUND: Separate sound, Put sound back, Lower music under speech. TEXT: Text. Grey lines say \"Not now: \u2026\". The + opens the Add sheet (videos and photos go in after the selected clip). Done clears the selection. Write down anything missing or extra.", ""], ["p-trim", "Trim start to here, Trim end to here; trim by dragging", "Tap clip A, move the playhead 3 seconds into it, More > Trim start to here. Move the playhead to 3 seconds before the end of A, More > Trim end to here. Tap Undo twice. Then drag the right edge of A about 2 seconds to the left (try twice through mirroring).", "Trim start to here makes A start at the playhead; Trim end to here makes it end there; the clips after it move up; each Undo restores one. Dragging an edge trims too (if the drag fails, set Needs the owner for the drag).", ""], ["p-hold", "Hold: the action list; hold and drag: move", "Long-press clip B without moving, read the list, close it. Long-press the title on the timeline, read, close. Long-press an empty part of the timeline, read, close. Then long-press clip B and, still holding, drag it in front of A; let go; Undo. (Try twice; otherwise set Needs the owner.)", "Holding opens a sheet titled Video clip with: Split, Trim start to here, Trim end to here, Duplicate, Copy settings, Paste settings, Freeze frame, Remove silences, Crop and position, Rotate right, Separate sound, Put sound back, Move earlier, Move later, Make a short from here, Delete (and selecting its time). The title's sheet has Edit, Duplicate, Text, Delete. An empty place (\"At 0:\u2026\") has Videos or photos, Music or sound, Voice recording, Title, Caption, Overlay (picture-in-picture), Good moment marker, Split, Make a short from here and Select part. Holding and dragging still moves the clip.", ""], ["p-title-sel", "A title or caption selected", "Tap the title on the timeline. Read the bar. Tap More, read, close. Tap Edit, change the text to Round 7 phone, close the sheet. Tap Done.", "Bar: Done, Edit, Duplicate, More, Delete. More: TEXT: Text, Find in the text, Export subtitles (.srt); PART; EDIT: Duplicate, History. Edit opens the title's settings as a sheet; the new text shows in the preview.", ""]]], ["H. The menu at the top, shape, fades", [["p-top", "The three dots at the top of a project", "Tap the three dots at the top right of the editor. Read the list. Tap History, read, close it.", "The list has: Shape and size, Fade in and out, Select part, Publishing notes, Text, History, Markers, Settings | Help, Send feedback, each with an icon. History opens a sheet with your changes by name, newest first; tapping an older one goes back to that point.", ""], ["p-shape", "Shape and size", "Tap the three dots > Shape and size. Read the sheet. Tap 1080p (Full HD). Tap \"Which shape should I use?\" and go back from Help. Tap 9:16 upright and close the sheet.", "SHAPE: Original (as the first clip), 9:16 upright, 16:9 wide, 1:1 square, 4:5 upright; VIDEO SIZE: Same as the first clip, 720p, 1080p (Full HD), 4K; a tick marks the current ones. The question opens the help article about shapes. The preview becomes upright.", ""], ["p-fades", "Fade in and out", "Tap the three dots > Fade in and out. Set Fade in from black and Fade out to black to about 2 s each. Close the sheet. Play the first 3 seconds.", "The video comes up from black at the start. Ask the owner to watch the phone.", "watch"]]], ["I. Picture and titles", [["p-look", "Fit, Fill, Blur and filters; Copy and Paste settings", "Tap clip A, tap Look. Choose Fit, Blur, then Fill. Tap Warm, Cool, Black & white, Vintage, Vivid, None in turn, then Vintage. Close the sheet. More > Copy settings. Tap clip B, More > Paste settings.", "Fit shows the whole wide picture with bars, Blur fills the bars with a blurred copy, Fill fills the upright frame. Each filter changes the preview at once. After pasting, B has the same look and fit and keeps its own length.", ""], ["p-crop", "Crop and position", "Tap clip A, More > Crop and position. Drag a corner of the frame inwards, then drag inside the frame (try twice). Tap 1:1, 9:16, Free, Original. Tap the rotate and flip buttons once each, then Reset crop and position. With Fill, move Left \u2013 right to keep the person in the middle. Tap Done.", "The sheet shows the whole picture with a frame and grips and the outside dimmed, and does not cover the frame. 1:1 and 9:16 keep their shape; rotate turns a quarter turn, flip mirrors, Reset puts everything back; Left \u2013 right chooses which part fills the frame. (If the drags fail through mirroring, set Needs the owner for the drags.)", ""], ["p-speed", "Speed, freeze frame, transition", "Tap clip B, tap Speed, choose 0.5\u00d7 then 2\u00d7 then 1\u00d7. More > Freeze frame with the playhead in the middle of B; Undo. Look in B's tools for the transition and the clip's fades, choose Crossfade and play across the start of B.", "Speed changes the clip's length and pace. Freeze frame holds the picture under the playhead as a new item; Undo removes it. The transition changes how A turns into B. Ask the owner to watch the phone and to listen: at 0.5\u00d7 the voice is slower, not deeper.", "watch,listen"], ["p-overlay", "Overlay (picture-in-picture), and its More", "Tap Done. Move the playhead to 0:03. Tap Add > Overlay (picture-in-picture) and pick video B. Tap the overlay on its row; read the bar; open Layout: another corner, Size about 50 %, White frame on; try Side by side and Full screen, then Picture-in-picture again. Tap More and read it. Play across the overlay.", "B appears small in a corner from 0:03 on an Overlay row above the clips. Corner, Size, White frame and the layouts change it at once. An overlay has More now (new in 1.17): CLIP: Crop and position, Rotate right; PART; EDIT: History. Ask the owner to watch the phone: both videos move.", "watch"], ["p-title", "Title: fonts, styles, position, animation; Hebrew and Russian", "Tap the title, tap Edit. Tap each Font (Classic, Modern, Elegant, Handwritten), two Styles, switch on Outline, tap Position Top and Lower third, set Appear to Pop. Close. Then Add > Title and paste or type: \u05e9\u05dc\u05d5\u05dd \u05e2\u05d5\u05dc\u05dd / \u041f\u0440\u0438\u0432\u0435\u0442, \u043c\u0438\u0440 . Play from 0:00.", "Fonts and styles change the letters; Outline draws a line around them; Top / Lower third move the text; the sheet scrolls and the keyboard does not hide the text box. Hebrew and Russian letters show properly, Hebrew right to left. On play the title pops in.", ""]]], ["J. Sound", [["p-tracks", "Sound tracks", "On the left edge of the timeline tap the add-track icon (\"Add sound track\"), or More > Add sound track. Tap the icon of the new track: a sheet opens. Change Volume, switch Mute on and off, read the other lines, tap Delete track. Then tap the film icon (Video sound) and switch Mute on and off.", "A new sound row appears and a message names it. The sheet has Name, Volume, Mute, Solo, Lower this track under speech, This track is speech, Only when speaking, Move up, Move down and Delete track. While a part is selected each row icon also has a tick box. The film icon opens the settings of the video's own sound.", ""], ["p-separate", "Separate sound, Put sound back", "Tap clip A, More > Separate sound; confirm (leave \"Also the other clips\" off). Play that piece. Then tap the clip, More > Put sound back.", "The clip's sound appears as its own piece on a Voice row and the clip shows as muted; Put sound back removes it again. Ask the owner to listen on the phone: the voice is heard once (no echo) and matches the lips.", "listen"], ["p-silences", "Remove silences", "Tap clip A (the talking video), More > Remove silences. Wait for the result. Tap Fewer cuts, Automatic, More cuts and write down the gap count of each. Choose Automatic and tap the Remove \u2026 gaps button. Play across two cuts. Tap Undo once.", "A progress bar with Cancel, then a line about the background noise and a button like \"Remove 5 gaps\". After applying, the clip is several pieces and the phone does not freeze for long. One Undo brings the single clip back. Ask the owner to listen: words are not chopped.", "listen"], ["p-clean", "Clean up sound and Voice focus", "Tap clip A, tap Sound, switch on Clean up sound and wait; then set Voice focus to about 50 % and wait. Play the clip. Read the clip's Volume and Mute there too.", "The clip shows \"Sound \u2026%\" while it works and then finishes (write down roughly how long). Ask the owner to listen on the phone: less background noise, voice in sync.", "listen"], ["p-music", "Music: Find free music, credits, Fit to video, lower under speech", "Tap Add > Music or sound > Find free music, search piano, play one preview. (Do not add a second music if one is there.) Tap the music on its row, open its settings (Edit): read them, tap Copy credits, tap Add credits at the end, tap Fit music to video. Then tap an empty place, More > Lower music under speech; open More again and read the line.", "Results show title, artist, length and licence; the preview plays (it needs internet: otherwise copy what it says). The music's settings show Volume, Fade in, Fade out, Fit music to video, Track, Credits and its Quiet parts. Add credits at the end puts a caption over the last 4 seconds. Fit music to video makes it end with the video (\"The music now ends with the video, with a 2-second fade-out.\"). Lower music under speech shows as on afterwards.", ""]]], ["K. Settings and suggestions", [["p-settings", "The Settings page", "Tap the three dots > Settings. Read the page. Go back. From the project list tap its three dots > Settings and go back.", "A page \"Settings\" with: Editing (Snap to playhead and edges, Show sound waves, Smooth preview), Export (Use graphics card (faster)), Suggestions (Show suggestions; \"Show hidden suggestions again (\u2026)\"), Updates (Check for updates automatically, Check now, the version line), About (About ClipForge, Copy version info, What's new, Licences, Send feedback). There is NO part \"Text window\" and NO part \"Claude\" on the phone.", ""], ["p-set-switches", "The switches change the app and are remembered", "Open Settings, switch Show sound waves OFF, Snap to playhead and edges OFF and Smooth preview OFF. Go back and look at the timeline. Close ClipForge completely, open it again, open the project and Settings. Switch all three ON again. Tap Check now.", "With Show sound waves off the waves are gone at once (and a drawing that was running stops). After reopening, all three switches are still off. Back on, the waves return. Check now says \"You have the newest version (1.17.0 (build 136)).\" Ask the owner, with a finger, whether dragging the end of the title jumps onto the playhead with snapping on and not with it off (otherwise set Partial).", ""], ["p-sg", "Suggestions: the line above the bottom bar", "In \"Round 7 phone\" (upright, with a wide clip and music) wait a second without playing and read the thin line just above the bottom bar. Write it down. Tap the three dots ON THAT LINE > Don't show again. Open Settings, read the button under Show suggestions, tap it, go back. When a line is back, tap its button. Tap Play and look where the line was. Swipe the next line sideways off the screen (or tap its cross).", "One line at a time, for example \"A clip has another shape than the video, so it gets bars.\" (Fill, Blur, Crop\u2026), \"The music is longer than the video.\" (Fit to video), \"Music plays while someone is talking.\" (Lower the music). Don't show again hides it; Settings shows \"Show hidden suggestions again (1)\" and brings it back. The button does what it says. While playing the line is hidden. A swiped line does not come back in this project. With two voice tracks: \"Two microphones: each one also picks up the other speaker and the room.\"", ""]]], ["L. The Text page", [["p-text-open", "Text: read, search, tap to jump", "Tap an empty place, then Text in the bottom bar. Read the page. Tap the sentence \"Hello back.\" and look at the playhead when you return. Open Text again, tap into \"Find in the text\u2026\" and type: hello. Then: xyzzy.", "A full-screen page \"Text\" shows the captions as a readable page: \"Sam Taylor\" once above his line and \"Alex K\" once above the two that follow, each with a coloured bar and the time. Tapping a sentence moves the playhead to it. The search marks and counts the places (\"1 of 2\"); xyzzy gives \"Not found\". Nothing offers to transcribe speech.", ""], ["p-text-edit", "Edit a caption; a short from a line", "In Text tap the sentence \"Let us test the search.\" and tap Edit. Change it to \"Let us test the phone.\" and tap Save. Tap Undo, then Redo. Open Text, tap the first sentence, tap Make a short from this\u2026; tap 30 s, 45 s, 60 s, 30 s; name it Round 7 phone short; tap Make the short and Stay here.", "Tapping a sentence shows a bar with Edit, Delete caption and Make a short from this\u2026. After Save the page and the preview show the new words; Undo and Redo switch. The window \"Make a short\" has The selection, 30 s, 45 s, 60 s, the line with the times, Start and end at a pause, Short caption look, Title at the top and the name; afterwards \"The short is ready\" with Stay here and Open it.", ""]]], ["M. Markers and shorts", [["p-marker", "Good moment markers and the lists", "Move the playhead to one third of the video and tap Add > Good moment marker; to two thirds and tap More > Good moment marker. Tap the three dots at the top > Markers; close. Tap More > Shorts and good moments and read the sheet. Tap Make shorts from markers\u2026, read, tap Make them, then Open the first; play 5 seconds and go back.", "Each marker is a flag on the ruler (\"Marked a good moment at \u2026\" with Undo). Markers opens \"Good moments\" with both, each with \"Make a short around it\" and \"Remove the marker\". The sheet \"Shorts\" has Good moment marker, Good moments (2)\u2026, Make a short from here\u2026 and Make shorts from markers\u2026. As many shorts are made as the window's title says; they are upright and play; this project is unchanged. Ask the owner to look at one short on the phone: captions bigger, in the lower middle, outlined.", "watch"]]], ["N. Export, share, publishing notes", [["p-notes", "Publishing notes", "Tap the three dots > Publishing notes. Type a Title (Round 7 phone video) and a Description (one sentence). Tap the copy button next to Title. Tap Chapters from titles / captions\u2026 and read what it says. Tap Done.", "A full-screen page \"Publishing notes\" with Title, Description, Hashtags and Chapters, each with a copy button, \"A different title for Shorts, Reels and TikTok\", Copy title and description and Done. The keyboard does not hide the field being typed in.", ""], ["p-exp-dest", "Export for a destination", "Tap Export at the top. Tap each choice under \"Where is it going?\" once and read its line. Choose WhatsApp / Telegram, read the size it shows, and tap Export. Wait and read the finished screen (stay on it).", "Choices: YouTube, Shorts / Reels / TikTok, Instagram post, WhatsApp / Telegram, Podcast audio, Custom. The project is upright, so YouTube asks about the shape, naming both the same way (\"Your video is 9:16 upright; this needs 16:9 wide\") with Make a copy in this shape and Export as it is. WhatsApp / Telegram shows the size that is really written (for an upright video 720 \u00d7 1280). The export runs to 100 %, then \"Video saved\" and \"Saved to \u2026\" (the gallery). \"Keep ClipForge open while it exports.\" shows while it runs.", ""], ["p-share", "Share, and Copy title and description", "On the finished screen tap Share. Look at Android's share sheet and close it WITHOUT choosing an app. Tap Copy title and description. Tap Done.", "Share opens Android's own share sheet with the video (nothing is sent). A note says that many apps ignore text shared with a video, which is why Copy title and description stays on screen; it copies the title and description from the notes.", ""], ["p-exp-several", "Export several into a gallery album", "Tap Export > Export several\u2026. Tick WhatsApp / Telegram and Podcast audio only. Read the line under the list. Tap Export 2 files and wait. Then open the phone's Gallery app, find the album Round 7 phone and play its video for 10 seconds.", "Each tick shows its file name. The line says \"2 files, about \u2026 together. The videos go to your gallery, in an album called \"Round 7 phone\".\" One progress bar (\"1 of 2: \u2026\"), then \"Files saved\" with Share and Copy title and description. The album holds the video. Ask the owner to watch and listen on the phone: upright, fade from black, captions readable, the silenced and the quieter part as in the preview, voice in sync.", "watch,listen"], ["p-exp-custom", "Custom: full quality, small file, sound only", "Tap Export > Custom. Full quality: write down the \"File size: about \u2026\" line, export, and write down how long it took. Then Small file. Then Make: sound only (M4A), and MP3. Compare the two videos' sizes in the Gallery.", "Each finishes (\"Video saved\" / \"Sound saved\"). The small file is clearly smaller. For sound only the picture settings are hidden and Share offers the file. If MP3 says to export as M4A instead, write that down exactly.", ""], ["p-exp-bg", "Leave the app, and screen off, during an export", "Start a Full quality export. At about 20 % press the phone's Home button, wait 30 seconds and return to ClipForge. Start one more export and do not touch the phone until it is finished.", "Write down exactly what happened: it kept running and finished (a notification keeps it running) / it stopped with a message and Try again. No half-finished video appears in the gallery. With the phone left alone the screen stays on and the export finishes.", ""], ["p-exp-long", "Export the long project (last, and let it run)", "Open \"Round 7 phone long\", tap Export > WhatsApp / Telegram (or Custom > Small file) and export. Leave the phone alone, on the charger. Write down the project's length, the time it took and the file size. Afterwards do Copy version info as in group B.", "The progress moves steadily to 100 % and it finishes; the video in the gallery has the project's length and plays to the end. Ask the owner to watch the last minute: picture and voice still in sync.", "watch,listen"]]], ["O. Files, rotation, what is not on a phone", [["p-project-menu", "Project cards: Rename, Duplicate, Share project file, Delete", "On the project list tap the three dots on the card of \"Round 7 phone markers\". Tap Duplicate. On the copy tap Rename and give it the name of the original. Tap Share project file on the copy; look at the share sheet and cancel. Delete the copy.", "The card menu has Rename, Duplicate, Share project file and Delete. A name that is taken gets \"(2)\". Share project file shows \"Packing \u2026\" and Android's share sheet with one file ending in .clipforge.zip; cancelling sends nothing. Delete asks first.", ""], ["p-reopen", "Close and reopen: the media is still there", "Close ClipForge completely. Open the Gallery app, look at two photos, close it. Open ClipForge and \"Round 7 phone\". Play 5 seconds.", "All clips are there with their pictures, the music is there, and everything plays. No clip is red or says Missing. (If an older project shows a Missing clip: tap it, Find file > Search the gallery, and write down what it says.)", ""], ["p-rotate", "The phone on its side", "Ask the owner to switch auto-rotate on and turn the phone on its side with the project open, then back upright.", "Write down what happens. On a wide enough screen the editor changes to the computer's layout (side panel, the strip \"Drag here to select a part\" under the ruler); otherwise it keeps the phone layout. In both cases nothing is lost: the project, the playhead, the selection and a selected part are still there, and the app does not close.", ""], ["p-help", "Help and the tour on the phone", "On the project list tap ? (Help). Search for: select a part, only when speaking, feedback, stutter. Open one article. Start the tour and go through it with Next to the end.", "The searches find \"Select a part\", \"Only when speaking\", \"Send feedback\" and \"Smooth preview on phones\"; the article names the phone's way (More > Select part, the handles, Actions). The text fits the screen and scrolls. Each tour step highlights a real button and its text fits the screen.", ""], ["p-none", "Nothing about speech-to-text or Claude on the phone", "Look for the words Transcribe, Captions from speech, Remove filler words, Automatic cuts and Claude in: both three-dot menus, Settings, the Add sheet, More (nothing selected and a clip selected) and the Text page.", "None of these places has an item about speech to text or about Claude. (Help may have articles marked \"computer only\".) Write down any place where such an item shows up.", ""], ["p-final", "Everything was saved", "Open \"Round 7 phone\" once more and look through it. Then do Copy version info one last time (as in group B) and give the owner's reading of the \"longest gap\" in the Summary.", "Everything is as you left it: 9:16 upright, the look, the title, three captions (the last one edited), fades, the music with its quiet part, the silenced part, the slow part of B, the flags, the publishing notes.", ""]]]];const INSTR="You are testing ClipForge 1.17.0 (build 136), a video editor, on the owner's Android phone. You work on the owner's Windows PC and see and touch the phone through \"Link to Windows\" (the PC app is called Phone Link): the phone's screen is shown in a window on the PC. This checklist page is open in a browser on the PC. Problems are expected; your job is to find them and write them down precisely. This round goes through EVERY phone feature, the new and risky things first. It has 65 numbered steps in 15 groups (A to O). Speech to text and Claude control are computer only and are not part of this page.\n\nMEDIA FOLDER: <owner fills in>\n\nHOW TO DRIVE THE PHONE\n- In the phone window a mouse click is a tap, holding the mouse button down for a second is a long-press, and click-and-drag is a drag or a swipe. There are no keyboard shortcuts and no menu bar on the phone: use only what is on the phone's screen.\n- If the phone screen is not shown, ask the owner to open Phone Link on the PC and choose the phone's screen, and to unlock the phone. If the mirrored screen goes black or locks, ask the owner to unlock it.\n- Drags, swipes and long-presses often fail through mirroring. Try twice. If it still fails, use the button the step offers instead; otherwise set \"Needs the owner\", write that it could not be performed through mirroring (it may work fine with a finger), and ask the owner to try it with a finger if they are there.\n- Typing: tap into the text box on the phone and type on the PC keyboard.\n- SOUND: the phone's sound may not reach you through mirroring. Never judge sound yourself. For every step tagged \"ask the owner to listen\", do the actions, then ask the owner in the chat. The same goes for smoothness: mirroring stutters by itself, so for steps tagged \"ask the owner to watch\" ask the owner to look at the phone itself. Write the answer in the note starting with \"Owner:\" and set PASS or FAIL from it. If the owner is not available, set \"Needs the owner\".\n\nHOW THE PHONE APP IS LAID OUT IN 1.17 (names as on the screen)\n- Project list: New project and Open project file; ? (Help) and three dots (Settings, What's new, Check for updates, Send feedback, About ClipForge, Copy version info) at the top; each project card has three dots: Rename, Duplicate, Share project file, Delete.\n- Editor, top: back arrow, the project's name, the save sign, Undo, Redo, Export and three dots (Shape and size, Fade in and out, Select part, Publishing notes, Text, History, Markers, Settings, Help, Send feedback).\n- Bottom bar with nothing selected: Add, Text, Split, More. Add opens one list of everything that can be added. More lists the rest under the headings Clip, Part, Sound, Text, Edit.\n- With something selected the bar shows that item's tools and More; Done clears the selection. A + next to Play opens the Add list while something is selected.\n- A selected part of the timeline has two handles on the ruler and its own bar between the timeline and the bottom bar: start, end, length, arrows, Actions and a cross.\n- A thin line with a tip and a button may appear just above the bottom bar: a suggestion. Outside the group that tests them leave it alone.\n- Sheets open from the bottom; swipe them down or tap outside to close them.\n\nBEFORE YOU START\n- Fill in \"Device\" (for example \"Samsung Galaxy S23, Android 15, via Link to Windows\") and \"Tester\".\n- Do group A first: it updates the app. Then fill in \"Version shown in the app\": project list > three dots > About ClipForge > Copy version info, then type or paste the line. If it does not match the build named at the top of this page (a red warning appears), tell the owner and say so in the Summary.\n- Test files must be ON THE PHONE (ask the owner which ones to use; the MEDIA FOLDER named above is where the same files are on the PC, in case the owner wants to copy one over): A. a talking video filmed wide (landscape), 1-3 minutes; B. a short video under 45 seconds; the longest video the phone has (20 minutes or more is best); optional: a music file longer than video A (otherwise the app's own Find free music is used, which needs internet), and a video with one sound file per speaker. Do not download files in any other way.\n- Do the groups in order: later steps build on the project \"Round 7 phone\". If time runs out, groups A to F matter most; say in the Summary where you stopped.\n\nIF CLIPFORGE STOPS ANSWERING ON THE PHONE\n- Write down the time, the step and what was on screen (\"Drawing sound\u2026 1 of 1\", \"Loading the video\u2026\"). Wait two minutes. If it does not come back, close it from the recent-apps view and open it again.\n- Then tap the three dots on the project list > Copy version info and get the text to the owner (paste it into a notes app on the phone): it carries the performance log, also of the run that stopped. Put what you can read of it into the Crash box. Do the same if the line \"Sound waves were paused to keep ClipForge responsive\" appears.\n\nRULES\n- Each step has \"Do\" (exact actions) and \"Expected\" (what should happen). Do the actions exactly, then compare with Expected.\n- For each step choose a Result and write a Note. Result meanings: PASS = you saw exactly the expected result (or the owner confirmed it). FAIL = something was wrong (write what you did, what happened, and what you expected). Partial = part of it worked (say which part). Not tested = you could not do it (say why). Needs the owner = only a person can judge or perform it and the owner was not available.\n- NEVER delete, move or rename the owner's photos, videos or music, in ClipForge's pickers, in the Gallery or in any other app. Do not uninstall ClipForge (that deletes the projects). Inside ClipForge only delete things this test made. Do not send or share anything to other people or apps: when a share sheet opens, choose nothing and go back.\n- Ask the owner before you tap Update or Send (feedback).\n- Exported videos go to the phone's gallery; leave them there for the owner.\n- If an Android permission dialog appears (photos and videos, music, notifications, installing from this source), allow it and write down that it appeared.\n- Do not guess. Only mark PASS for what you actually saw, or for what the owner told you they heard or saw.\n- This page keeps your answers in this browser as you go. When finished, fill in the Summary box (the long video first, then the most important problems; also what was hard to do through mirroring), then click \"Download filled checklist\" and give the downloaded file (ClipForge-Test-Round-7-phone-results-\u2026.html) to the owner, who sends it back.";
const OPTS=["", "PASS", "FAIL", "Partial", "Not tested", "Needs the owner"];const TAGS={"listen": "ask the owner to listen", "watch": "ask the owner to watch"};const NUM=true;const RESULT="Result";const NOTE="What happened? Start with Owner: for what the owner saw or heard";
let data=JSON.parse(document.getElementById('data').textContent);
try{const s=localStorage.getItem('clipforge-round7-phone');if(s){const l=JSON.parse(s);if(l&&l.items)data=Object.assign(data,l);}}catch(e){}
document.getElementById('instr').textContent=INSTR;document.getElementById('build').textContent=data.build;
const root=document.getElementById('steps');
let stepNo=0;
for(const [group,items] of STEPS){const h=document.createElement('h2');h.textContent=NUM?group+' ('+items.length+(items.length===1?' step)':' steps)'):group;root.appendChild(h);
 for(const st of items){const five=st.length>4,id=st[0],title=st[1],act=five?st[2]:'',exp=five?st[3]:st[2],tag=st[st.length-1];const it=data.items[id]||(data.items[id]={status:"",note:""});
  const c=document.createElement('article');c.className='card step';c.dataset.s=it.status;
  stepNo++;const t=document.createElement('h3');t.textContent=NUM?stepNo+'. '+title:title;for(const k of (tag?tag.split(','):[])){const g=document.createElement('span');g.className='tag';g.textContent=TAGS[k]||k+' only';t.appendChild(g);}
  const d=document.createElement('p');d.className='do';d.textContent='Do: '+act;
  const p=document.createElement('p');p.className='exp';p.textContent='Expected: '+exp;
  const row=document.createElement('div');row.className='row';const sel=document.createElement('select');sel.setAttribute('aria-label',RESULT+': '+title);
  for(const o of OPTS){const op=document.createElement('option');op.value=o;op.textContent=o||RESULT+'...';if(o===it.status)op.selected=true;sel.appendChild(op);}
  row.appendChild(sel);const ta=document.createElement('textarea');ta.setAttribute('aria-label','Note: '+title);ta.placeholder=NOTE;ta.value=it.note;
  sel.addEventListener('change',()=>{it.status=sel.value;c.dataset.s=sel.value;save();});ta.addEventListener('input',()=>{it.note=ta.value;save();});
  if(act)c.append(t,d,p,row,ta);else c.append(t,p,row,ta);root.appendChild(c);}}
for(const k of ['device','tester','version','summary','crash']){const e=document.getElementById(k);e.value=data[k]||'';e.addEventListener('input',()=>{data[k]=e.value;save();});}
function counts(){const n={};let total=0;for(const [,items] of STEPS)for(const [id] of items){total++;const s=data.items[id].status||'Not done yet';n[s]=(n[s]||0)+1;}
 const el=document.getElementById('counts');el.textContent='';for(const [k,v] of Object.entries(n)){const s=document.createElement('span');s.textContent=k+': '+v;el.appendChild(s);}const s=document.createElement('span');s.textContent='Total: '+total;el.appendChild(s);}
function vcheck(){const v=(data.version||'').trim();const w=document.getElementById('vwarn');
 const b=data.build||'';const m=b.match(/\d+\.\d+\.\d+ \(build \d+\)/)||b.match(/\d+\.\d+\.\d+/);const h=b.match(/\b([0-9a-f]{7,40})\s*$/);
 const bad=m&&!v.includes(m[0])?m[0]:(h&&!v.includes(h[1].slice(0,7))?h[1].slice(0,7):'');
 w.textContent=!v?'Please paste the version shown in the app (required).':(bad?'This is not the build named above ('+bad+'). Say so in the Summary.':'');}
function save(){counts();vcheck();try{localStorage.setItem('clipforge-round7-phone',JSON.stringify(data));document.getElementById('saved').textContent='Saved in this browser.';}catch(e){}}
counts();vcheck();
document.getElementById('dl').addEventListener('click',()=>{
 if(!(data.version||'').trim()&&!confirm('"Version shown in the app" is empty. Download anyway?'))return;
 const clone=document.documentElement.cloneNode(true);clone.querySelector('#data').textContent=JSON.stringify(data).replace(/</g,'\\u003c');
 clone.querySelector('#steps').innerHTML='';
 const blob=new Blob(['<!doctype html>\n'+clone.outerHTML],{type:'text/html'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);
 const d=(data.device||'device').replace(/[^A-Za-z0-9]+/g,'-').slice(0,30);a.download='ClipForge-Test-Round-7-phone-results-'+d+'.html';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1000);});
</script></body></html>
