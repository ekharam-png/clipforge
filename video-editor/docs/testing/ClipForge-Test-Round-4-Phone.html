<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ClipForge test round 4: Android phone</title>
<style>
:root{--bg:#f5f6fa;--card:#fff;--fg:#161a26;--muted:#5b6274;--line:#dfe2ec;--accent:#4257d6;--ok:#1f7a4d;--bad:#a8322b;--part:#9a5b00;--human:#6a3fb0}
@media (prefers-color-scheme:dark){:root{--bg:#0f1118;--card:#181b25;--fg:#eceef5;--muted:#9aa1b5;--line:#2a2f3f;--accent:#8c9bff;--ok:#6fd3a0;--bad:#ff9c94;--part:#f0b95a;--human:#c3a6ff;color-scheme:dark}}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}
.wrap{max-width:900px;margin:0 auto;padding:28px 16px 64px;display:flex;flex-direction:column;gap:20px}
h1{margin:0;font-size:1.8rem}h2{margin:8px 0 0;font-size:1.2rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:8px}
.instr{white-space:pre-wrap;font-size:.95rem}
.step{border-left:6px solid var(--line)}
.step[data-s="Works"]{border-left-color:var(--ok)}.step[data-s="Problem"]{border-left-color:var(--bad)}.step[data-s="Partial"]{border-left-color:var(--part)}.step[data-s="Needs a person"]{border-left-color:var(--human)}
.step[data-s="PASS"]{border-left-color:var(--ok)}.step[data-s="FAIL"]{border-left-color:var(--bad)}.step[data-s="Needs the owner"]{border-left-color:var(--human)}
.do{margin:0;font-size:.95rem}
.step h3{margin:0;font-size:1.02rem}.exp{color:var(--muted);font-size:.93rem;margin:0}
.tag{font-size:.75rem;font-weight:600;border:1px solid var(--line);border-radius:999px;padding:1px 8px;margin-left:6px;color:var(--muted)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
select,input,textarea,button{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px}
textarea{width:100%;box-sizing:border-box;min-height:64px}
button{cursor:pointer;background:var(--accent);color:#fff;border:0;font-weight:600;padding:10px 16px}
.counts{display:flex;gap:16px;flex-wrap:wrap;font-weight:600}
label{display:flex;flex-direction:column;gap:4px;font-size:.9rem;color:var(--muted)}
</style></head><body><div class="wrap">
<header class="card"><h1>ClipForge test round 4: Android phone</h1>
<p class="exp">Build: <b id="build"></b>. Fill in each step, then click <b>Download filled checklist</b> at the bottom and send the file back to Claude.</p>
<div class="row"><label>Device<input id="device" placeholder="e.g. Samsung Galaxy S23, Android 15, via Phone Link"></label><label>Tester<input id="tester" placeholder="e.g. ChatGPT agent, or your name"></label></div>
<label>Version shown in the app (required: About ClipForge &gt; Copy version info, then paste here)<textarea id="version" placeholder="ClipForge X.Y.Z (build N) · date, time UTC · commit" style="min-height:56px"></textarea></label>
<p class="exp" id="vwarn" style="color:var(--bad);margin:0"></p>
<div class="counts" id="counts"></div></header>
<section class="card"><h2>Instructions for the tester (person or AI agent)</h2><div class="instr" id="instr"></div></section>
<div id="steps" style="display:flex;flex-direction:column;gap:20px"></div>
<section class="card"><h2>Crash or freeze</h2><label>If the app closed by itself or froze: what were you doing? (include any message Android showed)<textarea id="crash"></textarea></label></section>
<section class="card"><h2>Summary</h2><label>Most important problems first, plus anything confusing, slow or hard to find<textarea id="summary" style="min-height:120px"></textarea></label>
<div class="row"><button id="dl" type="button">Download filled checklist</button><span class="exp" id="saved"></span></div></section>
</div>
<script id="data" type="application/json">{"device": "", "tester": "", "build": "ClipForge 1.9.0 (build 34) \u00b7 17 Nov 2026, 13:07 UTC \u00b7 1355148", "version": "", "summary": "", "crash": "", "items": {}}</script>
<script>
const STEPS=[["Install and first start", [["p-install", "Install 1.9.0 over the version that is on the phone", "Do NOT uninstall the old ClipForge first. Before installing, open the old ClipForge and write down the names of the projects in the list (or \"no projects\"). Then ask the owner to download the new APK on the phone (the file ending in -android.apk) and tap it. If Android says the browser may not install unknown apps: tap Settings, switch on Allow from this source, go back, tap Install (or Update).", "Android offers Update (not a fresh install) and finishes without \"App not installed\". If it says \"App not installed\" or asks to uninstall first, write the exact text and stop this step as FAIL (do not uninstall without asking the owner: that deletes the projects).", ""], ["p-version", "The app shows the expected version", "Open ClipForge. Read the small grey line at the bottom of the project list. Tap the three dots (More) at the top right, tap About ClipForge, then Copy version info. Type or paste the version line into \"Version shown in the app\" at the top of this page (if copy and paste between phone and PC does not work, type the line you see).", "Both show version 1.9.0 and the same build as named at the top of this page. No red warning appears under the version box.", ""], ["p-keeps", "The update kept the projects", "Compare the project list with the names you wrote down before installing. Open the newest of the old projects, play 5 seconds, go back to the project list (the back arrow at the top left).", "Every project from before the update is still listed, opens without an error and plays. No clip says Missing. (If there were no projects before, set Not tested.)", ""], ["p-tour", "The tour", "On the project list tap ? (Help) at the top and start the tour (on a first start a dialog \"Would you like a quick tour?\" offers Show me around / Not now: choose Show me around). Go through it with Next to the end.", "Each step highlights a real button on the phone screen and its text fits on the screen (nothing cut off, Next / Back / Skip tour reachable). At the end it asks whether to keep or delete the sample project: choose delete.", ""]]], ["Adding media, and the \"File not found\" fix", [["p-new", "New project from the gallery", "Tap New project. The phone's own picker opens: choose camera video A (a talking video) and photo D from the gallery and confirm. When the editor opens, tap the + next to the Play button, tap Videos or photos and add video B.", "The editor opens with A and D on the timeline, each with clip pictures, and B is added after them (after the selected clip or the clip at the playhead). The top shows Saved (or Saving\u2026 briefly). A short wait with a progress message while files are copied is fine.", ""], ["p-reopen", "Close and reopen: the files are still there", "Go back to the project list. Close ClipForge completely: open the phone's recent-apps view and swipe ClipForge away. Open ClipForge again and open the project.", "All three clips are there with their pictures and play. No clip is red or says Missing, and no \"File not found\" message appears. (This was the main bug of earlier builds: ClipForge now keeps its own copy of every file.)", ""], ["p-reboot", "Still there after other apps and a wait", "Go back to the project list. Open the phone's Gallery app, look at two photos, open the Camera app and close it again. Wait one minute. Return to ClipForge and open the project again.", "The clips are still there and play. No Missing clip.", ""], ["p-find", "Find file\u2026 > Search the gallery", "Only if any project on the phone shows a clip marked Missing (look through the older projects; otherwise set Not tested and write \"no missing clip\"). Tap the missing clip, tap Find file in the bar at the bottom. A dialog asks \"Where is <name> now?\": tap Search the gallery. If Android asks whether ClipForge may see photos and videos, allow it.", "It shows \"Searching the gallery for <name>\u2026\", then offers the matching file(s). After choosing one the clip is no longer Missing and plays. If nothing is found it says so and offers to choose the file yourself. Write down exactly what it said.", ""]]], ["Cutting", [["p-select", "Select a clip, play, scrub", "Tap clip A on the timeline. Tap Done in the bar at the bottom. Tap Play, let it run 5 seconds, tap Pause. Drag the timeline left and right with one finger.", "Tapping a clip selects it (the bar at the bottom changes to Done, Split, Speed, Look, Sound, More, Delete) and the preview jumps to it. Done clears the selection (the bar shows Add media, Music, Overlay, Title, Captions, Split, More). Dragging the timeline moves the playhead and the picture follows.", ""], ["p-split", "Split, delete, undo, redo", "Move the playhead to the middle of clip A and tap Split. Tap the second piece, tap Delete. Tap the Undo arrow at the top once, then the Redo arrow, then Undo again.", "Split cuts A into two pieces. Delete removes the selected piece. Undo brings it back, Redo removes it again, the second Undo brings it back: A ends in two pieces.", ""], ["p-trim", "Trim by dragging the end of a clip", "Tap the first piece of A. Drag its right edge about 2 seconds to the left. Then long-press clip B and drag it in front of the photo. (Through screen mirroring a drag or long-press may fail: try twice, then use More > Move earlier for the reorder, and set Needs the owner for the trim.)", "The clip gets shorter and the following clips close the gap. B moves to its new place. The total length at the top changes accordingly.", ""], ["p-history", "History", "Tap Done so nothing is selected. Tap More in the bar at the bottom, then History. Tap the oldest step in the list, then the newest.", "A sheet lists your changes by name, newest first (for example \"Split clip 1\", \"Deleted clip 2\"). Tapping an old step puts the project back to that point (later steps look grey); tapping the newest restores everything.", ""]]], ["Shape, size, crop and position", [["p-shape", "Shape and Video size", "Tap the Shape button at the top (next to Export). Tap 9:16 upright. Open it again and look at the Video size choices (As first clip, 720p, 1080p, 4K); tap 1080p. Open it once more and tap \"Which shape should I use?\", then close Help.", "The preview becomes upright; wide clips sit in it with bars (or blurred / filled if set). The menu shows a tick on the current shape and size. The help article about shapes opens and closes.", ""], ["p-crop", "Crop and position sheet", "Tap the first piece of A, tap More, tap Crop and position. On the preview drag a corner of the frame inwards, then drag inside the frame. Tap 1:1, then 9:16, then Free, then Original. Tap the rotate and flip buttons once each, then Reset crop and position. Tap Done.", "The sheet shows the whole picture with a frame and grips and the outside dimmed; the sheet does not cover the frame. Corner drags resize, a drag inside moves; 1:1 and 9:16 keep their shape. Rotate turns the picture a quarter turn, flip mirrors it, Reset puts everything back. (If the drags fail through mirroring, try twice, test the shape buttons, and set Needs the owner for the drags.)", ""], ["p-position", "Keep the person in shot", "With the shape still 9:16 upright, tap the first piece of A, tap Look and choose Fill under Fit to frame. Close the sheet. Tap More > Crop and position and move Left \u2013 right to one end, the other end, then so that the person is in the middle. Tap Done.", "With Fill the wide picture fills the upright frame, and Left \u2013 right changes which part is seen. Ask the owner to look at the phone: the person can be put in the middle.", "watch"]]], ["Overlay and titles", [["p-overlay", "Overlay (picture-in-picture)", "Tap Done. Move the playhead to about 0:03. Tap Overlay in the bar at the bottom (or + next to Play > Overlay (picture-in-picture)) and pick video B from the gallery. Tap the overlay on its row, tap Layout: set a different corner, move Size to about 50%, switch on White frame. Then try Side by side and Full screen, and go back to Picture-in-picture. Play across the overlay.", "B appears small in a corner of the preview from 0:03, on an Overlay row above the main clips. Corner, Size and White frame change it at once; Side by side and Full screen change the layout. Ask the owner to watch the phone while it plays: both videos move (the preview may stutter a little with an overlay; write down how much).", "watch"], ["p-title", "Title, fonts and styles", "Tap Done. Move the playhead to 0:01 and tap Title. The Edit title sheet opens: type Round 4 phone. Tap each Font (Classic, Modern, Elegant, Handwritten), two Styles, switch on Outline, tap Position Top and then Lower third. Set Appear to Pop. Close the sheet and play from 0:00.", "The text shows in the preview while typing; fonts and styles change it visibly; Outline draws a line around the letters; Top / Lower third move it. The sheet scrolls so that every setting is reachable and the keyboard does not hide the text box. On play the title pops in.", ""], ["p-hebrew", "Hebrew and Russian text", "Add another title at 0:05. Copy this text from this page and paste it into the title's text box on the phone (if pasting from the PC does not reach the phone, ask the owner to type or paste it on the phone): \u05e9\u05dc\u05d5\u05dd \u05e2\u05d5\u05dc\u05dd / \u041f\u0440\u0438\u0432\u0435\u0442, \u043c\u0438\u0440 . Tap each of the four fonts.", "In every font the Hebrew and Russian letters show properly (no empty boxes, no question marks). The Hebrew words keep their order: read right to left, \u05e9\u05dc\u05d5\u05dd comes before \u05e2\u05d5\u05dc\u05dd.", ""], ["p-caption", "A caption, duplicate and delete", "Tap Done. Tap Captions and add the caption: Test caption. Select it on the timeline, tap Duplicate, then delete the copy with Delete.", "The caption shows at the bottom of the picture in a dark box. Duplicate puts a copy right after it; Delete removes the copy.", ""]]], ["Look and fades", [["p-filter", "Filters", "Tap the first piece of A, tap Look. Tap Warm, Cool, Black & white, Vintage, Vivid, None in turn, then choose Vintage. Close the sheet. Tap More > Copy settings. Tap clip B, tap More > Paste settings.", "Each filter changes the preview at once. After pasting, B has the Vintage look too and keeps its own length.", ""], ["p-fades", "Fade in and out", "Tap Done. Tap More in the bar at the bottom, then Fade in and out. Set Fade in from black and Fade out to black to about 2 s each. Close the sheet, play the first 3 seconds and the last 3 seconds. Then tap clip B, More > Transition and fades, and pick Crossfade.", "The video comes up from black at the start and goes to black at the end. B now fades in from the clip before it. Ask the owner to watch the phone.", "watch"]]], ["Sound", [["p-tracks", "Sound tracks", "On the left edge of the timeline tap the small add-track icon at the top (its description is \"Add sound track\"). Then tap the icon of the new track on the left: a sheet opens. Change Volume, switch Mute on and off, look for Solo, Lower this track under speech, This track is speech, Move up, Move down and Delete track. Tap Delete track. Then tap the film icon (the first one on the left: Video sound) and switch Mute on and off.", "A new sound row appears with an icon on the left, and a short message names it. The sheet has all the listed settings and they stay as set. Delete track removes the empty track. The film icon opens the settings of the video's own sound.", ""], ["p-separate", "Separate sound to track", "Tap the first piece of A, tap Sound, tap Separate sound to track\u2026 and confirm with Separate (leave \"Also the other clips\" off). Close the sheet and play that piece. Then tap the same clip, Sound, Put it back on the clip.", "The clip's sound appears as its own piece on a Voice row under the clips and the clip shows as muted. Ask the owner to listen on the phone: the voice is heard once (no echo) and matches the lips. Put it back removes the Voice piece again.", "listen"], ["p-silences", "Remove silences", "Tap the first piece of A (the talking video), tap Sound, tap Remove silences. Wait for the result. Tap Fewer cuts, Automatic, More cuts under Sensitivity and write down the gap count for each. Choose Automatic and tap the Remove \u2026 gaps button. Play across two cuts. Tap Undo once.", "A progress bar with Cancel, then a line like \"Background noise about -45 dB; quieter than -34 dB counts as silence\" and a button like \"Remove 5 gaps\". After applying, the clip is several pieces and the phone does not freeze for long. Ask the owner to listen: words are not chopped. One Undo brings the single clip back.", "listen"], ["p-clean", "Clean up sound and Voice focus", "Tap the first piece of A, tap Sound, switch on Clean up sound and wait until it finishes; then set Voice focus to about 50% and wait again. Play the clip.", "The clip shows Sound xx% while it works and then finishes (on a phone this can take a while: write down roughly how long for how long a clip). Ask the owner to listen on the phone: less background noise, voice still in sync.", "listen"]]], ["Music", [["p-music-find", "Find free music: search and preview", "Tap Done. Move the playhead to 0:00 and tap Music. The Add music window opens with the tabs My files and Find free music. On Find free music type piano and tap Search. Tap the play button of one result, let it play a few seconds, stop it.", "Results show title, artist, length and licence (CC0, Public domain, CC BY or CC BY-SA). Ask the owner whether the preview is heard on the phone. If it says it is offline, \"Nothing found\" or shows an error, write the exact text. (Needs internet on the phone.)", "listen"], ["p-music-use", "Use a track, credits", "Tap Use on one result. When it is on the timeline, tap the music piece, tap Edit. Tap Copy credits (paste into the note if you can, otherwise write what the Credits line shows). Tap Add credits at the end.", "The music downloads and lands on a sound row from 0:00. Edit music shows Volume, Fade in, Fade out, Fit music to video, Track and Credits with the track's title, artist and licence. Add credits at the end puts a small caption with the credits over the last 4 seconds.", ""], ["p-music-file", "Music from the phone's files", "Tap Done, move the playhead to the middle of the video, tap Music > My files > Choose a music file\u2026 and pick music file C from the phone (if there is none, set Not tested).", "The phone's file picker opens; the chosen music lands at the playhead. Because the first music already plays there, it goes onto another sound row.", ""], ["p-fit", "Fit music to video, and loop", "Tap the first (downloaded) music piece, tap Edit, tap Fit music to video. If it says \"The music is shorter than the video\", tap Loop. Close the sheet and look at the end of the timeline. Then delete the second music piece (the one from My files).", "The music now ends exactly where the video ends, with a fade-out. Longer music is simply cut; shorter music asks to Loop and then shows a repeat sign and thin marks where it starts again. Ask the owner to listen to the last 5 seconds (and one repeat point if it loops): no click, no gap.", "listen"]]], ["Playback speed of the phone", [["p-smooth", "Smooth preview switch", "Tap Done, tap More in the bar at the bottom. Smooth preview should be ON. Close the sheet and play the whole project once from 0:00. Then More > switch Smooth preview OFF, go back to the project list, open the project again and play it once more. Switch it back ON afterwards.", "Ask the owner to watch the phone itself (mirroring adds its own stutter, so do not judge from the PC): with Smooth preview on, playback is fluent, perhaps a little softer; write down where it stutters or freezes (at cuts, during the overlay, during titles) in each mode. The switch keeps its setting.", "watch"], ["p-sync", "Sound and picture stay together", "Play 20 seconds of the talking clip from its start, then tap in the middle of it and play again.", "Ask the owner to watch and listen on the phone: lips and voice match, also after jumping; the music does not restart or double.", "listen"]]], ["Export", [["p-export-full", "Export full quality", "Tap Export at the top right. Make: Video, Full quality, Video size 1080p. Write down the \"File size: about \u2026\" line and what it says about where the video goes. Tap Export and wait. Write down how long it took and the \"Saved to \u2026\" line.", "The window says the finished video goes to your gallery. Progress runs to 100%, then \"Adding it to your gallery\u2026\" and \"Video saved\" with \"Saved to \u2026\" (the Movies folder of the gallery) and a Send to another app button. \"Keep ClipForge open while it exports\" is shown during the export.", ""], ["p-export-gallery", "The exported video is in the gallery and looks right", "Open the phone's Gallery app and find the new video (album Movies or ClipForge, newest first). Play it from start to end.", "The video is there and plays. Ask the owner to watch and listen on the phone: upright 9:16, fade from black, titles incl. Hebrew / Russian letters, the overlay in its corner, Vintage look, music ending with the video, fade to black; voice in sync.", "watch,listen"], ["p-export-small", "Export a small file", "Back in ClipForge tap Export, choose Small file, export. Compare the two files' sizes in the Gallery (details / info of each video).", "It finishes and is saved to the gallery like the first. The small file is clearly smaller (write down both sizes).", ""], ["p-export-sound", "Export the sound only", "Tap Export, set Make to Sound M4A, export. When it is done tap Send to another app and look at the share sheet (then cancel it without sending). Repeat with Sound MP3.", "Video size and Frames per second are hidden for sound. It ends with \"Sound saved\" and Send to another app opens Android's share sheet with the file. MP3 works too, or says to export as M4A instead: write down exactly what it says.", ""], ["p-export-bg", "Leave the app during an export", "Start a Full quality export again. At about 20%, press the phone's Home button, wait 30 seconds (open another app meanwhile), then return to ClipForge.", "Write down exactly what happened: the export kept running and finished / it paused and continued / it stopped with a message (\"The export stopped unexpectedly.\" with Try again) / the app restarted. If it stopped, Try again must work when the app stays open. No half-finished video appears in the gallery.", ""], ["p-export-lock", "Screen off during an export", "Start one more export and leave the phone alone without touching it until it is finished (the screen should stay on by itself).", "The screen stays on while exporting and the export finishes. If the screen went dark or locked, write down whether the export still finished.", ""]]], ["Rotate, share, finish", [["p-rotate", "Rotate the phone", "Ask the owner to make sure auto-rotate is on and to turn the phone on its side while the project is open, then back upright. Do this once while paused and once while playing.", "Write down what happens: either the editor rearranges itself for the wide screen, or it stays upright. In both cases nothing is lost: the project, the selection and the playhead are still there, playback continues or pauses cleanly, and the app does not close.", ""], ["p-share", "Share project file", "Go back to the project list. Tap the three dots on the project's card, tap Share project file. When Android's share sheet opens, look at the file name and cancel (do not send it anywhere unless the owner says where).", "It shows \"Packing \u2026\" and then Android's share sheet with one file ending in .clipforge.zip. Cancelling says the project file was not sent anywhere; nothing else changes. The card menu also has Rename, Duplicate and Delete.", ""], ["p-duplicate", "Duplicate and rename a project", "On the same card menu tap Duplicate. On the copy tap Rename and call it Round 4 phone copy. Open the copy, delete one clip, go back, open the original.", "The copy appears in the list with the new name. Changing the copy does not change the original (it still has all its clips).", ""], ["p-help", "Help on the phone", "On the project list tap ? (Help). Search for: stutter. Open the article it finds. Search for: gallery.", "\"stutter\" finds \"Smooth preview on phones\"; \"gallery\" finds articles about where exported videos go and about missing files. The article text fits the phone screen and scrolls.", ""], ["p-final", "Everything was saved", "Close ClipForge from the recent-apps view (swipe it away). Open it again, open the test project and play it once.", "Everything is still there: cuts, 9:16 shape, Fill and position, overlay, titles with Hebrew / Russian text, filter, fades, music fitted to the video, credits caption. No clip is Missing.", ""]]]];const INSTR="You are testing ClipForge 1.9.0, a video editor, on the owner's Samsung Android phone. You work on the owner's Windows PC and see and touch the phone through \"Phone Link\" (the phone side is called \"Link to Windows\"): the phone's screen is shown in a window on the PC. This checklist page is open in a browser on the PC. Problems are expected; your job is to find them and write them down precisely.\n\nHOW TO DRIVE THE PHONE\n- In the Phone Link window a mouse click is a tap, holding the mouse button down for a second is a long-press, and click-and-drag is a drag. There are no keyboard shortcuts and no menu bar on the phone: use only what is on the phone's screen.\n- If the phone screen is not shown, ask the owner to open Phone Link on the PC and choose the phone's screen (Apps > Open phone screen), and to unlock the phone. If the mirrored screen goes black or locks, ask the owner to unlock it.\n- Drags and long-presses often fail through mirroring. Try twice. If it still fails, use the button the step offers instead (for example More > Move earlier); otherwise set \"Needs the owner\" and write that the drag could not be performed through mirroring (it may work fine with a finger). Ask the owner to try it with a finger if they are there.\n- Typing: click into the text box on the phone and type on the PC keyboard. For Hebrew and Russian text copy it from this page and paste it (Ctrl+V) into the phone window; if that does not arrive, ask the owner to type it on the phone.\n- SOUND: the phone's sound may not reach you through mirroring. Never judge sound yourself. For every step tagged \"ask the owner to listen\", do the actions, then ask the owner in the chat, for example: \"Please listen on the phone: does the voice match the lips?\" The same goes for smoothness: mirroring stutters by itself, so for steps tagged \"ask the owner to watch\" ask the owner to look at the phone itself. Write the answer in the note starting with \"Owner:\" and set PASS or FAIL from it. If the owner is not available, set \"Needs the owner\".\n\nHOW THE PHONE APP IS LAID OUT (names as on the screen)\n- Project list: New project and Open project file; ? (Help) and three dots (More > About ClipForge) at the top; each project card has three dots: Rename, Duplicate, Share project file, Delete.\n- Editor, top: back arrow (Back to projects), Undo and Redo arrows, the Shape button, Export, ? (Help).\n- Editor, middle: the preview; under it Play / Pause, a + button (\"Add videos, photos, music or text\": Videos or photos, Music, Overlay (picture-in-picture), Title, Caption) and timeline zoom buttons.\n- Timeline: rows from top to bottom: Overlay (when there is one), the video clips, the sound tracks, titles. On the left edge are small icons: an add-track icon at the top (Add sound track), a film icon (the video's own sound) and one icon per sound track; tapping one opens its settings.\n- Bottom tool bar with nothing selected: Add media, Music, Overlay, Title, Captions, Split, More. More holds: Fade in and out, History, Smooth preview.\n- Bottom tool bar with a video clip selected: Done, Split, Speed, Look, Sound, More, Delete (and Find file when the file is missing). More holds: Crop and position, Transition and fades, Freeze frame, Duplicate, Copy settings, Paste settings, Move earlier, Move later.\n- With music selected: Done, Edit, Delete. With a title or caption selected: Done, Edit, Duplicate, Delete. With an overlay selected: Done, Layout, Crop, Sound, Delete.\n- Settings open as a sheet from the bottom; swipe it down or tap outside it to close it.\n\nBEFORE YOU START\n- Fill in \"Device\" (for example \"Samsung Galaxy S23, Android 15, via Phone Link\") and \"Tester\".\n- Fill in \"Version shown in the app\": project list > three dots > About ClipForge > Copy version info, then type or paste the line. If it does not match the build named at the top of this page (a red warning appears), tell the owner and say so in the Summary.\n- Test files on the phone (ask the owner which ones to use; do not download files from the internet except through the app's own Find free music):\n  A. a talking video filmed with the phone's camera, 1-3 minutes, with some pauses, filmed wide (landscape) if possible;\n  B. a second short camera video, 10-30 seconds;\n  C. optional: a music file on the phone (MP3 or M4A);\n  D. a photo from the gallery.\n- Do the steps in order: later steps build on the project made in \"New project from the gallery\".\n\nRULES\n- Each step has \"Do\" (exact actions) and \"Expected\" (what should happen). Do the actions exactly, then compare with Expected.\n- For each step choose a Result and write a Note. Result meanings: PASS = you saw exactly the expected result (or the owner confirmed it). FAIL = something was wrong (write what you did, what happened, and what you expected). Partial = part of it worked (say which part). Not tested = you could not do it (say why). Needs the owner = only a person can judge or perform it and the owner was not available.\n- NEVER delete, move or rename the owner's photos, videos or music, in ClipForge's pickers, in the Gallery or in any other app. Do not uninstall ClipForge (that deletes the projects). Inside ClipForge only delete things this test made. Do not send or share anything to other people or apps: cancel every share sheet.\n- Exported videos go to the phone's gallery (the Movies folder; the result says \"Saved to ...\"). Exported sound files stay in the app and are offered with \"Send to another app\". Leave the exported files in the gallery for the owner.\n- If an Android permission dialog appears (photos and videos, music, notifications), allow it and write down that it appeared.\n- If the app closes by itself or freezes, write down exactly what you were doing, fill in the Crash box, reopen it and continue.\n- Do not guess. Only mark PASS for what you actually saw, or for what the owner told you they heard or saw.\n- This page keeps your answers in this browser as you go. When finished, fill in the Summary box (most important problems first; also what was hard to do through mirroring), then click \"Download filled checklist\" and give the downloaded file to the owner.";
const OPTS=["", "PASS", "FAIL", "Partial", "Not tested", "Needs the owner"];const TAGS={"listen": "ask the owner to listen", "watch": "ask the owner to watch"};const RESULT="Result";const NOTE="What happened? Start with Owner: for what the owner saw or heard";
let data=JSON.parse(document.getElementById('data').textContent);
try{const s=localStorage.getItem('clipforge-round4-phone');if(s){const l=JSON.parse(s);if(l&&l.items)data=Object.assign(data,l);}}catch(e){}
document.getElementById('instr').textContent=INSTR;document.getElementById('build').textContent=data.build;
const root=document.getElementById('steps');
for(const [group,items] of STEPS){const h=document.createElement('h2');h.textContent=group;root.appendChild(h);
 for(const st of items){const five=st.length>4,id=st[0],title=st[1],act=five?st[2]:'',exp=five?st[3]:st[2],tag=st[st.length-1];const it=data.items[id]||(data.items[id]={status:"",note:""});
  const c=document.createElement('article');c.className='card step';c.dataset.s=it.status;
  const t=document.createElement('h3');t.textContent=title;for(const k of (tag?tag.split(','):[])){const g=document.createElement('span');g.className='tag';g.textContent=TAGS[k]||k+' only';t.appendChild(g);}
  const d=document.createElement('p');d.className='do';d.textContent='Do: '+act;
  const p=document.createElement('p');p.className='exp';p.textContent='Expected: '+exp;
  const row=document.createElement('div');row.className='row';const sel=document.createElement('select');sel.setAttribute('aria-label',RESULT+': '+title);
  for(const o of OPTS){const op=document.createElement('option');op.value=o;op.textContent=o||RESULT+'...';if(o===it.status)op.selected=true;sel.appendChild(op);}
  row.appendChild(sel);const ta=document.createElement('textarea');ta.setAttribute('aria-label','Note: '+title);ta.placeholder=NOTE;ta.value=it.note;
  sel.addEventListener('change',()=>{it.status=sel.value;c.dataset.s=sel.value;save();});ta.addEventListener('input',()=>{it.note=ta.value;save();});
  if(act)c.append(t,d,p,row,ta);else c.append(t,p,row,ta);root.appendChild(c);}}
for(const k of ['device','tester','version','summary','crash']){const e=document.getElementById(k);e.value=data[k]||'';e.addEventListener('input',()=>{data[k]=e.value;save();});}
function counts(){const n={};let total=0;for(const [,items] of STEPS)for(const [id] of items){total++;const s=data.items[id].status||'Not done yet';n[s]=(n[s]||0)+1;}
 const el=document.getElementById('counts');el.textContent='';for(const [k,v] of Object.entries(n)){const s=document.createElement('span');s.textContent=k+': '+v;el.appendChild(s);}const s=document.createElement('span');s.textContent='Total: '+total;el.appendChild(s);}
function vcheck(){const v=(data.version||'').trim();const w=document.getElementById('vwarn');
 const b=data.build||'';const m=b.match(/\d+\.\d+\.\d+ \(build \d+\)/)||b.match(/\d+\.\d+\.\d+/);const h=b.match(/\b([0-9a-f]{7,40})\s*$/);
 const bad=m&&!v.includes(m[0])?m[0]:(h&&!v.includes(h[1].slice(0,7))?h[1].slice(0,7):'');
 w.textContent=!v?'Please paste the version shown in the app (required).':(bad?'This is not the build named above ('+bad+'). Say so in the Summary.':'');}
function save(){counts();vcheck();try{localStorage.setItem('clipforge-round4-phone',JSON.stringify(data));document.getElementById('saved').textContent='Saved in this browser.';}catch(e){}}
counts();vcheck();
document.getElementById('dl').addEventListener('click',()=>{
 if(!(data.version||'').trim()&&!confirm('"Version shown in the app" is empty. Download anyway?'))return;
 const clone=document.documentElement.cloneNode(true);clone.querySelector('#data').textContent=JSON.stringify(data).replace(/</g,'\\u003c');
 clone.querySelector('#steps').innerHTML='';
 const blob=new Blob(['<!doctype html>\n'+clone.outerHTML],{type:'text/html'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);
 const d=(data.device||'device').replace(/[^A-Za-z0-9]+/g,'-').slice(0,30);a.download='ClipForge-Test-Round-4-phone-results-'+d+'.html';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1000);});
</script></body></html>
