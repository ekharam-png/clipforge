# Builds the ClipForge video editor (video-editor/) for Android, Windows and
# macOS and attaches the installers to the workflow run as artifacts.
#
# The Windows and macOS downloads also contain clipforge-mcp, the small
# command-line server that lets Claude edit ClipForge projects (README,
# "Claude control"). It is built by bin/build_mcp.dart, which wraps
# `dart compile exe` (see the comment in that file for why a wrapper).
#
# Connecting Claude without editing a config file (docs/claude-setup.html):
# the Windows and macOS jobs build the Claude Desktop extension
# ClipForge-<version>-build<n>-claude-{windows,macos}.mcpb (manifest.json +
# clipforge-mcp + title fonts, built by docs/tools/build_claude_bundles.py),
# and the check job builds the skill ClipForge-<version>-claude-skill.zip
# (claude/skill/clipforge-editing). They are artifacts of the run (for
# debugging); a release does not carry them (1.15): the app holds the
# extension and saves it from Help > Connect to Claude.
#
# Since 1.12 the Claude helper travels INSIDE the desktop apps: clipforge-mcp
# and the .mcpb are built BEFORE `flutter build`, and the .mcpb is put into
# assets/claude/ so that the build packs it into the app. The app installs
# the helper from it into a per-user folder on every start and saves the
# extension file from Help > Connect to Claude (assets/claude/README.txt).
#
# Updates from inside the app (1.12): the release job writes latest.json
# with, per system, the address, size and SHA-256 of the fixed-name file
# (tool/ci/make_latest_json.py). The Windows job runs the update scripts
# with pretend app folders (tool/ci/windows_swap_test.py) and checks that
# an export survives the helper's process tree being killed
# (tool/ci/job_survives_test.py).
#
# Windows installer (1.14.1): the Windows job also builds a per-user
# installer with Inno Setup (windows/installer/clipforge.iss), installs,
# updates and uninstalls it silently as a test, and the release publishes
# it as ClipForge-Setup.exe: THE Windows download. latest.json keeps
# pointing the app's own updater at the zip. When Inno Setup cannot be had
# on the runner the installer steps are skipped with a warning, and a
# release then fails (it must have ClipForge-Setup.exe).
#
# "Read me first.html" (1.14.1): the Windows and macOS jobs write one
# self-contained guide each (tool/ci/make_readme_html.py: install steps for
# that system, first steps, updates, and what is new from CHANGELOG.md) and
# put it next to the app: in the zip's "ClipForge" folder and in the
# installer on Windows, beside ClipForge.app in the macOS zip. It replaces
# "Release notes.txt". It is part of the install and not a separate
# download (1.15). The check job runs the script's test.
#
# What a release publishes (1.15; tool/ci/release_assets.py is THE list):
# three downloads, ClipForge-Setup.exe, ClipForge-macos.zip and
# ClipForge-android.apk, plus two files only the app's Update button uses,
# ClipForge-windows.zip and latest.json. No versioned duplicates (the
# version is in the release title and inside the files), no 32-bit Android
# APK (not built any more), no separate read-me, .mcpb or skill files. The
# release job fails unless its folder holds exactly that list, and the
# check job fails when the old download page (site/index.html, since 1.16 a
# signpost to the website) does not offer exactly the three downloads or
# when the site, the website, the app or the docs link to a release file
# that is not in the list.
#
# Outside addresses (1.16): tool/ci/links.json is THE place for the
# website's address and its pages. The release job writes them into
# latest.json ("links") so that installed apps follow a move of the site;
# tool/ci/links_test.py and test/core/links_test.dart (part of flutter
# test) fail when the app's built-in copy, the Pages signpost or the
# website disagree with it, or when the address is written anywhere else.
#
# Version numbers (lib/core/build_info.dart): the version comes from
# pubspec.yaml, the build number is this workflow's run number, and the
# "check" job records the build time (UTC) and commit once for the whole
# run. Every build (app and clipforge-mcp, on every platform) gets the same
# values, so Help > About ClipForge shows the same line everywhere, e.g.
# "ClipForge 1.4.0 (build 21) · 16 Nov 2026, 07:20 UTC · 877e482", and the
# downloads are named ClipForge-1.4.0-build21-<platform>.
#
# Build number = run number + 100. ClipForge moved to this repository after
# build 38 of the old one, and Android only installs an update whose
# version code (Flutter: 2000 + build for 64-bit) is higher, so the
# numbers continue above the old ones.
#
# Releases: pushing a tag v<version> (it must match pubspec.yaml), or a
# manual run on main with "publish" ticked, builds
# Android, Windows and macOS and the "release" job publishes them as a
# GitHub Release under fixed names (ClipForge-Setup.exe, ...) so
# releases/latest/download/<name> always gives the newest version, and
# latest.json for the app's update check (Help > Check for updates).
name: ClipForge builds

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish this build of main as a GitHub Release (creates the tag v<version>)"
        type: boolean
        default: false
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "video-editor/**"
      - ".github/workflows/video-editor-build.yml"

permissions:
  contents: read

concurrency:
  group: video-editor-build-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.50.0"

defaults:
  run:
    working-directory: video-editor

jobs:
  check:
    name: Analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
      build_time: ${{ steps.version.outputs.build_time }}
      commit: ${{ steps.version.outputs.commit }}
      display: ${{ steps.version.outputs.display }}
      build: ${{ steps.version.outputs.build }}
    steps:
      - uses: actions/checkout@v7
      # One version line for the whole run (see the top of this file).
      - name: Version for this run
        id: version
        run: |
          version="$(sed -n 's/^version:[[:space:]]*\([^+[:space:]]*\).*/\1/p' pubspec.yaml)"
          if [ -z "$version" ]; then echo "::error::no version in pubspec.yaml"; exit 1; fi
          build_time="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          commit="${GITHUB_SHA::7}"
          build=$(( GITHUB_RUN_NUMBER + 100 ))
          if [[ "$GITHUB_REF" == refs/tags/v* && "${GITHUB_REF#refs/tags/v}" != "$version" ]]; then
            echo "::error::tag ${GITHUB_REF#refs/tags/} does not match version $version in pubspec.yaml"; exit 1
          fi
          display="ClipForge $version (build $build) · $(LC_ALL=C date -u -d "$build_time" '+%-d %b %Y, %H:%M UTC') · $commit"
          {
            echo "version=$version"
            echo "build_time=$build_time"
            echo "commit=$commit"
            echo "display=$display"
            echo "build=$build"
          } >> "$GITHUB_OUTPUT"
          echo "::notice::$display"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      # The export integration tests drive the system ffmpeg; without it they
      # are skipped.
      - name: Install ffmpeg for the export tests
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
          # Which FFmpeg the export tests ran with (ubuntu-latest changes).
          ffmpeg -hide_banner -version | head -1
      - run: flutter pub get
      # Errors fail the build; lint infos and warnings are only reported.
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      # The guide compiled into the Claude helper must match claude/guide/*.md.
      - run: dart run tool/gen_guide.dart --check
      - run: flutter test
      # "Read me first.html" for the downloads: the script's own test (the
      # steps per system, nothing fetched from the internet, Markdown from
      # CHANGELOG.md escaped, the same install steps as the website's
      # install page, web/app/install/page.tsx),
      # and the real page for this version, written once as a check.
      - name: Test the read-me generator
        run: |
          python3 tool/ci/make_readme_html_test.py
          for platform in windows macos; do
            python3 tool/ci/make_readme_html.py --platform "$platform" \
              --version "${{ steps.version.outputs.version }}" --build "${{ steps.version.outputs.build }}" \
              --date "${{ steps.version.outputs.build_time }}" \
              --changelog CHANGELOG.md --out "$RUNNER_TEMP/readme-$platform.html"
          done
      # The download page offers exactly three downloads (Windows, Mac,
      # Android), and nothing on the site, in the app or in the docs links
      # to a release file that a release does not have.
      - name: Check the download page and every link to a release file
        run: |
          python3 tool/ci/release_assets_test.py
          python3 tool/ci/release_assets.py --check-links
      # tool/ci/links.json: complete, what the app would accept, written
      # into latest.json, and what the Pages signpost and the read-me use.
      - name: Check the outside addresses (links.json)
        run: python3 tool/ci/links_test.py
      # Compile smoke test of the Claude control server (test/mcp/e2e_test.dart
      # above already drives a full editing session through it): the
      # single-file executable must build and answer the MCP handshake.
      - name: Build clipforge-mcp and check that it answers
        run: |
          mkdir -p build
          printf '{"CLIPFORGE_BUILD_TIME":"%s","CLIPFORGE_COMMIT":"%s","CLIPFORGE_CHANNEL":"ci"}\n' \
            "${{ steps.version.outputs.build_time }}" "${{ steps.version.outputs.commit }}" > build/clipforge_build.json
          dart run bin/build_mcp.dart -o build/mcp/clipforge-mcp \
            --build-name=${{ steps.version.outputs.version }} --build-number=${{ steps.version.outputs.build }} \
            --dart-define-from-file=build/clipforge_build.json
          build/mcp/clipforge-mcp --version
          # The Dart version line must be exactly the one this workflow
          # computed (it names the downloads and the release notes).
          build/mcp/clipforge-mcp --version | grep -qF "${{ steps.version.outputs.display }}" || {
            echo "::error::clipforge-mcp --version does not show: ${{ steps.version.outputs.display }}"; exit 1; }
          reply="$(printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-11-25","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            | build/mcp/clipforge-mcp --projects-dir "$RUNNER_TEMP/projects")"
          grep -q '"protocolVersion":"2025-11-25"' <<<"$reply"
          grep -q '"name":"export_video"' <<<"$reply"
          grep -q '"name":"get_guide"' <<<"$reply"
      # The built helper checks itself (its own sample media, a temporary
      # folder), and an export must outlive the helper's process group.
      - name: Self-test and export-survives check with the built clipforge-mcp
        run: |
          cp -r assets/fonts build/mcp/fonts
          reply="$(printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-11-25","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"self_test","arguments":{}}}' \
            | CLIPFORGE_MCP_NO_HANDOVER=1 build/mcp/clipforge-mcp --projects-dir "$RUNNER_TEMP/selftest-projects")"
          python3 -c 'import json,sys; [print(json.loads(l)["result"]["content"][0]["text"]) for l in sys.stdin if l.strip() and json.loads(l).get("id") == 2]' <<<"$reply"
          grep -q 'ClipForge self-test: PASS' <<<"$reply" || { echo "::error::self_test did not pass"; exit 1; }
          python3 tool/ci/job_survives_test.py build/mcp/clipforge-mcp
      # The skill that teaches Claude how to edit with ClipForge
      # (Claude > Customize > Skills > Upload a skill). The zip holds the
      # folder clipforge-editing/, as the upload expects. The extension is
      # also assembled here from the Linux program, only to check the
      # script and the manifest on every push (the real ones are built in
      # the Windows and macOS jobs).
      - name: Build the Claude skill zip and check the extension script
        run: |
          python3 docs/tools/build_claude_bundles.py skill \
            --version "${{ steps.version.outputs.version }}" --out dist
          python3 docs/tools/build_claude_bundles.py mcpb --binary build/mcp/clipforge-mcp --platform linux \
            --version "${{ steps.version.outputs.version }}" --build ${{ steps.version.outputs.build }} \
            --display "${{ steps.version.outputs.display }}" --out "$RUNNER_TEMP/mcpb-check"
      - uses: actions/upload-artifact@v7
        with:
          # Test builds are only needed until a version is published.
          retention-days: 5
          path: video-editor/dist/ClipForge-${{ steps.version.outputs.version }}-claude-skill.zip
          archive: false
          if-no-files-found: error

  android:
    name: Android APK
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CF_VERSION: ${{ needs.check.outputs.version }}
      CF_BUILD_TIME: ${{ needs.check.outputs.build_time }}
      CF_COMMIT: ${{ needs.check.outputs.commit }}
      CF_DISPLAY: ${{ needs.check.outputs.display }}
      # Start of every download's name: ClipForge-1.4.0-build21
      CF_NAME: ClipForge-${{ needs.check.outputs.version }}-build${{ needs.check.outputs.build }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      # Signing: the ClipForge release key from the four ANDROID_* repository
      # secrets, so every build installs over the previous one. Without the
      # secrets (forks) the APK is signed with the debug key.
      - name: Configure release signing (if secrets are set)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::warning::No signing secrets: the APK is signed with the debug key, not for release."
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/clipforge.jks"
          {
            echo "storeFile=$RUNNER_TEMP/clipforge.jks"
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
          } > android/key.properties
      # One APK, for 64-bit ARM (every phone from roughly 2017 on; about
      # 72 MB). The APK for old 32-bit phones is not built since 1.15.
      # The build time, commit and channel for the app's About box
      # (--dart-define-from-file), and the release notes for this version
      # (its section of CHANGELOG.md) for the download.
      - name: Write the build details and release notes
        shell: bash
        run: |
          mkdir -p build dist
          printf '{"CLIPFORGE_BUILD_TIME":"%s","CLIPFORGE_COMMIT":"%s","CLIPFORGE_CHANNEL":"ci"}\n' \
            "$CF_BUILD_TIME" "$CF_COMMIT" > build/clipforge_build.json
          cat build/clipforge_build.json
          {
            echo "$CF_DISPLAY"
            echo
            awk -v v="$CF_VERSION" '/^## /{p = ($2 == v)} p' CHANGELOG.md
            echo "All versions: Help > What's new in the app."
          } > "dist/$CF_NAME-release-notes.txt"
          cat "dist/$CF_NAME-release-notes.txt"
          grep -q "^## $CF_VERSION" "dist/$CF_NAME-release-notes.txt" || {
            echo "::error::CHANGELOG.md has no section for $CF_VERSION"; exit 1; }
      # versionName = the version; versionCode = the run number plus
      # Flutter's per-CPU offset (2000 + run for 64-bit), so each new run
      # installs over the previous one. (--split-per-abi keeps that offset
      # and the file name the same as before 1.15.)
      - run: >-
          flutter build apk --release --split-per-abi --target-platform android-arm64
          --build-name=${{ env.CF_VERSION }} --build-number=${{ needs.check.outputs.build }}
          --dart-define-from-file=build/clipforge_build.json
      - name: Check the APK signature
        run: |
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$apksigner" verify --print-certs build/app/outputs/flutter-apk/app-arm64-v8a-release.apk | tee signer.txt
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            grep -qi "2f36dbd0dae67cde38d2bb7cea0c04d850fd4433693d209609f797df4f23655b" signer.txt || {
              echo "::error::The APK is not signed with the ClipForge release key"; exit 1; }
          else
            echo "::warning::No signing secrets: the APK is signed with the debug key, not for release."
          fi
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      - name: Name the APK
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "dist/$CF_NAME-android.apk"
          if ls build/app/outputs/flutter-apk/*armeabi* >/dev/null 2>&1; then
            echo "::error::a 32-bit APK was built; only the 64-bit one is wanted"; exit 1
          fi
      - uses: actions/upload-artifact@v7
        with:
          # Test builds are only needed until a version is published.
          retention-days: 5
          path: video-editor/dist/${{ env.CF_NAME }}-android.apk
          archive: false
          if-no-files-found: error

  windows:
    name: Windows app
    needs: check
    # Windows and macOS runners use up build minutes quickly, so these only
    # run when the workflow is started by hand or for a release tag.
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CF_VERSION: ${{ needs.check.outputs.version }}
      CF_BUILD_TIME: ${{ needs.check.outputs.build_time }}
      CF_COMMIT: ${{ needs.check.outputs.commit }}
      CF_DISPLAY: ${{ needs.check.outputs.display }}
      # Start of every download's name: ClipForge-1.4.0-build21
      CF_NAME: ClipForge-${{ needs.check.outputs.version }}-build${{ needs.check.outputs.build }}
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      # The build time, commit and channel for the app's About box
      # (--dart-define-from-file), and "Read me first.html" for the
      # download: the install steps for this system, first steps, and what
      # is new (this version's section of CHANGELOG.md; the script fails
      # when there is none).
      - name: Write the build details and the read-me
        shell: bash
        run: |
          mkdir -p build dist
          printf '{"CLIPFORGE_BUILD_TIME":"%s","CLIPFORGE_COMMIT":"%s","CLIPFORGE_CHANNEL":"ci"}\n' \
            "$CF_BUILD_TIME" "$CF_COMMIT" > build/clipforge_build.json
          cat build/clipforge_build.json
          python tool/ci/make_readme_html.py --platform windows \
            --version "$CF_VERSION" --build "${{ needs.check.outputs.build }}" --date "$CF_BUILD_TIME" \
            --changelog CHANGELOG.md --out "dist/$CF_NAME-readme-windows.html"
          grep -q "What is new in $CF_VERSION" "dist/$CF_NAME-readme-windows.html" || {
            echo "::error::the read-me does not show what is new in $CF_VERSION"; exit 1; }
      # The Claude helper is built FIRST (1.12): it goes into the app as part
      # of the extension file (assets/claude), not next to clipforge.exe any
      # more - a program running from the install folder would block the
      # app's own update. Unlike the app it needs a separately installed
      # ffmpeg.exe / ffprobe.exe on the user's PC (README).
      # The build script is run from a copy outside the package so that Dart
      # does not run the Flutter plugins' build hooks for it.
      - name: Build clipforge-mcp.exe and check that it answers
        shell: pwsh
        run: |
          $env:CLIPFORGE_MCP_NO_HANDOVER = "1"
          New-Item -ItemType Directory -Force build\mcp | Out-Null
          Copy-Item bin\build_mcp.dart "$env:RUNNER_TEMP\build_mcp.dart"
          dart "$env:RUNNER_TEMP\build_mcp.dart" -o "build\mcp\clipforge-mcp.exe" `
            "--build-name=$env:CF_VERSION" "--build-number=${{ needs.check.outputs.build }}" `
            "--dart-define-from-file=build\clipforge_build.json"
          if ($LASTEXITCODE -ne 0) { throw "building clipforge-mcp.exe failed" }
          $version = (& "build\mcp\clipforge-mcp.exe" --version) -join "`n"
          Write-Host $version
          if (-not $version.Contains("$env:CF_VERSION (build ${{ needs.check.outputs.build }})")) { throw "clipforge-mcp.exe reports the wrong version" }
          $messages = @(
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-11-25","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}',
            '{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"get_status","arguments":{}}}'
          )
          $reply = ($messages | & "build\mcp\clipforge-mcp.exe" --projects-dir "$env:RUNNER_TEMP\projects" --fonts-dir assets\fonts) -join "`n"
          if ($LASTEXITCODE -ne 0) { throw "clipforge-mcp.exe exited with $LASTEXITCODE" }
          Write-Host $reply
          if ($reply -notmatch '"protocolVersion":"2025-11-25"') { throw "no MCP handshake from clipforge-mcp.exe" }
          if ($reply -notmatch '"fontsDir":"[^"]') { throw "clipforge-mcp.exe did not find the title fonts" }
      # One-click install for Claude Desktop: a .mcpb file (a zip with
      # manifest.json, clipforge-mcp.exe and the title fonts in server\fonts).
      # The script starts the program from the assembled bundle and fails
      # when it does not find the bundle's fonts or lists other tools than
      # lib/mcp/tools.dart. --asset puts a copy into assets\claude, from
      # where the app build below packs it into the app.
      - name: Build the Claude Desktop extension (.mcpb)
        shell: pwsh
        run: |
          python docs\tools\build_claude_bundles.py mcpb `
            --binary "build\mcp\clipforge-mcp.exe" --platform windows `
            --version "$env:CF_VERSION" --build ${{ needs.check.outputs.build }} `
            --display "$env:CF_DISPLAY" --out dist --asset assets\claude
          if ($LASTEXITCODE -ne 0) { throw "building the .mcpb failed" }
      # FFmpeg comes with the ffmpeg_kit_flutter_new plugin: its DLLs and their
      # licence notices are downloaded and placed next to clipforge.exe by the
      # build, so no separate ffmpeg.exe is needed.
      # File and product version of clipforge.exe: 1.4.0.<run number>.
      - run: >-
          flutter build windows --release
          --build-name=${{ env.CF_VERSION }} --build-number=${{ needs.check.outputs.build }}
          --dart-define-from-file=build/clipforge_build.json
      - name: Check what the app carries
        shell: pwsh
        run: |
          $release = "build\windows\x64\runner\Release"
          $assets = "$release\data\flutter_assets\assets"
          foreach ($file in "fonts\DejaVuSans.ttf", "fonts\DejaVuSans-Bold.ttf",
                            "claude\ClipForge-claude.mcpb", "update\clipforge-update.ps1",
                            "update\clipforge-update.cmd") {
            if (-not (Test-Path "$assets\$file")) { throw "$file is missing from the app bundle" }
          }
          # The version file the update scripts compare (windows/CMakeLists.txt).
          $versionFile = "$release\data\clipforge-version.json"
          if (-not (Test-Path $versionFile)) { throw "data\clipforge-version.json is missing from the app folder" }
          $inFile = (Get-Content $versionFile -Raw | ConvertFrom-Json).version
          Write-Host "clipforge-version.json: $inFile"
          if ($inFile -ne "$env:CF_VERSION+${{ needs.check.outputs.build }}") { throw "clipforge-version.json says $inFile" }
          if (Test-Path "$release\clipforge-mcp.exe") { throw "clipforge-mcp.exe must not sit next to clipforge.exe any more" }
          Copy-Item docs\claude-setup.html "$release\Connect Claude to ClipForge.html"
      # The update scripts (PowerShell, and the plain cmd one), on real
      # Windows, with pretend app folders: replace the files, a held
      # folder, a held file, roll-back, tidy-up (see the test's header).
      - name: Test the update scripts with pretend app folders
        shell: pwsh
        run: |
          python tool\ci\windows_swap_test.py "build\mcp\clipforge-mcp.exe"
          if ($LASTEXITCODE -ne 0) { throw "the update script test failed" }
      # An export started through the helper must survive the helper's
      # whole process tree being ended (what Claude Code does on Windows
      # when it quits). Needs ffmpeg.exe, which the runner does not have.
      # Then the helper's own check of everything (self_test), on Windows.
      - name: Test that an export survives the helper's process tree being killed
        shell: pwsh
        run: |
          choco install ffmpeg -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw "installing ffmpeg failed" }
          $env:Path = [Environment]::GetEnvironmentVariable("Path", "Machine") + ";" + [Environment]::GetEnvironmentVariable("Path", "User")
          ffmpeg -hide_banner -version | Select-Object -First 1
          Copy-Item assets\fonts build\mcp\fonts -Recurse
          python tool\ci\job_survives_test.py "build\mcp\clipforge-mcp.exe"
          if ($LASTEXITCODE -ne 0) { throw "an export did not survive the helper's process tree being killed" }
          $env:CLIPFORGE_MCP_NO_HANDOVER = "1"
          $messages = @(
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-11-25","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}',
            '{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"self_test","arguments":{}}}'
          )
          $reply = ($messages | & "build\mcp\clipforge-mcp.exe" --projects-dir "$env:RUNNER_TEMP\selftest-projects") -join "`n"
          Write-Host ($reply -replace '\\n', "`n")
          if ($reply -notmatch 'ClipForge self-test: PASS') { throw "self_test did not pass on Windows" }
      - name: Add the Visual C++ runtime and zip
        shell: pwsh
        run: |
          $release = "build\windows\x64\runner\Release"
          # PCs without the Visual C++ redistributable need these next to the exe.
          foreach ($dll in "msvcp140.dll", "vcruntime140.dll", "vcruntime140_1.dll") {
            $src = Join-Path $env:SystemRoot "System32\$dll"
            if (Test-Path $src) { Copy-Item $src $release } else { Write-Warning "$dll not found on the runner" }
          }
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item $release dist\ClipForge -Recurse
          # The guide, next to clipforge.exe (the installer below takes the
          # same folder, so it installs it too).
          Copy-Item "dist\$env:CF_NAME-readme-windows.html" "dist\ClipForge\Read me first.html"
          Compress-Archive -Path dist\ClipForge -DestinationPath "dist\$env:CF_NAME-windows.zip"
          # The zip must unpack to ONE folder called "ClipForge" (no version
          # in the name: the app updates itself inside that folder).
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path "dist\$env:CF_NAME-windows.zip"))
          $names = @($zip.Entries | ForEach-Object { $_.FullName -replace '\\', '/' })
          $tops = @($names | ForEach-Object { ($_ -split '/')[0] } | Sort-Object -Unique)
          $zip.Dispose()
          if ($tops.Count -ne 1 -or $tops[0] -ne 'ClipForge') { throw "the Windows zip must hold one top folder 'ClipForge', found: $($tops -join ', ')" }
          # The guide sits next to the app; the old text file is gone.
          foreach ($file in 'ClipForge/clipforge.exe', 'ClipForge/Read me first.html') {
            if ($names -notcontains $file) { throw "$file is missing from the Windows zip" }
          }
          if ($names -contains 'ClipForge/Release notes.txt') { throw "Release notes.txt must not be in the Windows zip any more" }
      # The installer (1.14.1): per user, no administrator rights, into
      # %LOCALAPPDATA%\Programs\ClipForge, from the same folder as the zip.
      # Inno Setup: the one on the runner, else from Chocolatey; when
      # neither works the installer is skipped with a warning.
      - name: Build the installer (Inno Setup)
        id: installer
        shell: pwsh
        run: |
          function Find-Iscc {
            foreach ($dir in "${env:ProgramFiles(x86)}\Inno Setup 6", "$env:ProgramFiles\Inno Setup 6") {
              if (Test-Path "$dir\ISCC.exe") { return "$dir\ISCC.exe" }
            }
            $onPath = Get-Command iscc.exe -ErrorAction SilentlyContinue
            if ($onPath) { return $onPath.Source }
            return $null
          }
          $iscc = Find-Iscc
          if (-not $iscc) {
            choco install innosetup -y --no-progress
            $iscc = Find-Iscc
          }
          if (-not $iscc) {
            Write-Host "::warning::Inno Setup could not be found or installed: no ClipForge-Setup.exe in this run"
            "built=false" >> $env:GITHUB_OUTPUT
            exit 0
          }
          Write-Host "Inno Setup: $iscc"
          $source = (Resolve-Path dist\ClipForge).Path
          $out = (Resolve-Path dist).Path
          & $iscc "/DAppVersion=$env:CF_VERSION" "/DSourceDir=$source" "/DOutputDir=$out" `
            "/DOutputName=$env:CF_NAME-windows-setup" windows\installer\clipforge.iss
          if ($LASTEXITCODE -ne 0) { throw "building the installer failed" }
          if (-not (Test-Path "dist\$env:CF_NAME-windows-setup.exe")) { throw "the installer was not written" }
          "built=true" >> $env:GITHUB_OUTPUT
      # The installer, for real: silent install into a temp folder, the
      # files are there, the app's own update script works in the
      # installed folder and leaves the uninstaller alone, silent uninstall.
      - name: Test the installer (install, update in place, uninstall)
        if: steps.installer.outputs.built == 'true'
        shell: pwsh
        run: |
          $setup = (Resolve-Path "dist\$env:CF_NAME-windows-setup.exe").Path
          $dir = "$env:RUNNER_TEMP\cf install\ClipForge"
          $p = Start-Process $setup -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=`"$dir`"", "/LOG=`"$env:RUNNER_TEMP\cf-setup.log`"" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content "$env:RUNNER_TEMP\cf-setup.log" -Tail 40; throw "the installer ended with $($p.ExitCode)" }
          foreach ($file in "clipforge.exe", "data\clipforge-version.json", "data\app.so", "unins000.exe", "Read me first.html") {
            if (-not (Test-Path "$dir\$file")) { throw "$file is missing after the install" }
          }
          $installed = (Get-Content "$dir\data\clipforge-version.json" -Raw | ConvertFrom-Json).version
          if ($installed -ne "$env:CF_VERSION+${{ needs.check.outputs.build }}") { throw "the installed version file says $installed" }
          $shortcut = "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\ClipForge.lnk"
          if (-not (Test-Path $shortcut)) { throw "no Start-menu shortcut after the install" }
          # The guide's own Start-menu entry (a silent install does not open it).
          $readme = "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\ClipForge read me.lnk"
          if (-not (Test-Path $readme)) { throw "no Start-menu entry for the read-me after the install" }
          Write-Host "installed: $dir ($installed), shortcut: $shortcut"
          # The app's own updater in the installed folder: the unpacked
          # "new version" is a copy with one more file.
          $new = "$dir.update-new"
          Copy-Item $dir $new -Recurse
          Remove-Item "$new\unins000.exe", "$new\unins000.dat" -ErrorAction SilentlyContinue
          Set-Content "$new\.clipforge-update-marker" '{"by":"ClipForge updater"}'
          Set-Content "$new\new-in-update.txt" 'new'
          $result = "$env:RUNNER_TEMP\cf-install-result.json"
          $log = "$env:RUNNER_TEMP\cf-install-update-log.txt"
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File assets\update\clipforge-update.ps1 `
            -InstallDir $dir -NewDir $new -WaitPid 0 -ResultFile $result -LogFile $log -Version $env:CF_VERSION -NoRestart
          $code = $LASTEXITCODE
          Get-Content $log
          if ($code -ne 0) { throw "the update script ended with $code in the installed folder" }
          if (-not (Test-Path "$dir\new-in-update.txt")) { throw "the update did not reach the installed folder" }
          if (-not (Test-Path "$dir\unins000.exe") -or -not (Test-Path "$dir\unins000.dat")) { throw "the update removed the uninstaller" }
          if (-not (Test-Path "$dir\Read me first.html")) { throw "the update removed the read-me" }
          if ((Test-Path $new) -or (Test-Path "$dir.update-old")) { throw "the update left folders next to the installed app" }
          # Silent uninstall (the uninstaller works from a copy of itself,
          # so the folder may go a moment after it returns).
          $u = Start-Process "$dir\unins000.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait -PassThru
          if ($u.ExitCode -ne 0) { throw "the uninstaller ended with $($u.ExitCode)" }
          for ($i = 0; $i -lt 60 -and (Test-Path "$dir\clipforge.exe"); $i++) { Start-Sleep -Seconds 1 }
          if (Test-Path "$dir\clipforge.exe") { throw "clipforge.exe is still there after the uninstall" }
          if (Test-Path $shortcut) { throw "the Start-menu shortcut is still there after the uninstall" }
          if (Test-Path $readme) { throw "the read-me's Start-menu entry is still there after the uninstall" }
          if (Test-Path "$dir\Read me first.html") { throw "the read-me is still there after the uninstall" }
          if (Test-Path $dir) { Write-Host "left in the folder after the uninstall:"; Get-ChildItem $dir -Recurse | ForEach-Object { $_.FullName } }
          if (Test-Path "$dir\data") { throw "the app's data folder is still there after the uninstall" }
          Write-Host "OK: install, update in place and uninstall work"
      - uses: actions/upload-artifact@v7
        with:
          # Test builds are only needed until a version is published.
          retention-days: 5
          path: video-editor/dist/${{ env.CF_NAME }}-windows.zip
          archive: false
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: steps.installer.outputs.built == 'true'
        with:
          # Test builds are only needed until a version is published.
          retention-days: 5
          path: video-editor/dist/${{ env.CF_NAME }}-windows-setup.exe
          archive: false
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          # Test builds are only needed until a version is published.
          retention-days: 5
          path: video-editor/dist/${{ env.CF_NAME }}-claude-windows.mcpb
          archive: false
          if-no-files-found: error
      # The guide by itself: an artifact of the run only (a release does not
      # carry it; it is inside the installer and the zip).
      - uses: actions/upload-artifact@v7
        with:
          # Test builds are only needed until a version is published.
          retention-days: 5
          path: video-editor/dist/${{ env.CF_NAME }}-readme-windows.html
          archive: false
          if-no-files-found: error

  macos:
    name: macOS app
    needs: check
    # Windows and macOS runners use up build minutes quickly, so these only
    # run when the workflow is started by hand or for a release tag.
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      CF_VERSION: ${{ needs.check.outputs.version }}
      CF_BUILD_TIME: ${{ needs.check.outputs.build_time }}
      CF_COMMIT: ${{ needs.check.outputs.commit }}
      CF_DISPLAY: ${{ needs.check.outputs.display }}
      # Start of every download's name: ClipForge-1.4.0-build21
      CF_NAME: ClipForge-${{ needs.check.outputs.version }}-build${{ needs.check.outputs.build }}
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      # The build time, commit and channel for the app's About box
      # (--dart-define-from-file), and "Read me first.html" for the
      # download: the install steps for this system, first steps, and what
      # is new (this version's section of CHANGELOG.md; the script fails
      # when there is none).
      - name: Write the build details and the read-me
        shell: bash
        run: |
          mkdir -p build dist
          printf '{"CLIPFORGE_BUILD_TIME":"%s","CLIPFORGE_COMMIT":"%s","CLIPFORGE_CHANNEL":"ci"}\n' \
            "$CF_BUILD_TIME" "$CF_COMMIT" > build/clipforge_build.json
          cat build/clipforge_build.json
          python3 tool/ci/make_readme_html.py --platform macos \
            --version "$CF_VERSION" --build "${{ needs.check.outputs.build }}" --date "$CF_BUILD_TIME" \
            --changelog CHANGELOG.md --out "dist/$CF_NAME-readme-macos.html"
          grep -q "What is new in $CF_VERSION" "dist/$CF_NAME-readme-macos.html" || {
            echo "::error::the read-me does not show what is new in $CF_VERSION"; exit 1; }
      # The Claude helper is built FIRST (1.12) and travels inside the app
      # as part of the extension file (assets/claude): the app installs it
      # into ~/Library/Application Support/ClipForge/claude at start. A file
      # added to the bundle AFTER the build would break the bundle's ad-hoc
      # signature (its sealed resources); an asset is part of the build. The
      # executable itself gets an ad-hoc signature (Apple Silicon does not
      # run unsigned code). It is built for the runner's CPU only
      # (macos-latest = Apple Silicon); unlike the app it is not universal.
      # The build script is run from a copy outside the package so that Dart
      # does not run the Flutter plugins' build hooks for it.
      - name: Build clipforge-mcp and check that it answers
        run: |
          export CLIPFORGE_MCP_NO_HANDOVER=1
          out="build/mcp"
          mkdir -p "$out/fonts" dist/stage
          cp bin/build_mcp.dart "$RUNNER_TEMP/build_mcp.dart"
          dart "$RUNNER_TEMP/build_mcp.dart" -o "$out/clipforge-mcp" \
            --build-name="$CF_VERSION" --build-number=${{ needs.check.outputs.build }} \
            --dart-define-from-file=build/clipforge_build.json
          cp assets/fonts/*.ttf "$out/fonts/"
          codesign --verify "$out/clipforge-mcp" 2>/dev/null || codesign --force --sign - "$out/clipforge-mcp"
          codesign --verify --verbose "$out/clipforge-mcp"
          file "$out/clipforge-mcp"
          "$out/clipforge-mcp" --version | grep -qF "$CF_DISPLAY" || {
            echo "::error::clipforge-mcp --version does not show: $CF_DISPLAY"; exit 1; }
          reply="$(printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-11-25","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"get_status","arguments":{}}}' \
            | "$out/clipforge-mcp" --projects-dir "$RUNNER_TEMP/projects")"
          echo "$reply"
          grep -q '"protocolVersion":"2025-11-25"' <<<"$reply"
          grep -q '"fontsDir":"[^"]' <<<"$reply"
      # One-click install for Claude Desktop: a .mcpb file (a zip with
      # manifest.json, the ad-hoc signed clipforge-mcp and the title fonts
      # in server/fonts). Apple Silicon only, like the program. The program
      # is unpacked again and checked: still executable, signature intact.
      # --asset puts a copy into assets/claude for the app build below.
      # Not notarized: if macOS blocks it after installing, see
      # docs/claude-setup.html ("If the Mac blocks it").
      - name: Build the Claude Desktop extension (.mcpb)
        run: |
          python3 docs/tools/build_claude_bundles.py mcpb \
            --binary build/mcp/clipforge-mcp --platform macos \
            --version "$CF_VERSION" --build ${{ needs.check.outputs.build }} \
            --display "$CF_DISPLAY" --out dist --asset assets/claude
          check="$RUNNER_TEMP/mcpb-unpacked"
          mkdir -p "$check"
          unzip -q "dist/$CF_NAME-claude-macos.mcpb" -d "$check"
          test -x "$check/server/clipforge-mcp"
          codesign --verify --verbose "$check/server/clipforge-mcp"
          CLIPFORGE_MCP_NO_HANDOVER=1 "$check/server/clipforge-mcp" --version | grep -qF "$CF_DISPLAY"
      # CFBundleShortVersionString = the version, CFBundleVersion = the run
      # number (Finder > Get Info shows "1.4.0 (21)").
      - run: >-
          flutter build macos --release
          --build-name=${{ env.CF_VERSION }} --build-number=${{ needs.check.outputs.build }}
          --dart-define-from-file=build/clipforge_build.json
      # The update script and the helper install, run on a real Mac with
      # pretend app folders (the same tests as on Linux).
      - name: Test the update script and the Claude helper install on macOS
        run: |
          flutter test test/core/update_install_test.dart test/core/update_test.dart test/mcp/claude_helper_test.dart
      # Not signed with an Apple developer certificate (ad-hoc signature only),
      # so macOS asks for confirmation on first launch. ditto keeps the
      # symlinks inside the .app intact, which a plain zip would break.
      # The zip holds ClipForge.app, "Read me first.html" and the Claude
      # setup guide side by side at its top (the Claude helper is inside the
      # app since 1.12). There is no "ClipForge" folder around them: the
      # app's updater looks for the .app at the top of the zip
      # (unpackMacUpdate in lib/core/update/update_install.dart) and takes
      # nothing else, so files beside the app are fine, a folder around it
      # is not. Nothing is added INSIDE the .app (that would break its
      # signature).
      - name: Zip the app
        run: |
          app="$(ls -d build/macos/Build/Products/Release/*.app | head -n 1)"
          assets="$app/Contents/Frameworks/App.framework/Resources/flutter_assets/assets"
          test -f "$assets/claude/ClipForge-claude.mcpb" || { echo "::error::the Claude extension file is not inside the app"; exit 1; }
          test -f "$assets/update/clipforge-update.sh" || { echo "::error::the update script is not inside the app"; exit 1; }
          codesign --verify --deep --verbose "$app" || echo "::warning::codesign --verify reported a problem for the app bundle"
          ditto "$app" "dist/stage/$(basename "$app")"
          cp docs/claude-setup.html "dist/stage/Connect Claude to ClipForge.html"
          cp "dist/$CF_NAME-readme-macos.html" "dist/stage/Read me first.html"
          ditto -c -k --sequesterRsrc dist/stage "dist/$CF_NAME-macos.zip"
          # What the zip holds at its top: the app (where the updater looks
          # for it) and the guide; the old text file is gone.
          names="$(zipinfo -1 "dist/$CF_NAME-macos.zip")"
          grep -q "^$(basename "$app")/" <<<"$names" || { echo "::error::$(basename "$app") is not at the top of the macOS zip"; exit 1; }
          grep -qx "Read me first.html" <<<"$names" || { echo "::error::Read me first.html is not at the top of the macOS zip"; exit 1; }
          if grep -q "Release notes.txt" <<<"$names"; then echo "::error::Release notes.txt must not be in the macOS zip any more"; exit 1; fi
      - uses: actions/upload-artifact@v7
        with:
          # Test builds are only needed until a version is published.
          retention-days: 5
          path: video-editor/dist/${{ env.CF_NAME }}-macos.zip
          archive: false
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          # Test builds are only needed until a version is published.
          retention-days: 5
          path: video-editor/dist/${{ env.CF_NAME }}-claude-macos.mcpb
          archive: false
          if-no-files-found: error
      # The guide by itself: an artifact of the run only (a release does not
      # carry it; it is inside the macOS zip).
      - uses: actions/upload-artifact@v7
        with:
          # Test builds are only needed until a version is published.
          retention-days: 5
          path: video-editor/dist/${{ env.CF_NAME }}-readme-macos.html
          archive: false
          if-no-files-found: error

  # Publishes a GitHub Release for a tag v<version>: the versioned files,
  # copies with fixed names (one link always gives the newest version) and
  # latest.json. Only this job may write to the repository.
  release:
    name: GitHub Release
    needs: [check, android, windows, macos]
    # For a pushed tag v<version>, or a manual run on main with "publish"
    # ticked (the release then creates the tag itself).
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      CF_VERSION: ${{ needs.check.outputs.version }}
      CF_BUILD: ${{ needs.check.outputs.build }}
      CF_NAME: ClipForge-${{ needs.check.outputs.version }}-build${{ needs.check.outputs.build }}
    steps:
      - uses: actions/checkout@v7
      # The artifacts are single files (upload-artifact archive: false);
      # skip-decompress keeps the .zip and .mcpb files as they are instead
      # of unpacking them.
      - uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/artifacts
          skip-decompress: true
      - name: Collect this run's files
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          find "$RUNNER_TEMP/artifacts" -type f -exec cp {} "$RUNNER_TEMP/release/" \;
          ls -l "$RUNNER_TEMP/release"
      # Only fixed-name files are published (tool/ci/release_assets.py is
      # THE list): the three downloads people see and the two files the
      # app's Update button uses. They are put in a folder of their own, so
      # that nothing else of the run can slip into the release.
      - name: The release files, latest.json and release notes
        working-directory: ${{ runner.temp }}/release
        run: |
          need() { test -f "$1" || { echo "::error::$1 is missing"; exit 1; }; }
          out="$RUNNER_TEMP/publish"
          mkdir -p "$out"
          copy() { need "$1"; cp "$1" "$out/$2"; }
          # What people download.
          if [ ! -f "$CF_NAME-windows-setup.exe" ]; then
            echo "::error::no Windows installer in this run (Inno Setup could not be had?): ClipForge-Setup.exe is THE Windows download, so there is no release without it"; exit 1
          fi
          copy "$CF_NAME-windows-setup.exe"       ClipForge-Setup.exe
          copy "$CF_NAME-macos.zip"               ClipForge-macos.zip
          copy "$CF_NAME-android.apk"             ClipForge-android.apk
          # What only the app's own updater downloads (not on the page).
          # Installed 1.12 - 1.15 apps on Windows update from this zip: it
          # stays until they no longer need it.
          copy "$CF_NAME-windows.zip"             ClipForge-windows.zip
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then tag="${GITHUB_REF#refs/tags/}"; else tag="v$CF_VERSION"; fi
          # latest.json: version, build, date, notes_url as before, plus
          # (1.12) per system the address, size and SHA-256 of the
          # fixed-name file, which the app checks before it uses a download.
          python3 "$GITHUB_WORKSPACE/video-editor/tool/ci/make_latest_json.py" \
            --dir "$out" --version "$CF_VERSION" --build "$CF_BUILD" \
            --base-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" --tag "$tag" --out "$out/latest.json"
          # The numbers in it must be those of the files that get uploaded.
          for file in ClipForge-windows.zip ClipForge-macos.zip ClipForge-android.apk; do
            want="$(sha256sum "$out/$file" | cut -d' ' -f1)"
            grep -q "\"sha256\":\"$want\"" "$out/latest.json" || { echo "::error::latest.json does not carry the SHA-256 of $file"; exit 1; }
          done
          # (1.16) The outside addresses travel with it (tool/ci/links.json).
          grep -q '"links":{"site":"https://' "$out/latest.json" || { echo "::error::latest.json carries no links"; exit 1; }
          if grep -q "android32\|32bit" "$out/latest.json"; then
            echo "::error::latest.json still names a 32-bit Android file"; exit 1
          fi
          # Exactly the list: no more, no fewer.
          python3 "$GITHUB_WORKSPACE/video-editor/tool/ci/release_assets.py" --check-dir "$out"
          # The guide is part of the downloads: inside the Mac zip.
          unzip -Z1 "$out/ClipForge-macos.zip" | grep -qx "Read me first.html" || {
            echo "::error::Read me first.html is not in ClipForge-macos.zip"; exit 1; }
          awk -v v="$CF_VERSION" '/^## /{p = ($2 == v)} p' "$GITHUB_WORKSPACE/video-editor/CHANGELOG.md" > "$RUNNER_TEMP/notes.md"
          test -s "$RUNNER_TEMP/notes.md" || { echo "::error::CHANGELOG.md has no section for $CF_VERSION"; exit 1; }
      - name: Create the release
        working-directory: ${{ runner.temp }}/publish
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="${GITHUB_REF#refs/tags/}"; how=(--verify-tag)
          else
            # Manual publish from main: the release creates the tag here.
            tag="v$CF_VERSION"; how=(--target "$GITHUB_SHA")
            if gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "::error::release $tag exists already: raise the version in pubspec.yaml first"; exit 1
            fi
          fi
          # Exactly these five, by name (never a glob).
          files=(ClipForge-Setup.exe ClipForge-macos.zip ClipForge-android.apk ClipForge-windows.zip latest.json)
          gh release create "$tag" -R "$GITHUB_REPOSITORY" \
            --title "ClipForge $CF_VERSION" --notes-file "$RUNNER_TEMP/notes.md" "${how[@]}" \
            "${files[@]}"
